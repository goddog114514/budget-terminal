/* summary 参数解析：summary [day|week|month|cat] [类别] [@YYYY-MM]
   第一个 token 若不在已知 kind 里, 则视为类别(窗口用当前记账周期)。 */
const SUMMARY_KINDS = new Set(["day","日","today","week","周","month","月","natural","cat","category","类别"]);
function parseSummaryArgs(tokens){
  let kind = (tokens[0]||"").toLowerCase();
  let rest = tokens.slice(1);
  if(kind && !SUMMARY_KINDS.has(kind)){ rest = tokens.slice(); kind=""; }
  let cat=null, ref=null;
  for(const tk of rest){
    if(!tk) continue;
    if(tk[0]==="@"){ ref = tk.slice(1); continue; }
    if(/^\d{4}-\d{1,2}(-\d{1,2})?$/.test(tk)){ ref = tk; continue; } // 形如 2027-07 / 2027-07-01
    cat = tk;                                                        // 其余非日期 token 视为类别
  }
  return {kind, cat, ref};
}
function doSummary(tokens){
  const {kind, cat, ref} = parseSummaryArgs(tokens);
  const isDay = (kind==="day"||kind==="日"||kind==="today");
  const tag = cat ? "  [类别: "+cat+"]" : "";
  let win, name;
  if(isDay){
    const t=todayYMD(); win=collectWindow(t,t,cat); name="今日 "+t;
  } else if(kind==="week"||kind==="周"){
    const w=weekBounds(todayYMD()); win=collectWindow(w.start,w.end,cat);
    name="本周 "+w.start+" ~ "+w.end+" (周"+(state.settings.weekStart==="mon"?"一":"日")+"起)";
  } else if(kind==="cat"||kind==="category"||kind==="类别"){
    const p=currentPeriod(); win=collectWindow(p.start,p.end,cat);
    name="周期分类 · "+p.label;
  } else if(kind==="month"||kind==="月"||kind==="natural"||(!kind && ref)){
    // 自然月：固定从当月 1 日到月末，与记账周期(滚动/自定义)无关
    // (kind 为空但给了月份, 如 `summary 2027-07`: 以前会静默忽略这个月份, 现在按该自然月统计)
    let r = todayYMD();
    if(ref){
      const p = parseYMD(ref) || (/^\d{4}-\d{1,2}$/.test(ref) ? parseYMD(ref+"-01") : null);
      if(p) r = mkYMD(p.y, p.m, 1);
    }
    const m = calendarMonthBounds(r);
    win = collectWindow(m.start, m.end, cat);
    name = "本月(自然月 1日~月末) "+m.label;
  } else { // default: current accounting period
    const p=currentPeriod(); win=collectWindow(p.start,p.end,cat);
    const w1 = p.mode==="rolling" ? "本周期(每"+p.len+"天)" : "本月周期";
    name = w1+" "+p.label;
  }
  if(cat && win.count===0){
    line([{t:"⚠ 该窗口内没有“"+cat+"”的记录，已按 0 显示。", c:COLOR.yellow}]);
    const used = [...new Set(state.records.map(r=>r.category))];
    if(used.length) line([{t:"  现有类别: "+used.join("  "), c:COLOR.gray}]);
  }
  printSummaryReport(win, name+tag, {isDay, catFilter:cat});
}

function buildReportText(md){
  const t=todayYMD();
  const p=currentPeriod();
  const L = [];
  const push=(k,v)=> L.push(md? "**"+k+"**: "+v : k+": "+v);
  const H=(s)=> L.push(md? "## "+s : "── "+s+" ──");
  const HR=()=> L.push(md?"---":"─".repeat(40));
  const moneyF=(x)=> "¥"+money(x);      // md/txt 两种格式的金额写法一致(原先是个恒等的三元)
  const r2s=(x)=> (x*100).toFixed(1)+"%";
  const st = periodSnapshot();
  const bal = availableBalance();
  const carry = r2(st.usedUnits - st.B);           // >0 透支
  const aw = alertWord(st.ratio);
  H("预算与周期");
  push("记账周期", p.label);
  push("换算口径", "消费÷"+consumePct()+"%=占用总花费; 其中"+invPct()+"%应投(货币"+mmPct()+"%/指数"+idxPct()+"%)");
  push("本期发放总预算", moneyF(st.B));
  push("本期消费", moneyF(st.consumption));
  push("本期应投合计", moneyF(st.invest));
  push("本期占用(消费+应投)", moneyF(st.usedUnits));
  push("本期结余/透支(结转)", (carry>0?"透支 -":"可结转 +")+moneyF(Math.abs(carry)));
  push("累计可用余额(含结转)", moneyF(bal));
  push("发放使用率", r2s(st.ratio));
  push("超额状态", aw.t);
  HR();
  H("当前周期消费明细");
  const w=collectWindow(p.start,p.end);
  push("消费笔数", String(w.count));
  push("总消费", moneyF(w.total));
  for(const [cat,amt] of w.cats){ push("类别·"+cat, moneyF(amt)+" ("+(w.total?amt/w.total*100:0).toFixed(1)+"%)"); }
  HR();
  H("自动投资换算");
  push("应投货币 ("+mmPct()+"%口径)", moneyF(w.mmT));
  push("应投指数 ("+idxPct()+"%口径)", moneyF(w.idxT));
  push("应投合计", moneyF(r2(w.mmT+w.idxT)));
  const paidMM = r2(w.rows.reduce((s,r)=>s+(r.moneyInv||0),0));
  const paidIdx= r2(w.rows.reduce((s,r)=>s+(r.indexInv||0),0));
  push("已投货币", moneyF(paidMM)+" / 应投"+moneyF(w.mmT));
  push("已投指数", moneyF(paidIdx)+" / 应投"+moneyF(w.idxT));
  HR();
  H("逐笔记录");
  for(const r of state.records.slice().sort((a,b)=>a.date<b.date?-1:1)){
    const paid=recStatus(r).t;
    L.push("- "+r.date+"  #"+r.id+"  "+r.category+"  ¥"+money(r.amount)
          +"  (应投货币¥"+money(r.mm)+" 指数¥"+money(r.idx)
          +"  已投货币¥"+money(r.moneyInv||0)+" 指数¥"+money(r.indexInv||0)+")  ["+paid+"]"
          +(r.note?"  "+r.note:""));
  }
  HR();
  L.push("");
  L.push("生成时间: "+t+"  |  BUDGET::TERM 自动理财报告");
  return md? ("# BUDGET::TERM 自动理财报告\n\n"+L.join("\n")) : L.join("\n");
}
function download(filename, content, type){
  const blob = new Blob([content], {type:type||"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},300);
}
function doExport(tokens){
  const fmt=(tokens[0]||"").toLowerCase();
  const md = fmt==="md";
  const content = buildReportText(md);
  const t=todayYMD();
  const fname = "budget_report_"+t+(md?".md":".txt");
  download(fname, content, md?"text/markdown":"text/plain;charset=utf-8");
  line([{t:"✓ 已导出报告: ",c:COLOR.green},{t:fname,c:COLOR.cyan,cls:"glow"},{t:"  (文件已下载)",c:COLOR.gray}]);
}

/* ======================= 燃尽预测 (burn rate) ======================= */
function forecastData(){
  const st = periodSnapshot();
  const p = st.p, B = st.B;
  const today = todayYMD();
  const total = periodDayCount(p);
  const elapsedRaw = daysBetween(p.start, today) + 1;   // 含今天(不超过周期)
  const elapsed = Math.max(1, Math.min(total, elapsedRaw));
  const remaining = Math.max(0, total - elapsed);       // 之后还剩几天
  const spent = st.consumption;
  const dailyAvg = elapsed>0 ? spent/elapsed : 0;
  const projConsumption = r2(dailyAvg * total);         // 期末预测消费
  const projUsed = r2(projConsumption / consumeShare()); // 期末预测占用(预算口径)
  const projLeft = r2(B - projUsed);                    // >0 预计结余, <0 预计超支
  const allow = r2(consumeShare() * B);                 // 本期消费额度(N%)
  const leftConsume = r2(allow - spent);                // 还可消费
  const perDayLeft = remaining>0 ? r2(leftConsume/remaining) : leftConsume;
  const projRatio = B>0 ? projUsed/B : 0;
  return { st, p, B, today, total, elapsed, remaining, spent, dailyAvg,
           projConsumption, projUsed, projLeft, allow, leftConsume, perDayLeft, projRatio };
}
/* budget 命令末尾的一行简报 */
function showForecastLine(){
  const f = forecastData();
  const color = f.projLeft < 0 ? COLOR.red : COLOR.green;
  // 剩余 0 天(本周期最后一天)时不再说"每天可花", 否则会显示"还剩 0 天, 每天可花 ¥850"
  const tail = f.remaining > 0
    ? ("  (还剩 "+f.remaining+" 天, 每天可花 ¥"+money(Math.max(0,f.perDayLeft))+")")
    : ("  (本周期已到最后一天, 还可消费 ¥"+money(Math.max(0,f.leftConsume))+")");
  line([{t:"  燃尽预测: 日均 ¥"+money(f.dailyAvg)+"/天", c:COLOR.gray},
        {t:"  →  期末预计"+(f.projLeft<0?"超支 ":"结余 "), c:COLOR.gray},
        {t:"¥"+money(Math.abs(f.projLeft)), c:color, cls:"glow"},
        {t:tail, c:COLOR.gray}]);
}

/* ======================= 资产看板 & 收益模拟 ======================= */
function fv(P, rate, years){ return P * Math.pow(1 + rate, years); }
function sparkline(vals){
  const blocks = "▁▂▃▄▅▆▇█";
  if(!vals.length) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals);
  if(mx - mn < 1e-9) return blocks[3].repeat(vals.length);
  return vals.map(v=>{
    const i = Math.round((v-mn)/(mx-mn)*7);
    return blocks[Math.max(0, Math.min(7, i))];
  }).join("");
}
function doAssets(tokens){
  const rawYears = numeric(tokens[0]);
  const horizon = (rawYears!=null && rawYears>0 && rawYears<=60) ? Math.round(rawYears) : 10;
  const cash  = availableBalance();
  const pm    = moneyInvestedTotal();
  const pi    = indexInvestedTotal();
  const rm    = state.settings.rateMoney  || 0;
  const ri    = state.settings.rateIndex  || 0;
  const mvM   = r2(fv(pm, rm, horizon));
  const mvI   = r2(fv(pi, ri, horizon));
  const totalNow = r2(cash + pm + pi);
  const totalFut = r2(cash + mvM + mvI);
  blank();
  line([{t:"▍资产看板",c:COLOR.cyan},{t:"   (年化 货币 "+(rm*100).toFixed(2)+"% / 指数 "+(ri*100).toFixed(2)+"%; set rate 可改)",c:COLOR.gray}]);
  // 逐行
  const row=(k,v,c)=>kvRow(k,v,0,c);      // 统一渲染器(列宽按窗口自适应)
  row("现金余额(含结转)", "¥"+money(cash), cash<0?COLOR.red:COLOR.green);
  row("货币基金 本金", "¥"+money(pm), COLOR.cyan);
  row("  货币 "+horizon+"年后", "¥"+money(mvM), COLOR.cyan);
  row("指数基金 本金", "¥"+money(pi), COLOR.index);
  row("  指数 "+horizon+"年后", "¥"+money(mvI), COLOR.index);
  line([{t:"  "+"─".repeat(40), c:COLOR.gray}]);
  row("总资产(现金+本金)", "¥"+money(totalNow), COLOR.pure);
  row("总资产("+horizon+"年后预估)", "¥"+money(totalFut), COLOR.green);
  const gain = r2(totalFut - totalNow);
  row("预估增值", (gain>=0?"+":"")+"¥"+money(gain), gain>=0?COLOR.green:COLOR.red);
  // ASCII 增长曲线(现金不增长, 仅基金复利)
  const vals = [];
  for(let t=0;t<=horizon;t++){ vals.push(cash + fv(pm,rm,t) + fv(pi,ri,t)); }
  line([{t:"  增长曲线(0→"+horizon+"年): ",c:COLOR.gray},{t:sparkline(vals),c:COLOR.green,cls:"glow"}]);
  const step = Math.max(1, Math.round(horizon/5));
  const labels = [];
  for(let t=0;t<=horizon;t+=step){ labels.push("第"+t+"年"); }
  line([{t:"  "+labels.join("        "),c:COLOR.gray}]);
  blank();
}

/* 理财条: 应投货币/应投指数 的"未投池"累计; 达阈值变绿并出现"一键投资"按钮 */
function renderInvestBar(){
  const host = document.getElementById("investbar");
  if(!host) return;
  host.innerHTML="";
  host.appendChild(invCluster("money"));
  host.appendChild(invCluster("index"));
  if(autosaveOn){
    const s=document.createElement("span"); s.className="inv-hint autosave-mark";
    s.textContent="● 自动写盘 → "+(backupFolderName());
    host.appendChild(s);
  }
}
function invCluster(kind){
  const m = kind==="money";
  const lot = m ? INVEST_MONEY_LOT : INVEST_INDEX_LOT;
  const pend    = m ? moneyPending()    : indexPending();
  const invested= m ? moneyInvestedTotal(): indexInvestedTotal();
  const ready = pend >= lot - 0.005;              // 池≥阈值才点亮全额投资
  const cl = document.createElement("div"); cl.className="inv-cl";
  const kEl = document.createElement("span"); kEl.className="inv-kind "+(m?"m":"i");
  kEl.textContent = m ? "应投货币" : "应投指数";
  const pool = document.createElement("span"); pool.className="inv-pool"+(ready?" ready":"");
  pool.textContent = "¥"+money(pend);
  const done = document.createElement("span"); done.className="inv-done";
  done.textContent = "已投 ¥"+money(invested);
  // 全额投资: 把整池一次性投掉; 仅当未投池 ≥ 该种阈值(货币100/指数20)才点亮
  const btnFull = document.createElement("button"); btnFull.type="button"; btnFull.className="inv-btn";
  btnFull.disabled = !ready;
  btnFull.textContent = ready ? ("全额投资 ¥"+money(pend)) : ("待满 ¥"+lot);
  if(ready) btnFull.addEventListener("click", ()=>doInvestFull(kind));
  cl.append(kEl, pool, done, btnFull);
  if(!ready){
    const hint = document.createElement("span"); hint.className="inv-hint";
    hint.textContent = "(未投池累计至 ¥"+lot+" 即点亮全额投资并清池)";
    cl.appendChild(hint);
  }
  return cl;
}

/* ===================== Tab 命令补全 ===================== */
/* M1: 补全词同样由 COMMANDS 派生(主名在前, 别名在后), 不再手抄一份 */
const CMD_WORDS = [...new Set([...COMMAND_NAMES, ...Object.keys(CMD_ALIAS)])];
function recordIds(){ return state.records.map(r=>String(r.id)); }
// 已知类别 + 历史记录里出现过的类别(含自定义)，用于补全与提示
function allCategories(){
  return [...new Set([...PREDEFINED.keys(), ...state.records.map(r=>r.category)])].filter(Boolean);
}
/* 参数补全。
   M2 修复: 以前用"第几个 token"当槽位, 但 `@日期` 是**位置无关**参数
   (`add @2027-08-18 300 购物` / `add 300 购物 @2027-08-18` 都合法), 数 token 会把后面的槽位顶偏;
   而且 `add` 干脆忽略槽位(金额位也提示类别)、`update` 又把类别放在金额位(slot 2)、类别位(slot 3)返回空。
   现在统一成"语义槽位" arg = **已输入的值参数个数**(命令名与 @日期 都不计入):
     arg=0 是该命令的第 1 个值参数, 依此类推。所有命令共用这一套。 */
function argCandidates(c0, slot, tokens, cur){
  const cmd = canonicalCmd(c0);      // 别名先归一, 下面的分支只认主名(与 dispatch 同一套)
  let arg = 0;                       // 语义槽位(0-based)
  for(let i=1; i<slot && i<tokens.length; i++){
    const t = tokens[i];
    if(t && t[0]!=="@") arg++;       // @日期不占槽位
  }
  const typingAt = !!(cur && cur[0]==="@");
  // 正在输入 @条件: 只有 list 支持关键字写法, 其余命令要么接受 ISO 日期(@YYYY-MM-DD), 要么不支持
  if(typingAt) return (cmd==="list") ? ["@today","@period","@month"] : [];
  if(cmd==="help"||cmd==="config"||cmd==="cls"||cmd==="undo"||cmd==="redo") return [];
  if(cmd==="assets"||cmd==="forecast") return [];
  if(cmd==="budget"){
    if(arg===0) return ["set","default","reset"];
    if(arg===1) return ["800","1000","1200","1500","2000"];
    return [];
  }
  if(cmd==="set"){
    if(arg===0) return ["budget","daily","invest","consume","ratio","period","periodstart","monthstart","weekstart","alert","rate"];
    if(arg===1){
      const sub=(tokens[1]||"").toLowerCase();
      if(sub==="daily") return ["off","50","100","150","200"];
      if(sub==="invest") return ["15","10","20","5"];
      if(sub==="consume"||sub==="ratio") return ["85","90","80","0.85"];
      if(sub==="period") return ["natural","15","14","7","30","90"];
      if(sub==="monthstart") return ["natural","1","5","10","15","20","25","28"];
      if(sub==="weekstart") return ["mon","sun"];
      if(sub==="alert") return ["80,100","50,100","90"];
      if(sub==="rate") return ["money","index"];
    }
    if(arg===2){
      const sub=(tokens[1]||"").toLowerCase();
      if(sub==="rate") return ["2","3","8","10"];
    }
    return [];
  }
  /* add <金额> <类别> [备注..] [@日期]: 金额位不提示(数字自己敲), 类别位给类别, 备注位不给 */
  if(cmd==="add"){
    if(arg===1) return [...PREDEFINED.keys()];
    return [];
  }
  /* update <id> <金额> <类别> [备注..] [@日期]: 修复前类别被放在金额位(slot 2), 类别位(slot 3)返回空 */
  if(cmd==="update"){
    if(arg===0) return recordIds();
    if(arg===2) return [...PREDEFINED.keys()];
    return [];
  }
  if(cmd==="del"){ if(arg===0) return recordIds(); return []; }
  if(cmd==="pay"){
    if(arg===0) return recordIds();
    if(arg===1) return ["mm","idx","all","none"];
    return [];
  }
  if(cmd==="list"){                                   // 类别/@日期/条数 顺序自由, 各槽位都给同一组候选
    return ["@today","@period","@month", ...allCategories()];
  }
  if(cmd==="summary"){
    if(arg===0) return ["day","week","month","cat", ...allCategories()];
    return allCategories();                           // 类别筛选
  }
  if(cmd==="export"){ if(arg===0) return ["md","txt"]; return []; }
  return [];
}
function completionCandidates(full){
  const hasTrailing = /\s$/.test(full);
  const tokens = full.match(/[^\s]+/g) || [];
  const slot = hasTrailing ? tokens.length : Math.max(0, tokens.length-1);
  const cur   = hasTrailing ? "" : (tokens.length? tokens[slot] : "");
  const prefix = cur.toLowerCase();
  let list=[];
  if(slot===0){ list = CMD_WORDS.filter(w=>w.toLowerCase().startsWith(prefix)); }
  else if(tokens.length){ list = argCandidates(tokens[0].toLowerCase(), slot, tokens, cur); }
  list = [...new Set(list)].filter(x=>x.toLowerCase().startsWith(prefix));
  return { list, slot, cur, hasTrailing, base: full };
}
function tabHint(names){
  line([{t:"Tab 候选: ", c:COLOR.gray},{t:names.join("   "), c:COLOR.cyan},
        {t:"   (继续按 Tab 循环, Enter 执行)", c:COLOR.gray}]);
  scrollBottom();
}
/* ---- 输入框淡色“将输入”提示(ghost): 唯一候选时显示待补字符 ---- */
let ghostSuffixCache = null;
function currentGhostSuffix(value){
  const info = completionCandidates(value);
  if(info.list.length!==1) return null;
  if(info.hasTrailing) return null;       // 后面还有空 token 时不提示
  if(!info.cur) return null;              // 尚未输入前缀
  const suffix = info.list[0].slice(info.cur.length);
  return suffix || null;
}
let _cv=null, _ctx2=null;
function textWidthPx(s, el){
  if(!s) return 0;
  try{
    if(!_cv){ _cv = document.createElement("canvas"); _ctx2 = _cv.getContext && _cv.getContext("2d"); }
    if(_ctx2){
      let f="15px monospace";
      try{ f = getComputedStyle(el || input).font || f; }catch(e){}
      _ctx2.font = f;
      return _ctx2.measureText(s).width;
    }
  }catch(e){}
  return 0;
}
function hideGhost(){ ghostSuffixCache=null;
  const el=document.getElementById("ghost"); if(el){ el.textContent=""; el.classList.remove("show"); } }
function updateGhost(){
  const el=document.getElementById("ghost");
  if(!el) return;
  if(document.activeElement!==input){ hideGhost(); return; }
  const suf = currentGhostSuffix(input.value);
  ghostSuffixCache = suf;
  if(!suf){ el.textContent=""; el.classList.remove("show"); return; }
  const w = textWidthPx(input.value);
  el.textContent = suf;
  el.style.left = (w + 3) + "px";
  el.classList.add("show");
}
function caretAtEnd(){
  try{ if(input.selectionEnd==null) return true; return input.selectionEnd===input.value.length; }
  catch(e){ return true; }
}
let comp=null; // {list,i,cur,hasTrailing,base,hint}
function handleTab(){
  if(!comp){
    const info = completionCandidates(input.value);
    if(!info.list.length){ return; }
    comp = { list: info.list, i: 0, cur: info.cur, hasTrailing: info.hasTrailing, base: info.base, hint:false };
  } else {
    comp.i = (comp.i + 1) % comp.list.length;
  }
  if(comp.list.length>1 && !comp.hint){ comp.hint=true; tabHint(comp.list); }
  const cand = comp.list[comp.i];
  let out;
  if(comp.hasTrailing){ out = comp.base + cand; }
  else { out = comp.base.slice(0, comp.base.length - comp.cur.length) + cand; }
  input.value = out;
  input.setSelectionRange(out.length, out.length);
  hideGhost();
}
function bindInput(){
  input.addEventListener("keydown",(e)=>{
    if((e.ctrlKey||e.metaKey) && (e.key==="z"||e.key==="Z")){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
    if((e.ctrlKey||e.metaKey) && (e.key==="y"||e.key==="Y")){ e.preventDefault(); redo(); return; }
    if(e.key==="Enter"){ comp=null; hideGhost(); runCommand(input.value); input.value=""; scrollBottom(); return; }
    if(e.key==="Tab"){ e.preventDefault(); handleTab(); updateGhost(); return; }
    if(e.key==="ArrowRight"){
      if(caretAtEnd() && ghostSuffixCache){
        e.preventDefault();
        input.value = input.value + ghostSuffixCache;
        input.setSelectionRange(input.value.length, input.value.length);
        hideGhost();
        return;
      }
    }
    if(!["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) comp=null;
    if(e.key==="ArrowUp"){ historyUp(); }
    else if(e.key==="ArrowDown"){ historyDown(); }
    updateGhost();
  });
  input.addEventListener("input",()=>{ scrollBottom(); updateGhost(); });
  input.addEventListener("focus", updateGhost);
  input.addEventListener("blur", hideGhost);
}
let history=[], hIdx=-1;
function historyUp(){ if(!history.length) return; if(hIdx<0) hIdx=history.length-1; else hIdx=Math.max(0,hIdx-1); input.value=history[hIdx]; }
function historyDown(){ if(hIdx<0) return; hIdx++; if(hIdx>=history.length){ hIdx=-1; input.value=""; } else input.value=history[hIdx]; }

  line([{t:"║  ",c:COLOR.green},{t:"BUDGET :: TERM",c:COLOR.cyan,cls:"glow"},{t:"  "+APP_VERSION+"   个人记账 · 自动理财规划",c:COLOR.pure},{t:"  ║",c:COLOR.green}]);
  line([{t:"╚══════════════════════════════════════════════════════╝",c:COLOR.green}]);
  line([
    {t:"今日 ",c:COLOR.gray},{t:t,c:COLOR.white},
    {t:"   模型: 消费÷"+consumePct()+"%=占用预算; 占用×"+invPct()+"% 应投 ",c:COLOR.gray},
    {t:"货币"+mmPct()+"%",c:COLOR.cyan},{t:"+",c:COLOR.gray},{t:"指数"+idxPct()+"%",c:COLOR.index},
    {t:"; 剩余结转, 透支下期扣回",c:COLOR.gray}
  ]);
  line([{t:"  投资比例可调: ",c:COLOR.gray},{t:"set invest 15",c:COLOR.yellow},
        {t:" (或 set consume 85 / set ratio 0.85)",c:COLOR.gray}]);

  line([{t:"输入 ",c:COLOR.gray},{t:"help",c:COLOR.yellow},{t:" 查看全部命令；或点上方按钮快速操作。",c:COLOR.gray}]);
  blank();
  input.focus();
}
