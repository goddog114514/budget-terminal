<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUDGET::TERM — 记账与自动理财终端</title>
<style>
  :root{
    color-scheme:dark;              /* 让原生控件(日期/月份选择器图标、数字微调箭头)按暗色渲染, 否则默认是黑图标看不见 */
    --bg:#050607;
    --panel:#0b0e0f;
    --green:#3dff7a;
    --green-dim:#1e9e54;
    --white:#d7ffe0;
    --yellow:#ffd23d;
    --orange:#ff9d3d;
    --red:#ff4d5e;
    --cyan:#4de8ff;
    --magenta:#ff5ef0;
    --gray:#5d6b62;
    --border:#142018;
    /* ---- 扩展令牌: 供 JS 终端输出与表达式取值(见 JS 里的 COLOR 表) ---- */
    --index:#f1fa8c;                /* 指数(应投/基金)强调色 */
    --pure:#ffffff;                 /* 纯白: 金额等强强调文本(区别于柔和的 --white) */
    --faint:#3c4b41;                /* 极暗: 提示语/占位文字 */
    --cat-fallback:#8be9fd;         /* 未登记类别的兜底配色 */
    /* ---- 面板层次(避免同一底色在多处硬编码) ---- */
    --panel-2:#07090a;              /* 二级面板: 弹窗 / 下拉 / 理财条 */
    --panel-3:#080a0b;              /* 工具栏底色 */
    --field:#0c100e;                /* 输入框底色 */
    --chart-axis:#2b4a55;           /* 图表坐标轴(左/下)细亮线, 比 --border 更醒目 */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--green);
    font-family:"Consolas","JetBrains Mono","Cascadia Code","Courier New",monospace;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  /* faint scanlines + vignette for immersion */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.5;
  }
  .glow{ text-shadow:0 0 6px currentColor; }

  /* ---- header status bar ---- */
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);
    font-size:13px;letter-spacing:.3px;flex:0 0 auto;
  }
  .logo{font-weight:bold;color:var(--cyan);}
  .logo b{color:var(--magenta);}
  .stat{display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--border);padding-left:12px;}
  .stat .k{color:var(--gray);font-size:11px;}
  .stat .v{color:var(--white);font-size:13px;}
  .stat .v.neg{color:var(--red);}
  .stat .v.ok{color:var(--green);}
  .stat .v.warn{color:var(--yellow);}
  .spacer{flex:1;}
  /* 左上角定位状态: 图标 + 区名。由 refreshHeader 每次重建并放在第一个子项,
     不占 .stat 索引(浏览器探针按 #statusbar .stat 取列), 点击可手动重定位。 */
  .geo-badge{
    display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;cursor:pointer;
    border:1px solid var(--border);border-radius:3px;padding:3px 9px;
    background:var(--panel-2);font-size:12px;white-space:nowrap;color:var(--gray);
  }
  .geo-badge:hover{border-color:var(--green);}
  .geo-badge .geo-cv{width:16px;height:16px;display:block;flex:0 0 auto;}
  .geo-badge .geo-txt{color:var(--cyan);}
  .geo-badge.ok .geo-txt,.geo-badge.cached .geo-txt{color:var(--cyan);}
  .geo-badge.locating .geo-txt{color:var(--yellow);}
  .geo-badge.nokey .geo-txt,.geo-badge.failed .geo-txt{color:var(--yellow);}
  .geo-badge.off .geo-txt,.geo-badge.unsupported .geo-txt,.geo-badge.idle .geo-txt{color:var(--gray);}
  /* 行内地点图标: 与左上角 badge 共用同一套 Canvas 准星绘制(makeGeoIcon 用, 不是 Emoji) */
  .geo-ic{width:16px;height:16px;display:inline-block;vertical-align:-3px;flex:0 0 auto;}
  /* 右上角 今日/周期 预算指示: 红黄绿"实心圆点", 不闪烁。
     类别余额超额时也会插到这里(在今日/周期预算**之前**), 多项可横向列出 —— 
     窄屏放不下时自动换行, 不再把顶栏撑出横向滚动条。 */
  .mini-alert{
    font-size:12px;border:1px solid var(--border);padding:2px 8px;border-radius:3px;
    display:flex;gap:6px 14px;align-items:center;white-space:nowrap;flex-wrap:wrap;max-width:100%;
  }
  .dotbox{display:inline-flex;align-items:center;gap:3px;}
  .dotbox .dlabel{color:var(--gray);}
  .dotbox .dval{color:var(--white);}
  .dot{font-size:14px;line-height:1;display:inline-block;}
  .dot.g{color:var(--green);}
  .dot.y{color:var(--yellow);}
  .dot.r{color:var(--red);}
  .dot.n{color:var(--gray);}

  /* ---- button toolbar (auxiliary mouse support) ---- */
  nav.toolbar{
    flex:0 0 auto;display:flex;gap:6px;padding:6px 14px;
    background:var(--panel-3);border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  nav.toolbar button{
    background:transparent;color:var(--green);border:1px solid var(--border);
    font-family:inherit;font-size:12px;padding:4px 10px;cursor:pointer;border-radius:3px;
  }
  nav.toolbar button:hover{background:rgba(61,255,122,.08);border-color:var(--green);color:var(--white);}
  nav.toolbar button:active{background:rgba(61,255,122,.2);}
  nav.toolbar button.danger:hover{border-color:var(--red);color:var(--red);}
  nav.toolbar button.accent:hover{border-color:var(--cyan);color:var(--cyan);}
  /* 工具条下拉菜单 (消费列表的 4 个快捷范围) */
  nav.toolbar .dd{position:relative;display:inline-block;}
  nav.toolbar .dd-menu{
    position:absolute;top:calc(100% + 4px);left:0;min-width:158px;z-index:30;
    background:var(--panel-2);border:1px solid var(--green);border-radius:4px;padding:4px;
    box-shadow:0 8px 20px rgba(0,0,0,.65);display:none;flex-direction:column;gap:2px;
  }
  nav.toolbar .dd.open .dd-menu{display:flex;}
  nav.toolbar .dd-menu button{
    width:100%;text-align:left;border:none;border-radius:3px;padding:6px 10px;
    background:transparent;color:var(--green);font-family:inherit;font-size:12px;cursor:pointer;
  }
  nav.toolbar .dd-menu button:hover{background:rgba(61,255,122,.12);color:var(--white);}
  nav.toolbar .dd-menu .dd-hint{color:var(--gray);font-size:11px;padding:4px 10px 2px;}
  /* 查找框: 工具条最右侧的**唯一**搜索入口 —— 回车回灌 `search …` 命令,
     查询语法/结果渲染只有一套实现(与命令行完全等价, 不新建第二套查询状态)。 */
  nav.toolbar .searchbox{margin-left:auto;display:flex;align-items:center;}
  nav.toolbar #searchBox{
    width:230px;min-width:150px;max-width:34vw;
    background:var(--field);border:1px solid var(--border);border-radius:3px;
    color:var(--white);font-family:inherit;font-size:12px;padding:4px 10px;outline:none;
  }
  nav.toolbar #searchBox::placeholder{color:var(--faint);}
  nav.toolbar #searchBox:focus{border-color:var(--green);box-shadow:0 0 0 1px rgba(61,255,122,.18);}
  nav.toolbar #searchBox::-webkit-search-cancel-button{filter:invert(.65);cursor:pointer;}
  /* 行内 "已投资" 开关按钮 */
  .tbtn{
    background:transparent;color:var(--yellow);border:1px solid var(--yellow);
    font-family:inherit;font-size:12px;padding:1px 9px;margin:0 2px 0 8px;
    cursor:pointer;border-radius:3px;vertical-align:middle;line-height:1.4;
  }
  .tbtn:hover{background:rgba(255,210,61,.12);}
  .tbtn.on{color:var(--green);border-color:var(--green);}
  .tbtn.on:hover{background:rgba(61,255,122,.12);}
  .tbtn.dimmed{color:var(--gray);border-color:var(--gray);}

  /* ---- 理财条：应投货币 / 应投指数 池 + 一键投资 ---- */
  #investbar{
    flex:0 0 auto;display:flex;gap:22px;align-items:center;flex-wrap:wrap;
    padding:5px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);font-size:12.5px;
  }
  .inv-cl{display:flex;align-items:center;gap:9px;}
  .inv-kind{color:var(--gray);}
  .inv-kind.m{color:var(--cyan);}.inv-kind.i{color:var(--index);}
  .inv-pool{font-weight:bold;font-size:13px;color:var(--yellow);}
  .inv-pool.ready{color:var(--green);text-shadow:0 0 7px var(--green);}
  .inv-done{color:var(--gray);}
  .inv-btn{
    background:transparent;border:1px solid var(--green);color:var(--green);
    font-family:inherit;font-size:12px;padding:1px 10px;cursor:pointer;border-radius:3px;display:inline-block;
  }
  .inv-btn:hover{background:rgba(61,255,122,.12);}
  .inv-btn[disabled]{opacity:.35;cursor:not-allowed;border-color:var(--border);color:var(--gray);}
  .inv-hint{color:var(--faint);margin-left:4px;}

  /* ---- terminal output ---- */
  #term{
    flex:1 1 auto;overflow-y:auto;padding:10px 14px 14px;
    font-size:14px;line-height:1.5;scroll-behavior:smooth;
  }
  #term::-webkit-scrollbar{width:10px;}
  #term::-webkit-scrollbar-thumb{background:#122a1a;border-radius:6px;}
  #term::-webkit-scrollbar-track{background:transparent;}
  .l{white-space:pre-wrap;word-break:break-word;min-height:1em;}
  .dim{color:var(--gray);}
  .ok{color:var(--green);}
  .y{color:var(--yellow);}
  .o{color:var(--orange);}
  .r{color:var(--red);}
  .c{color:var(--cyan);}
  .m{color:var(--magenta);}
  .w{color:var(--white);}
  .cmd{color:var(--cyan);}
  .prompt{color:var(--magenta);}
  .sep{border-bottom:1px solid var(--border);margin:4px 0;}
  .hl{background:rgba(61,255,122,.14);}

  /* ---- 图表总结: 柱状图 / 饼图 / 图例(只用到主题令牌, 颜色值由 JS 的 COLOR.* 注入) ----
     图形是 DOM 元素(不是图片), 下方始终另有一份纯文本数据表, 便于复制/导出/无障碍阅读。
     视觉规格(与参考图一致): 左/下轴线细亮线; 柱宽 22px、顶部 3px 圆角; 柱顶数值与柱同色;
     黄色虚线 = 消费口径预算参考线, 标签右对齐压在线上方; 饼图无描边、切片之间留 0.5% 暗缝;
     图例为「色块 + 类别 + 金额 + 占比」四列, 类别列定宽以保证金额纵向对齐。 */
  .chartbox{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin:10px 0 8px 2px;max-width:100%;}
  .chart-h{font-size:15px;letter-spacing:.4px;margin:6px 0 2px;}
  /* 柱状图**随分辨率自适应**:
     - 绘图区高度由 JS 写入 --plot-h(按视口高度缩放, 见 plotHeight()), CSS 只负责加顶部标签留白,
       两者共用同一个数字, 不会出现"柱高 192px、容器只有 150px"的错位;
     - 柱列 flex:1 均分可见宽度: 宽屏柱距拉开、柱宽随列宽收放(clamp), 窄屏自动收窄不溢出;
     - 柱宽用百分比 + clamp 上下限, 12 根柱挤在窄屏也不会糊成一片。 */
  .chart-bars{position:relative;display:flex;align-items:flex-end;gap:clamp(4px,0.9vw,18px);
    width:100%;flex:1 1 420px;min-width:0;
    height:calc(var(--plot-h,192px) + 24px);
    padding:24px 10px 0;margin:2px 0 22px;
    border-left:1px solid var(--chart-axis);border-bottom:1px solid var(--chart-axis);}
  .chart-col{position:relative;flex:1 1 0;min-width:0;height:100%;}
  .chart-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:0;
    width:clamp(10px,58%,34px);min-height:2px;
    border-radius:3px 3px 0 0;box-shadow:0 0 12px -3px currentColor;}
  .chart-v{position:absolute;left:-9px;right:-9px;text-align:center;font-size:11px;line-height:1.1;
    font-weight:bold;color:var(--white);white-space:nowrap;}
  .chart-k{position:absolute;left:-11px;right:-11px;bottom:-19px;text-align:center;font-size:11px;
    color:var(--gray);white-space:nowrap;}
  .chart-refline{position:absolute;left:0;right:0;border-top:1px dashed var(--yellow);
    pointer-events:none;opacity:.92;}
  /* 负值时的 0 刻度线(负柱在左/下方) */
  .chart-zero{position:absolute;left:0;right:0;border-top:1px solid var(--gray);
    pointer-events:none;opacity:.55;}
  .chart-reflabel{position:absolute;right:2px;font-size:11px;color:var(--yellow);white-space:nowrap;
    text-shadow:0 0 7px rgba(255,210,61,.4);}
  .chart-pie{width:190px;height:190px;border-radius:50%;flex:0 0 auto;}
  .chart-legend{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0;padding-top:2px;}
  .chart-legend .li{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
  .chart-swatch{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto;}
  .chart-legend .nm{color:var(--white);flex:0 0 auto;min-width:4.2em;}
  .chart-legend .vl{display:inline-flex;align-items:baseline;gap:10px;color:var(--gray);}
  .chart-legend .vl .amt{color:var(--white);}
  .chart-legend .vl .pc{color:var(--green);min-width:3.2em;text-align:right;}

  /* ---- 统一视觉: 章节标题 / 横向比例条 / 堆叠条 / 迷你柱 ----
     budget / forecast / assets / summary / config / list 与图表共用一套语言:
     标题同为「▓ + 大一档青色」, 比例一律是「方形轨道 + 分色填充 + 100% 刻度」,
     不再用 █░ 字符条(字符条的字宽/亮度随字体漂移, 且和柱状图不是同一套颜色语义)。
     进度条一律**直角方形**: 已用部分 = 语义色实心, 剩余部分 = 同色低透明度实色(不是点阵/斜纹),
     两段之间是一条 1px 分界线 —— 分色靠"色块", 不靠纹理。 */
  .hbar-wrap{margin:7px 0 3px;max-width:640px;}
  .hbar-top{display:flex;align-items:baseline;gap:10px;font-size:12.5px;}
  .hbar-top .hbar-k{color:var(--gray);}
  .hbar-top .hbar-v{margin-left:auto;font-weight:bold;letter-spacing:.3px;}
  .hbar{position:relative;display:flex;height:12px;margin-top:5px;border-radius:0;
    border:1px solid var(--chart-axis);background:transparent;}
  .hbar-fill{height:100%;border-radius:0;min-width:2px;}
  .hbar-rest{height:100%;border-radius:0;}
  .hbar-100{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--yellow);opacity:.8;}
  .hbar-sub{font-size:11.5px;color:var(--gray);margin-top:5px;}
  .hbar-mini{display:inline-flex;width:104px;height:9px;margin:0;vertical-align:middle;border-radius:0;}
  .stat .hbar-mini{margin-right:6px;}
  .hbar-pct{font-size:11.5px;vertical-align:middle;}
  /* 堆叠条同样随分辨率自适应: 占满可用宽度(不再固定在 640px), 条高随视口微调;
     旧实现的 640px 上限让它在 2K/4K 屏上只占中间一小段, 图例也被挤在左边。 */
  .stack-wrap{margin:7px 0 3px;width:100%;max-width:100%;}
  .stack{display:flex;height:clamp(12px,1.1vh,18px);border-radius:0;overflow:hidden;margin-top:5px;
    border:1px solid var(--chart-axis);background:transparent;}
  .stack i{display:block;height:100%;box-shadow:2px 0 0 0 var(--bg);}
  /* 含负值: 条内按"零轴"绝对定位, 负段在零轴左侧、正段在右侧, 零轴画一条灰实线 */
  .stack.mixed{display:block;position:relative;}
  .stack.mixed i{position:absolute;top:0;bottom:0;height:auto;}
  .stack-zero{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--gray);opacity:.85;}
  .stack-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--gray);margin-top:6px;}
  .stack-li{display:inline-flex;align-items:center;gap:6px;}
  .stack-li .chart-swatch{width:9px;height:9px;}
  .chart-bars.mini{height:calc(var(--plot-h,128px) + 22px);padding:20px 8px 0;margin:4px 0 22px;}
  .cat-rows{display:flex;flex-direction:column;gap:3px;margin:5px 0 6px;max-width:520px;}
  .cat-row{display:grid;grid-template-columns:4.2em 1fr 3.2em 5.4em;align-items:center;gap:8px;font-size:12px;}
  .cat-nm{color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-track{display:block;height:8px;border-radius:0;overflow:hidden;
    background:rgba(61,255,122,.05);border:1px solid var(--chart-axis);}
  .cat-track i{display:block;height:100%;border-radius:0;}
  .cat-pc{color:var(--green);text-align:right;}
  .cat-amt{color:var(--gray);text-align:right;}
  /* ---- 类别余额(信封预算) ---- */
  /* 命令输出: 类别 / 已分配 / 已支出 / 剩余 / 使用率 —— 五列网格(中文名按列对齐, 不靠空格凑) */
  .cb-table{display:flex;flex-direction:column;gap:2px;margin:6px 0 8px;max-width:680px;font-size:12.5px;}
  .cb-tr{display:grid;grid-template-columns:minmax(4em,1fr) 7.6em 7.6em 7.6em 4.8em;gap:10px;align-items:center;}
  .cb-tr.hd{color:var(--gray);font-size:11.5px;border-bottom:1px solid var(--border);padding-bottom:3px;margin-bottom:2px;}
  .cb-tr.ft{color:var(--white);border-top:1px solid var(--border);padding-top:3px;margin-top:2px;}
  .cb-nm{display:inline-flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cb-sw{width:8px;height:8px;flex:0 0 auto;display:inline-block;}
  .cb-num{text-align:right;color:var(--white);}
  .cb-num.dim{color:var(--gray);}
  .cb-pc{text-align:right;}
  /* 配置弹窗: 一行一个类别, 输入框后是浅色"可配置余额", 行尾是该类别余额占比 */
  #catModal{width:min(640px,94vw);}
  #catModal h3{margin-bottom:10px;}
  #catModal .cmeta{color:var(--gray);font-size:12px;line-height:1.8;margin-bottom:10px;}
  #catModal .cmeta b{color:var(--pure);font-weight:normal;}
  #catModal .cmeta .warn{color:var(--yellow);}
  #catModal .crows{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  #catModal .crow{display:grid;grid-template-columns:10px 5.6em 14px 118px minmax(0,1fr) 4.4em;gap:9px;align-items:center;}
  #catModal .crow .cnm{color:var(--white);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #catModal .csw{width:8px;height:8px;display:block;border-radius:0;}
  #catModal .crow input{padding:4px 8px;font-size:13px;color-scheme:dark;}
  /* 提示超额开关: 不要让 #catModal input 的 width:100% 把它撑满一列 */
  #catModal .crow input.cwarn{width:13px;height:13px;padding:0;accent-color:var(--green);border:none;background:none;cursor:pointer;}
  /* 低透明度: 实时可配置余额(总可用余额 − 已配置类别余额) */
  #catModal .cleft{color:var(--white);opacity:.38;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #catModal .cleft.neg{color:var(--red);opacity:.95;}
  #catModal .cpc{color:var(--cyan);opacity:.72;font-size:11.5px;text-align:right;white-space:nowrap;}
  #catModal .hint{color:var(--gray);font-size:12px;margin-top:12px;line-height:1.6;}
  #catModal .hint.bad{color:var(--yellow);}
  #c_save{color:var(--green);border-color:var(--green);}
  #c_save:hover{background:rgba(61,255,122,.1);}
  #c_cancel{color:var(--red);border-color:var(--red);}
  #c_cancel:hover{background:rgba(255,77,94,.1);}
  #c_clear{color:var(--gray);border-color:var(--gray);}
  #c_clear:hover{background:rgba(93,107,98,.18);}

  /* ---- input ---- */
  footer{
    flex:0 0 auto;background:var(--panel);border-top:1px solid var(--border);
    display:flex;align-items:center;padding:8px 14px;gap:8px;
  }
  .ps1{color:var(--magenta);white-space:nowrap;font-size:13px;}
  .ps1 .pwd{color:var(--cyan);}
  footer input{
    flex:1;background:transparent;border:none;outline:none;color:var(--green);
    font-family:inherit;font-size:15px;caret-color:var(--green);
  }
  footer input::placeholder{color:#2c3a30;}
  .inwrap{position:relative;flex:1;display:flex;align-items:center;overflow:hidden;}
  #cmdline{position:relative;z-index:1;}
  #ghost{
    position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:0;
    color:#4c6b57;white-space:pre;font-family:inherit;font-size:15px;line-height:normal;
    pointer-events:none;opacity:0;user-select:none;
  }
  #ghost.show{opacity:1;}

  /* ---- modal forms (auxiliary) ---- */
  #modalWrap,#budgetWrap,#investWrap,#dateWrap,#geoWrap,#catWrap,#periodWrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20;}
  #modalWrap.open,#budgetWrap.open,#investWrap.open,#dateWrap.open,#geoWrap.open,#catWrap.open,#periodWrap.open{display:flex;}
  #modal,#budgetModal,#investModal,#dateModal,#geoModal,#catModal,#periodModal{
    width:min(560px,94vw);max-height:90vh;overflow:auto;
    background:var(--panel-2);border:1px solid var(--green);border-radius:6px;padding:18px 20px;
    box-shadow:0 0 30px rgba(61,255,122,.15);
  }
  #modal h3,#budgetModal h3,#investModal h3,#dateModal h3,#geoModal h3,#catModal h3,#periodModal h3{color:var(--cyan);font-size:15px;letter-spacing:1px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:8px;}
  #modal label,#budgetModal label,#investModal label,#dateModal label,#geoModal label,#catModal label,#periodModal label{display:block;color:var(--gray);font-size:12px;margin:10px 0 4px;}
  #modal input,#modal select,#budgetModal input,#investModal input,#dateModal input,#geoModal input,#catModal input,#periodModal input{
    width:100%;background:var(--field);border:1px solid var(--border);color:var(--white);
    font-family:inherit;font-size:14px;padding:6px 8px;border-radius:3px;outline:none;
  }
  #modal input:focus,#modal select:focus,#budgetModal input:focus,#investModal input:focus,#dateModal input:focus,#geoModal input:focus,#catModal input:focus,#periodModal input:focus{border-color:var(--green);}
  #geoModal .seg,#periodModal .seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  /* 分段按钮的**基态**: 以前只写了 .on, 未选中的那个落到浏览器默认的白底黑字(在近黑弹窗上抢眼) */
  #geoModal .seg button,#periodModal .seg button{
    font-family:inherit;font-size:13px;padding:5px 14px;cursor:pointer;border-radius:3px;
    border:1px solid var(--border);background:transparent;color:var(--gray);
  }
  #geoModal .seg button:hover,#periodModal .seg button:hover{border-color:var(--green);color:var(--green);}
  #geoModal .seg button.on,#periodModal .seg button.on{color:var(--green);border-color:var(--green);background:rgba(61,255,122,.1);}
  /* 配置周期: 起止日只读时(按月模式)仍要看清数字, 用低透明度提示不可编辑 */
  #periodModal input:disabled{opacity:.55;}
  #periodModal .pmeta{color:var(--cyan);font-size:12px;margin-top:12px;line-height:1.6;word-break:break-word;}
  #periodModal .hint{color:var(--gray);font-size:12px;margin-top:8px;line-height:1.6;white-space:pre-wrap;}
  #periodModal .hint.bad{color:var(--yellow);}
  #periodModal label .fmt{color:var(--faint);font-size:11px;margin-left:6px;letter-spacing:.5px;}
  #geoModal hr{border:none;border-top:1px solid var(--border);margin:18px 0 4px;}
  #geoModal .hint{color:var(--gray);font-size:12px;margin-top:10px;line-height:1.6;white-space:pre-wrap;}
  .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
  /* 兜底: 弹窗按钮默认用主题绿字, 避免落到浏览器默认的黑色 ButtonText(在近黑底上完全看不清) */
  .mbtns button{font-family:inherit;padding:6px 16px;cursor:pointer;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--green);}
  #btnSubmit,#b_current{color:var(--green);border-color:var(--green);}
  #btnCancel,#b_cancel{color:var(--red);border-color:var(--red);}
  #b_default{color:var(--cyan);border-color:var(--cyan);}
  #i_save{color:var(--green);border-color:var(--green);}
  #i_save:hover{background:rgba(61,255,122,.1);}
  #i_cancel{color:var(--red);border-color:var(--red);}
  #i_cancel:hover{background:rgba(255,77,94,.1);}
  /* 配置周期弹窗按钮 */
  #p_save{color:var(--green);border-color:var(--green);}
  #p_save:hover{background:rgba(61,255,122,.1);}
  #p_cancel{color:var(--red);border-color:var(--red);}
  #p_cancel:hover{background:rgba(255,77,94,.1);}
  #btnSubmit:hover,#b_current:hover{background:rgba(61,255,122,.1);}
  #btnCancel:hover,#b_cancel:hover{background:rgba(255,77,94,.1);}
  #b_default:hover{background:rgba(77,232,255,.1);}
  /* 每日可用余额 / 按日期查看 两个新弹窗的按钮 */
  #b_daily_save,#d_ok{color:var(--green);border-color:var(--green);}
  #b_daily_save:hover,#d_ok:hover{background:rgba(61,255,122,.1);}
  #b_daily_off{color:var(--gray);border-color:var(--gray);}
  #b_daily_off:hover{background:rgba(93,107,98,.18);}
  #d_cancel{color:var(--red);border-color:var(--red);}
  #d_cancel:hover{background:rgba(255,77,94,.1);}
  /* 输入框的日历/微调图标在暗色下也需要提亮 */
  #modal input,#budgetModal input,#investModal input,#dateModal input,#geoModal input,#catModal input,#periodModal input{color-scheme:dark;}
  #budgetModal .hint,#investModal .hint{color:var(--gray);font-size:12px;margin-top:12px;line-height:1.6;}
  #g_save,#g_place_save{color:var(--green);border-color:var(--green);}
  #g_cancel{color:var(--red);border-color:var(--red);}

  /* ---- 「记一笔」的双选项卡: 单笔消费 / 分摊成本 ---- */
  #modal .mtabs{display:flex;gap:8px;margin:0 0 4px;flex-wrap:wrap;}
  #modal .mtabs .mtab{
    font-family:inherit;font-size:13px;padding:5px 14px;cursor:pointer;border-radius:3px;
    border:1px solid var(--border);background:transparent;color:var(--gray);
  }
  #modal .mtabs .mtab:hover{border-color:var(--green);color:var(--green);}
  #modal .mtabs .mtab.on{color:var(--green);border-color:var(--green);background:rgba(61,255,122,.1);}
  #modal .mhint{color:var(--gray);font-size:12px;margin-top:10px;line-height:1.6;word-break:break-word;white-space:pre-wrap;}
  #modal .mhint.bad{color:var(--yellow);}
  #modal .mpanel.hide{display:none;}
  /* 经常性支出: 「持续时间 + 单位」同一行; 「自动分摊」勾选行不要竖排大间距 */
  #modal .frow{display:flex;gap:8px;align-items:stretch;}
  #modal .frow > input{flex:1 1 120px;min-width:0;}
  #modal .frow > select{flex:0 0 96px;width:96px;}
  #modal label.chk{display:flex;align-items:center;gap:8px;color:var(--white);font-size:13px;margin-top:12px;line-height:1.5;}
  #modal label.chk input{width:auto;flex:0 0 auto;margin:0;}

  /* ---- 「手动输日期」弹窗: 日期/月份统一为 ISO 文本 + 原生选择器辅助按钮 ---- */
  #dateModal label .fmt{color:var(--faint);font-size:11px;margin-left:6px;letter-spacing:.5px;}
  #dateModal .drow{position:relative;display:flex;gap:6px;align-items:stretch;}
  #dateModal .drow > input[type="text"]{flex:1 1 auto;min-width:0;}
  #dateModal .drow .pick{
    flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--cyan);
    font-family:inherit;font-size:13px;padding:0 10px;cursor:pointer;border-radius:3px;line-height:1;
  }
  #dateModal .drow .pick:hover{border-color:var(--cyan);background:rgba(77,232,255,.1);}
  #dateModal .drow .native-pick{
    position:absolute;right:0;top:0;width:40px;height:100%;opacity:0;border:none;padding:0;
    pointer-events:none;background:transparent;
  }
  #dateModal .dpreview{color:var(--cyan);font-size:12px;margin-top:10px;min-height:1.2em;word-break:break-all;}
  #dateModal .hint{color:var(--gray);font-size:12px;margin-top:10px;line-height:1.6;}
  #dateModal .hint.bad{color:var(--yellow);}

  /* ---- 三页外壳: 页面导航 / 钱包页 / 设置页 / 终端回显 ----
     主页的顶层元素不动(只是多了一个 .page-hide 开关); 另两页是独立 <main>, 各自滚动。
     视觉沿用整站语言: 近黑面板 + 1px 暗边框 + 直角方块 + 等宽字体; 颜色一律取主题令牌。 */
  nav.pages{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:5px 14px;background:var(--panel-3);border-bottom:1px solid var(--border);font-size:12.5px;
  }
  nav.pages .pg{
    font-family:inherit;font-size:12.5px;padding:4px 14px;cursor:pointer;border-radius:3px;letter-spacing:.5px;
    border:1px solid var(--border);background:transparent;color:var(--gray);
  }
  nav.pages .pg:hover{border-color:var(--green);color:var(--green);}
  nav.pages .pg.on{color:var(--green);border-color:var(--green);background:rgba(61,255,122,.1);}
  nav.pages .pg-hint{margin-left:auto;color:var(--faint);font-size:11.5px;}
  /* !important: header / nav.toolbar 自己带 display:flex, 会盖掉原生 [hidden], 所以统一用类来收起 */
  .page-hide{display:none !important;}
  .page{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 14px 18px;font-size:13.5px;line-height:1.5;}
  .page::-webkit-scrollbar{width:10px;}
  .page::-webkit-scrollbar-thumb{background:var(--chart-axis);border-radius:6px;}
  .pg-title{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin:0 0 10px 2px;}
  .pg-title .pg-name{color:var(--cyan);font-size:15px;letter-spacing:1px;}
  .pg-title .pg-sub{color:var(--gray);font-size:12px;}
  .page .pbtn{
    font-family:inherit;font-size:12px;padding:4px 10px;cursor:pointer;border-radius:3px;
    border:1px solid var(--border);background:transparent;color:var(--green);white-space:nowrap;
  }
  .page .pbtn:hover{background:rgba(61,255,122,.08);border-color:var(--green);color:var(--white);}
  .page .pbtn.accent:hover{border-color:var(--cyan);color:var(--cyan);}
  .page .pbtn.danger:hover{border-color:var(--red);color:var(--red);}
  /* 删除按钮的两步确认: 第一次点变红「确认删除?」, 再点才真的执行 */
  .page .pbtn.armed{border-color:var(--red);color:var(--red);background:rgba(255,77,94,.12);}
  .page .seg button{
    font-family:inherit;font-size:13px;padding:5px 14px;cursor:pointer;border-radius:3px;
    border:1px solid var(--border);background:transparent;color:var(--gray);
  }
  .page .seg button:hover{border-color:var(--green);color:var(--green);}
  .page .seg button.on{color:var(--green);border-color:var(--green);background:rgba(61,255,122,.1);}
  /* 钱包页 */
  .wsum{display:flex;gap:10px 30px;flex-wrap:wrap;align-items:stretch;border:1px solid var(--border);
    background:var(--panel);border-radius:4px;padding:10px 14px;margin:8px 0 6px;}
  .wsum .ws{display:flex;flex-direction:column;gap:2px;min-width:9em;}
  .wsum .ws .k{color:var(--gray);font-size:11px;}
  .wsum .ws .v{font-size:15px;font-weight:bold;letter-spacing:.3px;}
  .wsum .ws .s{color:var(--gray);font-size:11.5px;}
  .wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px;margin:10px 0 4px;}
  .wcard{border:1px solid var(--border);background:var(--panel);border-radius:4px;padding:12px 14px;min-width:0;}
  .wcard.default{border-color:var(--green-dim);}
  .wcard.new{border-style:dashed;margin-top:12px;}
  .wcard-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px;}
  .wcard-h .wname{color:var(--white);font-size:15px;font-weight:bold;word-break:break-all;}
  .wcard-h .wtag{color:var(--green);border:1px solid var(--green-dim);border-radius:2px;padding:0 6px;font-size:11px;white-space:nowrap;}
  .wcard-h .wsub{margin-left:auto;color:var(--gray);font-size:11.5px;white-space:nowrap;}
  .wbal{font-size:22px;font-weight:bold;letter-spacing:.5px;margin:8px 0 0;}
  .wbal.neg{text-shadow:0 0 8px currentColor;}
  .wnote{color:var(--gray);font-size:12px;margin-top:2px;}
  .wbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .wcard .hbar-wrap{max-width:none;}
  .wform{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .wform .wf{display:flex;align-items:center;gap:6px;flex:1 1 190px;min-width:0;}
  .wform .wf label{color:var(--gray);font-size:12px;white-space:nowrap;}
  .wform input,.wform select{
    flex:1 1 80px;min-width:0;background:var(--field);border:1px solid var(--border);color:var(--white);
    font-family:inherit;font-size:13px;padding:4px 8px;border-radius:3px;outline:none;color-scheme:dark;
  }
  .wform input:focus,.wform select:focus{border-color:var(--green);}
  .wform select{cursor:pointer;}
  .wform .werr{flex:1 1 100%;color:var(--yellow);font-size:12px;}
  .wform .werr:empty{display:none;}
  /* 设置页 */
  .scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(430px,100%),1fr));gap:12px;align-items:start;}
  .scard{border:1px solid var(--border);background:var(--panel);border-radius:4px;padding:12px 14px;min-width:0;}
  .scard-h{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:6px;}
  .scard-h .st{color:var(--cyan);font-size:14px;letter-spacing:.6px;}
  .scard-h .slive{color:var(--gray);font-size:12px;word-break:break-word;}
  .scard .shint{color:var(--gray);font-size:12px;margin-top:10px;line-height:1.6;white-space:pre-wrap;}
  .scard .shint.bad{color:var(--yellow);}
  .scard .shint:empty{display:none;}
  /* 设置页里挂载的弹窗面板: 去掉弹窗外观, 变成卡片内的普通表单(面板 DOM 仍是同一个节点) */
  #pageSettings #budgetModal,#pageSettings #periodModal,#pageSettings #investModal,
  #pageSettings #catModal,#pageSettings #geoModal{
    width:auto;max-height:none;overflow:visible;box-shadow:none;border:none;background:transparent;
    padding:0;border-radius:0;
  }
  #pageSettings .scard-body h3{display:none;}        /* 卡片自带标题, 面板里的 <h3> 不重复显示 */
  #pageSettings .mbtns{justify-content:flex-start;margin-top:12px;}
  #pageSettings .mbtns [data-close]{display:none;}   /* 「取消 / 关闭」在页内表单上没有意义 */
  #pageSettings .scard-body hr{border:none;border-top:1px solid var(--border);margin:16px 0 4px;}
  .srow{display:grid;grid-template-columns:9.5em minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:10px;}
  .srow > label{color:var(--gray);font-size:12px;line-height:1.4;}
  .srow input{
    width:100%;min-width:0;background:var(--field);border:1px solid var(--border);color:var(--white);
    font-family:inherit;font-size:13px;padding:4px 8px;border-radius:3px;outline:none;color-scheme:dark;
  }
  .srow input:focus{border-color:var(--green);}
  .srow .seg{display:flex;gap:8px;flex-wrap:wrap;grid-column:2 / -1;}
  /* 终端回显: 钱包 / 设置页上执行的命令, 其输出行(主页终端里新增的那几行)镜像到这里 */
  .pecho{display:none;margin-top:14px;border:1px solid var(--border);border-left:2px solid var(--green-dim);
    background:var(--panel-2);border-radius:4px;padding:8px 12px 10px;font-size:13px;line-height:1.5;}
  .pecho.has{display:block;}
  .pecho-h{color:var(--cyan);font-size:12.5px;letter-spacing:.5px;margin-bottom:4px;}
  .pecho-h span{color:var(--gray);margin-left:8px;letter-spacing:0;}
  .pecho-b .l{white-space:pre-wrap;word-break:break-word;}
  .pecho-b{max-height:300px;overflow-y:auto;}
  #modal select{cursor:pointer;}
</style>
</head>
<body>
<!-- 三页外壳: 主页 / 钱包 / 设置。主页 = 原终端界面(下面的 header / 工具栏 / 理财条 / 终端 / 输入行, 原样保留);
     钱包页与设置页是两个独立的 <main>, 同一时间只显示一页(见 showPage)。两页上的操作同样回灌命令。 -->
<nav class="pages" id="pageNav" aria-label="页面切换">
  <button type="button" class="pg on" data-page="home">● 主页</button>
  <button type="button" class="pg" data-page="wallet">钱包</button>
  <button type="button" class="pg" data-page="settings">设置</button>
  <span class="pg-hint">Alt+1 / 2 / 3 切换 · 钱包与设置页上的操作同样回灌命令, 输出同步到主页终端</span>
</nav>
<header id="statusbar"></header>
<nav class="toolbar" id="toolbar">
  <button data-cmd="help">[F1] 帮助</button>
  <!-- 工具栏不再留「预算进度」按钮 —— 周期预算在 boot 的首屏由 showBudget 自动输出,
       之后只能用 `budget` 命令重看(toolbar 只是辅助入口, 不再重复一个"已经一直看得见"的视图)。 -->
  <!-- 原来的「配置 ▾」下拉已移除 —— 配置预算 / 周期持续时间 / 投资比例 / 类别余额 / 地图 Key
       全部在顶部「设置」页里**页内直接改**(用的还是这五个面板的同一份 DOM, 见 SETTING_CARDS)。
       主页工具栏只保留"一次性的动作"(记一笔/查看类/导出/备份), 不再重复一套配置入口。 -->
  <button data-cmd="forecast">燃尽预测</button>
  <button data-cmd="open-add" class="accent">+ 记一笔</button>
  <!-- 原来的「地点 ▾」下拉已移除 —— 地点模式 / 地图 Key / 按 id 手动补填
       全部在顶部「设置」页的「地点与地图 Key」卡片里页内直接改(就是同一个 geoModal DOM)。
       主页工具栏不再重复一套配置入口; 模式切换仍回灌 config 命令, 左上角 badge 保留。 -->
  <span class="dd" id="listDd">
    <button id="btnListDd" class="accent" type="button">消费列表 ▾</button>
    <div class="dd-menu" id="listDdMenu">
      <span class="dd-hint">查看范围</span>
      <button type="button" data-range="today" data-range-target="list">当日</button>
      <button type="button" data-range="period" data-range-target="list">周期</button>
      <button type="button" data-range="month" data-range-target="list">月份</button>
      <button type="button" data-range="manual" data-range-target="list">手动输日期…</button>
    </div>
  </span>
  <!-- 原先「周期总结 / 日总结 / 周总结 / 图表总结」四个入口合成一个。
       范围选项与「消费列表」共用同一套 data-range + onRangeMenuItem + 手动输日期弹窗。 -->
  <span class="dd" id="reportDd">
    <button id="btnReportDd" class="accent" type="button">总结与图表 ▾</button>
    <div class="dd-menu" id="reportDdMenu">
      <span class="dd-hint">先选统计范围</span>
      <button type="button" data-range="today" data-range-target="report">当日</button>
      <button type="button" data-range="week" data-range-target="report">本周</button>
      <button type="button" data-range="period" data-range-target="report">记账周期</button>
      <button type="button" data-range="month" data-range-target="report">自然月</button>
      <button type="button" data-range="manual" data-range-target="report">手动输日期…</button>
    </div>
  </span>
  <button data-cmd="assets">资产看板</button>
  <button data-cmd="config">当前配置</button>
