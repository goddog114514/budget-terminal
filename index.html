<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUDGET::TERM — 记账与自动理财终端</title>
<style>
  :root{
    color-scheme:dark;              /* 让原生控件(日期/月份选择器图标、数字微调箭头)按暗色渲染, 否则默认是黑图标看不见 */
    --bg:#050607;
    --panel:#0b0e0f;
    --green:#3dff7a;
    --green-dim:#1e9e54;
    --white:#d7ffe0;
    --yellow:#ffd23d;
    --orange:#ff9d3d;
    --red:#ff4d5e;
    --cyan:#4de8ff;
    --magenta:#ff5ef0;
    --gray:#5d6b62;
    --border:#142018;
    /* ---- 扩展令牌: 供 JS 终端输出与表达式取值(见 JS 里的 COLOR 表) ---- */
    --index:#f1fa8c;                /* 指数(应投/基金)强调色 */
    --pure:#ffffff;                 /* 纯白: 金额等强强调文本(区别于柔和的 --white) */
    --faint:#3c4b41;                /* 极暗: 提示语/占位文字 */
    --cat-fallback:#8be9fd;         /* 未登记类别的兜底配色 */
    /* ---- 面板层次(避免同一底色在多处硬编码) ---- */
    --panel-2:#07090a;              /* 二级面板: 弹窗 / 下拉 / 理财条 */
    --panel-3:#080a0b;              /* 工具栏底色 */
    --field:#0c100e;                /* 输入框底色 */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--green);
    font-family:"Consolas","JetBrains Mono","Cascadia Code","Courier New",monospace;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  /* faint scanlines + vignette for immersion */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.5;
  }
  .glow{ text-shadow:0 0 6px currentColor; }

  /* ---- header status bar ---- */
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);
    font-size:13px;letter-spacing:.3px;flex:0 0 auto;
  }
  .logo{font-weight:bold;color:var(--cyan);}
  .logo b{color:var(--magenta);}
  .stat{display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--border);padding-left:12px;}
  .stat .k{color:var(--gray);font-size:11px;}
  .stat .v{color:var(--white);font-size:13px;}
  .stat .v.neg{color:var(--red);}
  .stat .v.ok{color:var(--green);}
  .stat .v.warn{color:var(--yellow);}
  .spacer{flex:1;}
  /* 右上角 今日/周期 预算指示: 红黄绿"实心圆点", 不闪烁 */
  .mini-alert{
    font-size:12px;border:1px solid var(--border);padding:2px 8px;border-radius:3px;
    display:flex;gap:16px;align-items:center;white-space:nowrap;
  }
  .dotbox{display:inline-flex;align-items:center;gap:3px;}
  .dotbox .dlabel{color:var(--gray);}
  .dotbox .dval{color:var(--white);}
  .dot{font-size:14px;line-height:1;display:inline-block;}
  .dot.g{color:var(--green);}
  .dot.y{color:var(--yellow);}
  .dot.r{color:var(--red);}
  .dot.n{color:var(--gray);}

  /* ---- button toolbar (auxiliary mouse support) ---- */
  nav.toolbar{
    flex:0 0 auto;display:flex;gap:6px;padding:6px 14px;
    background:var(--panel-3);border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  nav.toolbar button{
    background:transparent;color:var(--green);border:1px solid var(--border);
    font-family:inherit;font-size:12px;padding:4px 10px;cursor:pointer;border-radius:3px;
  }
  nav.toolbar button:hover{background:rgba(61,255,122,.08);border-color:var(--green);color:var(--white);}
  nav.toolbar button:active{background:rgba(61,255,122,.2);}
  nav.toolbar button.danger:hover{border-color:var(--red);color:var(--red);}
  nav.toolbar button.accent:hover{border-color:var(--cyan);color:var(--cyan);}
  /* 工具条下拉菜单 (消费列表的 4 个快捷范围) */
  nav.toolbar .dd{position:relative;display:inline-block;}
  nav.toolbar .dd-menu{
    position:absolute;top:calc(100% + 4px);left:0;min-width:158px;z-index:30;
    background:var(--panel-2);border:1px solid var(--green);border-radius:4px;padding:4px;
    box-shadow:0 8px 20px rgba(0,0,0,.65);display:none;flex-direction:column;gap:2px;
  }
  nav.toolbar .dd.open .dd-menu{display:flex;}
  nav.toolbar .dd-menu button{
    width:100%;text-align:left;border:none;border-radius:3px;padding:6px 10px;
    background:transparent;color:var(--green);font-family:inherit;font-size:12px;cursor:pointer;
  }
  nav.toolbar .dd-menu button:hover{background:rgba(61,255,122,.12);color:var(--white);}
  nav.toolbar .dd-menu .dd-hint{color:var(--gray);font-size:11px;padding:4px 10px 2px;}
  /* 行内 "已投资" 开关按钮 */
  .tbtn{
    background:transparent;color:var(--yellow);border:1px solid var(--yellow);
    font-family:inherit;font-size:12px;padding:1px 9px;margin:0 2px 0 8px;
    cursor:pointer;border-radius:3px;vertical-align:middle;line-height:1.4;
  }
  .tbtn:hover{background:rgba(255,210,61,.12);}
  .tbtn.on{color:var(--green);border-color:var(--green);}
  .tbtn.on:hover{background:rgba(61,255,122,.12);}
  .tbtn.dimmed{color:var(--gray);border-color:var(--gray);}

  /* ---- 理财条：应投货币 / 应投指数 池 + 一键投资 ---- */
  #investbar{
    flex:0 0 auto;display:flex;gap:22px;align-items:center;flex-wrap:wrap;
    padding:5px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);font-size:12.5px;
  }
  .inv-cl{display:flex;align-items:center;gap:9px;}
  .inv-kind{color:var(--gray);}
  .inv-kind.m{color:var(--cyan);}.inv-kind.i{color:var(--index);}
  .inv-pool{font-weight:bold;font-size:13px;color:var(--yellow);}
  .inv-pool.ready{color:var(--green);text-shadow:0 0 7px var(--green);}
  .inv-done{color:var(--gray);}
  .inv-btn{
    background:transparent;border:1px solid var(--green);color:var(--green);
    font-family:inherit;font-size:12px;padding:1px 10px;cursor:pointer;border-radius:3px;display:inline-block;
  }
  .inv-btn:hover{background:rgba(61,255,122,.12);}
  .inv-btn[disabled]{opacity:.35;cursor:not-allowed;border-color:var(--border);color:var(--gray);}
  .inv-hint{color:var(--faint);margin-left:4px;}

  /* ---- terminal output ---- */
  #term{
    flex:1 1 auto;overflow-y:auto;padding:10px 14px 14px;
    font-size:14px;line-height:1.5;scroll-behavior:smooth;
  }
  #term::-webkit-scrollbar{width:10px;}
  #term::-webkit-scrollbar-thumb{background:#122a1a;border-radius:6px;}
  #term::-webkit-scrollbar-track{background:transparent;}
  .l{white-space:pre-wrap;word-break:break-word;min-height:1em;}
  .dim{color:var(--gray);}
  .ok{color:var(--green);}
  .y{color:var(--yellow);}
  .o{color:var(--orange);}
  .r{color:var(--red);}
  .c{color:var(--cyan);}
  .m{color:var(--magenta);}
  .w{color:var(--white);}
  .cmd{color:var(--cyan);}
  .prompt{color:var(--magenta);}
  .sep{border-bottom:1px solid var(--border);margin:4px 0;}
  .hl{background:rgba(61,255,122,.14);}

  /* ---- input ---- */
  footer{
    flex:0 0 auto;background:var(--panel);border-top:1px solid var(--border);
    display:flex;align-items:center;padding:8px 14px;gap:8px;
  }
  .ps1{color:var(--magenta);white-space:nowrap;font-size:13px;}
  .ps1 .pwd{color:var(--cyan);}
  footer input{
    flex:1;background:transparent;border:none;outline:none;color:var(--green);
    font-family:inherit;font-size:15px;caret-color:var(--green);
  }
  footer input::placeholder{color:#2c3a30;}
  .inwrap{position:relative;flex:1;display:flex;align-items:center;overflow:hidden;}
  #cmdline{position:relative;z-index:1;}
  #ghost{
    position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:0;
    color:#4c6b57;white-space:pre;font-family:inherit;font-size:15px;line-height:normal;
    pointer-events:none;opacity:0;user-select:none;
  }
  #ghost.show{opacity:1;}

  /* ---- modal forms (auxiliary) ---- */
  #modalWrap,#budgetWrap,#dateWrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20;}
  #modalWrap.open,#budgetWrap.open,#dateWrap.open{display:flex;}
  #modal,#budgetModal,#dateModal{
    width:min(560px,94vw);max-height:90vh;overflow:auto;
    background:var(--panel-2);border:1px solid var(--green);border-radius:6px;padding:18px 20px;
    box-shadow:0 0 30px rgba(61,255,122,.15);
  }
  #modal h3,#budgetModal h3,#dateModal h3{color:var(--cyan);font-size:15px;letter-spacing:1px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:8px;}
  #modal label,#budgetModal label,#dateModal label{display:block;color:var(--gray);font-size:12px;margin:10px 0 4px;}
  #modal input,#modal select,#budgetModal input,#dateModal input{
    width:100%;background:var(--field);border:1px solid var(--border);color:var(--white);
    font-family:inherit;font-size:14px;padding:6px 8px;border-radius:3px;outline:none;
  }
  #modal input:focus,#modal select:focus,#budgetModal input:focus,#dateModal input:focus{border-color:var(--green);}
  .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
  /* 兜底: 弹窗按钮默认用主题绿字, 避免落到浏览器默认的黑色 ButtonText(在近黑底上完全看不清) */
  .mbtns button{font-family:inherit;padding:6px 16px;cursor:pointer;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--green);}
  #btnSubmit,#b_current{color:var(--green);border-color:var(--green);}
  #btnCancel,#b_cancel{color:var(--red);border-color:var(--red);}
  #b_default{color:var(--cyan);border-color:var(--cyan);}
  #btnSubmit:hover,#b_current:hover{background:rgba(61,255,122,.1);}
  #btnCancel:hover,#b_cancel:hover{background:rgba(255,77,94,.1);}
  #b_default:hover{background:rgba(77,232,255,.1);}
  /* 每日可用余额 / 按日期查看 两个新弹窗的按钮 */
  #b_daily_save,#d_ok{color:var(--green);border-color:var(--green);}
  #b_daily_save:hover,#d_ok:hover{background:rgba(61,255,122,.1);}
  #b_daily_off{color:var(--gray);border-color:var(--gray);}
  #b_daily_off:hover{background:rgba(93,107,98,.18);}
  #d_cancel{color:var(--red);border-color:var(--red);}
  #d_cancel:hover{background:rgba(255,77,94,.1);}
  /* 输入框的日历/微调图标在暗色下也需要提亮 */
  #modal input,#budgetModal input,#dateModal input{color-scheme:dark;}
  #budgetModal .hint{color:var(--gray);font-size:12px;margin-top:12px;line-height:1.6;}

  /* ---- 「手动输日期」弹窗: 日期/月份统一为 ISO 文本 + 原生选择器辅助按钮 ---- */
  #dateModal label .fmt{color:var(--faint);font-size:11px;margin-left:6px;letter-spacing:.5px;}
  #dateModal .drow{position:relative;display:flex;gap:6px;align-items:stretch;}
  #dateModal .drow > input[type="text"]{flex:1 1 auto;min-width:0;}
  #dateModal .drow .pick{
    flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--cyan);
    font-family:inherit;font-size:13px;padding:0 10px;cursor:pointer;border-radius:3px;line-height:1;
  }
  #dateModal .drow .pick:hover{border-color:var(--cyan);background:rgba(77,232,255,.1);}
  #dateModal .drow .native-pick{
    position:absolute;right:0;top:0;width:40px;height:100%;opacity:0;border:none;padding:0;
    pointer-events:none;background:transparent;
  }
  #dateModal .dpreview{color:var(--cyan);font-size:12px;margin-top:10px;min-height:1.2em;word-break:break-all;}
  #dateModal .hint{color:var(--gray);font-size:12px;margin-top:10px;line-height:1.6;}
  #dateModal .hint.bad{color:var(--yellow);}
</style>
</head>
<body>
<header id="statusbar"></header>
<nav class="toolbar">
  <button data-cmd="help">[F1] 帮助</button>
  <button data-cmd="budget">预算进度</button>
  <button data-cmd="open-budget" class="accent">配置预算</button>
  <button data-cmd="forecast">燃尽预测</button>
  <button data-cmd="open-add" class="accent">+ 记一笔</button>
  <span class="dd" id="listDd">
    <button id="btnListDd" class="accent" type="button">消费列表 ▾</button>
    <div class="dd-menu" id="listDdMenu">
      <span class="dd-hint">查看范围</span>
      <button type="button" data-list="today">当日</button>
      <button type="button" data-list="period">周期</button>
      <button type="button" data-list="month">月份</button>
      <button type="button" data-list="manual">手动输日期…</button>
    </div>
  </span>
  <button data-cmd="summary">周期总结</button>
  <button data-cmd="summary day">日总结</button>
  <button data-cmd="summary week">周总结</button>
  <button data-cmd="assets">资产看板</button>
  <button id="btnUndo" data-cmd="undo" disabled>↩ 撤销</button>
  <button id="btnRedo" data-cmd="redo" disabled>↪ 重做</button>
  <button data-cmd="export md">导出 .md</button>
  <button data-cmd="export txt">导出 .txt</button>
  <button data-cmd="backup-download">备份 .json</button>
  <button data-cmd="restore-file">导入 .json…</button>
  <button id="btnAutosave" data-cmd="autosave-dir" class="accent">存到本地目录: 关</button>
  <button data-cmd="cls" class="danger">清屏</button>
</nav>
<input type="file" id="fileImport" accept="application/json,.json" style="display:none">
<div id="investbar"></div>
<main id="term"></main>
<footer>
  <span class="ps1 glow"><b>user</b>@<span class="pwd">budget</span>:~$</span>
  <span class="inwrap">
    <input id="cmdline" autocomplete="off" spellcheck="false" placeholder="输入命令，如  add 50 餐饮 午餐    输入 help 查看帮助" />
    <span id="ghost" aria-hidden="true"></span>
  </span>
</footer>

<div id="modalWrap">
  <div id="modal">
    <h3 id="mTitle">记一笔消费</h3>
    <label>金额 (元)</label><input id="f_amt" type="number" step="0.01" min="0.01" placeholder="如 50">
    <label>类别</label>
    <input id="f_cat" list="catlist" placeholder="如 餐饮 / 交通 / 购物 ..."><datalist id="catlist"></datalist>
    <label>日期</label><input id="f_date" type="date">
    <label>备注</label><input id="f_note" placeholder="可选，如 午餐">
    <div class="mbtns">
      <button id="btnCancel">取消</button>
      <button id="btnSubmit">确认</button>
    </div>
  </div>
</div>

<div id="budgetWrap">
  <div id="budgetModal">
    <h3>配置预算</h3>
    <label>周期预算金额 (元)</label><input id="b_amt" type="number" step="0.01" min="0.01" placeholder="如 1200">
    <div class="hint" id="b_hint"></div>
    <div class="mbtns">
      <button id="b_cancel">取消</button>
      <button id="b_default">设为默认 (各期)</button>
      <button id="b_current">应用于当期</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:18px 0 4px;">
    <label>每日可用余额 (元) — 供右上角「今日预算」红黄绿提示</label>
    <input id="b_daily" type="number" step="0.01" min="0.01" placeholder="如 100；留空=不设置">
    <div class="hint" id="b_daily_hint"></div>
    <div class="mbtns">
      <button id="b_daily_off">清除 (不设)</button>
      <button id="b_daily_save">保存每日额度</button>
    </div>
  </div>
</div>

<div id="dateWrap">
  <div id="dateModal">
    <h3>按日期 / 月份查看消费</h3>
    <label>日期 <span class="fmt">统一格式 YYYY-MM-DD</span></label>
    <div class="drow">
      <input id="d_date" type="text" autocomplete="off" spellcheck="false" inputmode="numeric" placeholder="如 2027-08-18">
      <button type="button" class="pick" id="d_date_pick" title="用日历选择">📅</button>
      <input id="d_date_native" class="native-pick" type="date" tabindex="-1" aria-hidden="true">
    </div>
    <label>或 月份 <span class="fmt">统一格式 YYYY-MM</span></label>
    <div class="drow">
      <input id="d_month" type="text" autocomplete="off" spellcheck="false" inputmode="numeric" placeholder="如 2027-08">
      <button type="button" class="pick" id="d_month_pick" title="用月份选择器">📅</button>
      <input id="d_month_native" class="native-pick" type="month" tabindex="-1" aria-hidden="true">
    </div>
    <label>类别 (可选)</label><input id="d_cat" list="catlist" placeholder="留空 = 全部类别">
    <div class="hint" id="d_hint"></div>
    <div class="dpreview" id="d_preview"></div>
    <div class="mbtns">
      <button id="d_cancel">取消</button>
      <button id="d_ok">查看</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   BUDGET::TERM  — 个人记账与自动理财规划终端
   纯前端，数据保存在 localStorage。无需构建、无需服务器，双击即可运行。
   ========================================================================== */

const LS_KEY = "budget_term_v1";
const APP_VERSION = "v0.0.5";         // 版本号(与 git tag 对应)
const DEFAULT_BUDGET = 1000;          // 每周期总预算(可动用现金总额)
/* 可调投资比例：总花费(占用) = 消费 ÷ N, 其中 N = 消费占比(默认 0.85)、
   投资占比 = 1 - N (默认 0.15)。投资池内部仍按原始 13:2 比例拆分货币/指数。
   下面四个常量是"默认/基准值"，运行时的真实比例见 consumeShare()/rateSplit()。 */
const CONSUME_SHARE = 0.85;           // 基准: 总预算中用于"消费"的比例 N (可用 set invest/consume 调)
const MM_RATE   = 0.13;               // 基准: 其中货币基金占比(占总投资池 13/15)
const IDX_RATE  = 0.02;               // 基准: 其中指数基金占比(占总投资池 2/15)
/* 一键投资的触发/单笔额度: 应投货币池累计≥100、应投指数池累计≥20 时可投入该额度 */
const INVEST_MONEY_LOT = 100;         // 货币基金每次投入额(触发阈值)
const INVEST_INDEX_LOT = 20;          // 指数基金每次投入额(触发阈值)
const DEFAULT_CATEGORIES = ["餐饮","交通","购物","娱乐","居住","医疗","教育","人情","旅行","其他"];

/* ======================= 颜色表 (单一数据源) =======================
   终端输出里的颜色以前是散落各处的 "#rrggbb" 字面量(220+ 处), 想换主题就得全文件替换。
   现在统一到这里: 每个名字对应 :root 里的同名 CSS 变量, 启动时读取真实值,
   读不到(无布局/无 CSS 环境, 例如离线测试)就退回下面的字面量默认值。
   改配色 = 只改 <style> 里的 :root 一处(或在这里覆盖默认值)。 */
const COLOR = (function(){
  const def = {
    green:"#3dff7a", greenDim:"#1e9e54", white:"#d7ffe0", pure:"#ffffff",
    yellow:"#ffd23d", orange:"#ff9d3d", red:"#ff4d5e", cyan:"#4de8ff",
    magenta:"#ff5ef0", gray:"#5d6b62", index:"#f1fa8c", faint:"#3c4b41",
    catFallback:"#8be9fd"
  };
  const map = { green:"--green", greenDim:"--green-dim", white:"--white", pure:"--pure",
                yellow:"--yellow", orange:"--orange", red:"--red", cyan:"--cyan",
                magenta:"--magenta", gray:"--gray", index:"--index", faint:"--faint",
                catFallback:"--cat-fallback" };
  try{
    const cs = getComputedStyle(document.documentElement);
    if(cs && typeof cs.getPropertyValue === "function"){
      for(const k in map){
        const v = String(cs.getPropertyValue(map[k])||"").trim();
        if(v) def[k] = v;                      // 以 CSS 令牌为准
      }
    }
  }catch(e){ /* 拿不到计算样式时用字面量默认值 */ }
  return def;
})();
/* 类别配色: 前 6 个复用主题色, 后 2 个是仅用于类别的扩展色, 最后两个兜底 */
const CAT_PALETTE = [COLOR.green, COLOR.cyan, COLOR.yellow, COLOR.orange, COLOR.magenta,
                     COLOR.red, "#2dcc9f", "#c58bff", COLOR.catFallback, COLOR.index];
const PREDEFINED = new Map(DEFAULT_CATEGORIES.map((c,i)=>[c, CAT_PALETTE[i % CAT_PALETTE.length]]));

/* ---------- 可调投资比例: 运行时读取的消费/投资比率 ---------- */
function r6(x){ return Math.round(x*1e6)/1e6; }
/* 投资金额内部保留 6 位小数: 避免 <0.005 的应投被显示口径(0.00)抹掉后永远无法标记已投。
   UI 一律用 money() 显示 2 位, 只有内部计算/比较用高精度。 */
const INV_EPS  = 1e-9;                          // 判定"是否需要投资 / 是否已投足"的浮点容差
const INV_UNIT = 1e6;                           // 全额投资分摊用的整数单位(1e-6 元)
function consumeShare(){                        // N: 消费占总花费(占用)的比例
  const v = (state && state.settings) ? state.settings.consumeShare : undefined;
  // 允许 N=1 (100% 消费 / 不投资), 与文档的 50%~100% 区间一致
  return (typeof v==="number" && v>0 && v<=1) ? v : CONSUME_SHARE;
}
function investShare(){ return r6(1 - consumeShare()); }   // 1-N: 投资比例
/* 投资池内部拆分: 保持原始 13:2 比例, 按投资占比整体缩放 */
function rateSplit(){
  const inv = investShare(), base = MM_RATE + IDX_RATE;    // 0.15
  if(Math.abs(inv-base) < 1e-9) return { mm: MM_RATE, idx: IDX_RATE };
  return { mm: r6(inv * (MM_RATE/base)), idx: r6(inv * (IDX_RATE/base)) };
}
function consumePct(){ return r2(consumeShare()*100); }    // 85
function invPct(){ return r2(investShare()*100); }         // 15
function mmPct(){ return r2(rateSplit().mm*100); }         // 13
function idxPct(){ return r2(rateSplit().idx*100); }       // 2

/* ----------------------------- state ------------------------------------ */
let state = null;
function defaultSettings(){
  return { budget: DEFAULT_BUDGET, monthStart:1, weekStart:"mon", thresholds:[80,100],
           periodMode:"month", lengthDays:15, anchor:null, epoch:null,
           consumeShare:CONSUME_SHARE, rateMoney:0.02, rateIndex:0.08, periodBudget:{},
           dailyBudget:null };   // 手动设置的"每日可用余额"(null = 未设置)
}
function loadState(){
  let parsed = null;
  try{ parsed = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ parsed = null; }
  if(!parsed || typeof parsed!=="object") parsed = {};
  state = { settings: normalizeSettings(parsed.settings), seq: 0, records: [] };
  const norm = normalizeRecords(parsed.records);
  state.records = norm.records;
  state.seq = Math.max(
    (typeof parsed.seq==="number" && isFinite(parsed.seq)) ? Math.round(parsed.seq) : 0,
    state.records.reduce((m,r)=>Math.max(m,r.id), 0));   // 序号必须大于所有已有 id, 否则新增会撞号
  ensureEpoch();      // 账本起点对齐到真实周期边界(旧数据/改过周期设置的数据都会在这里修正)
  save();
  return norm.dropped;
}
/* --- 设置归一化: 手改过的/跨版本导入的 settings 也能安全使用 ---
   缺失项回落默认值, 非法值(类型错/越界/被写成 null)一律丢弃, 避免后面 [...thresholds] 之类直接抛错。 */
function normalizeSettings(raw){
  const def = defaultSettings();
  const s = Object.assign({}, def, (raw && typeof raw==="object") ? raw : {});
  if(!(typeof s.budget==="number" && isFinite(s.budget) && s.budget>0)) s.budget = def.budget;
  if(!(Number.isInteger(s.monthStart) && s.monthStart>=1 && s.monthStart<=28)) s.monthStart = def.monthStart;
  if(s.weekStart!=="mon" && s.weekStart!=="sun") s.weekStart = def.weekStart;
  const th = Array.isArray(s.thresholds) ? s.thresholds.map(Number).filter(x=>isFinite(x)&&x>0&&x<=100) : [];
  s.thresholds = [...new Set(th)].sort((a,b)=>a-b);
  if(!s.thresholds.length) s.thresholds = def.thresholds.slice();
  if(s.periodMode!=="month" && s.periodMode!=="rolling") s.periodMode = def.periodMode;
  if(!(Number.isInteger(s.lengthDays) && s.lengthDays>=2 && s.lengthDays<=90)) s.lengthDays = def.lengthDays;
  if(!isYMDish(s.anchor)) s.anchor = null;
  if(!isYMDish(s.epoch))  s.epoch  = null;
  if(!(typeof s.consumeShare==="number" && isFinite(s.consumeShare) && s.consumeShare>=0.5 && s.consumeShare<=1)) s.consumeShare = def.consumeShare;
  if(!(typeof s.rateMoney==="number" && isFinite(s.rateMoney) && s.rateMoney>=0 && s.rateMoney<=1)) s.rateMoney = def.rateMoney;
  if(!(typeof s.rateIndex==="number" && isFinite(s.rateIndex) && s.rateIndex>=0 && s.rateIndex<=1)) s.rateIndex = def.rateIndex;
  const pb = {};
  if(s.periodBudget && typeof s.periodBudget==="object"){
    for(const k in s.periodBudget){
      const v = Number(s.periodBudget[k]);
      if(/^\d{4}-\d{2}-\d{2}$/.test(k) && isFinite(v) && v>0) pb[k] = r2(v);
    }
  }
  s.periodBudget = pb;
  if(!(typeof s.dailyBudget==="number" && isFinite(s.dailyBudget) && s.dailyBudget>0)) s.dailyBudget = null;
  return s;
}
function isYMDish(v){ return typeof v==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v); }
/* 宽松解析日期(兼容 2027/8/5、2027年8月5日、时间戳等), 返回 'YYYY-MM-DD' 或 null */
function repairDate(v){
  if(v instanceof Date && !isNaN(v)) return fmtY(v);
  if(typeof v==="number" && isFinite(v)){ const d = new Date(v); if(!isNaN(d)) return fmtY(d); }
  const t = normDateText(v, "date");
  return (t.ok && t.value) ? t.value : null;
}
/* --- 记录归一化: 应投额按当前比例重算, 已投金额(含旧版 mmPaid/idxPaid 布尔字段)转成金额制 ---
   关键: 导入备份(restoreFromText)必须和加载 localStorage 走同一套规则, 否则同一份旧文件
   经"导入"和经"浏览器存储"会得到不同结果(旧版已投状态会丢)。无法修复的记录(金额/日期非法)丢弃。 */
function normalizeRecords(raw){
  const out = [], usedIds = new Set();
  let dropped = 0;
  for(const src of (Array.isArray(raw) ? raw : [])){
    if(!src || typeof src!=="object"){ dropped++; continue; }
    const amount = r2(Number(src.amount));
    const date = repairDate(src.date);
    if(!isFinite(amount) || amount<=0 || !date){ dropped++; continue; }
    let id = (typeof src.id==="number" && isFinite(src.id) && src.id>0) ? Math.round(src.id) : 0;
    while(!id || usedIds.has(id)) id = (id ? id+1 : 1);   // id 缺失/重复时顺延, 保证唯一
    usedIds.add(id);
    const oldMm = Number(src.mm)||0, oldIdx = Number(src.idx)||0;   // 重算前的应投(旧口径)
    const mInv0 = (typeof src.moneyInv==="number" && isFinite(src.moneyInv)) ? src.moneyInv : (src.mmPaid ? oldMm : 0);
    const iInv0 = (typeof src.indexInv==="number" && isFinite(src.indexInv)) ? src.indexInv : (src.idxPaid ? oldIdx : 0);
    const inv = investOf(amount);
    const cat = String(src.category==null ? "" : src.category).trim() || "其他";
    const note = src.note==null ? "" : String(src.note);
    const created = repairDate(src.created) || date;
    // 旧数据里已标记"已投足"的, 重算后要吸附到新的应投额, 避免因精度变化退回"部分/未投"
    const wasFullM = oldMm>0 && mInv0 >= oldMm - 0.005;
    const wasFullI = oldIdx>0 && iInv0 >= oldIdx - 0.005;
    const cl = (x, cap)=> r6(Math.max(0, Math.min(cap, isFinite(x) ? x : 0)));
    out.push({ id, amount, category:cat, note, date, created,
               mm:inv.mm, idx:inv.idx,
               moneyInv: wasFullM ? inv.mm : cl(mInv0, inv.mm),
               indexInv: wasFullI ? inv.idx : cl(iInv0, inv.idx) });
  }
  return { records: out, dropped };
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){
    // 隐私模式/禁用存储/某些 data: 打开方式下 setItem 会抛错; 不能让保存失败把整个应用打挂
    if(!save.silentWarned){
      save.silentWarned = true;
      if(typeof line==="function") line([{t:"⚠ 浏览器不允许写入本地存储(localStorage)，本次数据仅存在于内存中。请用 [备份 .json] 保存。", c:COLOR.red}]);
    }
  }
  scheduleFileWrite();
}

/* ======================= 撤销 / 重做 (undo / redo) ======================= */
const HISTORY_MAX = 200;
let undoStack = [], redoStack = [];
function snapshotState(){ return JSON.stringify(state); }
/* 包住一次可能修改数据的操作: 若数据确实变了, 把"改前"快照压入撤销栈 */
function mutate(fn){
  const before = snapshotState();
  const r = fn();
  if(snapshotState() !== before){
    undoStack.push(before);
    if(undoStack.length > HISTORY_MAX) undoStack.shift();
    redoStack.length = 0;
    refreshHistoryUI();
  }
  return r;
}
function applyState(json){
  state = JSON.parse(json);
  save(); refreshHeader(); refreshHistoryUI();
}
function undo(){
  if(!undoStack.length){ line([{t:"没有可撤销的操作。", c:COLOR.yellow}]); return; }
  const cur = snapshotState();
  const prev = undoStack.pop();
  redoStack.push(cur);
  applyState(prev);
  line([{t:"↩ 已撤销 (可重做 "+redoStack.length+" 步)", c:COLOR.yellow}]);
  scrollBottom();
}
function redo(){
  if(!redoStack.length){ line([{t:"没有可重做的操作。", c:COLOR.yellow}]); return; }
  const cur = snapshotState();
  const next = redoStack.pop();
  undoStack.push(cur);
  applyState(next);
  line([{t:"↪ 已重做 (可撤销 "+undoStack.length+" 步)", c:COLOR.green}]);
  scrollBottom();
}
function refreshHistoryUI(){
  const u = document.getElementById("btnUndo"); if(u) u.disabled = !undoStack.length;
  const r = document.getElementById("btnRedo"); if(r) r.disabled = !redoStack.length;
}

/* ============ 本地文件持久化(防刷新/清缓存丢失) ============
   方式: 导出/导入 .json (全浏览器可用) + 存到本地目录自动写盘
   (File System Access API, 需 Chrome/Edge; 用 IndexedDB 记住所选目录) */
let dirHandle = null;               // 本地目录句柄(内存, 本次会话)
let fileWritePending = false;       // 是否正在写盘
let fileWriteDirty = false;         // 写盘期间是否又发生了改动(写完补写一次)
let autosaveOn = false;
function supportsFSA(){ return typeof window!=="undefined" && ("showDirectoryPicker" in window); }
function fsLog(msg, color){ if(typeof line==="function") line([{t:msg, c:color||COLOR.cyan}]); }

function serializeState(){
  return JSON.stringify({ app:"budget_term", version:2,
    savedAt: todayYMD()+" "+new Date().toTimeString().slice(0,8),
    settings: state.settings, seq: state.seq, records: state.records }, null, 2);
}
function restoreFromText(text){
  const data = JSON.parse(text);
  if(!data || typeof data!=="object" || !Array.isArray(data.records)) throw new Error("不是有效的备份文件");
  if(data.app && data.app!=="budget_term") throw new Error("备份文件不匹配本应用");
  let dropped = 0;
  mutate(()=>{
    // 备份里的设置整体生效(备份中缺失的项回落默认值, 不再残留上一份数据里的旧设置),
    // 记录走与 loadState 相同的归一化: 旧版布尔已投字段会转成金额, 脏记录被丢弃。
    state.settings = normalizeSettings(data.settings);
    const norm     = normalizeRecords(data.records);
    state.records  = norm.records;
    dropped        = norm.dropped;
    state.seq      = Math.max(
      (typeof data.seq==="number" && isFinite(data.seq)) ? Math.round(data.seq) : 0,
      state.records.reduce((m,r)=>Math.max(m,r.id), 0));   // 防止后续新增记录与备份里的 id 撞号
    ensureEpoch();
    save();
  });
  refreshHeader();
  fsLog("✓ 已从备份恢复 "+state.records.length+" 条记录、预算与设置已更新 (可 undo 撤销)。", COLOR.green);
  if(dropped) fsLog("⚠ 其中 "+dropped+" 条记录金额或日期无效, 已跳过(其余记录正常导入)。", COLOR.yellow);
}
function doBackupDownload(){
  const blob = new Blob([serializeState()], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="budget_backup_"+todayYMD()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 400);
  fsLog("✓ 已下载完整备份 .json (含所有记录/设置)。", COLOR.green);
}
/* --- 存到本地目录: 选择目录并立即写入 budget_term_backup.json, 之后每改一次自动写盘 --- */
async function writeToFolder(){
  const dir = dirHandle || await window.showDirectoryPicker({mode:"readwrite"});
  dirHandle = dir;
  // 申请持久授权, 便于以后每次点开自动重连
  try{ await dir.requestPermission({mode:"readwrite"}); }catch(e){}
  const fh = await dir.getFileHandle("budget_term_backup.json", {create:true});
  const w = await fh.createWritable();
  await w.write(serializeState());
  await w.close();
  await persistDirHandle(dir);
  autosaveOn = true;
  refreshAutosaveUI();
}
async function doAutosaveToggle(){
  if(autosaveOn){ autosaveOn=false; refreshAutosaveUI(); fsLog("已关闭本地自动写盘(localStorage 仍在保存)。",COLOR.yellow); return; }
  try{
    if(!supportsFSA()){ fsLog("当前浏览器不支持“存到本地目录”(请改用 Chrome/Edge), 可用 [备份 .json] 手动导出。",COLOR.red); return; }
    fsLog("请在弹出框中选择一个文件夹存放备份(budget_term_backup.json)…",COLOR.cyan);
    await writeToFolder();
    fsLog("✓ 已存到所选文件夹。此后每次改动都会自动写盘；刷新页面点一次 [存到本地目录] 重新连接即可(或浏览器仍授权时会自动重连)。",COLOR.green);
  }catch(e){
    if(e && (e.name==="AbortError"||/abort/i.test(String(e.message)))){ fsLog("已取消选择文件夹。",COLOR.gray); }
    else { fsLog("存到本地目录失败: "+(e&&e.message||e),COLOR.red); }
  }
}
async function scheduleFileWrite(){
  if(!autosaveOn) return;
  if(fileWritePending){ fileWriteDirty = true; return; }   // 正在写盘时又有改动: 标记, 写完后再补一次(以前会直接丢掉这次改动)
  fileWritePending = true;
  try{
    do{ fileWriteDirty = false; await writeToFolder(); }while(fileWriteDirty);
  }
  catch(e){ /* 目录被移除等: 保持 localStorage 兜底 */ }
  finally{ fileWritePending = false; }
}
function refreshAutosaveUI(){
  const b = document.getElementById("btnAutosave");
  if(b) b.textContent = "存到本地目录: "+(autosaveOn?"开":"关");
  if(typeof renderInvestBar==="function") renderInvestBar();
}
function backupFolderName(){ try{ return dirHandle&&dirHandle.name?dirHandle.name:"本地文件夹"; }catch(e){ return "本地文件夹"; } }
/* --- IndexedDB: 记住所选目录句柄, 便于刷新后重连 --- */
function idbOpen(){
  return new Promise((res,rej)=>{
    if(typeof indexedDB==="undefined") return rej(new Error("no indexedDB"));
    const rq = indexedDB.open("budget_term_fs",1);
    rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore("kv"); }catch(e){} };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error||new Error("idb open"));
  });
}
async function persistDirHandle(h){
  try{ const db=await idbOpen();
    return new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(h,"dir"); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  }catch(e){ return Promise.resolve(); }
}
async function restoreLocalHandleQuiet(){
  if(!supportsFSA()) return;
  try{
    const db=await idbOpen();
    const h = await new Promise((res)=>{ const tx=db.transaction("kv","readonly"); const g=tx.objectStore("kv").get("dir"); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null); });
    if(!h) return;
    let perm = "prompt";
    try{ perm = await h.queryPermission({mode:"readwrite"}); }catch(e){}
    if(perm!=="granted"){ dirHandle=null; return; }   // 未授权: 交给首次交互时自动申请
    dirHandle = h;
    try{ autosaveOn=true; await writeToFolder(); }catch(e){ autosaveOn=false; }
    refreshAutosaveUI();
    fsLog("已自动重连本地文件夹 “"+(h.name||"")+"”，改动将自动写盘。",COLOR.green);
  }catch(e){ /* 忽略 */ }
}
/* 每次打开: 若上次授权因新会话过期, 在第一次用户交互时自动重新申请(无需再点专门按钮) */
let _reconnectArmed=false, _reconnectDone=false;
function armAutoReconnect(){
  if(_reconnectArmed || !supportsFSA()) return;
  _reconnectArmed = true;
  const once = async ()=>{
    if(_reconnectDone) return; _reconnectDone=true;
    try{
      const db = await idbOpen();
      const h = await new Promise((res)=>{ const tx=db.transaction("kv","readonly"); const g=tx.objectStore("kv").get("dir"); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null); });
      if(!h) return;
      let perm="prompt";
      try{ perm = await h.queryPermission({mode:"readwrite"}); }catch(e){}
      if(perm!=="granted"){
        try{ perm = await h.requestPermission({mode:"readwrite"}); }catch(e){}
      }
      if(perm!=="granted") return;
      dirHandle = h;
      try{ autosaveOn=true; await writeToFolder(); }catch(e){ autosaveOn=false; }
      refreshAutosaveUI();
      fsLog("已重新连接本地文件夹 “"+(h.name||"")+"”，自动写盘已开启。",COLOR.green);
    }catch(e){}
  };
  const guard = ()=>{ once(); window.removeEventListener("pointerdown",guard); window.removeEventListener("keydown",guard); };
  window.addEventListener("pointerdown",guard,{once:false});
  window.addEventListener("keydown",guard,{once:false});
}

/* ----------------------------- date utils ------------------------------- */
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtY(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function mkYMD(y,m,d){ return y+"-"+pad2(m)+"-"+pad2(d); }
function parseYMD(s){ // 'YYYY-MM-DD' -> {y,m,d}
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||""));
  if(!m) return null;
  return { y:+m[1], m:+m[2], d:+m[3] };
}
function todayYMD(){ const n=new Date(); return fmtY(n); }
/* ---- 「手动输日期」弹窗的统一格式解析 -------------------------------------
   目标: 不管用户怎么敲, 一律归一化成与命令 @日期 完全一致的 ISO 写法:
     日期 → YYYY-MM-DD     月份 → YYYY-MM
   宽容接受 2027-8-5 / 2027/8/5 / 2027.8.5 / 20270805 / 2027年8月5日 等写法。
   返回 { ok, value, error }: value 永远是统一格式(空输入返回""), ok=false 时 error 为提示语。 */
function normDateText(raw, kind){          // kind: "date" | "month"
  const out = { ok:true, value:"", error:"" };
  let s = String(raw==null ? "" : raw).trim();
  if(!s) return out;                        // 留空 = 不填该项(由调用方判断是否允许)
  s = s.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))  // 全角数字→半角
       .replace(/[年月]/g, "-").replace(/[日号]/g, "")
       .replace(/[／\/．.、]/g, "-")
       .replace(/[－—–−‐]/g, "-")            // 全角/长破折/减号 都当作 -
       .replace(/\s+/g, "")
       .replace(/-+/g, "-").replace(/^-+|-+$/g, "");
  const seg = s.split("-").filter(x=>x!=="");
  let y=null, m=null, d=null;
  if(seg.length===1 && /^\d{8}$/.test(seg[0])){       // 20270818
    y=+seg[0].slice(0,4); m=+seg[0].slice(4,6); d=+seg[0].slice(6,8);
  } else if(seg.length===1 && /^\d{6}$/.test(seg[0])){ // 202708
    y=+seg[0].slice(0,4); m=+seg[0].slice(4,6);
  } else if(seg.length>=2){
    y = /^\d{4}$/.test(seg[0]) ? +seg[0] : NaN;        // 年份必须 4 位
    m = +seg[1];
    if(seg[2]!==undefined) d = +seg[2];
  }
  if(!(y>=1000 && y<=9999)){
    out.ok=false;
    out.error = (kind==="date") ? "请按 YYYY-MM-DD 填写完整日期，如 2027-08-18。"
                                : "请按 YYYY-MM 填写月份，如 2027-08。";
    return out;
  }
  if(!(m>=1 && m<=12)){ out.ok=false; out.error = "月份要在 01~12 之间。"; return out; }
  if(kind==="month"){ out.value = y+"-"+pad2(m); return out; }
  if(d===null){ out.ok=false; out.error = "日期要写到「日」，如 2027-08-18；若只想看整月，请填上面的「月份」。"; return out; }
  if(!(d>=1 && d<=lastDay(y,m))){ out.ok=false; out.error = "该月没有 "+d+" 号（"+y+"-"+pad2(m)+" 只有 "+lastDay(y,m)+" 天）。"; return out; }
  out.value = mkYMD(y,m,d);
  return out;
}
function addMonths(y,m0,delta){ // m0: 1-based month index
  const total = (m0-1)+delta;          // to 0-based
  const yy = y + Math.floor(total/12);
  const mm = ((total%12)+12)%12;       // 0-based
  return { y:yy, m:mm+1 };
}
function lastDay(y,m){ return new Date(y,m,0).getDate(); } // m 1-based, day0 = prev month last day

/* Period (记账周期) 边界：
   periodMode = "month"   → 按月对齐(monthStart 自定义起始日, 1=自然月)
   periodMode = "rolling" → 固定 lengthDays 天, 从 anchor 日起每 N 天滚动一期 */
function daysBetween(a,b){ // whole days from a to b (both 'YYYY-MM-DD')
  const pa=parseYMD(a), pb=parseYMD(b);
  return Math.round((Date.UTC(pb.y,pb.m-1,pb.d) - Date.UTC(pa.y,pa.m-1,pa.d)) / 86400000);
}
function addDaysYMD(s, delta){
  const p=parseYMD(s);
  const d=new Date(Date.UTC(p.y,p.m-1,p.d)); d.setUTCDate(d.getUTCDate()+delta);
  return mkYMD(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());
}
function periodBounds(dateStr){
  const mode = state.settings.periodMode;
  if(mode === "rolling"){
    const L = state.settings.lengthDays || 15;
    let A = state.settings.anchor;
    if(!A){ A = dateStr; state.settings.anchor = A; }      // anchor falls back to queried date
    // k 允许为负: 锚点之前的日期也落在同一条 (A + n×L) 网格上。
    // 修复: 旧实现把 A 直接钳到 dateStr, 使"锚点之前"的周期起点跟着查询日期漂移,
    // 于是发放链(periodStartsUpTo)会与真实周期起点错位。
    const k = Math.floor(daysBetween(A, dateStr) / L);
    const start = addDaysYMD(A, k*L);
    const end   = addDaysYMD(start, L-1);
    return { start, end, label: start+" ~ "+end, mode:"rolling", len:L };
  }
  // default: monthly
  const P = parseYMD(dateStr);
  const ms = state.settings.monthStart;          // 1..28
  let startY, startM;
  if(P.d >= ms){ startY = P.y; startM = P.m; }
  else {
    const pr = addMonths(P.y, P.m, -1); startY = pr.y; startM = pr.m;
  }
  // endExclusive = start month + 1 on day ms  => inclusive end is (that day - 1)
  const nx = addMonths(startY, startM, 1);
  const sDate = mkYMD(startY,startM,ms);
  let eDay = ms - 1;
  let eY = nx.y, eM = nx.m;
  if(eDay < 1){ const pr = addMonths(nx.y,nx.m,-1); eY=pr.y; eM=pr.m; eDay=lastDay(eY,eM); }
  const eDate = mkYMD(eY,eM,eDay);
  return { start:sDate, end:eDate, label: sDate+" ~ "+eDate, mode:"month" };
}
function currentPeriod(){ return periodBounds(todayYMD()); }

/* 自然月边界：始终从当月 1 日到当月最后一天(与记账周期无关) */
function calendarMonthBounds(dateStr){
  const P = parseYMD(dateStr) || parseYMD(todayYMD());
  const start = mkYMD(P.y, P.m, 1);
  const end   = mkYMD(P.y, P.m, lastDay(P.y, P.m));
  return { start, end, label: start+" ~ "+end };
}

function weekBounds(dateStr){
  const P = parseYMD(dateStr);
  const js = new Date(P.y,P.m-1,P.d).getDay(); // 0=Sun..6=Sat
  const ws = state.settings.weekStart; // 'mon'|'sun'
  let startD;
  if(ws === "sun"){ startD = js; }
  else { startD = (js===0)?6:(js-1); } // Monday start
  const st = new Date(P.y,P.m-1,P.d-startD);
  const en = new Date(P.y,P.m-1,P.d-startD+6);
  return { start:fmtY(st), end:fmtY(en) };
}
function inRange(dateStr, start, end){
  return dateStr >= start && dateStr <= end;
}
function catColor(cat){ return PREDEFINED.get(cat) || COLOR.catFallback; }

/* --------------------------- investment calc ---------------------------- */
/* 核心换算: 一笔消费 E 对应占用总花费 E/N (N=消费占比, 默认0.85, 可调);
   应投 = 占用 × (1-N), 其中货币/指数按 13:2 拆分 */
function investOf(amount){
  const base = amount / consumeShare();             // 占用总花费的等价口径
  const sp = rateSplit();
  return { base: base, mm: r6(base*sp.mm), idx: r6(base*sp.idx) };
}
/* 比例变化后: 按新比例重算所有记录的应投额(已投金额不会超过新的应投额) */
function recomputeAllInvest(){
  for(const r of state.records){
    const inv = investOf(r.amount);
    r.mm = inv.mm; r.idx = inv.idx;
    r.moneyInv = Math.min(r.moneyInv||0, r.mm);
    r.indexInv = Math.min(r.indexInv||0, r.idx);
  }
}
function r2(x){ return Math.round(x*100)/100; }
function money(x){
  const neg = x<0; const s = Math.abs(x).toFixed(2);
  return (neg?"-":"")+s;
}

/* ===================== 投资池：应投货币 / 应投指数 ===================== */
/* 未投资部分累加(跨期累计): 每笔记录应投 mm/idx, 已投 moneyInv/indexInv(金额制) */
function moneyPending(){ return r6(state.records.reduce((s,r)=>s+Math.max(0,(r.mm||0)-(r.moneyInv||0)),0)); }
function indexPending(){ return r6(state.records.reduce((s,r)=>s+Math.max(0,(r.idx||0)-(r.indexInv||0)),0)); }
function moneyInvestedTotal(){ return r6(state.records.reduce((s,r)=>s+(r.moneyInv||0),0)); }
function indexInvestedTotal(){ return r6(state.records.reduce((s,r)=>s+(r.indexInv||0),0)); }
/* 应投为 0 视为"无需求"(满足); 否则按高精度比较是否已投足。
   注意: 不能用 0.005 这类粗容差 —— 那会把 <0.005 的小额应投直接判成"已投足"。 */
function recFullyMoney(r){ const need=r.mm||0; return need<=INV_EPS || (r.moneyInv||0) >= need - INV_EPS; }
function recFullyIndex(r){ const need=r.idx||0; return need<=INV_EPS || (r.indexInv||0) >= need - INV_EPS; }
function recNoNeed(r){ return (r.mm||0)<=INV_EPS && (r.idx||0)<=INV_EPS; }
function recStatus(r){
  if(recNoNeed(r)) return {t:"无需", c:COLOR.gray};   // 应投恒为 0, 无需投资
  const m = recFullyMoney(r), i = recFullyIndex(r);
  if(m && i) return {t:"已投", c:COLOR.green};
  if(!(r.moneyInv||0) && !(r.indexInv||0)) return {t:"未投", c:COLOR.gray};
  return {t:"部分", c:COLOR.yellow};
}
/* 把某类阈值额度(lot)按比例分摊到未投记录上(支持部分投入), 返回描述文字 */
function investAmount(kind, amt){ // 按比例把 amt 投给该种未投池; kind 'money'|'index'
  const isM = kind==="money";
  const pend = isM ? moneyPending() : indexPending();
  if(amt == null) amt = isM ? INVEST_MONEY_LOT : INVEST_INDEX_LOT;
  amt = Math.min(amt, pend);
  if(amt <= INV_EPS) return null;
  const lotU = Math.round(amt*INV_UNIT);
  // 收集每条记录的剩余未投额度(1e-6 元为单位, 保证 <0.01 的零头也能被分摊清零)
  const entries=[]; let totU=0;
  for(const r of state.records){
    const should = isM ? (r.mm||0) : (r.idx||0);
    const inv = isM ? (r.moneyInv||0) : (r.indexInv||0);
    const remU = Math.round(Math.max(0, should - inv)*INV_UNIT);
    if(remU>0){ entries.push({r, remU}); totU += remU; }
  }
  if(!totU) return null;
  // 按剩余占比分配(largest remainder)
  const alloc = entries.map(e=>{ const exact = lotU*e.remU/totU; const base=Math.floor(exact); return {e, base, frac: exact-base}; });
  let rem = lotU - alloc.reduce((s,a)=>s+a.base,0);
  alloc.sort((a,b)=>b.frac-a.frac);
  // 单次分配即可分完: sum(remU)==totU>=lotU, 每笔最多补到自己的 remU
  for(const a of alloc){ if(rem<=0)break; const add=Math.min(a.e.remU-a.base, rem); a.base+=add; rem-=add; }
  // 应用
  let applied=0;
  for(const a of alloc){
    if(a.base<=0) continue;
    const need = isM ? (a.e.r.mm||0) : (a.e.r.idx||0);
    const cur  = isM ? (a.e.r.moneyInv||0) : (a.e.r.indexInv||0);
    const nv = r6(Math.min(need, cur + a.base/INV_UNIT));
    if(isM) a.e.r.moneyInv = nv; else a.e.r.indexInv = nv;
    applied++;
  }
  save();
  return { amt, applied };
}
/* 全额投资: 把该种整个未投池投掉清零; 仅当池≥该种阈值(货币100/指数20)才允许点亮/执行 */
function investFull(kind){
  const isM = kind==="money";
  const lot = isM ? INVEST_MONEY_LOT : INVEST_INDEX_LOT;
  const pend = isM ? moneyPending() : indexPending();
  if(pend < lot - 0.005) return null;
  return investAmount(kind, pend);
}
/* 预算 / 结转 / 超额 派生指标：
   总预算 B 每周期发放一次; 每笔消费按 E/0.85 记账占用;
   未占用 = 剩余(结转下期), 占用>发放 = 透支(下期扣除)。余额跨期累计。
   支持"当期预算"覆盖: periodBudget[start]=金额 只改某一期。 */
/* 账本起点(第一笔"发放"所在的周期)。必须落在真实周期边界上:
   用户改过周期长度/锚点/月起始日后, 旧 epoch 可能落在周期中间, 这会让
   periodStartsUpTo 的发放链与真实周期起点(以及 periodBudget 的覆盖键)错位 ——
   现象是 `budget set`/弹窗设的"当期预算"不进入"累计可用余额"。 */
function ensureEpoch(){
  const cur = currentPeriod().start;
  const e = state.settings.epoch;
  if(!(typeof e==="string") || !/^\d{4}-\d{2}-\d{2}$/.test(e)){ state.settings.epoch = cur; return; }
  const snap = periodBounds(e).start;      // 映射到"包含该日期的那一期"的起点
  if(snap !== e) state.settings.epoch = snap;
}
function nextPeriodStart(startStr){
  if(state.settings.periodMode === "rolling") return addDaysYMD(startStr, state.settings.lengthDays||15);
  const p = parseYMD(startStr);
  const nx = addMonths(p.y, p.m, 1);
  return mkYMD(nx.y, nx.m, state.settings.monthStart||1);
}
function effectiveBudget(periodLike){
  const key = periodLike && periodLike.start;
  const ov = state.settings.periodBudget || {};
  const v = (key!=null) ? ov[key] : undefined;
  return (typeof v==="number" && v>0) ? v : state.settings.budget;
}
function hasBudgetOverride(periodLike){
  const key = periodLike && periodLike.start;
  const ov = state.settings.periodBudget || {};
  return !!(key!=null && typeof ov[key]==="number");
}
function periodStartsUpTo(endStart){
  ensureEpoch();
  const out=[]; let s=state.settings.epoch; let guard=0;
  while(s <= endStart && guard<5000){ out.push(s); s=nextPeriodStart(s); guard++; }
  if(!out.length) out.push(endStart);
  return out;
}
function grantedTotal(){
  ensureEpoch();
  const cur = currentPeriod().start;
  let sum=0;
  for(const s of periodStartsUpTo(cur)) sum += effectiveBudget({start:s});
  return r2(sum);
}
function totalCharge(){ return r2(state.records.reduce((s,r)=>s + (r.amount / consumeShare()), 0)); }
function availableBalance(){ return r2(grantedTotal() - totalCharge()); }
function periodDayCount(p){ return daysBetween(p.start, p.end) + 1; }
/* 当前周期快照(含燃尽预测所需的日进度) */
function periodSnapshot(){
  const p = currentPeriod();
  const B = effectiveBudget(p);
  const rows = state.records.filter(r=>inRange(r.date,p.start,p.end));
  const consumption = r2(rows.reduce((s,r)=>s+r.amount,0));      // 消费口径 (元)
  const mm  = r2(rows.reduce((s,r)=>s+r.mm,0));                   // 应投货币(本期累计)
  const idx = r2(rows.reduce((s,r)=>s+r.idx,0));                  // 应投指数(本期累计)
  const invest = r2(mm+idx);
  const usedUnits = r2(consumption / consumeShare());              // 本期已占用的预算口径
  const ratio = B>0 ? usedUnits/B : 0;                            // 进度(相对本期发放 B)
  return { p, B, rows, consumption, mm, idx, invest, usedUnits, ratio };
}

/* =========================== rendering helpers ========================== */
const term = document.getElementById("term");
const catlistEl = document.getElementById("catlist");

function line(segs){ // segs: string | [{t,c,cls}]
  const el = document.createElement("div");
  el.className = "l";
  if(typeof segs === "string"){ segs = [{t:segs}]; }
  for(const s of segs){
    const sp = document.createElement("span");
    if(s.c) sp.style.color = s.c;
    if(s.cls) sp.className = s.cls;
    sp.textContent = s.t;
    el.appendChild(sp);
  }
  term.appendChild(el);
  return el;
}
function blank(){ line(""); }

/* ===================== 统一的"标签 : 值"行渲染器 =====================
   以前总结/燃尽/资产/配置各写一套(rows 数组 + padEnd(24)、两份逐字节相同的 row() 闭包 + padEnd(22)、
   配置页手写空格), 列宽互不相同; 现在全部走 kvRow(), 列宽按当前窗口宽度自适应。 */
const KV_MIN = 14, KV_MAX = 24;      // 标签列宽(字符): 窄窗口也能让数值留在同一行
let _kvW = 0;                        // 缓存的列宽(窗口尺寸变化后失效重算, 避免每行都触发布局计算)
/* 终端当前可容纳的等宽字符数(拿不到布局信息时返回 0) */
function termCols(){
  let px = 0;
  try{ px = (term && term.clientWidth) || (typeof window!=="undefined" && window.innerWidth) || 0; }catch(e){}
  if(!(px > 0)) return 0;
  let charPx = 0;
  try{ charPx = textWidthPx("0000000000", term) / 10; }catch(e){}
  return Math.floor(px / (charPx > 0 ? charPx : 8));   // 兜底: 14px 等宽字体约 8px/字
}
/* 标签列宽: 约占终端宽度 1/4, 夹在 [KV_MIN, KV_MAX] */
function kvColWidth(){
  if(_kvW) return _kvW;
  const cols = termCols();
  _kvW = cols ? Math.max(KV_MIN, Math.min(KV_MAX, Math.round(cols * 0.26))) : KV_MAX;
  return _kvW;
}
if(typeof window!=="undefined" && window.addEventListener){
  window.addEventListener("resize", ()=>{ _kvW = 0; });   // 分辨率/窗口大小变化 → 下次输出重新计算列宽
}
/* kvRow("本期消费", "¥300.00") 或 kvRow(key, value, width, color, glow) */
function kvRow(key, value, width, color, glow){
  const w = (typeof width==="number" && width>0) ? width : kvColWidth();
  return line([{ t:("  "+key).padEnd(w," "), c:COLOR.gray },
               { t:String(value==null?"":value), c:color||COLOR.white, cls:glow?"glow":"" }]);
}

/* progress bar with level color */
function barLevel(ratio){
  const th = [...state.settings.thresholds].sort((a,b)=>a-b); // % thresholds
  let lvl = 0;
  for(const p of th){ if(ratio*100 >= p) lvl++; }
  return Math.min(lvl,4);
}
const LEVEL_COLOR = [COLOR.green,COLOR.yellow,COLOR.orange,COLOR.red,COLOR.magenta];
function progressBar(ratio, width){
  width = width || 26;
  ratio = Math.max(0, Math.min(1, ratio));
  const filled = Math.round(ratio*width);
  const bar = "█".repeat(filled) + "░".repeat(width-filled);
  const lvl = barLevel(ratio);
  return { bar:bar, color:LEVEL_COLOR[lvl], lvl:lvl, pct:(ratio*100).toFixed(1) };
}
function alertWord(ratio){
  const p = ratio*100;
  const th = [...state.settings.thresholds].sort((a,b)=>a-b);
  if(th.length && p>=th[th.length-1]) return {t:"已超额 ⚠", c:COLOR.red};
  for(let i=th.length-1;i>=0;i--){ if(p>=th[i]) return {t:"接近预算 ⚠ "+th[i]+"%", c:COLOR.yellow}; }
  return {t:"预算内 ✓", c:COLOR.green};
}

/* ============ 红黄绿"实心圆点"指示器 (规则与原预警阈值一致, 不闪烁) ============
   绿: 未达最低阈值 → 显示"剩余 X%";  黄: 达到最低阈值 → "接近上限 X%";
   红: 达到最高阈值(默认100) → "已超额 X%";  灰(n): 未设置额度 */
function ratioDot(ratio){
  if(ratio==null || !isFinite(ratio)) return {cls:"n", word:"未设", dot:COLOR.gray, text:"未设置额度"};
  const p = ratio*100;
  const th = [...state.settings.thresholds].sort((a,b)=>a-b);
  const over = th.length ? th[th.length-1] : 100;
  const warn = th.length ? th[0] : over;
  if(p >= over) return {cls:"r", word:"红", dot:COLOR.red, text:"已超额"+p.toFixed(0)+"%"};
  if(p >= warn) return {cls:"y", word:"黄", dot:COLOR.yellow, text:"接近上限"+p.toFixed(0)+"%"};
  return {cls:"g", word:"绿", dot:COLOR.green, text:"剩余"+Math.max(0,100-p).toFixed(0)+"%"};
}
/* 今日快照: 今日消费 vs 手动设置的"每日可用余额" */
function todaySnapshot(){
  const t = todayYMD();
  const consumption = r2(state.records.filter(r=>r.date===t).reduce((s,r)=>s+r.amount,0));
  const d = state.settings.dailyBudget;
  const hasDaily = typeof d==="number" && d>0;
  return { date:t, consumption, daily: hasDaily? d : null, ratio: hasDaily ? consumption/d : null };
}
/* 终端文本版: "周期预算：●已超额114%" (颜色由圆点本身表示, 圆点前不放文字) */
function dotLine(label, info){
  return [{t:label+"：",c:COLOR.gray},{t:"●",c:info.dot},{t:info.text,c:COLOR.white}];
}
/* DOM 版圆点组合 */
function dotPair(label, info){
  const box=document.createElement("span"); box.className="dotbox";
  const l=document.createElement("span"); l.className="dlabel"; l.textContent=label+"：";
  const d=document.createElement("span"); d.className="dot "+info.cls; d.textContent="●";
  const v=document.createElement("span"); v.className="dval"; v.textContent=info.text;
  box.append(l,d,v);
  return box;
}

/* ============================== input / dispatch ========================= */
const input = document.getElementById("cmdline");
/* ======================= 命令登记表 (单一数据源) =======================
   M1 修复: 命令清单以前在三个地方各自维护 —— dispatch() 的 switch(含各别名)、
   HELP_LINES(help 输出)、CMD_WORDS(Tab 补全) —— 于是不断出现漂移:
   `config`/`settings` 能用但 help 里查不到; 别名只在 dispatch 里存在; 补全词又各自抄一份。
   现在只有这一份清单: help 内容、别名解析(canonicalCmd)、补全词(CMD_WORDS) 全部由它派生,
   新增命令只需在这里登记一次, 并补上 dispatch 里对应的 case(有测试双向守着)。
   字段: n = 命令名数组(第 1 个是主名, 其余是别名); u = help 里显示的用法; d = 说明;
        sub = true 表示这只是主命令的子用法(只出现在 help, 不参与别名与补全)。 */
const COMMANDS = [
  { n:["help","?","h"],                            u:"help",                            d:"查看帮助" },
  { n:["set"],                                     u:"set budget <金额>",               d:"设置每周期固定预算, 如 set budget 1000" },
  { n:["set"], sub:true,                           u:"set daily <金额>",                d:"手动设置每日可用余额(今日预算红黄绿提示), 如 set daily 100; off=取消" },
  { n:["set"], sub:true,                           u:"set period <N天>",                d:"滚动N天周期结算预算, 如 set period 15;  natural 回到按月" },
  { n:["set"], sub:true,                           u:"set periodstart <日期>",           d:"设滚动周期起点(锚点), 例 set periodstart 2027-08-04" },
  { n:["set"], sub:true,                           u:"set monthstart <1-28>",           d:"(按月模式)起始日; 1=自然月; 15=每月15日起" },

const CMD_ALIAS = {};        // 别名 -> 主名
const COMMAND_NAMES = [];    // 主名(按登记顺序, 供补全)
for(const c of COMMANDS){
  if(c.sub) continue;
  if(!COMMAND_NAMES.includes(c.n[0])) COMMAND_NAMES.push(c.n[0]);
  for(const name of c.n) if(name!==c.n[0]) CMD_ALIAS[name] = c.n[0];
}
/* 把任意写法(含别名)解析成主名; 未知命令原样返回, 交给 dispatch 报"未知命令" */
function canonicalCmd(name){ return CMD_ALIAS[name] || name; }
const HELP_PAD = 34;         // help 的命令列宽(超出则说明换到下一行)
const HELP_ALIAS_WIDTH = 76; // 别名对照行的换行宽度
function printHelp(){
  line([{t:"  ▓ 命令参考", c:COLOR.cyan, cls:"glow"}]);
  for(const c of COMMANDS){
    const cmdText = c.u, desc = c.d;
    const descIndent = (cmdText.length > HELP_PAD) ? (2+3+2) : (2+HELP_PAD+2);
    const cmdStr = "  "+cmdText;
    const descStr = descIndent>cmdStr.length ? " ".repeat(descIndent-cmdStr.length)+desc
                                            : "\n"+" ".repeat(descIndent)+desc;
    line([{t:cmdStr,c:COLOR.yellow},{t:descStr,c:COLOR.white}]);
  }
  // 别名对照: 由登记表派生, 不再手工维护(以前 help 里根本没有别名)
  const pairs = COMMANDS.filter(c=>!c.sub && c.n.length>1).map(c=>c.n[0]+" = "+c.n.slice(1).join("/"));
  line([{t:"  ▓ 命令别名", c:COLOR.cyan, cls:"glow"}]);
  let row = "  ";
  for(const p of pairs){
    if(row.trim() && row.length + p.length + 4 > HELP_ALIAS_WIDTH){ line([{t:row.replace(/\s+$/,""), c:COLOR.gray}]); row = "  "; }
    row += p + "    ";
  }
  if(row.trim()) line([{t:row.replace(/\s+$/,""), c:COLOR.gray}]);
  line([{t:"  ⚙ 换算: 消费÷N 占用总花费(N=消费占比, 默认85%); 其中(1-N)=投资(默认15%, 货币13/指数2); set invest 15 可调", c:COLOR.gray}]);
  blank();
}

/* 分词: 支持单/双引号; 引号内支持反斜杠转义(\" 和 \\)。
   修复: 旧实现用 /"[^"]*"/ 匹配, 遇到备注里的转义引号(如 记一笔 "说 \"A\"" )会被截断成
   `说 \` + `A\`, 备注内容被破坏。
   注意: 引号"外"的反斜杠不当转义符, 保持字面量 —— 否则 Windows 路径备注
   (add 50 学习 C:\temp\a) 里的反斜杠会被吃掉。 */
function tokenize(str){
  const out=[]; let cur=null, quote=null;
  for(let i=0;i<str.length;i++){
    const ch = str[i];
    if(quote){                                   // 引号内: 支持 \" \\ 转义
      if(ch==="\\" && i+1<str.length && (str[i+1]===quote || str[i+1]==="\\")){ cur += str[++i]; continue; }
      if(ch===quote){ out.push(cur); cur=null; quote=null; continue; }
      cur += ch; continue;
    }
    if(ch==='"' || ch==="'"){ quote = ch; cur = ""; continue; }
    if(/\s/.test(ch)){ if(cur!==null){ out.push(cur); cur=null; } continue; }
    if(cur===null) cur = "";
    cur += ch;                                   // 引号外: 反斜杠原样保留
  }
  if(cur!==null) out.push(cur);
  return out;
}
function parseCmd(raw){
  const toks = tokenize(raw);
  const cmd = (toks[0]||"").toLowerCase();
  return { cmd, tokens:toks.slice(1) };
}
function numeric(t){ if(!/^-?\d+(\.\d+)?$/.test(String(t))) return null; return parseFloat(t); }
function findDateToken(tokens){
  // returns {tokens without @date, dateStr|null}
  const out=[]; let date=null;
  for(const tk of tokens){
    if(tk[0]==="@"){ date = tk.slice(1); }
    else out.push(tk);
  }
  return { tokens:out, date };
}
function cleanDateStr(d){ // accept YYYY-M-D variants, default today
  const p = d ? parseYMD(d) : parseYMD(todayYMD());
  if(!p) return null;
  return mkYMD(p.y,p.m,p.d);
}

function runCommand(raw){
  raw = raw.trim();
  if(!raw) return;
  if(raw && raw!==history[history.length-1]) history.push(raw); hIdx=-1;
  echoCommand(raw);
  const {cmd, tokens} = parseCmd(raw);
  try{
    // 用主名判断: 否则 `u`(undo 的别名)会走 mutate 包一层, 撤销后又被当成"新改动"压栈并把 redo 清空
    const c = canonicalCmd(cmd);
    if(c==="undo" || c==="redo") dispatch(cmd, tokens);   // 本身不改数据, 不进入撤销栈
    else mutate(()=>dispatch(cmd, tokens));
  }catch(e){
    line([{t:"[ERR] "+ (e && e.message ? e.message : e), c:COLOR.red}]);
    if(e && e.stack) console.error(e);
  }
}

/* dispatch main logic: 只按"主名"分派, 别名在入口统一解析(见上面的 COMMANDS 登记表)。
   这里每个 case 都必须与 COMMANDS 里某个主名一一对应(测试双向校验, 防漂移)。 */
function dispatch(cmd, tokens){
  switch(canonicalCmd(cmd)){
    case "help":     printHelp(); break;
    case "cls":      term.innerHTML=""; break;
    case "set":      doSet(tokens); break;
    case "budget":   doBudget(tokens); break;
    case "forecast": doForecast(); break;
    case "add":      doAdd(tokens); break;
    case "list":     doList(tokens); break;
    case "del":      doDelete(tokens); break;
    case "update":   doUpdate(tokens); break;
    case "pay":      doPay(tokens); break;
    case "summary":  doSummary(tokens); break;
    case "export":   doExport(tokens); break;
    case "assets":   doAssets(tokens); break;
    case "undo":     undo(); break;
    case "redo":     redo(); break;
    case "config":   showSettings(); break;
    default:
      line([{t:"未知命令: "+cmd+"。输入 help 查看用法。", c:COLOR.yellow}]);
  }
}


/* ------------------------------- set ----------------------------------- */
function doSet(tokens){
  const sub = (tokens[0]||"").toLowerCase();
  if(sub==="budget"){
    const v = tokens[1];
    const n = numeric(v);
    if(n==null || n<=0){ line([{t:"用法: set budget <金额>  例 set budget 1000",c:COLOR.yellow}]); return; }
    state.settings.budget = r2(n); save();
    line([{t:"✓ 默认预算已设为 ",c:COLOR.green},{t:"¥"+money(r2(n)),c:COLOR.pure,cls:"hl"},
          {t:"  (各期生效; 只想改本期可用 budget set <金额>)",c:COLOR.gray}]);
    showForecastLine();
    refreshHeader();     // 顶栏"可用余额/发放进度"由预算派生, 改完必须立即重画(否则显示旧数字)
  } else if(sub==="monthstart"){
    const v = (tokens[1]||"").toLowerCase();
    let d;
    if(v==="natural"||v==="自然月"||v==="1") d=1;
    else d = numeric(tokens[1]);
    if(d==null || d<1 || d>28){ line([{t:"用法: set monthstart <1-28>  (1=自然月, 例 15 表示每月15日~下月14日)",c:COLOR.yellow}]); return; }
    state.settings.monthStart = d; state.settings.periodMode = "month"; ensureEpoch(); save();
    const p = currentPeriod();
    line([{t:"✓ 切换为按月周期, 起始日 "+(d===1?"自然月":"每月 "+d+" 日")+"。当前周期: ",c:COLOR.green},{t:p.label,c:COLOR.cyan}]);
    refreshHeader();
  } else if(sub==="period"||sub==="cycle"||sub==="length"){
    // set period 15        → 滚动 15 天周期
    // set period natural|month → 回到按月周期
    const v=(tokens[1]||"").toLowerCase();
    const n = numeric(tokens[1]);
    if(v==="natural"||v==="month"||v==="月"||v==="自然月"){ state.settings.periodMode="month"; ensureEpoch(); save(); const p=currentPeriod(); line([{t:"✓ 已切回按月周期, 当前: ",c:COLOR.green},{t:p.label,c:COLOR.cyan}]); refreshHeader(); return; }
    if(n==null || !Number.isInteger(n) || n<2 || n>90){ line([{t:"用法: set period <N天>  例 set period 15  → 每15天滚动一期;  set period natural 回到自然月",c:COLOR.yellow}]); return; }
    state.settings.periodMode="rolling";
    state.settings.lengthDays=n;
    // 起点：若尚未设 anchor 或想在今天重启，则从今天起算新一期
    state.settings.anchor = state.settings.anchor || todayYMD();
    ensureEpoch(); save();
    const p = currentPeriod();
    line([{t:"✓ 已切换为滚动 "+n+" 天周期, 从 "+state.settings.anchor+" 起每 "+n+" 天滚动结算。当前期: ",c:COLOR.green},{t:p.label,c:COLOR.cyan}]);
    refreshHeader();
  } else if(sub==="periodstart"||sub==="anchor"){
    const d = cleanDateStr(tokens[1]);
    if(!d){ line([{t:"用法: set periodstart <YYYY-MM-DD>  设滚动周期起点(锚点)",c:COLOR.yellow}]); return; }
    state.settings.periodMode = state.settings.periodMode || "rolling";
    state.settings.anchor = d; ensureEpoch(); save();
    const p = currentPeriod();
    line([{t:"✓ 滚动周期起点设为 "+d+"。当前期: ",c:COLOR.green},{t:p.label,c:COLOR.cyan}]);
    refreshHeader();
  } else if(sub==="weekstart"){
    const v=(tokens[1]||"").toLowerCase();
    if(v==="mon"||v==="周一"||v==="一") state.settings.weekStart="mon";
    else if(v==="sun"||v==="周日"||v==="日") state.settings.weekStart="sun";
    else { line([{t:"用法: set weekstart <mon|sun>",c:COLOR.yellow}]); return; }
    save();
    line([{t:"✓ 周起始日设为 "+(state.settings.weekStart==="mon"?"周一":"周日"),c:COLOR.green}]);
    refreshHeader();
  } else if(sub==="alert"||sub==="threshold"||sub==="thresholds"){
    const rest = tokens.slice(1).join("").split(/[,，]/).map(x=>parseFloat(x)).filter(x=>!isNaN(x)&&x>0&&x<=100);
    if(!rest.length){ line([{t:"用法: set alert <p1,p2,...>  例 set alert 80,100",c:COLOR.yellow}]); return; }
    state.settings.thresholds = [...new Set(rest)].sort((a,b)=>a-b); save();
    line([{t:"✓ 预警阈值设为 "+state.settings.thresholds.join("% , ")+"%",c:COLOR.green}]);
    refreshHeader();     // 阈值决定顶栏红黄绿圆点与进度条颜色
  } else if(sub==="rate"||sub==="rates"){
    // set rate money 2 / set rate index 8  (年化百分比)
    const which = (tokens[1]||"").toLowerCase();
    const pct = numeric(tokens[2]);
    if(pct==null || pct<0 || pct>100){ line([{t:"用法: set rate <money|index> <年化%>  例 set rate index 8",c:COLOR.yellow}]); return; }
    if(which==="money"||which==="m"||which==="货币"){ state.settings.rateMoney = pct/100; }
    else if(which==="index"||which==="idx"||which==="i"||which==="指数"){ state.settings.rateIndex = pct/100; }
    else { line([{t:"用法: set rate <money|index> <年化%>",c:COLOR.yellow}]); return; }
    save();
    line([{t:"✓ 货币年化 "+(state.settings.rateMoney*100).toFixed(2)+"%  |  指数年化 "+(state.settings.rateIndex*100).toFixed(2)+"%",c:COLOR.green}]);
  } else if(sub==="invest"||sub==="investment"||sub==="consume"||sub==="ratio"||sub==="share"){
    // set invest <投资占比%>   → 消费占比 N = 1 - 投资占比
    // set consume <消费占比%>  → 直接设 N (也接受 set ratio 0.85 小数写法)
    let pct = numeric(tokens[1]);
    const asInvest = (sub==="invest"||sub==="investment");
    const usage = "用法: set invest <投资比例%>   例 set invest 15   (消费占比 = 1 - 投资比例)"
                + "\n      set consume <消费占比%>  例 set consume 85   (或 set ratio 0.85)";
    if(pct==null){ line([{t:usage,c:COLOR.yellow}]); return; }
    if(!asInvest && pct>0 && pct<=1) pct = pct*100;            // 允许 0.85 / 0.9 小数写法
    const newConsume = asInvest ? (1 - pct/100) : (pct/100);
    // 区间取闭区间: 文档写的是"消费占比 50%~100% (投资 0%~50%)", 50/100 这些端点必须能用
    if(!(newConsume>=0.5 && newConsume<=1)){
      line([{t:"比例超出范围: 消费占比需在 50%~100% 之间 (即投资比例 0%~50%)。",c:COLOR.yellow}]);
      line([{t:usage,c:COLOR.yellow}]); return;
    }
    const oldPct = consumePct();
    state.settings.consumeShare = r6(newConsume);
    recomputeAllInvest();                                      // 历史记录按新比例重算应投
    save();
    const sp = rateSplit();
    line([{t:"✓ 投资比例已更新: ",c:COLOR.green},
          {t:"消费占比 "+consumePct()+"%",c:COLOR.pure},
          {t:"  |  投资占比 "+invPct()+"%",c:COLOR.cyan},
          {t:"  (货币 "+r2(sp.mm*100)+"% + 指数 "+r2(sp.idx*100)+"%)",c:COLOR.index}]);
    line([{t:"  换算: 占用 = 消费 ÷ "+consumePct()+"%  →  消费¥100 ⇒ 占用¥"+money(100/consumeShare())
          +" (消费¥100 + 应投¥"+money(100/consumeShare()*(1-consumeShare()))+")",c:COLOR.gray}]);
    line([{t:"  ※ 已按新比例重算全部记录的应投额 (已投金额不会超过新的应投额)。",c:COLOR.gray}]);
    if(oldPct!==consumePct()) line([{t:"  原消费占比 "+oldPct+"%",c:COLOR.gray}]);
    refreshHeader(); renderInvestBar();
  } else if(sub==="daily"||sub==="daybudget"||sub==="每日"){
    // set daily <金额>  手动设置"每日可用余额"(用于右上角今日预算红黄绿提示); set daily off 取消
    const v=(tokens[1]||"").toLowerCase();
    if(v==="off"||v==="none"||v==="clear"||v==="取消"||v==="关"){
      state.settings.dailyBudget=null; save();
      line([{t:"✓ 已清除每日可用余额 (右上角「今日预算」转为灰点未设置)",c:COLOR.green}]);
    } else {
      const n=numeric(tokens[1]);
      if(n==null||n<=0){ line([{t:"用法: set daily <金额>  例 set daily 100  (每日可用余额;  set daily off 取消)",c:COLOR.yellow}]); return; }
      state.settings.dailyBudget=r2(n); save();
      const ts=todaySnapshot();
      line([{t:"✓ 每日可用余额已设为 ",c:COLOR.green},{t:"¥"+money(r2(n)),c:COLOR.pure,cls:"hl"},
            {t:"  今日已消费 ¥"+money(ts.consumption),c:COLOR.gray}]);
      line(dotLine("今日预算", ratioDot(ts.ratio)));
    }
    refreshHeader();
  } else {
    line([{t:"set 支持: budget | daily <每日可用余额> | invest <投资比例%> | consume <消费占比%> | period <N天> | periodstart <日期> | monthstart | weekstart | alert | rate",c:COLOR.yellow}]);
  }
}

/* ------------------------------- budget -------------------------------- */
/* 配置预算: budget set <金额>=仅改当期; budget default <金额>=以后各期; budget reset=取消当期覆盖 */
function doBudget(tokens){
  const sub = (tokens[0]||"").toLowerCase();
  const p = currentPeriod();
  if(sub==="set" || sub==="now" || sub==="current"){
    const n = numeric(tokens[1]);
    if(n==null || n<=0){ line([{t:"用法: budget set <金额>   例 budget set 1200 (仅调整当前周期)",c:COLOR.yellow}]); return; }
    state.settings.periodBudget = state.settings.periodBudget || {};
    state.settings.periodBudget[p.start] = r2(n); save();
    line([{t:"✓ 当期预算已设为 ",c:COLOR.green},{t:"¥"+money(r2(n)),c:COLOR.pure,cls:"hl"},
          {t:"  仅影响当前周期 "+p.label+"；以后各期仍为 ¥"+money(state.settings.budget),c:COLOR.gray}]);
    refreshHeader(); showForecastLine();
    return;
  }
  if(sub==="default"){
    const n = numeric(tokens[1]);
    if(n==null || n<=0){ line([{t:"用法: budget default <金额>   例 budget default 1000 (改默认, 各期生效)",c:COLOR.yellow}]); return; }
    state.settings.budget = r2(n); save();
    line([{t:"✓ 默认预算已设为 ",c:COLOR.green},{t:"¥"+money(r2(n)),c:COLOR.pure,cls:"hl"},{t:" (未单独覆盖的周期都用它)",c:COLOR.gray}]);
    refreshHeader(); showForecastLine();
    return;
  }
  if(sub==="reset" || sub==="clear"){
    if(state.settings.periodBudget){ delete state.settings.periodBudget[p.start]; save(); }
    line([{t:"✓ 已取消当前周期的预算覆盖，恢复默认 ¥"+money(state.settings.budget),c:COLOR.green}]);
    refreshHeader(); showForecastLine();
    return;
  }
  showBudget();
}
function showBudget(){
  const st = periodSnapshot();
  const p = st.p, b = st.B;
  const bar = progressBar(st.ratio);
  const aw = alertWord(st.ratio);
  const carry = r2(st.usedUnits - b);            // >0 透支, <=0 本期可结转(=剩余)
  const bal = availableBalance();
  blank();
  line([{t:"▍周期预算  ( ",c:COLOR.cyan},{t:p.label,c:COLOR.pure},{t:" )",c:COLOR.cyan}]);
  line([
    {t:"本期发放 ",c:COLOR.white},{t:"¥"+money(b),c:COLOR.green},
    {t:"   消费 ",c:COLOR.white},{t:"¥"+money(st.consumption),c:COLOR.pure},
    {t:"   应投合计 ",c:COLOR.white},{t:"¥"+money(st.invest),c:COLOR.cyan},
  ]);
  line([
    {t:"已占用(含应投) ",c:COLOR.gray},{t:"¥"+money(st.usedUnits),c:bar.color,cls:"glow"},
    {t:"   累计可用余额(含结转) ",c:COLOR.gray},{t:"¥"+money(bal),c:(bal<0?COLOR.red:COLOR.green),cls:"glow"},
  ]);
  line([
    {t:bar.bar,c:bar.color},{t:"  "+bar.pct+"%  ",c:COLOR.white}
  ]);
  if(carry > 0){
    line([{t:"⚠ 本期已透支 ¥"+money(carry)+" (将自下期发放中扣除)",c:COLOR.red,cls:"glow"}]);
  } else {
    line([{t:"本期可结转 ¥"+money(-carry),c:COLOR.green}]);
  }
  line([{t:aw.t,c:aw.c,cls:"glow"}]);

function validateCategory(cat){

  if(!c){ line([{t:"类别不能为空。例: add 50 餐饮 午餐",c:COLOR.yellow}]); return null; }
  if(!PREDEFINED.has(c)) PREDEFINED.set(c, COLOR.catFallback);   // register custom category color
  refreshCatlist();
  return c;
}
function doAdd(tokens){
  if(!tokens.length){ line([{t:"用法: add <金额> <类别> [备注..] [@日期]   例 add 50 餐饮 午餐",c:COLOR.yellow}]); return; }

        {t:"  "+cat+" ",c:catColor(cat)},

        {t:"  (消费÷"+consumePct()+"%)  应投货币 ",c:COLOR.gray},{t:"¥"+money(rec.mm),c:COLOR.cyan},
        {t:"  + 应投指数 ",c:COLOR.gray},{t:"¥"+money(rec.idx),c:COLOR.index},
        {t:"  = ",c:COLOR.gray},{t:"¥"+money(rec.mm+rec.idx),c:COLOR.green}]);

  const aw = alertWord(st.ratio);
  if(aw.t!=="预算内 ✓"){
    line([
      {t:"⚠ 本期占用 ",c:COLOR.yellow},{t:"¥"+money(st.usedUnits),c:COLOR.yellow,cls:"glow"},

      {t:"  ("+bar.pct+"%)  ",c:COLOR.yellow},

}
function makeRecord(amount, category, note, date){
  state.seq += 1;
  const inv = investOf(amount);
  return { id:state.seq, amount:r2(amount), category, note, date,
           mm:inv.mm, idx:inv.idx, moneyInv:0, indexInv:0, created: todayYMD() };
}

/* 每条记录一行; 点右侧"投资状态"按钮后, 行内状态/已投小计即时刷新(修复点了仍显示未投) */
function renderRecordRow(r){
  const d = document.createElement("div"); d.className = "l";
  addSeg(d,{t:"#"+r.id, c:COLOR.cyan});

  addSeg(d,{t:"  应投指数 ",c:COLOR.index}); addSeg(d,{t:"¥"+money(r.idx), c:COLOR.white});
  const invSpan = mkSpan("", COLOR.gray);       // 已投小计
  const stSpan  = mkSpan("", COLOR.gray);       // 状态
  d.appendChild(invSpan); d.appendChild(stSpan);
  if(r.note) addSeg(d,{t:"  · "+r.note, c:COLOR.gray});
  addSeg(d,{t:"  ", c:COLOR.gray});
  const b = document.createElement("button"); b.type="button"; b.className="tbtn";
  b.title = "把 #"+r.id+" 应投货币/指数全部标记已投 (等同 pay "+r.id+" all), 再点重置";
  // 行是否还指向 state 里的同一条记录: undo/redo 或 del 之后, 旧行会变成"悬空"行,
  // 不能再让它按钮上报成功(否则看起来改了数据, 实际什么都没发生)
  const alive = ()=> state.records.indexOf(r) >= 0;
  const refresh = ()=>{
    if(!alive()){
      invSpan.textContent = ""; stSpan.textContent = "  已失效"; stSpan.style.color = COLOR.gray;
      b.disabled = true; b.className = "tbtn dimmed"; b.textContent = "已失效";
      b.title = "该行对应的记录已被删除或撤销, 请重新 list";
      return;
    }
    const noNeed = recNoNeed(r);
    const mInv=r.moneyInv||0, iInv=r.indexInv||0;
    const parts=[]; if(mInv>0) parts.push("已投货币¥"+money(mInv)); if(iInv>0) parts.push("已投指数¥"+money(iInv));
    invSpan.textContent = parts.length? "  ["+parts.join(" ")+"]" : "";
    invSpan.style.color = COLOR.gray;
    const st = recStatus(r);
    stSpan.textContent = "  "+st.t; stSpan.style.color = st.c;
    const f2 = !noNeed && recFullyMoney(r) && recFullyIndex(r);
    b.className = "tbtn " + (f2 ? "on" : "");
    if(noNeed){
      b.disabled = true;
      b.textContent = "无需投资";
      b.title = "该笔应投货币/指数均为 ¥0.00, 无需投资";
    } else {
      b.disabled = false;
      b.textContent = f2 ? "已投资 ✓" : "标记已投资";
      b.title = "把 #"+r.id+" 应投货币/指数全部标记已投 (等同 pay "+r.id+" all), 再点重置";
    }
  };
  b.addEventListener("click", ()=>{
    if(!alive()){ line([{t:"#"+r.id+" 所在行已失效(记录已被删除或撤销), 请重新执行 list 查看最新数据。", c:COLOR.yellow}]); refresh(); return; }
    if(recNoNeed(r)){ line([{t:"#"+r.id+" 应投货币/指数均为 ¥0.00, 无需投资。", c:COLOR.yellow}]); return; }
    mutate(()=>{
      if(recFullyMoney(r) && recFullyIndex(r)){ r.moneyInv=0; r.indexInv=0; }
      else { r.moneyInv=r.mm; r.indexInv=r.idx; }
      save();
    });
    const f2 = recFullyMoney(r) && recFullyIndex(r);
    refresh();
    line([{t:"✓ #"+r.id+" "+r.category+" ¥"+money(r.amount)+" 投资 → "+(f2?"已投资":"未投资"), c: f2?COLOR.green:COLOR.yellow}]);
    refreshHeader(); scrollBottom();
  });
  d.appendChild(b);
  refresh();   // 初始化行内状态
  term.appendChild(d);
}
/* list 参数解析: [类别X] [@日期 | @YYYY-MM | @today | @period | @month] [条数]
   - @YYYY-MM-DD / @today  → 只看该天
   - @YYYY-MM   / @month   → 看整月(自然月)
   - @period               → 看当前记账周期(可跨月)
   - 其余非数字 token 视为类别 */
function filterByTokens(tokens){
  let cat=null, month=null, date=null, range=null, limit=null;
  const bad = [];                      // 无法识别的 @条件(以前会被静默忽略, 于是 list @写错 就变成"列出全部")
  const keyword = (s)=>{
    const low = String(s).toLowerCase();
    if(low==="today" || s==="今日" || s==="当日"){ date = todayYMD(); return true; }
    if(low==="period" || s==="周期" || s==="本周期"){ const p=currentPeriod(); range={start:p.start,end:p.end,label:"周期 "+p.label}; return true; }
    if(low==="month" || s==="本月" || s==="月份" || s==="自然月"){ const m=calendarMonthBounds(todayYMD()); range={start:m.start,end:m.end,label:"本月 "+m.label}; return true; }
    return false;
  };
  for(const tk of tokens){
    const raw = String(tk);
    if(raw[0]==="@"){
      const s = raw.slice(1);
      if(keyword(s)) continue;
      if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){ const p=parseYMD(s); if(p){ date = mkYMD(p.y,p.m,p.d); continue; } }
      else if(/^\d{4}-\d{1,2}$/.test(s)){ const p=parseYMD(s+"-01"); if(p){ month = mkYMD(p.y,p.m,1).slice(0,7); continue; } }
      else { const p=parseYMD(s); if(p){ month = mkYMD(p.y,p.m,1).slice(0,7); continue; } }
      bad.push(raw);
      continue;
    }
    if(/^(cat|类别|category)$/i.test(raw)) continue;
    if(numeric(raw)!==null){ limit = +raw; continue; }
    if(keyword(raw)) continue;
    cat = raw;
  }
  return {cat,month,date,range,limit,bad};
}
function doList(tokens){
  const f = filterByTokens(tokens);
  let rows = state.records.slice();
  if(f.cat)  rows = rows.filter(r=>r.category===f.cat);
  if(f.date) rows = rows.filter(r=>r.date===f.date);
  else if(f.range) rows = rows.filter(r=>inRange(r.date,f.range.start,f.range.end));
  else if(f.month) rows = rows.filter(r=>r.date.startsWith(f.month));
  rows.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:a.id-b.id));
  if(f.limit && f.limit>0) rows = rows.slice(-f.limit);
  const desc=[];
  if(f.cat) desc.push("类别="+f.cat);
  if(f.date) desc.push("日期="+f.date);
  else if(f.range) desc.push(f.range.label);
  else if(f.month) desc.push("月份="+f.month);
  if(f.limit) desc.push("最近 "+f.limit+" 条");
  const descTxt = desc.length ? ("  [筛选: "+desc.join("  ")+"]") : "";
  if(f.bad.length) line([{t:"⚠ 无法识别的日期条件: "+f.bad.join(" ")+"  可用 @YYYY-MM-DD / @YYYY-MM / @today / @period / @month",
                          c:COLOR.yellow}]);
  if(!rows.length){
    line([{t:"(暂无匹配记录)"+descTxt+"   add 一笔试试吧",c:COLOR.gray}]);
    const cats=[...new Set(state.records.map(r=>r.category))];
    if(cats.length) line([{t:"现有类别: "+cats.join("   "),c:COLOR.gray}]);
    return;
  }
  const sum = r2(rows.reduce((s,r)=>s+r.amount,0));
  blank();
  line([{t:" 消费记录  ("+rows.length+" 条)",c:COLOR.cyan},{t:descTxt,c:COLOR.yellow}]);
  line([{t:" 合计 ¥"+money(sum)+"   点每行右侧 [标记已投资] 一键勾选, 再点取消。",c:COLOR.gray}]);
  for(const r of rows){ renderRecordRow(r); }
  blank();
}
function doDelete(tokens){
  const id = numeric(tokens[0]);
  if(id==null){ line([{t:"用法: del <id>",c:COLOR.yellow}]); return; }
  const i = state.records.findIndex(r=>r.id===id);
  if(i<0){ line([{t:"未找到 #"+id+"。用 list 查看编号",c:COLOR.yellow}]); return; }
  const [rm] = state.records.splice(i,1); save();
  line([{t:"✗ 已删除 #",c:COLOR.red},{t:rm.id,c:COLOR.red},{t:"  "+rm.category+" ¥"+money(rm.amount),c:COLOR.white}]);
  refreshHeader();
}
function doUpdate(tokens){
  if(tokens.length<3){ line([{t:"用法: update <id> <金额> <类别> [备注..] [@日期]",c:COLOR.yellow}]); return; }
  const id = numeric(tokens[0]);
  const rec = state.records.find(r=>r.id===id);
  if(!rec){ line([{t:"未找到 #"+id,c:COLOR.yellow}]); return; }
  const {tokens:rest, date:rawDate} = findDateToken(tokens.slice(1));
  const amt = numeric(rest[0]);
  if(amt==null||amt<=0){ line([{t:"金额无效",c:COLOR.yellow}]); return; }
  const cat = validateCategory(rest[1]); if(!cat) return;
  const note = rest.slice(2).join(" ");
  rec.amount = r2(amt); rec.category = cat; rec.note = note;
  if(rawDate){ const d = cleanDateStr(rawDate); if(d) rec.date=d; }
  const inv = investOf(rec.amount); rec.mm=inv.mm; rec.idx=inv.idx;
  rec.moneyInv = Math.min(rec.moneyInv||0, rec.mm);
  rec.indexInv = Math.min(rec.indexInv||0, rec.idx);
  save();
  line([{t:"✓ 已更新 #",c:COLOR.green},{t:id,c:COLOR.pure},{t:"  "+cat+" ¥"+money(rec.amount)+" 应投重新计算: 货币¥"+money(rec.mm)+" 指数¥"+money(rec.idx),c:COLOR.white}]);
  refreshHeader();
}
function doPay(tokens){
  const id = numeric(tokens[0]);
  if(id==null){ line([{t:"用法: pay <id> [mm|idx|all|none]   例 pay 3 all",c:COLOR.yellow}]); return; }
  const rec = state.records.find(r=>r.id===id);
  if(!rec){ line([{t:"未找到 #"+id,c:COLOR.yellow}]); return; }
  if(recNoNeed(rec)){ line([{t:"#"+id+" 应投货币/指数均为 ¥0.00, 无需投资。",c:COLOR.yellow}]); return; }
  const kind = (tokens[1]||"all").toLowerCase();
  let label="", verb;
  const fm = recFullyMoney(rec), fi = recFullyIndex(rec);
  if(kind==="all"){
    if(fm && fi){ rec.moneyInv=0; rec.indexInv=0; label="重置为未投资"; }
    else { rec.moneyInv=rec.mm; rec.indexInv=rec.idx; label="全部记已投"; }
  } else if(kind==="none"){
    rec.moneyInv=0; rec.indexInv=0; label="重置为未投资";
  } else if(kind==="mm"){
    rec.moneyInv = fm ? 0 : rec.mm; label = fm ? "货币 重置未投" : "货币 记已投";
  } else if(kind==="idx"||kind==="index"){
    rec.indexInv = fi ? 0 : rec.idx; label = fi ? "指数 重置未投" : "指数 记已投";
  } else { line([{t:"kind 应为 mm | idx | all | none",c:COLOR.yellow}]); return; }
  save();
  const st2 = recStatus(rec);
  line([{t:"✓ #"+id+" "+label+" → "+st2.t, c: st2.c===COLOR.green?COLOR.green:COLOR.yellow}]);
  refreshHeader();
}

/* 全额投资: 整池投掉清零; 仅当该种未投池 ≥ 阈值(货币100/指数20)才可执行(否则提示需满额) */
function doInvestFull(kind){
  const name = kind==="money" ? "应投货币" : "应投指数";
  const lot = kind==="money" ? INVEST_MONEY_LOT : INVEST_INDEX_LOT;
  const r = mutate(()=>investFull(kind));
  if(!r){
    const pend = kind==="money" ? moneyPending() : indexPending();
    if(pend <= INV_EPS) line([{t:name+" 未投池为空，暂无可投。", c:COLOR.yellow}]);
    else line([{t:name+" 未投池仅 ¥"+money(pend)+"，需累计至 ¥"+lot+" 才能全额投资。", c:COLOR.yellow}]);
    return;
  }
  line([{t:"✓ 已全额投资 ",c:COLOR.green},{t:name,c:kind==="money"?COLOR.cyan:COLOR.index},
        {t:" ¥"+money(r.amt)+" (池已清零; 分摊到 "+r.applied+" 笔未投记录)",c:COLOR.white}]);
  refreshHeader();
  renderInvestBar();
  scrollBottom();
}

/* ----------------------------- summaries ------------------------------- */
function collectWindow(start,end,category){
  const catFilter = category ? String(category).trim() : null;
  let rows = state.records.filter(r=>inRange(r.date,start,end));
  if(catFilter) rows = rows.filter(r=>r.category===catFilter);
  const total = r2(rows.reduce((s,r)=>s+r.amount,0));
  const mmT  = r2(rows.reduce((s,r)=>s+r.mm,0));
  const idxT = r2(rows.reduce((s,r)=>s+r.idx,0));
  const byCat = new Map();
  for(const r of rows){ byCat.set(r.category,(byCat.get(r.category)||0)+r.amount); }
  const cats = [...byCat.entries()].sort((a,b)=>b[1]-a[1]);
  const days = Math.max(1, daysBetween(start,end)+1);
  return {rows,count:rows.length,total,mmT,idxT,cats,start,end,days,category:catFilter};
}
/* 总结报告渲染。注意: 表里的"预算行"(本期发放/占用/结余/累计余额)始终是
   **当前记账周期**口径 —— 预算按周期发放与结转, 不随统计窗口或类别变化,
   所以这里不接收"窗口对应的周期"参数(旧的 budgetRef 形参传了但从未被读取)。 */
function printSummaryReport(win, windowName, opts){
  opts = opts || {};
  const st = periodSnapshot();                 // 当前(含窗口所在)周期口径
  const bar = progressBar(st.ratio);
  const aw  = alertWord(st.ratio);
  const carry = r2(st.usedUnits - st.B);       // >0 透支; <=0 本期剩余可结转
  const bal = availableBalance();
  const title = windowName;
  line([{t:"═ "+title+" 总结 ═", c:COLOR.cyan}]);
  const invTotal = r2(win.mmT+win.idxT);
  // stat table rows: [key, value, color, glow?]
  const rows=[
    ["窗口总消费", "¥"+money(win.total), COLOR.pure],
    ["消费笔数", String(win.count), COLOR.white],
  ];
  for(const [cat,amt] of win.cats){
    const pct = win.total>0? (amt/win.total*100).toFixed(1)+"%":"0%";
    rows.push(["  类别·"+cat, "¥"+money(amt)+"  ("+pct+")", catColor(cat)]);
  }
  rows.push(["应投货币("+mmPct()+"%)", "¥"+money(win.mmT), COLOR.cyan]);
  rows.push(["应投指数("+idxPct()+"%)", "¥"+money(win.idxT), COLOR.index]);
  rows.push(["应投合计", "¥"+money(invTotal), COLOR.green]);
  rows.push(["本期发放(基准)", "¥"+money(st.B), COLOR.white]);
  rows.push(["本期消费", "¥"+money(st.consumption), COLOR.pure]);
  rows.push(["本期占用(消费+应投)", "¥"+money(st.usedUnits), (st.ratio>1?COLOR.red:COLOR.white)]);
  rows.push(["本期结余/透支", (carry>0?"透支 -":"可结转 +")+money(Math.abs(carry)), carry>0?COLOR.red:COLOR.green]);
  rows.push(["累计可用余额(含结转)", "¥"+money(bal), bal<0?COLOR.red:COLOR.green]);
  rows.push(["超额状态", aw.t, aw.c]);
  for(const [k,v,color] of rows){
    kvRow(k, v, 0, color, /透支|超额/.test(k) && (carry>0 || aw.t!=="预算内 ✓"));
  }
  // visual bar for the period
  line([{t:" 本期发放进度 ",c:COLOR.gray},{t:bar.bar,c:bar.color},{t:"  "+bar.pct+"%",c:COLOR.white}]);
  line([{t:" 换算口径: 消费÷"+consumePct()+"%=占用; 占用×"+invPct()+"% 应投(货币"+mmPct()+"%/指数"+idxPct()+"%)", c:COLOR.gray}]);
  // category mini-bars
  if(win.cats.length && win.total>0){
    line([{t:" 类别占比(按消费):",c:COLOR.gray}]);
    for(const [cat,amt] of win.cats){
      const ratioC = amt/win.total;
      const w = Math.round(ratioC*20);
      const col = catColor(cat);
      line([{t:"   "+cat,c:col},{t:"  "+"█".repeat(w)+"░".repeat(20-w)+"  ",c:col},{t:(ratioC*100).toFixed(1)+"%",c:COLOR.white}]);
    }
  }
  // investment payment status recap (未投部分 != 0)
  const unpaid = win.rows.filter(r=> !(recFullyMoney(r) && recFullyIndex(r)));
  if(unpaid.length){
    line([{t:" 未完全投资 ("+unpaid.length+" 笔): 用 pay <id> all 或点右侧按钮", c:COLOR.yellow}]);
    unpaid.slice(0,10).forEach(r=>{
      const mmInv=r.moneyInv||0, idxInv=r.indexInv||0;
      const invNote = (mmInv||idxInv) ? "  (已投货币¥"+money(mmInv)+" 指数¥"+money(idxInv)+")":"";
      line([{t:"   #"+r.id+" "+r.category+" ¥"+money(r.amount)+"  (应投货币¥"+money(r.mm)+" 指数¥"+money(r.idx)+")"+invNote,c:COLOR.white}]);
    });
    if(unpaid.length>10) line([{t:"   ... 等 "+(unpaid.length-10)+" 笔",c:COLOR.gray}]);
  }
  // 平均每日消费（summary day 不计算）
  if(!opts.isDay){
    const today = todayYMD();
    const totalDays = win.days || 1;
    const endEff = (win.end && win.end < today) ? win.end : today;
    const usedDays = Math.max(1, daysBetween(win.start, endEff) + 1);
    const avg = r2(win.total / usedDays);
    line([{t:" ── 平均每日消费 ──", c:COLOR.gray}]);
    line([
      {t:" 日均 ", c:COLOR.gray},
