<script>
"use strict";
/* ============================================================================
   BUDGET::TERM  — 个人记账与自动理财规划终端
   纯前端，数据保存在 localStorage。无需构建、无需服务器，双击即可运行。
   ========================================================================== */

const LS_KEY = "budget_term_v1";
const APP_VERSION = "v0.1.1";          // 版本号(与 git tag 对应)
/* ---- 钱包 · 口径 ----
   钱包 = 付款账户(现金 / 微信 / 支付宝 / 银行卡…), 余额**手动维护**:
     · 余额不参与预算的发放/占用/结转口径, 与预算各自独立(只做对照展示);
     · 余额 = Σ 手动流水(存入 + / 取出 −) − Σ 由该钱包支付的支出, 两者都**只算截至今天**的;
     · 一笔支出对钱包的扣款 = recTotal()(**总价**, 付款口径) —— 分摊成本的钱是记账当天一次付掉的,
       与"消费口径 = 每天金额"(amount)不是同一把尺子, 所以这里不能拿 r.amount 直接减。
   存储: state.wallets = [{id, name}]、state.wops = [{wallet, amount, date, note, created}];
         记录上的 rec.wallet = 钱包 id(0 = 未指定: 钱包功能上线前的旧记录)。
   WALLET_NAME_MAX: 钱包名长度上限; 命令行用 `$钱包名` 指定, 名字太长会把列表行/卡片撑爆。 */
const WALLET_NAME_MAX = 24;
const DEFAULT_WALLET_NAME = "默认钱包";
const DEFAULT_BUDGET = 1000;          // 每周期总预算(可动用现金总额)
/* ---- 地点 · 合规边界 ----
   只用腾讯地图 JSAPI GL + service 库。本应用是"本地双击"的单文件应用, 属非默认场景:
   SDK URL 需要用户自己的 key, 代码里只保留下面这条**显式占位符模板**:
     https://map.qq.com/api/gljs?v=1.exp&libraries=service&key="请在腾讯位置服务开放平台申请自己的key并替换此占位符"
   真实 key 只能由 `config set geokey <key>` 写进本地 settings; 代码不预置任何有效 key。
   逆地理编码一律走 TMap.service.Geocoder (SDK 内部鉴权), 不手写 fetch 调 WebService。
   坐标仅在内存里用于换地名, 不写进记录/备份; 落盘的只有省/市/区地名字符串。 */
const GEO_KEY_PLACEHOLDER = "请在腾讯位置服务开放平台申请自己的key并替换此占位符";
const GEO_SDK_BASE = "https://map.qq.com/api/gljs?v=1.exp&libraries=service";
const GEO_SDK_URL_TEMPLATE = GEO_SDK_BASE + "&key=\"" + GEO_KEY_PLACEHOLDER + "\"";
const GEO_TIMEOUT_MS = 10000;         // 浏览器定位超时
const GEO_SDK_TIMEOUT_MS = 8000;      // SDK <script> 加载超时(P1: 失败后不永久缓存)
const GEO_MAX_PLACE_LEN = 60;         // 地名最大长度(外部返回值一律截断)
const GEO_CACHE_KEY = "budget_term_geo_v1";  // 上次定位的地名缓存(独立键, 不进账本/备份/撤销栈)
/* --- 分摊成本(amort)的字段与口径 ---
   一笔"分摊成本"= 一次性付出的**总价**(如年费/房租/保险费), 按 **分摊天数** 平均分到每一天。
   记录里各字段的口径(务必与其它命令一致):
     amount     = **每天**分摊到的金额(总价 ÷ 天数) —— 所有"消费口径"的派生(周期占用/
                  summary/燃尽/日均)与旧记录**完全同义**, 不需要任何特判;
     amortDays  = 分摊天数(>1 才算分摊; 普通消费记 1, 归一化时补齐);
     amortTotal = 当初付出的总价(用于列表/报告/导出的"总价 X / N 天"展示)。
   投资是**一次性按总价记**的("相关的投资只记录总数, 不分摊"): 每笔的应投额由
   amortTotal 算出并记在该笔记录上, 因此分期期间每天分摊 1/N, 但应投池只累计一次;
   顺带保证了"总额口径"与"逐日口径"两种算法的结果完全相等
   (Σ (总价/N ÷ N占比) = 总价 ÷ N占比)。
   旧记录(没有这两个字段)走 recDays()/recTotal() 时自动当作 amount / 1 天, 行为不变。 */
const AMORT_MIN_DAYS = 2, AMORT_MAX_DAYS = 3650;   // 分摊天数区间(上限约 10 年, 够覆盖长期摊销)
const AMORT_DAYS_UNIT = 30;                        // "N月"换算用的每月天数(口径可预期, 不随日历漂移)
/* 可调投资比例：总花费(占用) = 消费 ÷ N, 其中 N = 消费占比(默认 0.85)、
   投资占比 = 1 - N (默认 0.15)。投资池内部仍按原始 13:2 比例拆分货币/指数。
   下面四个常量是"默认/基准值"，运行时的真实比例见 consumeShare()/rateSplit()。 */
const CONSUME_SHARE = 0.85;           // 基准: 总预算中用于"消费"的比例 N (可用 set invest/consume 调)
const MM_RATE   = 0.13;               // 基准: 其中货币基金占比(占总投资池 13/15)
const IDX_RATE  = 0.02;               // 基准: 其中指数基金占比(占总投资池 2/15)
/* 一键投资的触发/单笔额度: 应投货币池累计≥100、应投指数池累计≥20 时可投入该额度 */
const INVEST_MONEY_LOT = 100;         // 货币基金每次投入额(触发阈值)
const INVEST_INDEX_LOT = 20;          // 指数基金每次投入额(触发阈值)
const DEFAULT_CATEGORIES = ["餐饮","交通","购物","娱乐","居住","医疗","教育","人情","旅行","其他"];
/* 类别余额(信封预算):
   总可用余额 = 当期预算 × 可消费比例(consumeShare, 默认 85%) —— 与"占用 = 消费 ÷ N"是同一把尺子,
   所以每个类别再被 `已分配` 切分时, 单元格里装的是**消费额度**(元), 使用率 = 已消费 ÷ 已分配。
   配置类别余额**不转账**, 只是给每个类别一个天花板; 已配置合计不得超过总可用余额。
   CAT_NAME_MAX: 类别名长度上限(与地点 60 同一思路, 防脏数据把配置页/顶栏撑爆)。
   取 60 而不是更小, 是为了让"能记账的类别名"都能配额度 —— 记账侧 validateCategory 不截断,
   若这里截断就会生成一个永远匹配不上记录名的幽灵键。 */
const CAT_NAME_MAX = 60;
const CAT_ALLOC_OFF = ["off","clear","-","0","none","取消","清除"];   // set category <类别> <这些> = 取消该类别
const CAT_ALLOC_MUTE = ["nowarn","silent","静默"];                     // 金额后的可选标记 = 该类别不提示超额
/* 图表总结: 柱状图上限桶数 / 绘图区像素高(与 CSS .chart-bars 的 218px - 24px 预留标签高度对应)
   柱数有上限, 保证长窗口在窄屏下也能完整显示。 */
const CHART_MAX_BUCKETS = 12;
const CHART_PLOT_H = 192;
const CHART_WINDOWS = new Set(["day","日","today","week","周","month","月","natural",
                               "period","周期","cycle"]);
const CHART_TYPES = new Set(["bar","bars","柱","柱状图","柱图","pie","饼","饼图",
                             "both","all","全部","双图","两者"]);

/* ======================= 颜色表 (单一数据源) =======================
   终端输出里的颜色以前是散落各处的 "#rrggbb" 字面量(220+ 处), 想换主题就得全文件替换。
   现在统一到这里: 每个名字对应 :root 里的同名 CSS 变量, 启动时读取真实值,
   读不到(无布局/无 CSS 环境, 例如离线测试)就退回下面的字面量默认值。
   改配色 = 只改 <style> 里的 :root 一处(或在这里覆盖默认值)。 */
const COLOR = (function(){
  const def = {
    green:"#3dff7a", greenDim:"#1e9e54", white:"#d7ffe0", pure:"#ffffff",
    yellow:"#ffd23d", orange:"#ff9d3d", red:"#ff4d5e", cyan:"#4de8ff",
    magenta:"#ff5ef0", gray:"#5d6b62", index:"#f1fa8c", faint:"#3c4b41",
    catFallback:"#8be9fd"
  };
  const map = { green:"--green", greenDim:"--green-dim", white:"--white", pure:"--pure",
                yellow:"--yellow", orange:"--orange", red:"--red", cyan:"--cyan",
                magenta:"--magenta", gray:"--gray", index:"--index", faint:"--faint",
                catFallback:"--cat-fallback" };
  try{
    const cs = getComputedStyle(document.documentElement);
    if(cs && typeof cs.getPropertyValue === "function"){
      for(const k in map){
        const v = String(cs.getPropertyValue(map[k])||"").trim();
        if(v) def[k] = v;                      // 以 CSS 令牌为准
      }
    }
  }catch(e){ /* 拿不到计算样式时用字面量默认值 */ }
  return def;
})();
/* 类别配色: 前 6 个复用主题色, 后 2 个是仅用于类别的扩展色, 最后两个兜底 */
const CAT_PALETTE = [COLOR.green, COLOR.cyan, COLOR.yellow, COLOR.orange, COLOR.magenta,
                     COLOR.red, "#2dcc9f", "#c58bff", COLOR.catFallback, COLOR.index];
const PREDEFINED = new Map(DEFAULT_CATEGORIES.map((c,i)=>[c, CAT_PALETTE[i % CAT_PALETTE.length]]));
/* P1 B-15: 自定义类别专用色板, 与默认 10 类的 CAT_PALETTE 完全不重叠。
   旧行为把所有自定义类别都塞进 COLOR.catFallback → 饼图/图例相邻切片同色、看不出分界。 */
const CUSTOM_CAT_PALETTE = ["#7aa2ff", "#ff8ac4", "#5ce1b9", "#ffc46b",
                            "#b39cff", "#71d8ff", "#ff8f8f", "#a8e063"];

/* ---------- 可调投资比例: 运行时读取的消费/投资比率 ---------- */
function r6(x){ return Math.round(x*1e6)/1e6; }
/* 投资金额内部保留 6 位小数: 避免 <0.005 的应投被显示口径(0.00)抹掉后永远无法标记已投。
   UI 一律用 money() 显示 2 位, 只有内部计算/比较用高精度。 */
const INV_EPS  = 1e-9;                          // 判定"是否需要投资 / 是否已投足"的浮点容差
const INV_UNIT = 1e6;                           // 全额投资分摊用的整数单位(1e-6 元)
function consumeShare(){                        // N: 消费占总花费(占用)的比例
  const v = (state && state.settings) ? state.settings.consumeShare : undefined;
  // 允许 N=1 (100% 消费 / 不投资), 与文档的 50%~100% 区间一致
  return (typeof v==="number" && v>0 && v<=1) ? v : CONSUME_SHARE;
}
function investShare(){ return r6(1 - consumeShare()); }   // 1-N: 投资比例
/* 投资池内部拆分: 保持原始 13:2 比例, 按投资占比整体缩放 */
function rateSplit(){
  const inv = investShare(), base = MM_RATE + IDX_RATE;    // 0.15
  if(Math.abs(inv-base) < 1e-9) return { mm: MM_RATE, idx: IDX_RATE };
  return { mm: r6(inv * (MM_RATE/base)), idx: r6(inv * (IDX_RATE/base)) };
}
function consumePct(){ return r2(consumeShare()*100); }    // 85
function invPct(){ return r2(investShare()*100); }         // 15
function mmPct(){ return r2(rateSplit().mm*100); }         // 13
function idxPct(){ return r2(rateSplit().idx*100); }       // 2

/* ----------------------------- state ------------------------------------ */
let state = null;
function defaultSettings(){
  return { budget: DEFAULT_BUDGET, monthStart:1, weekStart:"mon", thresholds:[80,100],
           periodMode:"month", lengthDays:15, anchor:null, epoch:null,
           consumeShare:CONSUME_SHARE, rateMoney:0.02, rateIndex:0.08, periodBudget:{},
           dailyBudget:null,                 // 手动设置的"每日可用余额"(null = 未设置)
           categoryBudget:{},                // 类别余额(信封): {类别: 已分配金额}
           categoryMute:{},                  // 静默开关: {类别:true} = 该类别不产生超额警告(缺省 = 提示)
           walletDefault:null,               // 默认钱包 id(记支出时默认用它付款); null = 第一个钱包
           geoMode:"auto", geoKey:"" };    // 地点: auto=add 时自动定位 / manual=全手动; key 只存本机
}
function loadState(){
  let parsed = null;
  try{ parsed = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ parsed = null; }
  if(!parsed || typeof parsed!=="object") parsed = {};
  state = { settings: normalizeSettings(parsed.settings), seq: 0, records: [], wallets: [], wops: [] };
  const norm = normalizeRecords(parsed.records);
  state.records = norm.records;
  state.seq = Math.max(
    (typeof parsed.seq==="number" && isFinite(parsed.seq)) ? Math.round(parsed.seq) : 0,
    state.records.reduce((m,r)=>Math.max(m,r.id), 0));   // 序号必须大于所有已有 id, 否则新增会撞号
  /* 钱包: 与记录走同一套归一化(加载与导入共用), 并保证至少一个钱包 + 修正悬空引用 */
  const wn = normalizeWallets(parsed.wallets, parsed.wops);
  state.wallets = wn.wallets;
  state.wops = wn.wops;
  ensureWallets();
  ensureEpoch();      // 账本起点对齐到真实周期边界(旧数据/改过周期设置的数据都会在这里修正)
  save();             // 启动时把归一化后的 state 落盘(非命令路径; 命令统一走 commit())
  return { dropped:norm.dropped, walletsDropped:wn.dropped };
}
/* --- 设置归一化: 手改过的/跨版本导入的 settings 也能安全使用 ---
   缺失项回落默认值, 非法值(类型错/越界/被写成 null)一律丢弃, 避免后面 [...thresholds] 之类直接抛错。 */
function normalizeSettings(raw){
  const def = defaultSettings();
  const s = Object.assign({}, def, (raw && typeof raw==="object") ? raw : {});
  /* P0: r2 后仍 >0 —— 否则备份里的 0.001 会显示 ¥0.00 / 被 effectiveBudget 判为无覆盖 */
  if(!(typeof s.budget==="number" && isFinite(s.budget) && s.budget>0 && r2(s.budget)>0)) s.budget = def.budget;
  if(!(Number.isInteger(s.monthStart) && s.monthStart>=1 && s.monthStart<=28)) s.monthStart = def.monthStart;
  if(s.weekStart!=="mon" && s.weekStart!=="sun") s.weekStart = def.weekStart;
  const th = Array.isArray(s.thresholds) ? s.thresholds.map(Number).filter(x=>isFinite(x)&&x>0&&x<=100) : [];
  s.thresholds = [...new Set(th)].sort((a,b)=>a-b);
  if(!s.thresholds.length) s.thresholds = def.thresholds.slice();
  if(s.periodMode!=="month" && s.periodMode!=="rolling") s.periodMode = def.periodMode;
  /* 周期上限放宽到 PERIOD_RANGE_MAX —— config set period <起> <止> / periodend 可以设半年、一年为一期,
     旧上限 90 会让这种周期"存得住、重启回落成 15 天"。 */
  if(!(Number.isInteger(s.lengthDays) && s.lengthDays>=PERIOD_DAYS_MIN && s.lengthDays<=PERIOD_RANGE_MAX)) s.lengthDays = def.lengthDays;
  if(!isYMDish(s.anchor)) s.anchor = null;
  if(!isYMDish(s.epoch))  s.epoch  = null;
  if(!(typeof s.consumeShare==="number" && isFinite(s.consumeShare) && s.consumeShare>=0.5 && s.consumeShare<=1)) s.consumeShare = def.consumeShare;
  if(!(typeof s.rateMoney==="number" && isFinite(s.rateMoney) && s.rateMoney>=0 && s.rateMoney<=1)) s.rateMoney = def.rateMoney;
  if(!(typeof s.rateIndex==="number" && isFinite(s.rateIndex) && s.rateIndex>=0 && s.rateIndex<=1)) s.rateIndex = def.rateIndex;
  const pb = {};
  if(s.periodBudget && typeof s.periodBudget==="object"){
    for(const k in s.periodBudget){
      const v = Number(s.periodBudget[k]);
      if(/^\d{4}-\d{2}-\d{2}$/.test(k) && isFinite(v) && v>0 && r2(v)>0) pb[k] = r2(v);
    }
  }
  s.periodBudget = pb;
  /* 类别余额: 只保留"类别名非空且 ≤ CAT_NAME_MAX + 金额 r2 后仍 >0"的项。
     手改坏的/旧备份里的 0、负数、字符串金额一律丢弃 —— 否则"已配置合计"会被 NaN 污染。 */
  const cb = {};
  if(s.categoryBudget && typeof s.categoryBudget==="object" && !Array.isArray(s.categoryBudget)){
    for(const k in s.categoryBudget){
      const nm = String(k).trim().slice(0, CAT_NAME_MAX);
      const v = Number(s.categoryBudget[k]);
      if(nm && isFinite(v) && v>0 && r2(v)>0) cb[nm] = r2(v);
    }
  }
  s.categoryBudget = cb;
  /* 静默开关: {类别:true} = 该类别不再产生超额警告。
     只保留"值 truthy 且类别仍在 categoryBudget 里"的项 —— 取消分配后残留的静默标记不能活下去
     (否则下次重新配置该类别会莫名其妙不报警)。类别名与 categoryBudget 同一套 trim/截断规则。 */
  const cm = {};
  if(s.categoryMute && typeof s.categoryMute==="object" && !Array.isArray(s.categoryMute)){
    for(const k in s.categoryMute){
      if(!s.categoryMute[k]) continue;
      const nm = String(k).trim().slice(0, CAT_NAME_MAX);
      if(nm && Object.prototype.hasOwnProperty.call(cb, nm)) cm[nm] = true;
    }
  }
  s.categoryMute = cm;
  if(!(typeof s.dailyBudget==="number" && isFinite(s.dailyBudget) && s.dailyBudget>0 && r2(s.dailyBudget)>0)) s.dailyBudget = null;
  /* 默认钱包: 只接受正整数 id; 指向不存在的钱包时由 ensureWallets 回落到第一个钱包 */
  if(!(typeof s.walletDefault==="number" && isFinite(s.walletDefault) && s.walletDefault>0)) s.walletDefault = null;
  if(s.geoMode!=="auto" && s.geoMode!=="manual") s.geoMode = def.geoMode;
  /* P1 B-12: 与 config set geokey 共用 normalizeGeoKey() 唯一入口 ——
     以前写入只做 slice(0,128), 重启加载会额外清占位符/提示文案/空白, 出现"本次生效、重启失效"。 */
  s.geoKey = normalizeGeoKey(s.geoKey);
  return s;
}
function isYMDish(v){ return typeof v==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v); }
/* 宽松解析日期(兼容 2027/8/5、2027年8月5日、时间戳等), 返回 'YYYY-MM-DD' 或 null */
function repairDate(v){
  if(v instanceof Date && !isNaN(v)) return fmtY(v);
  if(typeof v==="number" && isFinite(v)){ const d = new Date(v); if(!isNaN(d)) return fmtY(d); }
  const t = normDateText(v, "date");
  return (t.ok && t.value) ? t.value : null;
}
/* --- 记录归一化: 应投额按当前比例重算, 已投金额(含旧版 mmPaid/idxPaid 布尔字段)转成金额制 ---
   关键: 导入备份(restoreFromText)必须和加载 localStorage 走同一套规则, 否则同一份旧文件
   经"导入"和经"浏览器存储"会得到不同结果(旧版已投状态会丢)。无法修复的记录(金额/日期非法)丢弃。
   分摊成本(amort): 备份里 amount 存的仍是**每天**金额(与普通记录同义), 这里只补 amortDays/amortTotal;
   天数非法(缺失/≤1/超上限)时按普通记录处理 → 老备份与手改坏的备份都不会变形。 */
function normalizeRecords(raw){
  const out = [], usedIds = new Set();
  let dropped = 0;
  for(const src of (Array.isArray(raw) ? raw : [])){
    if(!src || typeof src!=="object"){ dropped++; continue; }
    const amount = r2(Number(src.amount));
    const date = repairDate(src.date);
    if(!isFinite(amount) || amount<=0 || !date){ dropped++; continue; }
    let id = (typeof src.id==="number" && isFinite(src.id) && src.id>0) ? Math.round(src.id) : 0;
    while(!id || usedIds.has(id)) id = (id ? id+1 : 1);   // id 缺失/重复时顺延, 保证唯一
    usedIds.add(id);
    const oldMm = Number(src.mm)||0, oldIdx = Number(src.idx)||0;   // 重算前的应投(旧口径)
    const mInv0 = (typeof src.moneyInv==="number" && isFinite(src.moneyInv)) ? src.moneyInv : (src.mmPaid ? oldMm : 0);
    const iInv0 = (typeof src.indexInv==="number" && isFinite(src.indexInv)) ? src.indexInv : (src.idxPaid ? oldIdx : 0);
    // 分摊天数: 只接受 [AMORT_MIN_DAYS, AMORT_MAX_DAYS] 的整数, 其余一律当普通消费(1 天)
    const daysRaw = Math.round(Number(src.amortDays));
    const days = (isFinite(daysRaw) && daysRaw>=AMORT_MIN_DAYS && daysRaw<=AMORT_MAX_DAYS) ? daysRaw : 1;
    // 总价: 优先取备份里的 amortTotal, 缺失时按"每天 × 天数"补回(老数据/手改的备份都能自洽)
    const totalRaw = Number(src.amortTotal);
    const total = (isFinite(totalRaw) && totalRaw>0) ? r2(totalRaw) : (days>1 ? r2(amount*days) : amount);
    const inv = investOf(total);        // 投资只按总价记一次(不分摊; days=1 时 total 就是 amount)
    const cat = String(src.category==null ? "" : src.category).trim() || "其他";
    const note = src.note==null ? "" : String(src.note).replace(/[\u0000-\u001f\u007f]/g," ");   // P2 B-19: 与 place 同一清洗纪律(只去控制字符, 不改变可见内容)
    const place = normalizePlace(src.place);   // 旧备份没有该字段 → 空串, 零迁移
    const created = repairDate(src.created) || date;
    // 付款钱包: 只认正整数 id; 指向的钱包不存在时由 ensureWallets 归 0(未指定), 旧备份没有该字段 → 0
    const walletId = (typeof src.wallet==="number" && isFinite(src.wallet) && src.wallet>0) ? Math.round(src.wallet) : 0;
    // 旧数据里已标记"已投足"的, 重算后要吸附到新的应投额, 避免因精度变化退回"部分/未投"
    const wasFullM = oldMm>0 && mInv0 >= oldMm - 0.005;
    const wasFullI = oldIdx>0 && iInv0 >= oldIdx - 0.005;
    const cl = (x, cap)=> r6(Math.max(0, Math.min(cap, isFinite(x) ? x : 0)));
    out.push({ id, amount, category:cat, note, place, date, created,
               wallet:walletId,
               amortDays:days, amortTotal:total,
               mm:inv.mm, idx:inv.idx,
               moneyInv: wasFullM ? inv.mm : cl(mInv0, inv.mm),
               indexInv: wasFullI ? inv.idx : cl(iInv0, inv.idx) });
  }
  return { records: out, dropped };
}
/* --- 钱包归一化: 加载 localStorage 与导入备份共用(A8/F7) ---
   钱包: id 必须是正整数(重复/缺失时顺延), 名称去首尾空白/控制字符后非空且 ≤ WALLET_NAME_MAX,
         **同名只留第一个**(命令行用 `$钱包名` 指定, 重名会让"付的是哪个"有歧义); 不合法的钱包整体丢弃并计数。
   流水: 只保留"钱包存在 + 金额 r2 后 ≠ 0"的项; 日期非法回落到创建日/今天。 */
function cleanWalletName(v){
  const s = String(v==null?"":v).replace(/[\u0000-\u001f\u007f]/g," ").trim();
  if(!s || s.length > WALLET_NAME_MAX) return "";
  return s;
}
function normalizeWallets(rawWallets, rawOps){
  const wallets = [], wops = [], usedIds = new Set(), names = new Set();
  let dropped = 0;
  for(const src of (Array.isArray(rawWallets) ? rawWallets : [])){
    if(!src || typeof src!=="object"){ dropped++; continue; }
    const name = cleanWalletName(src.name);
    if(!name || names.has(name)){ dropped++; continue; }
    let id = (typeof src.id==="number" && isFinite(src.id) && src.id>0) ? Math.round(src.id) : 0;
    while(!id || usedIds.has(id)) id = (id ? id+1 : 1);
    usedIds.add(id); names.add(name);
    wallets.push({ id, name });
  }
  for(const o of (Array.isArray(rawOps) ? rawOps : [])){
    if(!o || typeof o!=="object"){ dropped++; continue; }
    const v = r2(Number(o.amount));
    if(!usedIds.has(o.wallet) || !isFinite(v) || v===0){ dropped++; continue; }
    const op = { wallet:o.wallet, amount:v,
                 date: repairDate(o.date) || repairDate(o.created) || todayYMD(),
                 note: o.note==null ? "" : String(o.note).replace(/[\u0000-\u001f\u007f]/g," "),
                 created: repairDate(o.created) || todayYMD() };
    /* 成对转账标记: 只认短 ASCII id; 缺失/非法时降级成普通流水(旧备份与本字段无关) */
    if(typeof o.xid==="string" && /^[A-Za-z0-9_-]{1,64}$/.test(o.xid)) op.xid = o.xid;
    wops.push(op);
  }
  return { wallets, wops, dropped };
}
/* 钱包不变量的唯一修复点(加载 / 导入 / undo·redo 恢复后都经过这里或等价路径):
     ① 至少有一个钱包(没有就建「默认钱包」, 旧账本零迁移);
     ② 默认钱包 id 必须指向真实存在的钱包, 否则回落到第一个;
     ③ 记录上的 wallet 只能是 0(未指定) 或真实存在的钱包 id。 */
function ensureWallets(){
  if(!Array.isArray(state.wallets)) state.wallets = [];
  if(!Array.isArray(state.wops)) state.wops = [];
  if(!state.wallets.length) state.wallets.push({ id:1, name:DEFAULT_WALLET_NAME });
  const ids = new Set(state.wallets.map(w=>w.id));
  if(!ids.has(state.settings.walletDefault)) state.settings.walletDefault = state.wallets[0].id;
  for(const r of state.records) if(!ids.has(r.wallet)) r.wallet = 0;
}
function save(){
  let ok = true;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){
    // 隐私模式/禁用存储/某些 data: 打开方式下 setItem 会抛错; 不能让保存失败把整个应用打挂
    ok = false;
    /* P2 B-18: 失败不再"只提示一次后长期静默" —— 控制台每次留痕, 终端在状态翻转时提示 */
    try{ console.warn("[save] localStorage 写入失败: "+(e&&e.message||e)); }catch(_e){}
    const wasFailed = !!save.failed;
    save.failed = true;
    if(!wasFailed && typeof line==="function"){
      line([{t:"⚠ 浏览器不允许写入本地存储(localStorage)，本次数据仅存在于内存中。请用 [备份 .json] 保存。", c:COLOR.red}]);
    }
  }
  if(ok && save.failed){
    save.failed = false;
    if(typeof line==="function") line([{t:"✓ 本地存储写入已恢复。", c:COLOR.green}]);
  }
  scheduleFileWrite();
  return ok;
}

/* ======================= 撤销 / 重做 (undo / redo) ======================= */
const HISTORY_MAX = 200;
let undoStack = [], redoStack = [];
function snapshotState(){ return JSON.stringify(state); }
/* ============ 统一提交点 commit() (H4) ============
   背景(H4/F10): "改数据 → save() → refreshHeader()" 原先散落在 20+ 个命令/UI 处理函数里
   (save 25 处、refreshHeader 23 处), 漏写一处就会出现"改了数据但界面没刷新"。
   收口后:
     · 命令函数只改 state, 不再自己落盘/刷新;
     · runCommand 出口统一调用 commitIfDirty(): 数据确实变了才 save() + refreshAll();
     · 非命令入口(list 行按钮 / 全额投资 / 导入备份 / undo·redo)在各自出口调用 commit。
   pendingCommit 由 mutate() 在"快照确实变化"时置位 —— 只读命令(list/summary/help…)
   不会白写 localStorage、也不会白刷顶栏, 与收口前的行为一致。 */
let pendingCommit = false;
function refreshAll(){
  refreshHeader();       // 顶栏统计 + 理财条(renderInvestBar 在 refreshHeader 末尾统一调用)
  refreshHistoryUI();    // 撤销/重做按钮可用态
  refreshCatlist();      // 类别下拉: 单一真相来源 knownCategories()(含记录里的自定义类别)
  refreshGeoUI();        // 左上角 badge 随 geoMode / Key 状态同步(配置入口在设置页卡片)
  refreshWalletSelects();   // 「记一笔」三个面板的支付钱包下拉
  if(currentPage==="wallet") renderWalletPage();   // 钱包页的数据视图跟着提交点刷新
}
function commit(){
  if(!state) return;     // boot 之前(loadState)还没有完整 state, 不落盘
  const ok = save();     // P2 B-18: commit 感知持久化成败(save 内部负责提示/留痕)
  refreshAll();
  pendingCommit = false;
  return ok;
}
function commitIfDirty(){ if(pendingCommit) commit(); }
/* 包住一次可能修改数据的操作: 若数据确实变了, 把"改前"快照压入撤销栈, 并交给出口 commit */
function mutate(fn){
  const before = snapshotState();
  const r = fn();
  if(snapshotState() !== before){
    undoStack.push(before);
    if(undoStack.length > HISTORY_MAX) undoStack.shift();
    redoStack.length = 0;
    refreshHistoryUI();
    pendingCommit = true;      // 有真实改动 → 由出口统一落盘 + 刷新(H4)
  }
  return r;
}
function applyState(json){
  state = JSON.parse(json);
  commit();                    // 撤销/重做也是"改数据", 走同一个提交点
}
function undo(){
  if(!undoStack.length){ line([{t:"没有可撤销的操作。", c:COLOR.yellow}]); return; }
  const cur = snapshotState();
  const prev = undoStack.pop();
  redoStack.push(cur);
  applyState(prev);
  line([{t:"↩ 已撤销 (可重做 "+redoStack.length+" 步)", c:COLOR.yellow}]);
  scrollBottom();
}
function redo(){
  if(!redoStack.length){ line([{t:"没有可重做的操作。", c:COLOR.yellow}]); return; }
  const cur = snapshotState();
  const next = redoStack.pop();
  undoStack.push(cur);
  applyState(next);
  line([{t:"↪ 已重做 (可撤销 "+undoStack.length+" 步)", c:COLOR.green}]);
  scrollBottom();
}
function refreshHistoryUI(){
  const u = document.getElementById("btnUndo"); if(u) u.disabled = !undoStack.length;
  const r = document.getElementById("btnRedo"); if(r) r.disabled = !redoStack.length;
}

/* ============ 本地文件持久化(防刷新/清缓存丢失) ============
   方式: 导出/导入 .json (全浏览器可用) + 存到本地目录自动写盘
   (File System Access API, 需 Chrome/Edge; 用 IndexedDB 记住所选目录) */
let dirHandle = null;               // 本地目录句柄(内存, 本次会话)
let fileWritePending = false;       // 是否正在写盘
let fileWriteDirty = false;         // 写盘期间是否又发生了改动(写完补写一次)
let autosaveOn = false;
function supportsFSA(){ return typeof window!=="undefined" && ("showDirectoryPicker" in window); }
function fsLog(msg, color){ if(typeof line==="function") line([{t:msg, c:color||COLOR.cyan}]); }

function serializeState(){
  return JSON.stringify({ app:"budget_term", version:2,
    savedAt: todayYMD()+" "+new Date().toTimeString().slice(0,8),
    settings: state.settings, seq: state.seq, records: state.records,
    wallets: state.wallets, wops: state.wops }, null, 2);   // 钱包随备份走(格式仍是 version:2 的增量字段)
}
function restoreFromText(text){
  const data = JSON.parse(text);
  if(!data || typeof data!=="object" || !Array.isArray(data.records)) throw new Error("不是有效的备份文件");
  if(data.app && data.app!=="budget_term") throw new Error("备份文件不匹配本应用");
  let dropped = 0;
  const before = snapshotState();     // P2 B-16: 用于判断这次导入是否真的产生了变化
  mutate(()=>{
    // 备份里的设置整体生效(备份中缺失的项回落默认值, 不再残留上一份数据里的旧设置),
    // 记录走与 loadState 相同的归一化: 旧版布尔已投字段会转成金额, 脏记录被丢弃。
    state.settings = normalizeSettings(data.settings);
    const norm     = normalizeRecords(data.records);
    state.records  = norm.records;
    dropped        = norm.dropped;
    state.seq      = Math.max(
      (typeof data.seq==="number" && isFinite(data.seq)) ? Math.round(data.seq) : 0,
      state.records.reduce((m,r)=>Math.max(m,r.id), 0));   // 防止后续新增记录与备份里的 id 撞号
    /* 钱包: 与 loadState 同一套归一化; 备份里没有钱包字段(旧版本导出) → 回到「默认钱包」 */
    const wn = normalizeWallets(data.wallets, data.wops);
    state.wallets = wn.wallets;
    state.wops = wn.wops;
    dropped       += wn.dropped;
    ensureWallets();
    ensureEpoch();
  });
  commit();     // 导入也是一个提交点: 落盘 + 全量刷新(含类别下拉, H4)
  /* P2 B-16: 重复导入同一份备份时 mutate 不压栈(内容没变), 此时提示"可 undo"会把人引去
     回退更早的操作 —— 现在按"是否真的变化"分两种文案。 */
  const unchanged = snapshotState() === before;
  fsLog(unchanged
    ? "✓ 已从备份恢复 "+state.records.length+" 条记录、"+state.wallets.length+" 个钱包、预算与设置已更新 (内容与当前账本一致, 没有产生变化)。"
    : "✓ 已从备份恢复 "+state.records.length+" 条记录、"+state.wallets.length+" 个钱包、预算与设置已更新 (可 undo 撤销)。", COLOR.green);
  if(dropped) fsLog("⚠ 其中 "+dropped+" 条记录 / 钱包 / 流水金额或日期无效, 已跳过(其余正常导入)。", COLOR.yellow);
}
function doBackupDownload(){
  const blob = new Blob([serializeState()], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="budget_backup_"+todayYMD()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 400);
  fsLog("✓ 已下载完整备份 .json (含所有记录/设置)。", COLOR.green);
}
/* --- 存到本地目录: 选择目录并立即写入 budget_term_backup.json, 之后每改一次自动写盘 --- */
async function writeToFolder(){
  const dir = dirHandle || await window.showDirectoryPicker({mode:"readwrite"});
  dirHandle = dir;
  // 申请持久授权, 便于以后每次点开自动重连
  try{ await dir.requestPermission({mode:"readwrite"}); }catch(e){}
  const fh = await dir.getFileHandle("budget_term_backup.json", {create:true});
  const w = await fh.createWritable();
  await w.write(serializeState());
  await w.close();
  await persistDirHandle(dir);
  autosaveOn = true;
  refreshAutosaveUI();
}
async function doAutosaveToggle(){
  if(autosaveOn){ autosaveOn=false; refreshAutosaveUI(); fsLog("已关闭本地自动写盘(localStorage 仍在保存)。",COLOR.yellow); return; }
  try{
    if(!supportsFSA()){ fsLog("当前浏览器不支持“存到本地目录”(请改用 Chrome/Edge), 可用 [备份 .json] 手动导出。",COLOR.red); return; }
    fsLog("请在弹出框中选择一个文件夹存放备份(budget_term_backup.json)…",COLOR.cyan);
    await writeToFolder();
    fsLog("✓ 已存到所选文件夹。此后每次改动都会自动写盘；刷新页面点一次 [存到本地目录] 重新连接即可(或浏览器仍授权时会自动重连)。",COLOR.green);
  }catch(e){
    if(e && (e.name==="AbortError"||/abort/i.test(String(e.message)))){ fsLog("已取消选择文件夹。",COLOR.gray); }
    else { fsLog("存到本地目录失败: "+(e&&e.message||e),COLOR.red); }
  }
}
async function scheduleFileWrite(){
  if(!autosaveOn) return;
  if(fileWritePending){ fileWriteDirty = true; return; }   // 正在写盘时又有改动: 标记, 写完后再补一次(以前会直接丢掉这次改动)
  fileWritePending = true;
  try{
    do{ fileWriteDirty = false; await writeToFolder(); }while(fileWriteDirty);
  }
  catch(e){
    /* P2 B-18: 自动写盘失败不再被吞 —— 留痕、回落 autosaveOn、UI 同步; localStorage 仍兜底 */
    autosaveOn = false;
    refreshAutosaveUI();
    try{ console.warn("[autosave] 本地写盘失败, 自动写盘已暂停(localStorage 仍在保存): "+(e&&e.message||e)); }catch(_e){}
    fsLog("⚠ 自动写盘失败, 已暂停(localStorage 仍在保存): "+(e&&e.message||e), COLOR.yellow);
  }
  finally{ fileWritePending = false; }
}
function refreshAutosaveUI(){
  const b = document.getElementById("btnAutosave");
  if(b) b.textContent = "存到本地目录: "+(autosaveOn?"开":"关");
  if(typeof renderInvestBar==="function") renderInvestBar();
}
function backupFolderName(){ try{ return dirHandle&&dirHandle.name?dirHandle.name:"本地文件夹"; }catch(e){ return "本地文件夹"; } }
/* --- IndexedDB: 记住所选目录句柄, 便于刷新后重连 --- */
function idbOpen(){
  return new Promise((res,rej)=>{
    if(typeof indexedDB==="undefined") return rej(new Error("no indexedDB"));
    const rq = indexedDB.open("budget_term_fs",1);
    rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore("kv"); }catch(e){} };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error||new Error("idb open"));
  });
}
async function persistDirHandle(h){
  try{ const db=await idbOpen();
    return new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(h,"dir"); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  }catch(e){ try{ console.warn("[autosave] 记住目录句柄失败(IndexedDB), 刷新后需手动重连: "+(e&&e.message||e)); }catch(_e){} return Promise.resolve(); }
}
async function restoreLocalHandleQuiet(){
  if(!supportsFSA()) return;
  try{
    const db=await idbOpen();
    const h = await new Promise((res)=>{ const tx=db.transaction("kv","readonly"); const g=tx.objectStore("kv").get("dir"); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null); });
    if(!h) return;
    let perm = "prompt";
    try{ perm = await h.queryPermission({mode:"readwrite"}); }catch(e){}
    if(perm!=="granted"){ dirHandle=null; return; }   // 未授权: 交给首次交互时自动申请
    dirHandle = h;
    try{ autosaveOn=true; await writeToFolder(); }catch(e){ autosaveOn=false; try{ console.warn("[autosave] 自动重连后写盘失败: "+(e&&e.message||e)); }catch(_e){} }
    refreshAutosaveUI();
    fsLog("已自动重连本地文件夹 “"+(h.name||"")+"”，改动将自动写盘。",COLOR.green);
  }catch(e){ try{ console.warn("[autosave] 自动重连本地文件夹失败: "+(e&&e.message||e)); }catch(_e){} }
}
/* 每次打开: 若上次授权因新会话过期, 在第一次用户交互时自动重新申请(无需再点专门按钮) */
let _reconnectArmed=false, _reconnectDone=false;
function armAutoReconnect(){
  if(_reconnectArmed || !supportsFSA()) return;
  _reconnectArmed = true;
  const once = async ()=>{
    if(_reconnectDone) return; _reconnectDone=true;
    try{
      const db = await idbOpen();
      const h = await new Promise((res)=>{ const tx=db.transaction("kv","readonly"); const g=tx.objectStore("kv").get("dir"); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null); });
      if(!h) return;
      let perm="prompt";
      try{ perm = await h.queryPermission({mode:"readwrite"}); }catch(e){}
      if(perm!=="granted"){
        try{ perm = await h.requestPermission({mode:"readwrite"}); }catch(e){}
      }
      if(perm!=="granted") return;
      dirHandle = h;
      try{ autosaveOn=true; await writeToFolder(); }catch(e){ autosaveOn=false; try{ console.warn("[autosave] 首次交互重连后写盘失败: "+(e&&e.message||e)); }catch(_e){} }
      refreshAutosaveUI();
      fsLog("已重新连接本地文件夹 “"+(h.name||"")+"”，自动写盘已开启。",COLOR.green);
    }catch(e){ try{ console.warn("[autosave] 首次交互重连失败: "+(e&&e.message||e)); }catch(_e){} }
  };
  const guard = ()=>{ once(); window.removeEventListener("pointerdown",guard); window.removeEventListener("keydown",guard); };
  window.addEventListener("pointerdown",guard,{once:false});
  window.addEventListener("keydown",guard,{once:false});
}

/* ----------------------------- date utils ------------------------------- */
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtY(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function mkYMD(y,m,d){ return y+"-"+pad2(m)+"-"+pad2(d); }
function parseYMD(s){ // 'YYYY-MM-DD' -> {y,m,d}
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||""));
  if(!m) return null;
  return { y:+m[1], m:+m[2], d:+m[3] };
}
function todayYMD(){ const n=new Date(); return fmtY(n); }
/* ---- 「手动输日期」弹窗的统一格式解析 -------------------------------------
   目标: 不管用户怎么敲, 一律归一化成与命令 @日期 完全一致的 ISO 写法:
     日期 → YYYY-MM-DD     月份 → YYYY-MM
   宽容接受 2027-8-5 / 2027/8/5 / 2027.8.5 / 20270805 / 2027年8月5日 等写法。
   返回 { ok, value, error }: value 永远是统一格式(空输入返回""), ok=false 时 error 为提示语。 */
function normDateText(raw, kind){          // kind: "date" | "month"
  const out = { ok:true, value:"", error:"" };
  let s = String(raw==null ? "" : raw).trim();
  if(!s) return out;                        // 留空 = 不填该项(由调用方判断是否允许)
  s = s.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))  // 全角数字→半角
       .replace(/[年月]/g, "-").replace(/[日号]/g, "")
       .replace(/[／\/．.、]/g, "-")
       .replace(/[－—–−‐]/g, "-")            // 全角/长破折/减号 都当作 -
       .replace(/\s+/g, "")
       .replace(/-+/g, "-").replace(/^-+|-+$/g, "");
  const seg = s.split("-").filter(x=>x!=="");
  let y=null, m=null, d=null;
  if(seg.length===1 && /^\d{8}$/.test(seg[0])){       // 20270818
    y=+seg[0].slice(0,4); m=+seg[0].slice(4,6); d=+seg[0].slice(6,8);
  } else if(seg.length===1 && /^\d{6}$/.test(seg[0])){ // 202708
    y=+seg[0].slice(0,4); m=+seg[0].slice(4,6);
  } else if(seg.length>=2){
    y = /^\d{4}$/.test(seg[0]) ? +seg[0] : NaN;        // 年份必须 4 位
    m = +seg[1];
    if(seg[2]!==undefined) d = +seg[2];
  }
  if(!(y>=1000 && y<=9999)){
    out.ok=false;
    out.error = (kind==="date") ? "请按 YYYY-MM-DD 填写完整日期，如 2027-08-18。"
                                : "请按 YYYY-MM 填写月份，如 2027-08。";
    return out;
  }
  if(!(m>=1 && m<=12)){ out.ok=false; out.error = "月份要在 01~12 之间。"; return out; }
  if(kind==="month"){ out.value = y+"-"+pad2(m); return out; }
  if(d===null){ out.ok=false; out.error = "日期要写到「日」，如 2027-08-18；若只想看整月，请填上面的「月份」。"; return out; }
  if(!(d>=1 && d<=lastDay(y,m))){ out.ok=false; out.error = "该月没有 "+d+" 号（"+y+"-"+pad2(m)+" 只有 "+lastDay(y,m)+" 天）。"; return out; }
  out.value = mkYMD(y,m,d);
  return out;
}
function addMonths(y,m0,delta){ // m0: 1-based month index
  const total = (m0-1)+delta;          // to 0-based
  const yy = y + Math.floor(total/12);
  const mm = ((total%12)+12)%12;       // 0-based
  return { y:yy, m:mm+1 };
}
function lastDay(y,m){ return new Date(y,m,0).getDate(); } // m 1-based, day0 = prev month last day

/* Period (记账周期) 边界：
   periodMode = "month"   → 按月对齐(monthStart 自定义起始日, 1=自然月)
   periodMode = "rolling" → 固定 lengthDays 天, 从 anchor 日起每 N 天滚动一期 */
function daysBetween(a,b){ // whole days from a to b (both 'YYYY-MM-DD')
  const pa=parseYMD(a), pb=parseYMD(b);
  return Math.round((Date.UTC(pb.y,pb.m-1,pb.d) - Date.UTC(pa.y,pa.m-1,pa.d)) / 86400000);
}
function addDaysYMD(s, delta){
  const p=parseYMD(s);
  const d=new Date(Date.UTC(p.y,p.m-1,p.d)); d.setUTCDate(d.getUTCDate()+delta);
  return mkYMD(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());
}
function periodBounds(dateStr){
  if(state.settings.periodMode !== "rolling") return monthPeriodBounds(dateStr);
  // 兜底: 滚动模式缺锚点时把当次日期落成锚点(保持旧行为 —— 否则历史窗口会各用各的锚点, 网格漂移)
  if(!state.settings.anchor) state.settings.anchor = dateStr;
  const L = state.settings.lengthDays || 15;
  const start = periodStartOf(dateStr);
  const end   = addDaysYMD(start, L-1);
  return { start, end, label: start+" ~ "+end, mode:"rolling", len:L };
}
/* 周期网格的**纯计算**入口: 包含 dateStr 的那一期起点。
   k 允许为负: 锚点之前的日期也落在同一条 (A + n×L) 网格上 —— 旧实现把 A 直接钳到 dateStr,
   使"锚点之前"的周期起点跟着查询日期漂移, 发放链(periodStartsUpTo)会与真实周期起点错位。
   注意: 这里**不写 settings**(预览/计划计算不允许产生副作用); 需要落锚点的调用方走 periodBounds()。 */
function periodStartOf(dateStr){
  if(state.settings.periodMode !== "rolling") return monthPeriodBounds(dateStr).start;
  const L = state.settings.lengthDays || 15;
  const A = state.settings.anchor || dateStr;
  return addDaysYMD(A, Math.floor(daysBetween(A, dateStr)/L)*L);
}
/* 按月规则的本期边界(与 periodMode 无关, 只看 monthStart)。
    「配置周期」弹窗在按月模式下要预览起止日, 而那时 periodMode 可能还是 rolling ——
   不能借 periodBounds() 顺手改设置, 也不能再抄一份月边界算法。 */
function monthPeriodBounds(dateStr){
  const P = parseYMD(dateStr);
  const ms = state.settings.monthStart;          // 1..28
  let startY, startM;
  if(P.d >= ms){ startY = P.y; startM = P.m; }
  else {
    const pr = addMonths(P.y, P.m, -1); startY = pr.y; startM = pr.m;
  }
  // endExclusive = start month + 1 on day ms  => inclusive end is (that day - 1)
  const nx = addMonths(startY, startM, 1);
  const sDate = mkYMD(startY,startM,ms);
  let eDay = ms - 1;
  let eY = nx.y, eM = nx.m;
  if(eDay < 1){ const pr = addMonths(nx.y,nx.m,-1); eY=pr.y; eM=pr.m; eDay=lastDay(eY,eM); }
  const eDate = mkYMD(eY,eM,eDay);
  return { start:sDate, end:eDate, label: sDate+" ~ "+eDate, mode:"month" };
}
function currentPeriod(){ return periodBounds(todayYMD()); }

/* 自然月边界：始终从当月 1 日到当月最后一天(与记账周期无关) */
function calendarMonthBounds(dateStr){
  const P = parseYMD(dateStr) || parseYMD(todayYMD());
  const start = mkYMD(P.y, P.m, 1);
  const end   = mkYMD(P.y, P.m, lastDay(P.y, P.m));
  return { start, end, label: start+" ~ "+end };
}

function weekBounds(dateStr){
  const P = parseYMD(dateStr);
  const js = new Date(P.y,P.m-1,P.d).getDay(); // 0=Sun..6=Sat
  const ws = state.settings.weekStart; // 'mon'|'sun'
  let startD;
  if(ws === "sun"){ startD = js; }
  else { startD = (js===0)?6:(js-1); } // Monday start
  const st = new Date(P.y,P.m-1,P.d-startD);
  const en = new Date(P.y,P.m-1,P.d-startD+6);
  return { start:fmtY(st), end:fmtY(en) };
}
/* 注: 按日期统计/筛选统一收口到
   recInWindow()/recAmountInRange() 之后它就没有调用点了 —— 删掉, 避免"死代码漂移"(HANDOVER F12)。
   判断"某天是否落在区间内"请直接用 YYYY-MM-DD 字符串比较(ISO 格式可直接比大小)。 */
/* P1 B-15: 自定义类别按「已知自定义类别」的排序索引取独立色板 —— 同一类别跨会话稳定,
   排序相邻的类别必然异色(饼图/图例不会再出现相邻同色无分界); 尚未记账的未知类别仍回落兜底色。 */
function customCatColor(cat){
  const custom = knownCategories().filter(c=>!PREDEFINED.has(c)).sort();
  const i = custom.indexOf(cat);
  return i<0 ? COLOR.catFallback : CUSTOM_CAT_PALETTE[i % CUSTOM_CAT_PALETTE.length];
}
function catColor(cat){ return PREDEFINED.get(cat) || customCatColor(cat); }

/* --------------------------- investment calc ---------------------------- */
/* 分摊成本记录的读取入口(旧记录没有这两个字段 → 相当于"不分摊"):
     recDays(r)  = 分摊天数(普通消费为 1)
     recTotal(r) = 该笔**付出的总价**(普通消费即 amount)
   应投一律按**总价**算 —— "投资只记录总数, 不分摊"(见文件头 AMORT_* 注释)。 */
function recDays(r){ const d = Number(r && r.amortDays); return (isFinite(d) && d>1) ? d : 1; }
function recTotal(r){
  const t = Number(r && r.amortTotal);
  if(isFinite(t) && t>0) return t;
  return (Number(r && r.amount)||0) * recDays(r);
}
function recAmortized(r){ return recDays(r) > 1; }
/* 分摊成本的**生效窗口**: 从记账日(date)起连续 recDays(r) 天, 闭区间。
    普通消费是"一天"(date~date), 所以下面所有窗口函数对旧记录都退化成原来的行为。
    以前只有 r.date 被用来筛选/求和 —— 于是一笔 365 天的分摊只在**记账那一天**算一次钱,
    其余 364 天在每日预算/周期预算/消费列表/总结里全部消失(严重缺陷, 现已按天窗口计算)。 */
function recWindow(r){
  const start = (r && typeof r.date==="string") ? r.date : todayYMD();
  return { start, end: addDaysYMD(start, recDays(r)-1) };
}
/* 该记录的分摊窗口与 [start,end] 的交集天数(不为普通消费/不相交时返回 0) */
function recDaysInRange(r, start, end){
  const w = recWindow(r);
  const s = w.start > start ? w.start : start;      // YYYY-MM-DD 可直接比较大小
  const e = w.end   < end   ? w.end   : end;
  return (s > e) ? 0 : (daysBetween(s,e) + 1);
}
/* 窗口筛选的唯一入口: 只按 date 命中会把分摊成本漏掉, 一律用"窗口有交集" */
function recInWindow(r, start, end){ return recDaysInRange(r, start, end) > 0; }
/* 某条记录在 [start,end] 里的消费额(消费口径: 分摊按天计入, 普通消费就是 amount) */
function recAmountInRange(r, start, end){
  const n = recDaysInRange(r, start, end);
  return n > 0 ? r2(n * (Number(r.amount)||0)) : 0;
}
/* 到指定日为止已实际发生的消费额: 分摊成本只累计到该日 ——
    封顶是为了不让未来的分摊天数提前占掉可用余额
    (否则记一笔年付房租, 可用余额立刻变负; 未来那些天尚未来到, 不该算已消费)。
    dayStr 省略 = 今天; 传历史日给"过去某期"的余额快照用。 */
function recAmountUpTo(r, dayStr){
  return recAmountInRange(r, recWindow(r).start, dayStr || todayYMD());
}
function recAmountUpToToday(r){
  return recAmountUpTo(r, todayYMD());
}
/* 一组记录在窗口内的消费合计 / 其中分摊部分(列表与总结共用, 避免两处口径漂移) */
function sumRange(rows, start, end){
  let total = 0, amort = 0;
  for(const r of rows){
    const a = recAmountInRange(r, start, end);
    total += a;
    if(recAmortized(r)) amort += a;
  }
  return { total:r2(total), amort:r2(amort) };
}
/* 核心换算: 一笔消费 E 对应占用总花费 E/N (N=消费占比, 默认0.85, 可调);
   应投 = 占用 × (1-N), 其中货币/指数按 13:2 拆分
   注意: 调用方传的必须是**该笔付出的总金额**(分摊成本传总价, 普通消费传 amount) —— 投资不分摊。 */
function investOf(amount){
  const base = amount / consumeShare();             // 占用总花费的等价口径
  const sp = rateSplit();
  return { base: base, mm: r6(base*sp.mm), idx: r6(base*sp.idx) };
}
/* 比例变化后: 按新比例重算所有记录的应投额(已投金额不会超过新的应投额) */
function recomputeAllInvest(){
  for(const r of state.records){
    const inv = investOf(recTotal(r));     // 分摊成本按总价重算应投(与录入时同一口径)
    r.mm = inv.mm; r.idx = inv.idx;
    r.moneyInv = Math.min(r.moneyInv||0, r.mm);
    r.indexInv = Math.min(r.indexInv||0, r.idx);
  }
}
function r2(x){ return Math.round(x*100)/100; }
function money(x){
  const neg = x<0; const s = Math.abs(x).toFixed(2);
  return (neg?"-":"")+s;
}

/* ===================== 投资池：应投货币 / 应投指数 ===================== */
/* 未投资部分累加(跨期累计): 每笔记录应投 mm/idx, 已投 moneyInv/indexInv(金额制) */
function moneyPending(){ return r6(state.records.reduce((s,r)=>s+Math.max(0,(r.mm||0)-(r.moneyInv||0)),0)); }
function indexPending(){ return r6(state.records.reduce((s,r)=>s+Math.max(0,(r.idx||0)-(r.indexInv||0)),0)); }
function moneyInvestedTotal(){ return r6(state.records.reduce((s,r)=>s+(r.moneyInv||0),0)); }
function indexInvestedTotal(){ return r6(state.records.reduce((s,r)=>s+(r.indexInv||0),0)); }
/* 应投为 0 视为"无需求"(满足); 否则按高精度比较是否已投足。
   注意: 不能用 0.005 这类粗容差 —— 那会把 <0.005 的小额应投直接判成"已投足"。 */
function recFullyMoney(r){ const need=r.mm||0; return need<=INV_EPS || (r.moneyInv||0) >= need - INV_EPS; }
function recFullyIndex(r){ const need=r.idx||0; return need<=INV_EPS || (r.indexInv||0) >= need - INV_EPS; }
function recNoNeed(r){ return (r.mm||0)<=INV_EPS && (r.idx||0)<=INV_EPS; }
function recStatus(r){
  if(recNoNeed(r)) return {t:"无需", c:COLOR.gray};   // 应投恒为 0, 无需投资
  const m = recFullyMoney(r), i = recFullyIndex(r);
  if(m && i) return {t:"已投", c:COLOR.green};
  if(!(r.moneyInv||0) && !(r.indexInv||0)) return {t:"未投", c:COLOR.gray};
  return {t:"部分", c:COLOR.yellow};
}
/* ===================== 窗口统计（消费口径的唯一入口） =====================
   分摊成本让"一条记录"不再等于"一天": 一笔分摊横跨 recDays() 天, 每天都该计入消费。
   下面这四个函数是**所有**按日期统计消费的地方(report 期快照/今日快照/列表/总结/导出)的唯一入口,
   别在任何地方再写一遍 `filter(r=>r.date在区间内).reduce(s+r.amount)` —— 那正是本缺陷的来源
   (分摊只在记账当天算一次, 其余天数在每日/周期/列表/总结里全部消失)。 */
/* 统计窗口(总结/报告/周期快照共用): 行筛选与金额口径都按"分摊窗口与窗口有交集" */
function collectWindow(start,end,category){
  const catFilter = category ? String(category).trim() : null;
  let rows = state.records.filter(r=>recInWindow(r,start,end));
  if(catFilter) rows = rows.filter(r=>r.category===catFilter);
  const sm = sumRange(rows, start, end);
  const byCat = new Map();
  for(const r of rows){ byCat.set(r.category,(byCat.get(r.category)||0)+recAmountInRange(r,start,end)); }
  const inv = investTotalsOf(rows);
  return { rows, count:rows.length,
           total:sm.total, amortTotal:sm.amort,
           mmT:inv.mm, idxT:inv.idx,
           cats:[...byCat.entries()].sort((a,b)=>b[1]-a[1]),
           start, end, days:Math.max(1, daysBetween(start,end)+1), category:catFilter };
}
/* 窗口内"截至今天"已发生的消费(预算对比/日均用)。
   进行中的窗口若直接用 win.total, 会把未来日期的分摊成本提前算进分子,
   而参考额度只按已过天数算 —— 分子分母口径不一致(F13), 预算使用率会虚高。
   已结束的窗口直接用 win.total(与整窗口口径相同, 不变)。 */
function spentUpToToday(win){
  const t = todayYMD();
  if(win.end <= t) return win.total;
  return r2(sumRange(win.rows, win.start, t).total);
}
/* 一组记录的应投合计(总结/导出/周期快照共用, 避免同一份 reduce 抄三遍) */
function investTotalsOf(rows){
  let mm = 0, idx = 0, mmInv = 0, idxInv = 0;
  for(const r of rows){ mm += (r.mm||0); idx += (r.idx||0); mmInv += (r.moneyInv||0); idxInv += (r.indexInv||0); }
  return { mm:r2(mm), idx:r2(idx), mmInv:r2(mmInv), idxInv:r2(idxInv) };
}
/* 把某类阈值额度(lot)按比例分摊到未投记录上(支持部分投入), 返回描述文字 */
function investAmount(kind, amt){ // 按比例把 amt 投给该种未投池; kind 'money'|'index'
  const isM = kind==="money";
  const pend = isM ? moneyPending() : indexPending();
  if(amt == null) amt = isM ? INVEST_MONEY_LOT : INVEST_INDEX_LOT;
  amt = Math.min(amt, pend);
  if(amt <= INV_EPS) return null;
  const lotU = Math.round(amt*INV_UNIT);
  // 收集每条记录的剩余未投额度(1e-6 元为单位, 保证 <0.01 的零头也能被分摊清零)
  const entries=[]; let totU=0;
  for(const r of state.records){
    const should = isM ? (r.mm||0) : (r.idx||0);
    const inv = isM ? (r.moneyInv||0) : (r.indexInv||0);
    const remU = Math.round(Math.max(0, should - inv)*INV_UNIT);
    if(remU>0){ entries.push({r, remU}); totU += remU; }
  }
  if(!totU) return null;
  // 按剩余占比分配(largest remainder)
  const alloc = entries.map(e=>{ const exact = lotU*e.remU/totU; const base=Math.floor(exact); return {e, base, frac: exact-base}; });
  let rem = lotU - alloc.reduce((s,a)=>s+a.base,0);
  alloc.sort((a,b)=>b.frac-a.frac);
  // 单次分配即可分完: sum(remU)==totU>=lotU, 每笔最多补到自己的 remU
  for(const a of alloc){ if(rem<=0)break; const add=Math.min(a.e.remU-a.base, rem); a.base+=add; rem-=add; }
  // 应用
  let applied=0;
  for(const a of alloc){
    if(a.base<=0) continue;
    const need = isM ? (a.e.r.mm||0) : (a.e.r.idx||0);
    const cur  = isM ? (a.e.r.moneyInv||0) : (a.e.r.indexInv||0);
    const nv = r6(Math.min(need, cur + a.base/INV_UNIT));
    if(isM) a.e.r.moneyInv = nv; else a.e.r.indexInv = nv;
    applied++;
  }
  return { amt, applied };
}
/* 全额投资: 把该种整个未投池投掉清零; 仅当池≥该种阈值(货币100/指数20)才允许点亮/执行 */
function investFull(kind){
  const isM = kind==="money";
  const lot = isM ? INVEST_MONEY_LOT : INVEST_INDEX_LOT;
  const pend = isM ? moneyPending() : indexPending();
  if(pend < lot - 0.005) return null;
  return investAmount(kind, pend);
}
/* 预算 / 结转 / 超额 派生指标：
   总预算 B 每周期发放一次; 每笔消费按 E/0.85 记账占用;
   未占用 = 剩余(结转下期), 占用>发放 = 透支(下期扣除)。余额跨期累计。
   支持"当期预算"覆盖: periodBudget[start]=金额 只改某一期。 */
/* 账本起点(第一笔"发放"所在的周期)。必须落在真实周期边界上:
   用户改过周期长度/锚点/月起始日后, 旧 epoch 可能落在周期中间, 这会让
   periodStartsUpTo 的发放链与真实周期起点(以及 periodBudget 的覆盖键)错位 ——
   现象是 `budget set`/弹窗设的"当期预算"不进入"累计可用余额"。 */
function ensureEpoch(){
  const cur = currentPeriod().start;
  const e = state.settings.epoch;
  if(!(typeof e==="string") || !/^\d{4}-\d{2}-\d{2}$/.test(e)){ state.settings.epoch = cur; return; }
  const snap = periodBounds(e).start;      // 映射到"包含该日期的那一期"的起点
  if(snap !== e) state.settings.epoch = snap;
}
function nextPeriodStart(startStr){
  if(state.settings.periodMode === "rolling") return addDaysYMD(startStr, state.settings.lengthDays||15);
  const p = parseYMD(startStr);
  const nx = addMonths(p.y, p.m, 1);
  return mkYMD(nx.y, nx.m, state.settings.monthStart||1);
}
function effectiveBudget(periodLike){
  const key = periodLike && periodLike.start;
  const ov = state.settings.periodBudget || {};
  const v = (key!=null) ? ov[key] : undefined;
  return (typeof v==="number" && v>0) ? v : state.settings.budget;
}
function hasBudgetOverride(periodLike){
  const key = periodLike && periodLike.start;
  const ov = state.settings.periodBudget || {};
  return !!(key!=null && typeof ov[key]==="number");
}
function periodStartsUpTo(endStart){
  ensureEpoch();
  const out=[]; let s=state.settings.epoch; let guard=0;
  while(s <= endStart && guard<5000){ out.push(s); s=nextPeriodStart(s); guard++; }
  if(!out.length) out.push(endStart);
  return out;
}
/* 发放链累计到**指定周期**(默认当前周期): 统计历史窗口时要按那个时点的发放额算,
   不能一律用今天的 —— 否则 `report @2026-09` 的"本期发放"会是现在的周期预算。 */
function grantedTotalAt(startStr){
  ensureEpoch();
  let sum=0;
  for(const s of periodStartsUpTo(startStr)) sum += effectiveBudget({start:s});
  return r2(sum);
}
function grantedTotal(){ return grantedTotalAt(currentPeriod().start); }
/* 累计已发生的占用: 分摊成本按**到指定日为止已过的天数**累计
   (不是把每天金额只在记账当天算一次, 也不是把未来那些天提前算掉)。 */
function totalChargeAt(dayStr){
  return r2(state.records.reduce((s,r)=>s + recAmountUpTo(r, dayStr)/consumeShare(), 0));
}
function totalCharge(){ return totalChargeAt(todayYMD()); }
/* 累计可用余额 = 已发放 − 已占用。默认是"今天"的口径(summary/budget/顶栏);
   传入某个周期(或预算行区间, 带 lastStart)时给的是**该区间末**的历史快照:
   - 发放累计到 min(区间最后一期, 当前周期) —— 未来的周期还没发放;
   - 占用累计到 min(区间末, 今天) —— 未来还没发生。
   两者在当前区间上退化为今天的值。 */
function availableBalance(p){
  const t = todayYMD(), cur = currentPeriod();
  const ref = p || cur;
  const lastStart = ref.lastStart || ref.start;          // 多期区间: 发放要算到最后一期
  const grantTo = (lastStart < cur.start) ? lastStart : cur.start;
  const capDay  = (ref.end   < t)         ? ref.end   : t;
  return r2(grantedTotalAt(grantTo) - totalChargeAt(capDay));
}
function periodDayCount(p){ return daysBetween(p.start, p.end) + 1; }
/* 预算行的首期 = 统计窗口**起点所在**的记账周期。
    口径: summary/report/chart 按查询区间选预算口径,
   于是 `report @2026-09` 标题写着 2026-09, 表里的"本期发放/本期消费/累计余额"
   却全是今天这个周期的数字(用户报的 bug)。 */
function periodOfWindow(win){
  const anchor = (win && typeof win.start==="string") ? win.start : todayYMD();
  /* 滚动周期缺锚点时 periodBounds 会拿传入日期去补锚点 —— 查历史窗口不该顺手改设置, 交给当前周期兜底 */
  if(state.settings.periodMode === "rolling" && !state.settings.anchor) return currentPeriod();
  return periodBounds(anchor);
}
/* 窗口覆盖的记账周期: 首期由窗口起点决定, 之后逐期用 nextPeriodStart **接着上一期往后推**,
   直到盖住窗口终点。自然月 = 一期; 自定义月起日/滚动周期看一个自然月时通常就是两期
   (第一个周期仍按起始日所在周期算, 第二个周期接着第一个算)。 */
function budgetPeriodsOfWindow(win){
  const out = [periodOfWindow(win)];
  let guard = 0;
  while(out[out.length-1].end < win.end && guard < 5000){
    out.push(periodBounds(nextPeriodStart(out[out.length-1].start)));
    guard++;
  }
  return out;
}
/* 预算行快照 = 窗口覆盖的**各期整期合计**(用户口径):
   发放 B = 各期发放之和; 消费/占用/结转取首期起点~末期终点这一整段。
   一期刚好覆盖窗口时(自然月周期看自然月)N=1, 数字与原「本期」口径完全一致。 */
function budgetOfWindow(win){
  const periods = budgetPeriodsOfWindow(win);
  const start = periods[0].start, end = periods[periods.length-1].end;
  let B = 0;
  for(const p of periods) B += effectiveBudget(p);
  B = r2(B);
  const w = collectWindow(start, end);        // 预算行是全局口径, 不跟随类别筛选
  const usedUnits = r2(w.total / consumeShare());
  return { periods, start, end, lastStart: periods[periods.length-1].start, count: periods.length, B,
           days: daysBetween(start, end) + 1,
           rows: w.rows, consumption: w.total, amort: w.amortTotal,
           mm: w.mmT, idx: w.idxT, invest: r2(w.mmT + w.idxT),
           usedUnits, ratio: B>0 ? usedUnits/B : 0 };
}
/* 周期快照(含燃尽预测所需的日进度)。p 省略 = 当前周期(顶栏/budget/导出)。
   行筛选与消费口径都复用 collectWindow: 本期**覆盖到的**记录(分摊窗口与本期有交集)才算一笔,
   它的消费额按"落在本期内的天数"计 —— 以前只认 r.date, 于是分摊只在记账当天算一次。 */
function periodSnapshot(p){
  p = p || currentPeriod();
  const B = effectiveBudget(p);
  const win = collectWindow(p.start, p.end);
  const consumption = win.total;                                   // 消费口径 (元)
  const mm = win.mmT, idx = win.idxT;                              // 应投货币/指数(本期累计)
  const invest = r2(mm+idx);
  const usedUnits = r2(consumption / consumeShare());              // 本期已占用的预算口径
  const ratio = B>0 ? usedUnits/B : 0;                            // 进度(相对本期发放 B)
  return { p, B, rows:win.rows, consumption, amort:win.amortTotal,
           mm, idx, invest, usedUnits, ratio };
}

/* ====================== 类别余额 / 信封预算 ======================
   "账户余额"回答钱在哪里, "类别余额"回答钱准备做什么: 把**当期可消费额度**
   (当期预算 × N%)切给若干类别。切分只是计划, 不转账、不动可用余额、不影响占用口径 —— 
   所以这里所有的数字都是**消费口径**(元), 不与"占用 = 消费 ÷ N"混用。
   存续: settings.categoryBudget = {类别: 已分配金额}, 跨期沿用(和默认预算一样是"配置"),
        使用量按**当前周期**重新统计; 备份/导入/撤销都跟着 settings 走。
        静默开关 settings.categoryMute = {类别:true} 只影响警告(catAlertList), 不进金额口径。 */
function catAllocMap(){ return (state && state.settings && state.settings.categoryBudget) || {}; }
function catAllocOf(cat){ const v = catAllocMap()[cat]; return (typeof v==="number" && isFinite(v) && v>0) ? v : 0; }
/* 静默开关: 只关掉"该类别超额的警告", 不改金额/排序/占比/合计 */
function catMuteMap(){ return (state && state.settings && state.settings.categoryMute) || {}; }
function catMuted(cat){ return catMuteMap()[cat] === true; }
/* 总可用余额 = 当期预算 × 可消费比例(默认 85%) */
function catPool(p){ p = p || currentPeriod(); return r2(effectiveBudget(p) * consumeShare()); }
/* 已配置类别余额合计 */
function catAllocated(){
  const m = catAllocMap(); let s = 0;
  for(const k in m){ const v = Number(m[k]); if(isFinite(v) && v>0) s += v; }
  return r2(s);
}
/* 可配置余额 = 总可用余额 − 已配置类别余额(UI 输入框后的浅色实时数字就是它) */
function catPoolLeft(p){ return r2(catPool(p) - catAllocated()); }
/* 参与配置的类别 = 已知类别(默认 10 类 + 记录里的自定义类别) ∪ 已配置但暂无记录的类别
   —— 后者不能漏, 否则"配置了却看不到"会变成一笔无法取消的幽灵额度。 */
function catBudgetCats(){
  const out = knownCategories().slice();
  for(const k in catAllocMap()) if(!out.includes(k)) out.push(k);
  return out;
}
/* 当前周期每个已配置类别的 已分配/已消费/剩余/使用率/占比。
   已消费走 collectWindow(单类别) —— 分摊成本按"落在本期内的天数"计入, 与 summary/budget 同口径。 */
function catBudgetRows(p){
  p = p || currentPeriod();
  const pool = catPool(p), out = [];
  for(const c of catBudgetCats()){
    const alloc = catAllocOf(c);
    if(!(alloc > 0)) continue;
    const spent = collectWindow(p.start, p.end, c).total;
    out.push({ cat:c, alloc, spent, left:r2(alloc-spent),
               ratio: spent/alloc, share: pool>0 ? alloc/pool : 0 });
  }
  return out.sort((a,b)=> (b.ratio-a.ratio) || (b.alloc-a.alloc) || (a.cat<b.cat?-1:1));
}
/* 触发预警的类别: 使用率达到**最低阈值**(即将超额)或**最高阈值**(已超额)才返回;
   未触发的类别**完全不出现**(顶栏/预算页都不留空位)。阈值与今日/周期预算同一份 settings.thresholds。
   静默类别(勾选框取消)即使达到阈值也不返回 —— 顶栏与 budget 都复用本函数, 所以只过滤这一处。 */
function catAlertList(p){
  const th = [...state.settings.thresholds].sort((a,b)=>a-b);
  const warn = th.length ? th[0] : 80, over = th.length ? th[th.length-1] : 100;
  const out = [];
  for(const r of catBudgetRows(p)){
    if(catMuted(r.cat)) continue;
    const pc = r.ratio*100;
    if(!(pc >= warn)) continue;
    const isOver = pc >= over;
    out.push({ cat:r.cat, ratio:r.ratio, pct:pc, over:isOver,
               cls: isOver ? "r" : "y",
               dot: isOver ? COLOR.red : COLOR.yellow,
               text: pc.toFixed(0)+"%" });
  }
  return out;
}
/* 终端文本版: 与 dotLine 同构(标签 + 实心圆点 + 比例), 只用在"已触发"的类别上 */
function catDotLine(a){
  return [{t:a.cat+"：", c:COLOR.gray}, {t:"●", c:a.dot}, {t:a.text, c:COLOR.white}];
}

/* =========================== rendering helpers ========================== */
const term = document.getElementById("term");
const catlistEl = document.getElementById("catlist");

function line(segs){ // segs: string | [{t,c,cls,node}]
  const el = document.createElement("div");
  el.className = "l";
  if(typeof segs === "string"){ segs = [{t:segs}]; }
  for(const s of segs){
    if(s.node){ el.appendChild(s.node); continue; }   // Canvas 图标段(地点准星)
    const sp = document.createElement("span");
    if(s.c) sp.style.color = s.c;
    if(s.cls) sp.className = s.cls;
    sp.textContent = s.t;
    el.appendChild(sp);
  }
  term.appendChild(el);
  return el;
}
function blank(){ line(""); }

/* ===================== 统一的"标签 : 值"行渲染器 =====================
   以前总结/燃尽/资产/配置各写一套(rows 数组 + padEnd(24)、两份逐字节相同的 row() 闭包 + padEnd(22)、
   配置页手写空格), 列宽互不相同; 现在全部走 kvRow(), 列宽按当前窗口宽度自适应。 */
const KV_MIN = 14, KV_MAX = 24;      // 标签列宽(字符): 窄窗口也能让数值留在同一行
let _kvW = 0;                        // 缓存的列宽(窗口尺寸变化后失效重算, 避免每行都触发布局计算)
/* 终端当前可容纳的等宽字符数(拿不到布局信息时返回 0) */
function termCols(){
  let px = 0;
  try{ px = (term && term.clientWidth) || (typeof window!=="undefined" && window.innerWidth) || 0; }catch(e){}
  if(!(px > 0)) return 0;
  let charPx = 0;
  try{ charPx = textWidthPx("0000000000", term) / 10; }catch(e){}
  return Math.floor(px / (charPx > 0 ? charPx : 8));   // 兜底: 14px 等宽字体约 8px/字
}
/* 标签列宽: 约占终端宽度 1/4, 夹在 [KV_MIN, KV_MAX] */
function kvColWidth(){
  if(_kvW) return _kvW;
  const cols = termCols();
  _kvW = cols ? Math.max(KV_MIN, Math.min(KV_MAX, Math.round(cols * 0.26))) : KV_MAX;
  return _kvW;
}
if(typeof window!=="undefined" && window.addEventListener){
  window.addEventListener("resize", ()=>{ _kvW = 0; });   // 分辨率/窗口大小变化 → 下次输出重新计算列宽
}
/* kvRow("本期消费", "¥300.00") 或 kvRow(key, value, width, color, glow)
   value 也接受**分段**写法(段数组 [{t,c,cls}]), 用于同一行里"金额红/参考灰/占比红"这种多色行;
   字符串走原来的单段路径(颜色/glow 语义不变)。 */
function kvRow(key, value, width, color, glow){
  const w = (typeof width==="number" && width>0) ? width : kvColWidth();
  const row = line([{ t:("  "+key).padEnd(w," "), c:COLOR.gray }]);
  const segs = Array.isArray(value)
    ? value
    : [{ t:String(value==null?"":value), c:color||COLOR.white, cls:glow?"glow":"" }];
  for(const s of segs){
    const sp = document.createElement("span");
    if(s && s.c) sp.style.color = s.c;
    if(s && s.cls) sp.className = s.cls;
    sp.textContent = (s && s.t!=null) ? String(s.t) : "";
    row.appendChild(sp);
  }
  return row;
}

/* ===================== 统一"图形块" =====================
   budget / forecast / assets / summary / config / list 与图表共用一套视觉语言。
   全部是 DOM 元素(不是图片): 数字仍在可复制的文本里, 图形只负责"一眼看出比例/构成"。
     sectionHead() 章节标题 —— 「▓ + 大一档青色 + 灰色副标题」, 与图表章节同款
     hbarTrack()   方形进度条 —— 直角边框 + 已用色块 + 剩余同色浅块 + 100% 虚线刻度
     ratioBar()    带标题/说明的进度条块 —— hbarTrack() + 标签 + 百分比 + 脚注
     stackBar()    堆叠条 —— 资产构成 / 额度拆分, 自带色块图例
     catRows()     类别四列条
     miniBars()    迷你柱状图 —— 增长曲线, 复用 .chart-bars 的柱样式
   颜色语义与图表一致: 绿=正常/结余, 黄=预警, 橙/红=越线/超支, 青=货币, 浅黄=指数。 */
function sectionHead(title, meta, color){
  const segs = [{t:"  ▓ ", c:color||COLOR.cyan},{t:title, c:color||COLOR.cyan}];
  if(meta) segs.push({t:"  "+meta, c:COLOR.gray});
  const el = line(segs);
  el.className = "l chart-h";
  return el;
}
/* "#rrggbb" → "rgba(r,g,b,a)"; 其它写法(变量/rgb 字面量)原样返回, 由 CSS 兜底。 */
function withAlpha(col, a){
  const m = /^#([0-9a-fA-F]{6})$/.exec(String(col||""));
  if(!m) return col;
  const n = parseInt(m[1], 16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}
/* 方形进度条: 直角、无圆角、无点阵 —— 已用=语义色实心, 剩余=同色 16% 的实色块,
   两段之间由填充色的左边界天然形成分界(不需要额外纹理)。ratio>1 时填充拉满,
   100% 刻度线落到内部 1/r 处。 */
function hbarTrack(ratio, color, opts){
  opts = opts || {};
  const r = (typeof ratio==="number" && isFinite(ratio)) ? Math.max(0, ratio) : 0;
  const col = color || LEVEL_COLOR[barLevel(r)];
  const usedPct = Math.min(100, r*100);
  const track = document.createElement("div");
  track.className = "hbar" + (opts.mini ? " hbar-mini" : "");
  const fill = document.createElement("div"); fill.className = "hbar-fill";
  fill.style.width = usedPct.toFixed(2)+"%";
  fill.style.background = col;
  fill.style.color = col;                 // 与图表柱同一套"同色微光"语义
  fill.dataset.pct = usedPct.toFixed(2);
  const rest = document.createElement("div"); rest.className = "hbar-rest";
  rest.style.width = (100-usedPct).toFixed(2)+"%";
  rest.style.background = withAlpha(col, 0.16);
  track.append(fill, rest);
  if(opts.marker !== false){             // 「占比」条不画 100% 预算刻度(marker:false), 只有"是不是快花超了"才需要它
    const mk = document.createElement("i"); mk.className = "hbar-100";
    mk.style.left = (100/Math.max(r,1)).toFixed(2)+"%";
    track.appendChild(mk);
  }
  return track;
}
function ratioBar(ratio, opts){
  opts = opts || {};
  const r = (typeof ratio==="number" && isFinite(ratio)) ? Math.max(0, ratio) : 0;
  const col = opts.color || LEVEL_COLOR[barLevel(r)];
  const wrap = document.createElement("div"); wrap.className = "l hbar-wrap";
  const top = document.createElement("div"); top.className = "hbar-top";
  const k = document.createElement("span"); k.className = "hbar-k"; k.textContent = opts.label||"";
  const v = document.createElement("span"); v.className = "hbar-v";
  v.style.color = col; v.textContent = (r*100).toFixed(1)+"%";
  top.append(k, v);
  wrap.append(top, hbarTrack(r, col));
  if(opts.sub){
    const sub = document.createElement("div"); sub.className = "hbar-sub"; sub.textContent = opts.sub;
    wrap.appendChild(sub);
  }
  ((opts && opts.host) || term).appendChild(wrap);   // opts.host 可把同一块图形挂到钱包页等非终端容器
  return wrap;
}
function stackBar(parts, opts){
  opts = opts || {};
  /* 负值不能再被过滤掉 —— 现金为负(透支/超支结转)时正是最需要被看见的那一段。
     有负值时按"零轴"排版: 负段从 0 向左长, 正段从 0 向右长, 中间画一条 0 刻度线;
     全正时仍走原来的 flex 等分路径(宽度百分比直接可读)。 */
  const list = (parts||[]).filter(p=>p && isFinite(p.value) && p.value!==0);
  const posSum = list.filter(p=>p.value>0).reduce((s,p)=>s+p.value, 0);
  const negSum = -list.filter(p=>p.value<0).reduce((s,p)=>s+p.value, 0);
  const hasNeg = negSum > 0;
  const gross = (posSum + negSum) || 1;      // 有负值时为"毛额"(正+负绝对值), 百分比才有意义
  const net = posSum - negSum;
  const total = hasNeg ? gross : (net || 1);
  const wrap = document.createElement("div"); wrap.className = "l stack-wrap";
  if(opts.title){
    const top = document.createElement("div"); top.className = "hbar-top";
    const k = document.createElement("span"); k.className = "hbar-k"; k.textContent = opts.title;
    top.appendChild(k); wrap.appendChild(top);
  }
  const bar = document.createElement("div"); bar.className = "stack" + (hasNeg ? " mixed" : "");
  if(!list.length){
    bar.classList.add("empty");
  } else if(!hasNeg){
    for(const p of list){
      const seg = document.createElement("i");
      seg.style.width = (p.value/total*100).toFixed(2)+"%";
      seg.style.background = p.color;
      bar.appendChild(seg);
    }
  } else {
    /* 零轴位置 = 负段占毛额的比例; 负段按原顺序从零轴向左累加, 正段向右累加 */
    const zeroPct = negSum/gross*100;
    let left = zeroPct;                                  // 负段游标(向左)
    for(const p of list){
      if(p.value >= 0) continue;
      const w = (-p.value)/gross*100;
      const seg = document.createElement("i");
      seg.style.left = Math.max(0, left - w).toFixed(2)+"%";
      seg.style.width = w.toFixed(2)+"%";
      seg.style.background = p.color;
      bar.appendChild(seg);
      left -= w;
    }
    let right = zeroPct;                                 // 正段游标(向右)
    for(const p of list){
      if(p.value < 0) continue;
      const w = p.value/gross*100;
      const seg = document.createElement("i");
      seg.style.left = right.toFixed(2)+"%";
      seg.style.width = w.toFixed(2)+"%";
      seg.style.background = p.color;
      bar.appendChild(seg);
      right += w;
    }
    const zl = document.createElement("span"); zl.className = "stack-zero";
    zl.style.left = zeroPct.toFixed(2)+"%";
    bar.appendChild(zl);
  }
  wrap.appendChild(bar);
  const leg = document.createElement("div"); leg.className = "stack-legend";
  for(const p of list){
    const it = document.createElement("span"); it.className = "stack-li";
    const sw = document.createElement("span"); sw.className = "chart-swatch"; sw.style.background = p.color;
    const tx = document.createElement("span"); tx.className = "stack-tx";
    tx.textContent = p.label+" ¥"+money(p.value)+"  "+(p.value/total*100).toFixed(1)+"%";
    it.append(sw, tx); leg.appendChild(it);
  }
  wrap.appendChild(leg);
  ((opts && opts.host) || term).appendChild(wrap);   // opts.host 可把同一块图形挂到钱包页等非终端容器
  return wrap;
}
/* 类别占比行: 名称 + 细条 + 占比 + 金额(四列, 与饼图图例同一套色块/配色),
   取代原来 "████░░░░ 36.1%" 的字符条 —— 字符条的字宽随字体变, 条长不可比。 */
function catRows(cats, total){
  const wrap = document.createElement("div"); wrap.className = "l cat-rows";
  const maxAmt = Math.max(1, ...cats.map(c=>c[1]));
  for(const [cat, amt] of cats){
    const pct = total>0 ? amt/total*100 : 0;
    const row = document.createElement("div"); row.className = "cat-row";
    const nm = document.createElement("span"); nm.className = "cat-nm"; nm.textContent = cat;
    const tr = document.createElement("span"); tr.className = "cat-track";
    const fi = document.createElement("i");
    fi.style.width = Math.max(1, Math.round(amt/maxAmt*100))+"%";
    fi.style.background = catColor(cat);
    tr.appendChild(fi);
    const pc = document.createElement("span"); pc.className = "cat-pc"; pc.textContent = pct.toFixed(1)+"%";
    const am = document.createElement("span"); am.className = "cat-amt"; am.textContent = "¥"+money(amt);
    row.append(nm, tr, pc, am);
    wrap.appendChild(row);
  }
  term.appendChild(wrap);
  return wrap;
}
/* 绘图区像素高: 以 MINI_PLOT_H / CHART_PLOT_H 为基准, 按视口高度等比缩放(0.8x~1.35x)。
   1080p 屏 ≈ 0.95x, 2K/4K 屏最多 1.35x; 拿不到布局信息(测试/导出/无窗口)时就用基准值,
   保证 headless 输出与测试里的柱高仍是确定值。 */
function plotHeight(kind){
  const base = (kind==="mini") ? MINI_PLOT_H : CHART_PLOT_H;
  let vh = 0;
  try{ vh = (typeof window!=="undefined" && window.innerHeight) || 0; }catch(e){}
  if(!(vh > 0)) return base;
  const k = Math.min(1.35, Math.max(0.8, vh/1000));
  return Math.round(base*k);
}
/* 把柱高/柱顶数值/预算参考线/零轴按当前绘图区高度重算一遍。
   柱高仍是像素(测试与导出一致), 但像素来源是"当前视口"而不是写死的常量 ——
   这样窗口/分辨率变化后重新调用一次即可对齐 CSS 的 --plot-h。
   负值处理: 以前负值算出的高度是负数 → 被夹到 2px, 图形几乎不可见。
   现在用 [min, max] 值域排版, 0 刻度线落在零轴处, 负柱从零轴向**下**长, 正柱向上长。 */
function applyPlotHeight(wrap){
  const kind = wrap.classList.contains("mini") ? "mini" : "chart";
  const H = plotHeight(kind);
  const hi = Math.max(0, Number(wrap.dataset.max) || 0);
  const lo = Math.min(0, Number(wrap.dataset.min) || 0);
  const span = (hi - lo) || 1;
  const px = H / span;                       // 每单位值对应的像素
  const zero = Math.round(-lo * px);          // 零轴距底部像素(全正 = 0, 即贴底)
  wrap.dataset.plotH = String(H);
  if(wrap.style && typeof wrap.style.setProperty === "function") wrap.style.setProperty("--plot-h", H+"px");
  else if(wrap.style) wrap.style["--plot-h"] = H+"px";
  /* 只用 children 遍历(不依赖 querySelector), headless 导出/测试的 DOM stub 也能跑 */
  let ln = null, lb = null, zl = null;
  for(const col of wrap.children){
    if(col.className === "chart-refline"){ ln = col; continue; }
    if(col.className === "chart-reflabel"){ lb = col; continue; }
    if(col.className === "chart-zero"){ zl = col; continue; }
    if(col.className !== "chart-col") continue;
    let bar = null, v = null;
    for(const n of col.children){
      if(n.className === "chart-bar") bar = n;
      else if(n.className === "chart-v") v = n;
    }
    if(!bar) continue;
    const val = Number(bar.dataset.value) || 0;
    const h = Math.max(2, Math.round(Math.abs(val) * px));
    bar.style.height = h+"px";
    bar.style.bottom = (val < 0 ? zero - h : zero) + "px";
    if(v){
      /* 正柱标签在柱顶上方, 负柱标签在柱底下方 */
      v.style.bottom = (val < 0 ? Math.max(0, zero - h - 13) : zero + h + 3) + "px";
    }
  }
  if(lo < 0){
    if(!zl){
      zl = document.createElement("div"); zl.className = "chart-zero";
      wrap.appendChild(zl);            // 1px 虚线, CSS 已 pointer-events:none, 不会挡住柱子
    }
    zl.style.bottom = zero + "px";
  } else if(zl && zl.style){ zl.style.display = "none"; }
  const refQ = Number(wrap.dataset.refQuota) || 0;
  if(refQ > 0){
    const refH = Math.min(H, Math.round(refQ * px));
    if(ln) ln.style.bottom = refH+"px";
    if(lb) lb.style.bottom = (refH+2)+"px";
  }
  return H;
}
/* 分辨率/窗口变化 → 所有已渲染的柱状图重新按新高度排版(宽度由 flex 自动重排, 无需干预) */
if(typeof window!=="undefined" && window.addEventListener){
  window.addEventListener("resize", ()=>{
    const nodes = (typeof document!=="undefined" && document.querySelectorAll)
      ? document.querySelectorAll(".chart-bars") : [];
    for(const w of nodes) applyPlotHeight(w);
  });
}
/* 迷你柱状图: points=[{label,value,tone?}], 最多 12 根(多的合并到最后根), 复用图表柱样式 */
const MINI_MAX = 12, MINI_PLOT_H = 128;
function miniBars(points, opts){
  opts = opts || {};
  const pts = (points||[]).filter(p=>p && isFinite(p.value));
  if(!pts.length) return null;
  const boxes = pts.length > MINI_MAX ? pts.slice(0, MINI_MAX-1).concat([pts[pts.length-1]]) : pts;
  /* 值域取 [min, max] 而不是 [1, max]: 全负时(资产为负)旧写法 maxVal=1 会让所有柱压成 2px,
     等于"图形不显示"。现在正负都按同一值域排版, 零轴自动落在对应位置。 */
  const hiVal = Math.max(0, ...boxes.map(p=>p.value));
  const loVal = Math.min(0, ...boxes.map(p=>p.value));
  const wrap = document.createElement("div");
  wrap.className = "chart-bars mini";
  wrap.dataset.kind = opts.kind || "mini";
  wrap.dataset.count = String(boxes.length);
  wrap.dataset.max = String(hiVal || (loVal ? 0 : 1));
  wrap.dataset.min = String(loVal);
  for(const p of boxes){
    const col = document.createElement("div"); col.className = "chart-col";
    const color = p.tone || (p.value < 0 ? COLOR.red : COLOR.green);   // 负值默认红色(与全站语义一致)
    const bar = document.createElement("div"); bar.className = "chart-bar";
    bar.style.background = color; bar.style.color = color;
    bar.dataset.value = String(p.value); bar.dataset.label = p.label;
    const v = document.createElement("span"); v.className = "chart-v";
    v.style.color = color; v.textContent = money(p.value);
    const k = document.createElement("span"); k.className = "chart-k"; k.textContent = p.label;
    col.append(bar, v, k);
    wrap.appendChild(col);
  }
  term.appendChild(wrap);
  applyPlotHeight(wrap);      // 统一按视口高度落柱高(测试环境 = MINI_PLOT_H)
  return wrap;
}

/* progress bar with level color */
function barLevel(ratio){
  const th = [...state.settings.thresholds].sort((a,b)=>a-b); // % thresholds
  let lvl = 0;
  for(const p of th){ if(ratio*100 >= p) lvl++; }
  return Math.min(lvl,4);
}
const LEVEL_COLOR = [COLOR.green,COLOR.yellow,COLOR.orange,COLOR.red,COLOR.magenta];
/* 只算"等级色 + 百分比", 不再拼 █░ 字符条 —— 所有进度条都是 DOM 的 hbarTrack
   (方形 + 分色), 顶部栏与终端共用同一份实现。 */
function progressBar(ratio){
  ratio = Math.max(0, Math.min(1, ratio));
  const lvl = barLevel(ratio);
  return { color:LEVEL_COLOR[lvl], lvl:lvl, pct:(ratio*100).toFixed(1) };
}
function alertWord(ratio){
  const p = ratio*100;
  const th = [...state.settings.thresholds].sort((a,b)=>a-b);
  if(th.length && p>=th[th.length-1]) return {t:"已超额 ⚠", c:COLOR.red};
  for(let i=th.length-1;i>=0;i--){ if(p>=th[i]) return {t:"接近预算 ⚠ "+th[i]+"%", c:COLOR.yellow}; }
  return {t:"预算内 ✓", c:COLOR.green};
}

/* ============ 红黄绿"实心圆点"指示器 (规则与原预警阈值一致, 不闪烁) ============
   绿: 未达最低阈值 → 显示"剩余 X%";  黄: 达到最低阈值 → "接近上限 X%";
   红: 达到最高阈值(默认100) → "已超额 X%";  灰(n): 未设置额度 */
function ratioDot(ratio){
  if(ratio==null || !isFinite(ratio)) return {cls:"n", word:"未设", dot:COLOR.gray, text:"未设置额度"};
  const p = ratio*100;
  const th = [...state.settings.thresholds].sort((a,b)=>a-b);
  const over = th.length ? th[th.length-1] : 100;
  const warn = th.length ? th[0] : over;
  if(p >= over) return {cls:"r", word:"红", dot:COLOR.red, text:"已超额"+p.toFixed(0)+"%"};
  if(p >= warn) return {cls:"y", word:"黄", dot:COLOR.yellow, text:"接近上限"+p.toFixed(0)+"%"};
  return {cls:"g", word:"绿", dot:COLOR.green, text:"剩余"+Math.max(0,100-p).toFixed(0)+"%"};
}
/* 今日快照: 今日消费 vs 手动设置的"每日可用余额"
   分摊成本按**当天那一份**计入(以前只有记账当天算一次, 之后每天恒为 0)。 */
function todaySnapshot(){
  const t = todayYMD();
  const consumption = r2(state.records.reduce((s,r)=>s+recAmountInRange(r,t,t),0));
  const d = state.settings.dailyBudget;
  const hasDaily = typeof d==="number" && d>0;
  return { date:t, consumption, daily: hasDaily? d : null, ratio: hasDaily ? consumption/d : null };
}

  line([{t:"  ▓ 命令参考", c:COLOR.cyan, cls:"glow"}]);
  for(const c of COMMANDS){
    const cmdText = c.u, desc = c.d;
    const descIndent = (cmdText.length > HELP_PAD) ? (2+3+2) : (2+HELP_PAD+2);
    const cmdStr = "  "+cmdText;
    const descStr = descIndent>cmdStr.length ? " ".repeat(descIndent-cmdStr.length)+desc

  // 别名对照: 由登记表派生, 不再手工维护(以前 help 里根本没有别名)
  const pairs = COMMANDS.filter(c=>!c.sub && c.n.length>1).map(c=>c.n[0]+" = "+c.n.slice(1).join("/"));
  line([{t:"  ▓ 命令别名", c:COLOR.cyan, cls:"glow"}]);
  let row = "  ";
  for(const p of pairs){
    if(row.trim() && row.length + p.length + 4 > HELP_ALIAS_WIDTH){ line([{t:row.replace(/\s+$/,""), c:COLOR.gray}]); row = "  "; }
    row += p + "    ";
