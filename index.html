/* 分词: 支持单/双引号; 引号内支持反斜杠转义(\" 和 \\)。
   修复: 旧实现用 /"[^"]*"/ 匹配, 遇到备注里的转义引号(如 记一笔 "说 \"A\"" )会被截断成
   `说 \` + `A\`, 备注内容被破坏。
   注意: 引号"外"的反斜杠不当转义符, 保持字面量 —— 否则 Windows 路径备注
   (add 50 学习 C:\temp\a) 里的反斜杠会被吃掉。 */
function tokenize(str){
  const out=[]; let cur=null, quote=null;
  for(let i=0;i<str.length;i++){
    const ch = str[i];
    if(quote){                                   // 引号内: 支持 \" \\ 转义
      if(ch==="\\" && i+1<str.length && (str[i+1]===quote || str[i+1]==="\\")){ cur += str[++i]; continue; }
      if(ch===quote){ out.push(cur); cur=null; quote=null; continue; }
      cur += ch; continue;
    }
    /* 引号出现在 token 中途时保留已有前缀(如 #"北京市 海淀区" 要留下 #),
       纯引号开头仍是(cur===null → "")，旧行为不变。 */
    if(ch==='"' || ch==="'"){ quote = ch; if(cur===null) cur = ""; continue; }
    if(/\s/.test(ch)){ if(cur!==null){ out.push(cur); cur=null; } continue; }
    if(cur===null) cur = "";
    cur += ch;                                   // 引号外: 反斜杠原样保留
  }
  if(cur!==null) out.push(cur);
  return out;
}
function parseCmd(raw){
  const toks = tokenize(raw);
  const cmd = (toks[0]||"").toLowerCase();
  return { cmd, tokens:toks.slice(1) };
}
function numeric(t){ if(!/^-?\d+(\.\d+)?$/.test(String(t))) return null; return parseFloat(t); }
/* 金额唯一入口(P0): 严格数字 + 有限 + >0 + r2 后仍 >0。
   防两类真实事故: 0.001 被 r2 抹成 0(设置静默无效/重启回落默认)、超长数字 parseFloat→Infinity(落盘成 null)。 */
function parseAmount(t){
  const n = numeric(t);
  if(n==null || !isFinite(n) || !(n>0)) return null;
  const v = r2(n);
  return (isFinite(v) && v>0) ? v : null;
}
/* 备注转义(P0): 备注首字符为 # / @ 时会被当成 #地点 / @日期, 造成地点与备注互换、备注被吞。
   UI 回灌一律走 quoteNote() 前置 \; 命令行也可写 "\#标签" / "\@朋友"。
   转义 token 在参数拆分阶段原样透传, 由 splitRecordArgs 最后统一还原(避免被二次解释)。 */
function escapedArg(tk){ return typeof tk==="string" && tk[0]==="\\" && tk.length>1; }
function unescapeArg(tk){ return escapedArg(tk) ? tk.slice(1) : tk; }
function quoteNote(s){
  const v = String(s==null?"":s);
  return quote((v[0]==="#"||v[0]==="@") ? "\\"+v : v);
}
function findDateToken(tokens){
  // returns {tokens without 第一个 @date, dateStr|null}; 其余 @token 保留为备注
  const out=[]; let date=null;
  for(const tk of tokens){
    if(escapedArg(tk)){ out.push(tk); continue; }
    if(tk[0]==="@" && date===null){ date = tk.slice(1); }
    else out.push(tk);
  }
  return { tokens:out, date };
}
/* @日期 → 'YYYY-MM-DD'。改成走 normDateText 单一入口 —— 以前只校验"长得像 YYYY-MM-DD",
   于是 `add 50 餐饮 @2027-13-40` / `@2027-02-30` 能落库, 而下次加载 normalizeRecords→repairDate
   认定它非法, 那条记录会被当成"损坏"静默丢掉(记账变少)。现在不合法的日期当场拒绝(返回 null)。 */
function cleanDateStr(d){
  if(!d) return todayYMD();
  const t = normDateText(d, "date");
  return (t.ok && t.value) ? t.value : null;
}
/* 地点参数: `#地点` 与 `@日期` 一样位置无关, 只认第一个 #token。
   含空格写成 #"北京市 海淀区" (tokenize 会把引号内空格并进同一个 token); `#-`/`#off` = 清除。
   转义过的备注 token (\#… / \@…) 不参与参数识别, 原样透传。
   拆成一次调用, 让 add / amort / update 三条命令共用同一套参数口径。 */
/* #地点 与 $钱包 都是"位置无关的带前缀标记", 解析逻辑只有下面这一份(不再各写一遍循环)。 */
function findMarkedToken(tokens, mark){
  const out=[]; let value=null;
  for(const tk of tokens){
    if(escapedArg(tk)){ out.push(tk); continue; }
    if(tk[0]===mark && tk.length>1 && value===null){ value = tk.slice(1); }
    else out.push(tk);
  }
  return { tokens:out, value };
}
function findPlaceToken(tokens){ return findMarkedToken(tokens, "#"); }
function findWalletToken(tokens){ return findMarkedToken(tokens, "$"); }
function splitRecordArgs(tokens){
  const a = findDateToken(tokens), b = findPlaceToken(a.tokens), c = findWalletToken(b.tokens);
  return { tokens:c.tokens.map(unescapeArg), date:a.date, place:b.value, wallet:c.value };
}
/* 注意 tokenize 遇到引号会重置当前 token, 所以 # 必须放在引号**里面**: "#北京市 海淀区" */
function quotePlace(p){ return quote("#"+p); }
/* $钱包 同理: $"招商银行 储蓄卡"(前缀在引号外, 与 #地点 完全同一套写法) */
function quoteWallet(w){ return "$"+quote(w); }

function runCommand(raw){
  raw = raw.trim();
  if(!raw) return;
  if(raw && raw!==history[history.length-1]) history.push(raw); hIdx=-1;
  /* 三页外壳: 命令输出永远进主页终端; 当前在「钱包 / 设置」页时, 本次新增的终端行
     会镜像到该页底部的回显条, 数据确实变了再把设置页表单回填成已保存值(见 afterPageCommand)。 */
  const onPage = (currentPage!=="home");
  const before0 = onPage ? snapshotState() : null, lines0 = onPage ? term.children.length : 0;
  echoCommand(raw);
  const {cmd, tokens} = parseCmd(raw);
  try{
    // 用主名判断: 否则 `u`(undo 的别名)会走 mutate 包一层, 撤销后又被当成"新改动"压栈并把 redo 清空
    const c = canonicalCmd(cmd);
    if(c==="undo" || c==="redo"){ dispatch(cmd, tokens); if(onPage) afterPageCommand(before0, lines0); return; }   // applyState() 内部已 commit
    pendingCommit = false;
    mutate(()=>dispatch(cmd, tokens));
    commitIfDirty();     // 唯一出口: 数据确实变了才 落盘 + 刷新(H4)
  }catch(e){
    line([{t:"[ERR] "+ (e && e.message ? e.message : e), c:COLOR.red}]);
    if(e && e.stack) console.error(e);
  }
  if(onPage) afterPageCommand(before0, lines0);
}

/* dispatch main logic: 只按"主名"分派, 别名在入口统一解析(见上面的 COMMANDS 登记表)。
   这里每个 case 都必须与 COMMANDS 里某个主名一一对应(测试双向校验, 防漂移)。 */
function dispatch(cmd, tokens){
  switch(canonicalCmd(cmd)){
    case "help":     printHelp(); break;
    case "cls":      term.innerHTML=""; break;
    case "set":      doSet(tokens); break;
    case "budget":   doBudget(tokens); break;
    case "forecast": doForecast(); break;
    case "add":      doAdd(tokens); break;
    case "amort":    doAmort(tokens); break;
    case "recur":    doRecur(tokens); break;
    case "list":     doList(tokens); break;
    case "search":   doSearch(tokens); break;
    case "del":      doDelete(tokens); break;
    case "update":   doUpdate(tokens); break;
    case "place":    doPlace(tokens); break;
    case "pay":      doPay(tokens); break;
    case "summary":  doSummary(tokens); break;
    case "chart":    doChart(tokens); break;
    case "report":   doReport(tokens); break;
    case "export":   doExport(tokens); break;
    case "assets":   doAssets(tokens); break;
    case "undo":     undo(); break;
    case "redo":     redo(); break;
    case "config":   doConfig(tokens); break;
    case "wallet":   doWallet(tokens); break;
    default:
      line([{t:"未知命令: "+cmd+"。输入 help 查看用法。", c:COLOR.yellow}]);
  }
}


/* ============================== config =================================
   「配置预算」「配置投资比例」不再是散落的设置入口, 统一收进 config:
     config                      查看当前配置(原 showSettings 输出)
     config set budget <金额>     设默认周期预算(各期生效)
     config set budget <金额> now 只改当前周期(等同「应用于当期」)
     config set invest <比例%>    投资比例(消费占比 = 1 - 投资比例)
   设置成功后**直接复用 config 原有的输出**(showSettings), 不再另写一套确认文案。
   旧的 set budget / set invest 仍然可用(历史脚本/键位习惯), 但 help 只推荐 config 写法。 */
function setDefaultBudget(n){
  const v = parseAmount(n);
  if(v==null) return false;
  state.settings.budget = v;
  return true;
}
function setPeriodBudget(n){
  const v = parseAmount(n);
  if(v==null) return false;
  const p = currentPeriod();
  state.settings.periodBudget = state.settings.periodBudget || {};
  state.settings.periodBudget[p.start] = v;
  return true;
}
/* ---------------------- 周期设置的唯一入口 ----------------------
   以前周期只能从命令行改(`set period` / `set periodstart`), 界面上的「配置」页看不到也改不了;
   现在命令、设置页「周期持续时间」卡与「配置周期」弹窗共用下面这几个 setter, 天数(lengthDays)一律由起止日期推导:
     · periodSetDays(n)         → 滚动 N 天(N 只接受 2~90, 快捷写法)
     · periodSetStart(起)       → 只移动锚点, 天数不变 → 截止日自动顺延
     · periodSetEnd(止)         → 以当前周期的起点为锚, 天数 = 止−起+1 自动回算
     · periodSetRange(起, 止)    → 起止都指定, 天数同样自动回算(弹窗走这条)
   monthPeriodBounds() 是"按月规则"的纯算法入口(见周期引擎), 不依赖 periodMode。 */
const PERIOD_DAYS_MIN = 2;      // 周期最少 2 天(1 天等于自然日, 没有周期意义)
const PERIOD_DAYS_MAX = 90;     // "N 天"快捷写法上限(与历史文档一致)
const PERIOD_RANGE_MAX = 366;   // 直接指定起止日时的上限(支持半年/一年为一期)
function periodDaysBetween(startStr, endStr){ return daysBetween(startStr, endStr) + 1; }
function periodSetDays(n){
  if(n==null || !Number.isInteger(n) || n<PERIOD_DAYS_MIN || n>PERIOD_DAYS_MAX) return { ok:false, reason:"days" };
  state.settings.periodMode = "rolling";
  state.settings.lengthDays = n;
  state.settings.anchor = state.settings.anchor || todayYMD();   // 起点缺省=今天起算新一期
  ensureEpoch();
  return { ok:true, period:currentPeriod() };
}
function periodSetMonth(){
  state.settings.periodMode = "month";
  ensureEpoch();
  return { ok:true, period:currentPeriod() };
}
function periodSetStart(dateStr){
  const d = repairDate(dateStr);
  if(!d) return { ok:false, reason:"date" };
  state.settings.periodMode = "rolling";
  state.settings.anchor = d;
  ensureEpoch();
  return { ok:true, anchor:d, period:currentPeriod() };
}
function periodSetEnd(dateStr){
  const end = repairDate(dateStr);
  if(!end) return { ok:false, reason:"date" };
  const start = currentPeriod().start;          // 改之前先取"本期起点"(按月/滚动都适用)
  const days = periodDaysBetween(start, end);
  if(days < PERIOD_DAYS_MIN) return { ok:false, reason:"order", start, end };
  if(days > PERIOD_RANGE_MAX) return { ok:false, reason:"long", start, end, days };
  if(end < todayYMD()) return { ok:false, reason:"past", start, end };
  state.settings.periodMode = "rolling";
  state.settings.anchor = start;
  state.settings.lengthDays = days;
  ensureEpoch();
  return { ok:true, start, end, days, period:currentPeriod() };
}
/* 起止日区间的**唯一校验入口**(命令与「配置周期」弹窗共用, 避免两份规则各说各话):
   日期真实可解析、2~366 天、区间必须包含今天(否则设的不是"当前周期")。 */
function periodRangeCheck(startStr, endStr){
  const start = repairDate(startStr), end = repairDate(endStr);
  if(!start) return { ok:false, reason:"date", which:"start" };
  if(!end)   return { ok:false, reason:"date", which:"end" };
  const days = periodDaysBetween(start, end);
  if(days < PERIOD_DAYS_MIN) return { ok:false, reason:"order", start, end };
  if(days > PERIOD_RANGE_MAX) return { ok:false, reason:"long", start, end, days };
  const t = todayYMD();
  if(t < start || t > end) return { ok:false, reason:"outside", start, end, today:t };
  return { ok:true, start, end, days };
}
/* 起止都指定: 通过校验后写入锚点与天数(天数由日期推导, 不接受外部传值) */
function periodSetRange(startStr, endStr){
  const r = periodRangeCheck(startStr, endStr);
  if(!r.ok) return r;
  state.settings.periodMode = "rolling";
  state.settings.anchor = r.start;
  state.settings.lengthDays = r.days;
  ensureEpoch();
  return Object.assign({}, r, { period:currentPeriod() });
}
/* setter 失败原因 → 用户可读的一句话(命令与弹窗共用, 避免两处文案漂移) */
function periodErrText(r){
  if(!r || r.ok) return "";
  if(r.reason==="days")  return "用法: 天数需为 "+PERIOD_DAYS_MIN+"~"+PERIOD_DAYS_MAX+" 的整数, 例 config set period 15";
  if(r.reason==="date")  return "日期无效: 请按 YYYY-MM-DD 填写真实存在的日期, 如 2027-08-18";
  if(r.reason==="order") return "截止日必须比起始日至少晚 1 天 (本期最少 "+PERIOD_DAYS_MIN+" 天)";
  if(r.reason==="long")  return "周期过长: 一期最多 "+PERIOD_RANGE_MAX+" 天 (当前 "+(r.days||"?")+" 天)";
  if(r.reason==="past")  return "截止日不能早于今天 ("+todayYMD()+"); 本期必须包含今天";
  if(r.reason==="outside") return "起止日必须包含今天 ("+r.today+"), 否则指定的不是当前周期";
  return "周期设置失败";
}
/* 投资比例: pct 允许 0~50; asInvest=false 时按"消费占比"解释(也接受 0.85 小数写法) */
const INVEST_MAX_PCT = 50;
function setInvestPct(pct, asInvest){
  const usage = "用法: config set invest <投资比例%>   例 config set invest 15   (消费占比 = 1 - 投资比例)";
  if(pct==null || !isFinite(pct)) return {ok:false, msg:usage};
  let p = pct;
  if(!asInvest && p>0 && p<=1) p = p*100;
  const newConsume = asInvest ? (1 - p/100) : (p/100);
  if(!(newConsume>=0.5 && newConsume<=1)){
    return {ok:false, msg:"比例超出范围: 消费占比需在 50%~100% 之间 (即投资比例 0%~"+INVEST_MAX_PCT+"%)。\n"+usage};
  }
  state.settings.consumeShare = r6(newConsume);
  recomputeAllInvest();          // 历史记录按新比例重算应投(已投额封顶)
  return {ok:true};
}
function configUsage(){
  line([{t:"用法: config   查看当前配置", c:COLOR.yellow}]);
  line([{t:"      config set period <N天>            滚动 N 天一期; natural 回到按月", c:COLOR.yellow}]);
  line([{t:"      config set period <起> <止>         直接指定本期起止日, 天数自动算出", c:COLOR.yellow}]);
  line([{t:"      config set periodstart <日期>       设滚动周期起点(锚点)", c:COLOR.yellow}]);
  line([{t:"      config set periodend <日期>         设本期截止日(天数自动回算)", c:COLOR.yellow}]);
  line([{t:"      config set monthstart <1-28>       (按月模式)每期起始日; natural = 自然月", c:COLOR.yellow}]);
  line([{t:"      config set budget <金额> [now]    设默认预算 / 加 now 只改当前周期", c:COLOR.yellow}]);
  line([{t:"      config set invest <投资比例%>      如 config set invest 15 (消费占比=85%)", c:COLOR.yellow}]);
  line([{t:"      config set consume|ratio|share <消费占比>   如 config set ratio 0.85 (与 set ratio 同解释)", c:COLOR.yellow}]);
  line([{t:"      config set geo auto|manual        地点: 自动填充地址 / 全手动(不填则空)", c:COLOR.yellow}]);
  line([{t:"      config set geokey <你的Key>|off   腾讯地图 Key; off 清空(代码不预置 key)", c:COLOR.yellow}]);
  line([{t:"      (每日额度用 set daily; 类别余额用 set category; 钱包用 wallet —— 它们不在 config 下)", c:COLOR.gray}]);
}
function doConfig(tokens){
  const sub = (tokens[0]||"").toLowerCase();
  if(!sub || sub==="show" || sub==="view" || sub==="list"){ showSettings(); return; }
  if(sub!=="set"){ configUsage(); return; }
  const what = (tokens[1]||"").toLowerCase();
  /* 周期设置从 set 收进 config:
       config set period <N天> | natural       滚动 N 天 / 回到按月
       config set period <起> <止>              直接指定本期起止日(天数自动算出)
       config set periodstart <日期>            设滚动锚点(只改起点, 天数不变)
       config set periodend <日期>              设本期截止日(天数自动回算)
     成功后与其它 config set 一样直接输出当前配置表, 不另写确认文案。 */
  if(what==="period"||what==="cycle"||what==="length"){
    const v = (tokens[2]||"").toLowerCase();
    const usage = "用法: config set period <N天>  例 config set period 15\n"
                + "      config set period natural            回到按月周期\n"
                + "      config set period <起> <止>           直接指定本期起止日, 天数自动算出\n"
                + "                                           例 config set period "+todayYMD()+" "+addDaysYMD(todayYMD(),29);
    if(v==="natural"||v==="month"||v==="月"||v==="自然月"){
      if(tokens.length>3){ line([{t:"多余参数: natural 后面不需要再写日期", c:COLOR.yellow}]); return; }
      periodSetMonth(); showSettings(); return;
    }
    if(tokens.length===4){
      const r = periodSetRange(tokens[2], tokens[3]);
      if(!r.ok){ line([{t:periodErrText(r), c:COLOR.yellow}]); return; }
      showSettings(); return;
    }
    if(tokens.length>4){ line([{t:usage, c:COLOR.yellow}]); return; }
    const n = numeric(tokens[2]);
    const r = periodSetDays(n);
    if(!r.ok){ line([{t:usage, c:COLOR.yellow}]); return; }
    showSettings(); return;
  }
  if(what==="periodstart"||what==="anchor"){
    if(!tokens[2]){ line([{t:"用法: config set periodstart <YYYY-MM-DD>   例 config set periodstart 2027-08-04", c:COLOR.yellow}]); return; }
    const r = periodSetStart(tokens[2]);
    if(!r.ok){ line([{t:periodErrText(r), c:COLOR.yellow}]); return; }
    showSettings(); return;
  }
  /* 月起始日收进 config(与周期其它三项同一入口, 设置页「周期持续时间」卡也回灌这条);
     旧写法 set monthstart 仍兼容 —— 两者共用 monthStartSet() 校验。 */
  if(what==="monthstart"){
    const d = monthStartSet(tokens[2]);
    if(d==null || tokens.length>3){
      line([{t:"用法: config set monthstart <1-28>   1 或 natural = 自然月; 例 config set monthstart 15", c:COLOR.yellow}]);
      return;
    }
    state.settings.monthStart = d; state.settings.periodMode = "month"; ensureEpoch();
    showSettings(); return;
  }
  if(what==="periodend"||what==="periodstop"){
    if(!tokens[2]){ line([{t:"用法: config set periodend <YYYY-MM-DD>   例 config set periodend 2027-09-02 (天数自动回算)", c:COLOR.yellow}]); return; }
    const r = periodSetEnd(tokens[2]);
    if(!r.ok){ line([{t:periodErrText(r), c:COLOR.yellow}]); return; }
    showSettings(); return;
  }
  if(what==="budget"){
    const n = parseAmount(tokens[2]);
    const when = (tokens[3]||"").toLowerCase();
    const onlyNow = (when==="now"||when==="current"||when==="当期"||when==="本期");
    /* P2 B-17: 第四个 token 存在但不合法(如把 now 拼成 nwo)时, 旧代码静默退化成"改全局默认预算";
       现在多给 / 拼错一律拒绝 —— "只改当期"不会悄悄变成"改所有周期"。 */
    if(tokens.length>4 || (tokens[3] && !onlyNow)){
      line([{t:"用法: config set budget <金额> [now]   第四个参数只接受 now / current / 当期 / 本期", c:COLOR.yellow}]);
      return;
    }
    if(n==null){
      line([{t:"用法: config set budget <金额> [now]   例 config set budget 1200 (now = 只改当前周期)", c:COLOR.yellow}]);
      line([{t:"      金额需为有限正数且 ≥ ¥0.01 (0.001 会被舍成 0, 超大数会溢出)", c:COLOR.gray}]);
      return;
    }
    if(onlyNow) setPeriodBudget(n); else setDefaultBudget(n);
    showSettings();
    return;
  }
  if(what==="invest"||what==="investment"||what==="consume"||what==="ratio"||what==="share"){
    /* P0: 与 set 同口径 —— 只有 invest/investment 按"投资比例"解释, 其余按"消费占比"。
       旧写法把 ratio/share 当投资比例, config set ratio 0.85 会算出 99.15% 并重算历史应投。 */
    const asInvest = (what==="invest"||what==="investment");
    const res = setInvestPct(numeric(tokens[2]), asInvest);
    if(!res.ok){ line([{t:res.msg, c:COLOR.yellow}]); return; }
    showSettings();
    return;
  }
  if(what==="geo"||what==="geolocation"||what==="location"||what==="place"){
    const v = (tokens[2]||"").toLowerCase();
    const isAuto = ["auto","on","自动","自动填充","自动填充地址"].includes(v);
    const isManual = ["manual","off","手动","全手动"].includes(v);
    if(!isAuto && !isManual){
      line([{t:"用法: config set geo auto|manual   auto=add 时自动定位; manual=全手动(不填则空)", c:COLOR.yellow}]);
      return;
    }
    state.settings.geoMode = isAuto ? "auto" : "manual";
    if(isAuto) primeGeoLocation(true);                       // 切回自动 → 立即补一次定位
    else { clearGeoCache(); setGeoStatus("off","全手动"); }  // 全手动 → 清掉缓存, badge 同步
    showSettings();
    return;
  }
  if(what==="geokey"||what==="mapkey"||what==="key"){
    const raw = tokens.slice(2).join(" ").trim();
    if(!raw){ line([{t:"用法: config set geokey <你的腾讯地图Key>   (off 清空)", c:COLOR.yellow}]); return; }
    const low = raw.toLowerCase();
    const clearing = (low==="off"||low==="clear"||raw==="清除"||raw===GEO_KEY_PLACEHOLDER);
    /* P1 B-12: 写入与 normalizeSettings() 共用 normalizeGeoKey() —— 占位符/提示文案/带空白的
       脏值当场拒绝, 不再出现"本次会话存住并发请求、重启被清空"。 */
    const key = clearing ? "" : normalizeGeoKey(raw);
    if(!clearing && !key){
      line([{t:"Key 无效: 请填不带空格/引号的腾讯地图 Key(占位符与提示文案不会被写入)。", c:COLOR.yellow}]);
      return;
    }
    state.settings.geoKey = key;
    resetTMapSDK();                                    // P1 B-09: 换 Key / 清 Key 后旧 SDK 不再复用
    if(key) primeGeoLocation(true);                    // 填 Key 后立即定位, 无需重开页面
    else { clearGeoCache(); setGeoStatus("nokey","未配置 Key"); }
    showSettings();
    return;
  }
  configUsage();
}


/* ------------------------------- set ----------------------------------- */
/* 月起始日的唯一校验入口: 1 / natural / 自然月 = 自然月; 其余必须是 1~28 的整数 */
function monthStartSet(raw){
  const v = String(raw==null?"":raw).toLowerCase();
  let d;
  if(v==="natural"||v==="自然月"||v==="1") d=1;
  else d = numeric(v);
  return (d==null || !Number.isInteger(d) || d<1 || d>28) ? null : d;
}
function doSet(tokens){
  const sub = (tokens[0]||"").toLowerCase();
  if(sub==="category" || sub==="cat" || sub==="categories"){
    /* 类别余额(信封预算): 与其它子项一样走 mutate → 一次撤销步 */
    doSetCategory(tokens.slice(1));
  } else if(sub==="budget"){
    const n = parseAmount(tokens[1]);
    if(n==null){ line([{t:"用法: set budget <金额>  例 set budget 1000 (金额需 ≥ ¥0.01 且为有限数)",c:COLOR.yellow}]); return; }
    state.settings.budget = n;
    line([{t:"✓ 默认预算已设为 ",c:COLOR.green},{t:"¥"+money(n),c:COLOR.pure,cls:"hl"},
          {t:"  (各期生效; 只想改本期可用 budget set <金额>)",c:COLOR.gray}]);
    showForecastLine();
  } else if(sub==="monthstart"){
    /* 校验抽成 monthStartSet, 与 config set monthstart 共用 */
    const d = monthStartSet(tokens[1]);
    if(d==null){ line([{t:"用法: set monthstart <1-28>  (1=自然月, 例 15 表示每月15日~下月14日)",c:COLOR.yellow}]); return; }
    state.settings.monthStart = d; state.settings.periodMode = "month"; ensureEpoch();
    const p = currentPeriod();
    line([{t:"✓ 切换为按月周期, 起始日 "+(d===1?"自然月":"每月 "+d+" 日")+"。当前周期: ",c:COLOR.green},{t:p.label,c:COLOR.cyan}]);
  } else if(sub==="period"||sub==="cycle"||sub==="length"){
    /* 旧写法(兼容保留): set period 15 / set period natural
       推荐写法: config set period … —— 两者走同一个 periodSetDays/periodSetMonth。 */
    const v=(tokens[1]||"").toLowerCase();
    const n = numeric(tokens[1]);
    if(v==="natural"||v==="month"||v==="月"||v==="自然月"){
      periodSetMonth(); const p=currentPeriod();
      line([{t:"✓ 已切回按月周期, 当前: ",c:COLOR.green},{t:p.label,c:COLOR.cyan}]);
      return;
    }
    if(tokens.length===3){                        // 旧命令也支持 set period <起> <止>
      const r = periodSetRange(tokens[1], tokens[2]);
      if(!r.ok){ line([{t:periodErrText(r),c:COLOR.yellow}]); return; }
      line([{t:"✓ 周期已设为 ",c:COLOR.green},{t:r.period.label,c:COLOR.cyan},
            {t:"  (共 "+r.days+" 天, 天数按起止日自动计算)",c:COLOR.gray}]);
      return;
    }
    const r = periodSetDays(n);
    if(!r.ok){ line([{t:"用法: config set period <N天>  例 config set period 15  → 每15天滚动一期;  config set period natural 回到自然月",c:COLOR.yellow}]); return; }
    line([{t:"✓ 已切换为滚动 "+state.settings.lengthDays+" 天周期, 从 "+state.settings.anchor+" 起每 "+state.settings.lengthDays+" 天滚动结算。当前期: ",c:COLOR.green},{t:r.period.label,c:COLOR.cyan}]);
  } else if(sub==="periodstart"||sub==="anchor"){
    if(!tokens[1]){ line([{t:"用法: config set periodstart <YYYY-MM-DD>  设滚动周期起点(锚点)",c:COLOR.yellow}]); return; }
    const r = periodSetStart(tokens[1]);
    if(!r.ok){ line([{t:periodErrText(r),c:COLOR.yellow}]); return; }
    line([{t:"✓ 滚动周期起点设为 "+r.anchor+"。当前期: ",c:COLOR.green},{t:r.period.label,c:COLOR.cyan}]);
  } else if(sub==="periodend"||sub==="periodstop"){
    if(!tokens[1]){ line([{t:"用法: config set periodend <YYYY-MM-DD>  设本期截止日(天数自动回算)",c:COLOR.yellow}]); return; }
    const r = periodSetEnd(tokens[1]);
    if(!r.ok){ line([{t:periodErrText(r),c:COLOR.yellow}]); return; }
    line([{t:"✓ 本期截止日设为 "+r.end+"  (共 "+r.days+" 天, 天数自动计算)。当前期: ",c:COLOR.green},{t:r.period.label,c:COLOR.cyan}]);
  } else if(sub==="weekstart"){
    const v=(tokens[1]||"").toLowerCase();
    if(v==="mon"||v==="周一"||v==="一") state.settings.weekStart="mon";
    else if(v==="sun"||v==="周日"||v==="日") state.settings.weekStart="sun";
    else { line([{t:"用法: set weekstart <mon|sun>",c:COLOR.yellow}]); return; }
    line([{t:"✓ 周起始日设为 "+(state.settings.weekStart==="mon"?"周一":"周日"),c:COLOR.green}]);
  } else if(sub==="alert"||sub==="threshold"||sub==="thresholds"){
    const rest = tokens.slice(1).join("").split(/[,，]/).map(x=>parseFloat(x)).filter(x=>!isNaN(x)&&x>0&&x<=100);
    if(!rest.length){ line([{t:"用法: set alert <p1,p2,...>  例 set alert 80,100",c:COLOR.yellow}]); return; }
    state.settings.thresholds = [...new Set(rest)].sort((a,b)=>a-b);
    line([{t:"✓ 预警阈值设为 "+state.settings.thresholds.join("% , ")+"%",c:COLOR.green}]);
  } else if(sub==="rate"||sub==="rates"){
    // set rate money 2 / set rate index 8  (年化百分比)
    const which = (tokens[1]||"").toLowerCase();
    const pct = numeric(tokens[2]);
    if(pct==null || pct<0 || pct>100){ line([{t:"用法: set rate <money|index> <年化%>  例 set rate index 8",c:COLOR.yellow}]); return; }
    if(which==="money"||which==="m"||which==="货币"){ state.settings.rateMoney = pct/100; }
    else if(which==="index"||which==="idx"||which==="i"||which==="指数"){ state.settings.rateIndex = pct/100; }
    else { line([{t:"用法: set rate <money|index> <年化%>",c:COLOR.yellow}]); return; }
    line([{t:"✓ 货币年化 "+(state.settings.rateMoney*100).toFixed(2)+"%  |  指数年化 "+(state.settings.rateIndex*100).toFixed(2)+"%",c:COLOR.green}]);
  } else if(sub==="invest"||sub==="investment"||sub==="consume"||sub==="ratio"||sub==="share"){
    // 旧写法(兼容保留): set invest 15 / set consume 85 / set ratio 0.85
    // 推荐写法: config set invest 15 —— 两者走同一个 setter, 只是输出不同(旧写法保留简短确认)
    const asInvest = (sub==="invest"||sub==="investment");
    const usage = "用法: config set invest <投资比例%>   例 config set invest 15   (消费占比 = 1 - 投资比例)"
                + "\n      (兼容旧写法: set invest 15 / set consume 85 / set ratio 0.85)";
    if(numeric(tokens[1])==null){ line([{t:usage,c:COLOR.yellow}]); return; }
    const oldPct = consumePct();
    const res = setInvestPct(numeric(tokens[1]), asInvest);
    if(!res.ok){ line([{t:res.msg,c:COLOR.yellow}]); return; }
    const sp = rateSplit();
    line([{t:"✓ 投资比例已更新: ",c:COLOR.green},
          {t:"消费占比 "+consumePct()+"%",c:COLOR.pure},
          {t:"  |  投资占比 "+invPct()+"%",c:COLOR.cyan},
          {t:"  (货币 "+r2(sp.mm*100)+"% + 指数 "+r2(sp.idx*100)+"%)",c:COLOR.index}]);
    line([{t:"  换算: 占用 = 消费 ÷ "+consumePct()+"%  →  消费¥100 ⇒ 占用¥"+money(100/consumeShare())
          +" (消费¥100 + 应投¥"+money(100/consumeShare()*(1-consumeShare()))+")",c:COLOR.gray}]);
    line([{t:"  ※ 已按新比例重算全部记录的应投额 (已投金额不会超过新的应投额)。",c:COLOR.gray}]);
    if(oldPct!==consumePct()) line([{t:"  原消费占比 "+oldPct+"%",c:COLOR.gray}]);
  } else if(sub==="daily"||sub==="daybudget"||sub==="每日"){
    // set daily <金额>  手动设置"每日可用余额"(用于右上角今日预算红黄绿提示); set daily off 取消
    const v=(tokens[1]||"").toLowerCase();
    if(v==="off"||v==="none"||v==="clear"||v==="取消"||v==="关"){
      state.settings.dailyBudget=null;
      line([{t:"✓ 已清除每日可用余额 (右上角「今日预算」转为灰点未设置)",c:COLOR.green}]);
    } else {
      const n=parseAmount(tokens[1]);
      if(n==null){ line([{t:"用法: set daily <金额>  例 set daily 100  (每日可用余额;  set daily off 取消)",c:COLOR.yellow}]); return; }
      state.settings.dailyBudget=n;
      const ts=todaySnapshot();
      line([{t:"✓ 每日可用余额已设为 ",c:COLOR.green},{t:"¥"+money(n),c:COLOR.pure,cls:"hl"},
            {t:"  今日已消费 ¥"+money(ts.consumption),c:COLOR.gray}]);
      line(dotLine("今日预算", ratioDot(ts.ratio)));
    }
  } else {
    line([{t:"set 支持: daily <每日可用余额> | monthstart <1-28> | weekstart <mon|sun> | alert <阈值> | rate <money|index> <年化%> | category <类别> <金额>",c:COLOR.yellow}]);
    line([{t:"预算 / 投资比例 / 周期请用: config set budget <金额> [now]  ·  config set invest <比例%>  ·  config set period <N天>",c:COLOR.gray}]);
  }
}

/* ------------------------------- budget -------------------------------- */
/* 配置预算: budget set <金额>=仅改当期; budget default <金额>=以后各期; budget reset=取消当期覆盖 */
function doBudget(tokens){
  const sub = (tokens[0]||"").toLowerCase();
  const p = currentPeriod();
  if(sub==="set" || sub==="now" || sub==="current"){
    const n = parseAmount(tokens[1]);
    if(n==null){ line([{t:"用法: budget set <金额>   例 budget set 1200 (仅调整当前周期; 金额需 ≥ ¥0.01)",c:COLOR.yellow}]); return; }
    state.settings.periodBudget = state.settings.periodBudget || {};
    state.settings.periodBudget[p.start] = n;
    line([{t:"✓ 当期预算已设为 ",c:COLOR.green},{t:"¥"+money(n),c:COLOR.pure,cls:"hl"},
          {t:"  仅影响当前周期 "+p.label+"；以后各期仍为 ¥"+money(state.settings.budget),c:COLOR.gray}]);
    showForecastLine();
    return;
  }
  if(sub==="default"){
    const n = parseAmount(tokens[1]);
    if(n==null){ line([{t:"用法: budget default <金额>   例 budget default 1000 (改默认, 各期生效)",c:COLOR.yellow}]); return; }
    state.settings.budget = n;
    line([{t:"✓ 默认预算已设为 ",c:COLOR.green},{t:"¥"+money(n),c:COLOR.pure,cls:"hl"},{t:" (未单独覆盖的周期都用它)",c:COLOR.gray}]);
    showForecastLine();
    return;
  }
  if(sub==="reset" || sub==="clear"){
    if(state.settings.periodBudget){ delete state.settings.periodBudget[p.start]; }
    line([{t:"✓ 已取消当前周期的预算覆盖，恢复默认 ¥"+money(state.settings.budget),c:COLOR.green}]);
    showForecastLine();
    return;
  }
  showBudget();
}
function showBudget(){
  const st = periodSnapshot();
  const p = st.p, b = st.B;
  const bar = progressBar(st.ratio);
  const aw = alertWord(st.ratio);
  const carry = r2(st.usedUnits - b);            // >0 透支, <=0 本期可结转(=剩余)
  const bal = availableBalance();
  const sp = rateSplit();
  blank();
  sectionHead("周期预算", p.label);
  kvRow("本期发放", "¥"+money(b), 0, COLOR.pure);
  kvRow("本期消费", "¥"+money(st.consumption)+"   ("+st.rows.length+" 笔)", 0, COLOR.pure);
  kvRow("应投合计", [
    {t:"¥"+money(st.invest), c:COLOR.cyan},
    {t:"   (货币 ¥"+money(st.mm)+" + 指数 ¥"+money(st.idx)+")", c:COLOR.gray}
  ], 0);
  kvRow("已占用(含应投)", "¥"+money(st.usedUnits), 0, bar.color, true);
  kvRow("累计可用余额(含结转)", "¥"+money(bal), 0, bal<0?COLOR.red:COLOR.green, true);
  /* 钱包 ↔ 预算对照: 钱包余额是手动维护的"手里有多少", 只在这里并排给出, 不参与占用/结转 */
  const wcmp = walletBudgetCompare();
  kvRow("钱包余额合计", [
    {t:"¥"+money(wcmp.total), c:wcmp.total<0?COLOR.red:COLOR.green},
    {t:"   ("+state.wallets.length+" 个钱包 · 手动维护)", c:COLOR.gray},
    {t:"   ↔ 可用余额 ¥"+money(bal), c:COLOR.cyan},
    {t:"   钱包"+(wcmp.diff>=0 ? "多" : "少")+" ¥"+money(Math.abs(wcmp.diff)), c:COLOR.gray}
  ], 0);
  kvRow("本期结余/透支", [
    {t:(carry>0?"透支 -":"可结转 +")+money(Math.abs(carry)), c:carry>0?COLOR.red:COLOR.green},
    {t:"   (发放 ¥"+money(b)+" − 占用 ¥"+money(st.usedUnits)+")", c:COLOR.gray}
  ], 0);
  ratioBar(st.ratio, {
    label: "本期发放进度",
    sub: "占用 ÷ 发放; 虚线 = 100% 额度线(越线即透支)"
  });
  if(carry > 0){
    line([{t:"⚠ 本期已透支 ¥"+money(carry)+" (将自下期发放中扣除)",c:COLOR.red,cls:"glow"}]);
  } else {
    line([{t:"✓ 本期可结转 ¥"+money(-carry),c:COLOR.green}]);
  }
  line([{t:aw.t,c:aw.c,cls:"glow"}]);
  /* 红黄绿实心圆点: 类别余额(仅已触发预警的类别, 未超额完全不显示) → 今日预算 → 周期预算。
     类别超额要先于整体预算被看到, 所以排在「今日/周期预算」**之前**。 */
  const ts = todaySnapshot();
  for(const a of catAlertList(p)) line(catDotLine(a));
  line(dotLine("今日预算", ratioDot(ts.ratio)));
  line(dotLine("周期预算", ratioDot(st.ratio)));
  blank();
  line([{t:"换算口径: 消费 ¥"+money(st.consumption)+" → 占用 ¥"+money(st.usedUnits)
        +" = 消费÷"+consumePct()+"%; 其中应投 "+invPct()+"% (货币 "+r2(sp.mm*100)+"% / 指数 "+r2(sp.idx*100)+"%)", c:COLOR.gray}]);
  if(hasBudgetOverride(p)){
    line([{t:"  ※ 本期为自定义预算 ¥"+money(b)+" (默认 ¥"+money(state.settings.budget)+"); budget reset 可恢复", c:COLOR.yellow}]);
  }
  showForecastLine();
  blank();
}

/* ====================== 类别余额(命令层, ) ======================
   set category                     查看类别余额表
   set category 餐饮 400 交通 300    一次配置多个类别(原子: 任一对不合法则整体不改)
   set category 餐饮 400 nowarn     只对"该类别超额提示"静默(nowarn|silent|静默); 不写 = 恢复提示
   set category 餐饮 off            取消该类别(同时清掉静默标记);  set category reset 全部清除
   约束: 已配置合计 ≤ 总可用余额(当期预算 × N%)。已经超额的账本(例如后来调低了预算)
         只能往下调 —— total ≤ 当前合计时放行, 否则拒绝, 避免"越改越超"。 */
function catBudgetUsage(){
  line([{t:"用法: set category                     查看类别余额(总可用/已配置/可配置 + 每类使用率)", c:COLOR.yellow}]);
  line([{t:"      set category <类别> <金额> [nowarn] [...]   例 set category 餐饮 400 交通 300", c:COLOR.yellow}]);
  line([{t:"      nowarn|silent|静默 = 该类别不提示超额;  off 取消该类别;  reset = 全部清除", c:COLOR.yellow}]);
}
/* 五列网格: 类别 / 已分配 / 已支出 / 剩余可用 / 使用率。
   用 DOM 网格而不是空格对齐 —— 中文类别是双宽字符, padEnd 对不齐(全站表格同理)。 */
function catBudgetTable(rows){
  const wrap = document.createElement("div"); wrap.className = "l cb-table";
  const cell = (txt, cls, color)=>{
    const s = document.createElement("span");
    s.className = "cb-"+cls;
    if(color) s.style.color = color;
    s.textContent = txt;
    return s;
  };
  const head = document.createElement("div"); head.className = "cb-tr hd";
  head.append(cell("类别","nm"), cell("已分配","num"), cell("已支出","num"),
              cell("剩余可用","num"), cell("使用率","pc"));
  wrap.appendChild(head);
  let ta = 0, ts = 0;
  for(const r of rows){
    ta += r.alloc; ts += r.spent;
    const tr = document.createElement("div"); tr.className = "cb-tr"; tr.dataset.cat = r.cat;
    const nm = document.createElement("span"); nm.className = "cb-nm";
    const sw = document.createElement("i"); sw.className = "cb-sw"; sw.style.background = catColor(r.cat);
    const tx = document.createElement("span"); tx.textContent = r.cat;
    nm.append(sw, tx);
    /* 静默类别: 名字后加浅色标记, 使用率用灰色(不按警告色) —— 让"为什么这里不亮圆点"看得出来 */
    if(catMuted(r.cat)){
      const mt = document.createElement("span");
      mt.textContent = "静默";
      mt.style.color = COLOR.gray; mt.style.fontSize = "11px";
      nm.append(mt);
    }
    tr.append(nm,
             cell("¥"+money(r.alloc), "num"),
             cell("¥"+money(r.spent), "num"),
             cell("¥"+money(r.left), "num", r.left<0 ? COLOR.red : COLOR.white),
             cell((r.ratio*100).toFixed(1)+"%", "pc",
                  catMuted(r.cat) ? COLOR.gray : LEVEL_COLOR[barLevel(r.ratio)]));
    wrap.appendChild(tr);
  }
  const ft = document.createElement("div"); ft.className = "cb-tr ft";
  ft.append(cell("合计","nm"), cell("¥"+money(r2(ta)),"num"), cell("¥"+money(r2(ts)),"num"),
            cell("¥"+money(r2(ta-ts)),"num"), cell("","pc"));
  wrap.appendChild(ft);
  term.appendChild(wrap);
  return wrap;
}
function printCategoryBudget(){
  const p = currentPeriod();
  const pool = catPool(p), alloc = catAllocated(), left = catPoolLeft(p);
  const rows = catBudgetRows(p);
  const al = catAlertList(p);
  blank();
  sectionHead("类别余额", p.label);
  kvRow("总可用余额", [
    {t:"¥"+money(pool), c:COLOR.pure, cls:"glow"},
    {t:"   (当期预算 ¥"+money(effectiveBudget(p))+" × 消费 "+consumePct()+"%)", c:COLOR.gray}
  ], 0);
  kvRow("已配置", [
    {t:"¥"+money(alloc), c:COLOR.pure},
    {t:"   ("+rows.length+" 个类别)", c:COLOR.gray}
  ], 0);
  kvRow("可配置余额", "¥"+money(left), 0, left<0 ? COLOR.red : COLOR.green, true);
  if(rows.length) catBudgetTable(rows);
  else line([{t:"  还没有配置类别余额 —— 例: set category 餐饮 400 交通 300", c:COLOR.gray}]);
  if(rows.length){
    line([{t:"  使用率 = 已消费 ÷ 已分配; 已消费按本期统计(分摊成本按落在本期的天数计入)", c:COLOR.gray}]);
    if(al.length) for(const a of al) line(catDotLine(a));
    else line([{t:"✓ 所有已配置类别都在阈值内", c:COLOR.green}]);

}
function doSetCategory(args){
  const toks = args.map(t=>String(t));
  const first = (toks[0]||"").toLowerCase();
  /* 单 token 才是"查看/全清": `set category list 100` 是给名为 list 的类别配额度, 不吞掉参数 */
  if(!toks.length || (toks.length===1 && (first==="list" || first==="show" || first==="ls"))){ printCategoryBudget(); return; }
  if(toks.length===1 && (first==="reset" || first==="clearall" || first==="all")){
    state.settings.categoryBudget = {};
    state.settings.categoryMute = {};          // 全清: 静默标记一并清掉
    line([{t:"✓ 已清空全部类别余额", c:COLOR.green}]);
    printCategoryBudget();
    return;
  }
  /* 先整表算完再落 state: 任何一对不合法都不改, 不会出现"改了一半"的中间态。
     可变长参数对: <类别> <金额> [nowarn|silent|静默] —— 第三个 token 是可选标记, 不写 = 恢复提示。 */
  const cur = catAllocated();
  const next = Object.assign({}, catAllocMap());
  const nextMute = Object.assign({}, catMuteMap());
  const changed = [];
  let muteDirty = false;
  for(let i=0;i<toks.length;){
    const cat = toks[i].trim();
    const raw = toks[i+1];
    if(!cat || raw==null){ catBudgetUsage(); return; }
    /* 超长类别名不静默截断: 截断会造出匹配不上记录名的幽灵键(记账侧同样没有长度上限) */
    if(cat.length > CAT_NAME_MAX){
      line([{t:"✗ 类别名过长("+cat.length+" > "+CAT_NAME_MAX+" 字符): "+cat.slice(0,16)+"…", c:COLOR.yellow}]);
      return;
    }
    const mark = (toks[i+2]!=null) ? String(toks[i+2]).toLowerCase() : "";
    const mute = CAT_ALLOC_MUTE.includes(mark);
    const step = mute ? 3 : 2;
    if(CAT_ALLOC_OFF.includes(String(raw).toLowerCase())){
      /* 取消分配必须同步删掉静默标记, 否则下次重新配置会"继承"静默、该报的警不报了 */
      if(nextMute[cat]!=null){ delete nextMute[cat]; muteDirty = true; }
      if(next[cat]!=null){ delete next[cat]; changed.push(cat); }
      i += step; continue;
    }
    const amt = parseAmount(raw);
    if(amt==null){
      line([{t:"✗ 「"+cat+"」的金额无效: "+raw+"   (需 ≥ ¥0.01 的有限数; 取消该类别写 off)", c:COLOR.yellow}]);
      return;
    }
    next[cat] = amt; changed.push(cat);
    if(mute){ if(nextMute[cat]!==true){ nextMute[cat] = true; muteDirty = true; } }
    else if(nextMute[cat]!=null){ delete nextMute[cat]; muteDirty = true; }
    i += step;
  }
  if(!changed.length && !muteDirty){ printCategoryBudget(); return; }
  let total = 0; for(const k in next) total += next[k]; total = r2(total);
  const pool = catPool();
  if(total > pool + 0.005 && total > cur + 0.005){
    line([{t:"✗ 已配置合计 ¥"+money(total)+" 超过总可用余额 ¥"+money(pool), c:COLOR.red, cls:"glow"}]);
    line([{t:"  总可用余额 = 当期预算 ¥"+money(effectiveBudget(currentPeriod()))+" × 消费 "+consumePct()
          +"%; 先减少其它类别, 或用 config set budget 调高预算", c:COLOR.gray}]);
    return;
  }
  state.settings.categoryBudget = next;
  state.settings.categoryMute = nextMute;
  line([{t:"✓ 已更新类别余额: "+changed.join("、"), c:COLOR.green}]);
  if(total > pool + 0.005) line([{t:"⚠ 已配置合计比总可用余额多 ¥"+money(r2(total-pool))+" (只能下调, 请尽快减回额度内)", c:COLOR.yellow}]);
  printCategoryBudget();
}

/* ===================== 地点 place =====================
   目标: 记账时自动带出**行政区地名**, 也允许手动填写; 只存地名字符串, 不存坐标。
   合规: 只接腾讯地图 JSAPI GL (service 库) 的 TMap.service.Geocoder; 不手写 fetch、
        不用任何境外/无资质地图源。key 由用户自己申请并写进本地 settings, 代码只有占位符。
   架构: 命令链路(add)只负责"发起异步任务"并传记录对象; 结果回来后 applyAutoPlace()
        先做对象引用/模式复查, 再经 mutate 压一步撤销 + commit()(H4 统一提交点)落盘刷新。
        P0 修复后自动填地点是**可独立撤销的一步**(旧版不经 mutate, 会被无关 undo 静默清掉)。 */
function normalizePlace(v){
  if(v==null) return "";
  return String(v).replace(/[\u0000-\u001f\u007f]/g," ").trim().slice(0,GEO_MAX_PLACE_LEN);
}
/* P1 B-12: Key 的唯一归一化入口 —— config 写入、备份/重启加载都走这里。
   占位符、提示文案、含空白或引号的脏值一律当作"没填", 绝不拿去发请求。 */
function normalizeGeoKey(v){
  if(typeof v!=="string") return "";
  const s = v.trim().slice(0,128);
  if(!s || s===GEO_KEY_PLACEHOLDER || s.indexOf("请")===0 || /[\s"'`]/.test(s)) return "";
  return s;
}
function maskGeoKey(k){
  const s = String(k||"");
  return s.length>8 ? (s.slice(0,3)+"…"+s.slice(-3)) : "***";
}
function geoModeLabel(){ return (state && state.settings.geoMode==="auto") ? "自动" : "手动"; }
/* 手动设置/清除地点: 走 runCommand 的 mutate → 自然进撤销栈 */
function doPlace(tokens){
  const id = numeric(tokens[0]);
  if(id==null){ line([{t:"用法: place <id> <地点..>   (place <id> - 清除; 例 place 3 广东省深圳市南山区)",c:COLOR.yellow}]); return; }
  const rec = state.records.find(r=>r.id===id);
  if(!rec){ line([{t:"未找到 #"+id+"。用 list 查看编号",c:COLOR.yellow}]); return; }
  /* P1 B-14: 与 add/amort/update 共用 splitRecordArgs() —— 剥离 @日期 / #地点 参数,
     不再把 "北京市 @2027-08-30" 整串存成地名; 清除关键字只在「单个裸 token 且大小写精确」
     时成立, 地名 Clear / Off 不再被误清空(旧写法把整串忽略大小写后比对关键字)。 */
  const args = splitRecordArgs(tokens.slice(1));
  const parts = args.tokens.map(String);
  const only = parts.length===1 ? parts[0] : null;
  const raw = (args.place!=null ? args.place : parts.join(" ").trim());
  const CLEAR_TOKENS = ["-","clear","off","清除"];
  const cleared = args.place==="-" || args.place==="off" ||
                  (args.place==null && only!==null && CLEAR_TOKENS.includes(only));
  if(!cleared && !raw){ line([{t:"用法: place <id> <地点..>   (place <id> - 清除; 不填则空着)",c:COLOR.yellow}]); return; }
  rec.place = cleared ? "" : normalizePlace(raw);
  line([{t:cleared?"✗ 已清除 #":"✓ #",c:cleared?COLOR.yellow:COLOR.green},
        {t:String(id),c:COLOR.pure},
        {t:cleared?" 的地点":" 地点 → ",c:COLOR.gray},
        {t:cleared?"":rec.place,c:COLOR.cyan}]);
}
/* ---------- WGS-84 → GCJ-02 (浏览器定位坐标 → 腾讯地图坐标系) ----------
   纯本地换算, 不发请求; 境外坐标不做偏移。 */
function geoTransformLat(x,y){
  let ret = -100.0+2.0*x+3.0*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  ret += (20.0*Math.sin(6.0*x*Math.PI)+20.0*Math.sin(2.0*x*Math.PI))*2.0/3.0;
  ret += (20.0*Math.sin(y*Math.PI)+40.0*Math.sin(y/3.0*Math.PI))*2.0/3.0;
  ret += (160.0*Math.sin(y/12.0*Math.PI)+320.0*Math.sin(y*Math.PI/30.0))*2.0/3.0;
  return ret;
}
function geoTransformLng(x,y){
  let ret = 300.0+x+2.0*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  ret += (20.0*Math.sin(6.0*x*Math.PI)+20.0*Math.sin(2.0*x*Math.PI))*2.0/3.0;
  ret += (20.0*Math.sin(x*Math.PI)+40.0*Math.sin(x/3.0*Math.PI))*2.0/3.0;
  ret += (150.0*Math.sin(x/12.0*Math.PI)+300.0*Math.sin(x/30.0*Math.PI))*2.0/3.0;
  return ret;
}
function wgs84ToGcj02(lat,lng){
  if(!isFinite(lat) || !isFinite(lng)) return null;
  if(lat<0.8293 || lat>55.8271 || lng<72.004 || lng>137.8347) return {lat,lng};
  const a=6378245.0, ee=0.00669342162296594323;
  let dLat=geoTransformLat(lng-105.0, lat-35.0), dLng=geoTransformLng(lng-105.0, lat-35.0);
  const radLat = lat/180.0*Math.PI;
  let magic = Math.sin(radLat); magic = 1 - ee*magic*magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat*180.0)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);
  dLng = (dLng*180.0)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);
  return { lat:lat+dLat, lng:lng+dLng };
}
/* 只取省/市/区, 直辖市 province===city 时去重; POI / 街道 / 门牌一律不取 */
function placeFromAddressComponent(ac){
  if(!ac || typeof ac!=="object") return "";
  const parts=[];
  for(const k of ["province","city","district"]){
    const v = typeof ac[k]==="string" ? normalizePlace(ac[k]) : "";
    if(v && !parts.includes(v)) parts.push(v);
  }
  return normalizePlace(parts.join(""));
}
/* 左上角只显示区/县级(如「南山区」); 没有 district 时退回完整地名的末段 */
function districtFromAddressComponent(ac){
  if(!ac || typeof ac!=="object") return "";
  for(const k of ["district","city","province"]){
    const v = typeof ac[k]==="string" ? normalizePlace(ac[k]) : "";
    if(v) return v;
  }
  return "";
}
function districtOf(place){
  const s = normalizePlace(place);
  const m = /([^省市区]{1,10}(?:区|县|旗|盟))$/.exec(s);
  return m ? m[1] : s;
}
/* 按需加载官方 SDK: URL 只带用户自填的 key, 代码里没有有效 key。
   P1 B-09: 缓存按 Key 绑定; onload 失败 / onerror / 超时 / 宿主缺失一律清缓存允许下次重试;
            换 Key 时丢弃旧 script 与旧的全局 SDK 实例, 不再拿旧 Key 鉴权。 */
let tmapLoadPromise = null, tmapLoadedKey = "", tmapScriptEl = null, tmapScriptHost = null, tmapTimer = null;
function resetTMapSDK(){
  tmapLoadPromise = null; tmapLoadedKey = "";
  if(tmapTimer){ clearTimeout(tmapTimer); tmapTimer = null; }
  if(tmapScriptEl){
    if(tmapScriptHost && typeof tmapScriptHost.removeChild==="function") tmapScriptHost.removeChild(tmapScriptEl);
    tmapScriptEl = null; tmapScriptHost = null;
  }
  /* 浏览器里 SDK 挂在 window 上; 不清掉就会一直复用旧 Key 的实例(测试注入的 TMap 是形参, 不受影响) */
  try{ if(typeof window!=="undefined" && window && "TMap" in window) window.TMap = undefined; }catch(e){}
}
function loadTMapSDK(){
  const key = (state && state.settings) ? state.settings.geoKey : "";
  if(!key) return Promise.resolve(false);
  if(tmapLoadPromise && tmapLoadedKey===key) return tmapLoadPromise;
  if(tmapLoadPromise) resetTMapSDK();          // Key 变了: 旧 promise / 旧 script 一律作废
  const preloaded = typeof TMap!=="undefined" && TMap && TMap.service && TMap.service.Geocoder;
  if(preloaded && !tmapScriptEl){              // 页面已自带 / 测试注入的 SDK: 绑定当前 Key 复用
    tmapLoadedKey = key;
    tmapLoadPromise = Promise.resolve(true);
    return tmapLoadPromise;
  }
  tmapLoadedKey = key;
  tmapLoadPromise = new Promise((resolve)=>{
    let done = false;
    const finish = (ok)=>{
      if(done) return; done = true;
      if(tmapTimer){ clearTimeout(tmapTimer); tmapTimer = null; }
      if(!ok) resetTMapSDK();                 // 失败/超时/缺 Geocoder → 下一次重新加载, 不永久缓存
      resolve(ok);
    };
    const s = document.createElement("script");
    s.id = "tmapSdkScript";
    s.src = GEO_SDK_BASE + "&key=" + encodeURIComponent(key);
    s.onload = ()=> finish(!!(typeof TMap!=="undefined" && TMap && TMap.service && TMap.service.Geocoder));
    s.onerror = ()=> finish(false);
    const host = document.head || document.body;
    if(!host || typeof host.appendChild!=="function"){ finish(false); return; }
    tmapScriptEl = s; tmapScriptHost = host;
    host.appendChild(s);
    tmapTimer = setTimeout(()=>finish(false), GEO_SDK_TIMEOUT_MS);
    if(tmapTimer && typeof tmapTimer.unref==="function") tmapTimer.unref();   // 离线测试不挂住进程
  });
  return tmapLoadPromise;
}
function geoLocate(){
  return new Promise((resolve,reject)=>{
    const g = (typeof navigator!=="undefined") ? navigator.geolocation : null;
    if(!g || typeof g.getCurrentPosition!=="function"){ reject(new Error("no-geolocation")); return; }
    g.getCurrentPosition(
      (pos)=>{
        const c = pos && pos.coords;
        if(!c || !isFinite(c.latitude) || !isFinite(c.longitude)){ reject(new Error("bad-coords")); return; }
        resolve({ lat:c.latitude, lng:c.longitude });   // 只在内存里, 绝不写 state
      },
      (err)=>reject(err || new Error("geo-denied")),
      { enableHighAccuracy:false, timeout:GEO_TIMEOUT_MS, maximumAge:60000 }
    );
  });
}
function geoReverse(lat,lng){
  const gcj = wgs84ToGcj02(lat,lng);
  if(!gcj) return Promise.reject(new Error("bad-coords"));
  return loadTMapSDK().then((ok)=>{
    if(!ok) throw new Error("sdk-unavailable");
    // 官方 API: new TMap.service.Geocoder().getAddress({location: new TMap.LatLng(lat,lng)})
    // → Promise<AddressResult>, 取 result.address_component 的 province/city/district
    return new TMap.service.Geocoder().getAddress({ location: new TMap.LatLng(gcj.lat, gcj.lng) });
  }).then((res)=>{
    const r = res && res.result;
    const ac = r && (r.address_component || r.ad_info);
    const place = placeFromAddressComponent(ac);
    if(!place) throw new Error("empty-address");
    return { place, district: districtFromAddressComponent(ac) || districtOf(place) };
  });
}
/* ============ 启动预热 ============
   旧模型: 每笔 add 后异步定位 → 结果回来再回填记录。用户实测"定位晚于数据落盘",
     派生出 id 复用 / undo 吞掉地名 / 期间切模式 等一串竞态。
   新模型: **打开时只申请一次定位**; 结果只写内存 + 独立 localStorage 缓存 + 左上角 badge。
     记账时从缓存**同步**取地名写进 rec.place, 随命令的 mutate→commitIfDirty() 一次落盘。
     异步链路不再触碰 state.records, 竞态从根上消失; 一次记账仍只压一步撤销。 */
let geoCache = { place:"", district:"" };   // 只存地名字符串, 不存坐标
let geoStatus = { kind:"idle", text:"定位中…" };
let geoPrimed = false;                       // 每次打开只申请一次
let geoBadgeEl = null, geoBadgeTextEl = null, geoBadgeCanvasEl = null;
function loadGeoCache(){
  try{
    const o = JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || "null");
    if(o && typeof o.place==="string" && o.place){
      geoCache = { place:normalizePlace(o.place), district:normalizePlace(o.district) || districtOf(o.place) };
      return true;
    }
  }catch(e){ /* 缓存损坏当没缓存 */ }
  geoCache = { place:"", district:"" };
  return false;
}
function saveGeoCache(){
  try{ localStorage.setItem(GEO_CACHE_KEY, JSON.stringify({place:geoCache.place, district:geoCache.district})); }
  catch(e){ /* 隐私模式/禁用存储: 缓存非必需, 静默 */ }
}
function clearGeoCache(){
  geoCache = { place:"", district:"" };
  try{ localStorage.removeItem(GEO_CACHE_KEY); }catch(e){}
}
function setGeoStatus(kind, text){
  geoStatus = { kind, text };
  if(!geoBadgeEl || !geoBadgeTextEl) return;
  geoBadgeEl.className = "geo-badge "+kind;
  geoBadgeTextEl.textContent = text;
  drawGeoIcon();
}
/* 地点图标: 左上角 badge 与所有行内地点共用同一套 Canvas 2D 手绘准星 ——
   直角刻线 + 圆环 + 方形中心点, 与站内的方形进度条/色块同一套视觉语言。
   状态色随 kind 变化; 不用 Emoji / 外部图片。
   getContext 不可用(离线 DOM stub)时静默降级, 文字仍可读。 */
function paintGeoIcon(cv, kind){
  const ctx = cv && cv.getContext ? cv.getContext("2d") : null;
  if(!ctx) return;
  const side = 16, dpr = 2;
  cv.width = side*dpr; cv.height = side*dpr;
  cv.style.width = side+"px"; cv.style.height = side+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,side,side);
  const col = (kind==="locating"||kind==="nokey"||kind==="failed") ? COLOR.yellow
            : (kind==="off"||kind==="unsupported"||kind==="idle") ? COLOR.gray : COLOR.cyan;
  ctx.strokeStyle = col; ctx.lineWidth = 1.25; ctx.lineCap = "butt";
  ctx.beginPath(); ctx.arc(8,8,5.25,0,Math.PI*2); ctx.stroke();   // 外圈准星
  ctx.beginPath();                                                  // 四向直角刻线
  ctx.moveTo(8,0.5);  ctx.lineTo(8,2.2);
  ctx.moveTo(8,13.8); ctx.lineTo(8,15.5);
  ctx.moveTo(0.5,8);  ctx.lineTo(2.2,8);
  ctx.moveTo(13.8,8); ctx.lineTo(15.5,8);
  ctx.stroke();
  ctx.fillStyle = (kind==="ok"||kind==="cached") ? COLOR.green : col;
  ctx.fillRect(7,7,2,2);                                            // 方形中心点
}
function drawGeoIcon(){ paintGeoIcon(geoBadgeCanvasEl, geoStatus.kind); }
/* 行内地点图标: 每处新建一个 16×16 canvas, 与左上角"已定位"状态同色 */
function makeGeoIcon(){

/* 所有 DOM 里的地点展示统一走这里; lead / label 只是命令输出与列表行的文案差异。

/* 左上角 badge: 由 refreshHeader() 清空后第一个 append, 不占 .stat 索引(浏览器探针按 .stat 取列) */
function renderGeoBadge(bar){

let geoHintShown = false;
function geoHintOnce(){
  if(geoHintShown) return;
  geoHintShown = true;
  line([{t:"   ℹ 自动定位未启用: 在顶部「设置」页的「地点与地图 Key」卡片填入自己的腾讯地图 Key 后会自动重新定位; 或切到全手动。", c:COLOR.gray}]);
}
/* P1 B-10: 失败不再 .catch(()=>{}) 全吞 —— badge title 记具体原因、终端按原因一次性提示、
   console.warn 每次留痕; 用户能区分「拒绝授权 / 超时 / Key 无效 / 无网 / 无行政区结果」。 */
const geoWarned = new Set();
function geoErrorText(err){
  const code = err && err.code, msg = String((err && err.message) || err || "");
  if(code===1) return "定位权限被拒绝(在浏览器地址栏重新授权)";
  if(code===2) return "位置信息不可用(检查系统定位服务)";
  if(code===3 || /timeout/i.test(msg)) return "定位超时";
  if(msg==="no-geolocation") return "浏览器不支持定位";
  if(msg==="bad-coords") return "定位坐标无效";
  if(msg==="sdk-unavailable") return "地图 SDK 加载失败(Key 无效 / 无网络 / 脚本被拦截)";
  if(msg==="empty-address") return "逆地理编码没有返回行政区";
  if(/network|fetch|fail/i.test(msg)) return "地图服务请求失败(网络或 Key 鉴权)";
  return "定位失败("+msg.slice(0,40)+")";
}
function geoWarnOnce(err){
  const text = geoErrorText(err);
  try{ console.warn("[geo] "+text); }catch(e){}
  if(geoWarned.has(text)) return text;
  geoWarned.add(text);
  line([{t:"   ⚠ 自动定位失败: "+text+"  (顶部「设置」页 →「地点与地图 Key」可查 Key / 切全手动, 点击左上角图标重试)", c:COLOR.yellow}]);
  return text;
}
/* 每次打开调用一次(boot); 切模式/填 Key/点 badge 时 force 补一次。记账时绝不发起定位。 */
function primeGeoLocation(force){
  if(geoPrimed && !force) return;
  geoPrimed = true;
  if(!state) return;
  if(state.settings.geoMode!=="auto"){
    clearGeoCache(); setGeoStatus("off","全手动"); return;
  }
  const g = (typeof navigator!=="undefined") ? navigator.geolocation : null;
  if(!g || typeof g.getCurrentPosition!=="function"){
    setGeoStatus("unsupported","定位不可用"); return;   // 离线测试环境: 完全静默
  }
  if(!state.settings.geoKey){
    setGeoStatus("nokey","未配置 Key"); geoHintOnce(); return;
  }
  if(!geoCache.place) setGeoStatus("locating","定位中…");
  else setGeoStatus("cached", geoCache.district || districtOf(geoCache.place));
  geoLocate()
    .then(c=>geoReverse(c.lat,c.lng))
    .then((r)=>{
      // 期间切全手动 / 清空 Key → 只丢弃缓存更新, 绝不改任何记录
      if(!state || state.settings.geoMode!=="auto" || !state.settings.geoKey) return;
      geoCache = { place:r.place, district:r.district || districtOf(r.place) };
      saveGeoCache();
      setGeoStatus("ok", geoCache.district || districtOf(geoCache.place));
      if(geoBadgeEl) geoBadgeEl.title = "当前记账地点 · 点击重新定位";
    })
    .catch((err)=>{
      const reason = geoWarnOnce(err);
      if(geoBadgeEl) geoBadgeEl.title = "定位失败: "+reason+" · 点击重试";
      if(geoCache.place) setGeoStatus("cached", geoCache.district || districtOf(geoCache.place));
      else setGeoStatus("failed","定位失败");
    });

/* 记账时同步读取(无异步): 全手动/无定位结果时返回空串 */
function currentGeoPlace(){
  return (state && state.settings.geoMode==="auto") ? geoCache.place : "";
}
/* ---------- 设置页「地点与地图 Key」卡片 (UI 一律回灌命令, H5 双通道对称) ----------

const GEO_COMMANDS = { auto:"config set geo auto", manual:"config set geo manual" };
function refreshGeoUI(){
  // 全手动时左上角不许残留上次定位的区名
  if(state && state.settings.geoMode==="manual" && geoStatus.kind!=="off") setGeoStatus("off","全手动");
}
function fillGeoModal(){
  const k = state.settings.geoKey;
  const el = document.getElementById("g_key");
  el.value = "";                              // 不回显明文 key
  el.placeholder = k ? ("已配置 ("+maskGeoKey(k)+")，留空则不修改") : "请在腾讯位置服务开放平台申请自己的 key 并填入";
  updateGeoHint();
}
function openGeoModal(){
  fillGeoModal();
  openOverlay("geoWrap");
  document.getElementById("g_key").focus();
}
function closeGeoModal(){ document.getElementById("geoWrap").classList.remove("open"); }
function updateGeoHint(){
  const auto = state.settings.geoMode==="auto";
  document.getElementById("g_auto").classList.toggle("on", auto);
  document.getElementById("g_manual").classList.toggle("on", !auto);
  document.getElementById("g_hint").textContent =
    "自动填充地址: 打开时申请一次定位, 左上角显示区名; 记账时同步写入省/市/区(不会晚于落盘)。\n"+
    "点击左上角定位图标、切模式或填 Key 会重新定位; 坐标不落盘。\n"+
    "全手动: 不定位, 地点留空; 可用 place <id> <地点> 或弹窗里的「地点」字段补填。\n"+
    "分摊成本(amort) 从不自动带地点。";
  document.getElementById("g_key_hint").textContent =
    "申请: 腾讯位置服务控制台 → 应用管理 → 我的应用 → 创建应用 → 添加 Key(勾选 Web端 JSAPI 与 WebServiceAPI)。\n"+
    "本地 file:// 打开时 Referer 为空: 域名白名单请留空/不启用; 商用请改后端代理鉴权。\n"+
    "SDK 模板: "+GEO_SDK_URL_TEMPLATE;
}
function setGeoMode(mode){
  runCommand(GEO_COMMANDS[mode==="auto"?"auto":"manual"]);
  updateGeoHint();
}
function saveGeoKey(){
  const v = document.getElementById("g_key").value.trim();
  if(!v){ document.getElementById("g_key_hint").textContent = "请填入自己的 Key；留空不会修改。"; return; }
  closeGeoModal();
  runCommand("config set geokey "+quote(v));   // P1 B-12: 整串 quote, 不再被 tokenize 吞掉
}
function submitGeoPlace(){
  const id = document.getElementById("g_id").value.trim();
  const p  = document.getElementById("g_place").value.trim();
  if(!/^\d+$/.test(id) || !p){
    document.getElementById("g_key_hint").textContent = "请填记录 id 与地点 (地点填 - 可清除)。id 见 list。";
    return;
  }
  closeGeoModal();
  /* P1 B-14: 地名以 # / @ 开头时沿用 P0 的备注转义, 否则会被当成 #地点 / @日期 参数吞掉 */
  const arg = (p==="-"||p==="off"||p==="清除") ? p : quoteNote(p);
  runCommand("place "+id+" "+arg);
}

/* ------------------------------- add ----------------------------------- */
function validateCategory(cat){
  const c = String(cat||"").trim();
  if(!c){ line([{t:"类别不能为空。例: add 50 餐饮 午餐",c:COLOR.yellow}]); return null; }
  /* P1 B-13: 不再往全局 PREDEFINED 写颜色 —— 旧写法在命令后续校验失败时留下副作用,
     且不受 undo / 落盘约束。颜色统一由 catColor() 从 knownCategories() 动态派生(B-15)。
     下拉由 refreshAll() 的统一出口刷新, 此时记录已入账本。 */
  return c;
}
function doAdd(tokens){
  if(!tokens.length){ line([{t:"用法: add <金额> <类别> [备注..] [@日期] [#地点] [$钱包]   例 add 50 餐饮 午餐",c:COLOR.yellow}]); return; }
  const {tokens:rest, date:rawDate, place:rawPlace, wallet:rawWallet} = splitRecordArgs(tokens);
  const amt = numeric(rest[0]);
  if(amt==null||amt<=0){ line([{t:"金额无效。例 add 50 餐饮 午餐",c:COLOR.yellow}]); return; }
  const cat = validateCategory(rest[1]);
  if(!cat) return;
  const note = rest.slice(2).join(" ");
  const date = cleanDateStr(rawDate);
  if(!date){ line([{t:"日期无效，格式 @YYYY-MM-DD",c:COLOR.yellow}]); return; }
  const wid = pickWalletId(rawWallet);   // 钱包不存在则整笔不入账(校验在落账之前)
  if(wid==null) return;
  const rec = makeRecord(amt, cat, note, date);
  rec.wallet = wid;
  if(rawPlace!=null) rec.place = (rawPlace==="-"||rawPlace==="off") ? "" : normalizePlace(rawPlace);
  else rec.place = normalizePlace(currentGeoPlace());   // 启动预热缓存: 同步写入, 随命令一次落盘
  state.records.push(rec);
  if(rec.place) line(geoPlaceSegs(rec.place, "   ", " 地点 "));
  const st = periodSnapshot();
  const bar = progressBar(st.ratio);
  line([{t:"✓ 已记入 #",c:COLOR.green},{t:rec.id,c:COLOR.pure,cls:"hl"},
        {t:"  "+cat+" ",c:catColor(cat)},
        {t:"¥"+money(rec.amount),c:COLOR.pure}, {t:"  ("+date+")",c:COLOR.gray},
        {t:"  ["+walletNameOf(wid)+"]",c:COLOR.gray}]);
  line([{t:"  占用预算 ",c:COLOR.gray},{t:"¥"+money(rec.amount/consumeShare()),c:COLOR.white},
        {t:"  (消费÷"+consumePct()+"%)  应投货币 ",c:COLOR.gray},{t:"¥"+money(rec.mm),c:COLOR.cyan},
        {t:"  + 应投指数 ",c:COLOR.gray},{t:"¥"+money(rec.idx),c:COLOR.index},
        {t:"  = ",c:COLOR.gray},{t:"¥"+money(rec.mm+rec.idx),c:COLOR.green}]);
  if(recAmortized(rec)) line(amortSplitLine(rec));
  // overspend notice for this period
  const aw = alertWord(st.ratio);
  if(aw.t!=="预算内 ✓"){
    line([
      {t:"⚠ 本期占用 ",c:COLOR.yellow},{t:"¥"+money(st.usedUnits),c:COLOR.yellow,cls:"glow"},
      {t:" / 发放 ¥"+money(st.B),c:COLOR.white},
      {t:"  ("+bar.pct+"%)  ",c:COLOR.yellow},
      {t:aw.t,c:aw.c,cls:"glow"}
    ]);
  }
  // 定位在 boot 时已预热完毕, 记账只同步取缓存; 此处不再发起任何异步请求
}
function makeRecord(amount, category, note, date, amortDays){
  state.seq += 1;
  const days = (isFinite(amortDays) && amortDays>1) ? Math.round(amortDays) : 1;
  // 分摊成本: 记 "每天" 的金额, 投资按**总价**(每天 × 天数)一次性算 —— 不分摊
  const total = r2(amount);                       // amount 传进来的是"总价"(普通消费即金额本身)
  const daily = days>1 ? r2(total/days) : total;
  const inv = investOf(total);
  return { id:state.seq, amount:daily, category, note, place:"", date,
           wallet:0,                      // 付款钱包 id(由调用方在落账前指定; 0 = 未指定)
           amortDays:days, amortTotal:total,
           mm:inv.mm, idx:inv.idx, moneyInv:0, indexInv:0, created: todayYMD() };
}
/* 分摊成本的"每天"明细行(列表/录入回执共用, 避免两处写法漂移) */
function amortSplitLine(r){
  return [{t:"  分摊 ",c:COLOR.gray},
          {t:"总价 ¥"+money(recTotal(r)),c:COLOR.white},
          {t:" ÷ "+recDays(r)+" 天 = ",c:COLOR.gray},
          {t:"每天 ¥"+money(r.amount),c:COLOR.pure,cls:"hl"},
          {t:"   (投资按总价记一次: 应投货币 ¥"+money(r.mm)+" + 指数 ¥"+money(r.idx)+", 不再分摊)",c:COLOR.gray}];
}
/* ------------------------------ amort ---------------------------------- */
/* 分摊成本: amort <总价> <天数> <类别> [备注..] [@开始日期]
   把一次性付掉的总价按天数平均分到每天(计入每日消费口径), 而投资**只按总价记一次**。
   天数写成 `<N>月` / `<N>m` 时按每月 AMORT_DAYS_UNIT 天折算(口径可预期, 不随日历漂移)。 */
function parseDaysToken(t){
  if(t==null) return null;
  const s = String(t).trim().toLowerCase();
  let m = /^(\d+)\s*(?:d|day|days|天|日)?$/.exec(s);
  if(m) return { days:+m[1], label:null };
  m = /^(\d+(?:\.\d+)?)\s*(?:m|mo|mon|month|months|个?月)$/.exec(s);
  if(m){
    const months = +m[1];
    const days = Math.round(months * AMORT_DAYS_UNIT);
    return { days, label: money(months).replace(/\.00$/,"")+" 个月 × "+AMORT_DAYS_UNIT+" 天" };
  }
  return null;
}
function amortUsage(){ return "用法: amort <总价> <天数> <类别> [备注..] [@开始日期] [#地点] [$钱包]   例 amort 3000 365 房租 年付  或 amort 600 12月 会员费"; }
function doAmort(tokens){
  if(tokens.length < 3){ line([{t:amortUsage(),c:COLOR.yellow}]); return; }
  const {tokens:rest, date:rawDate, place:rawPlace, wallet:rawWallet} = splitRecordArgs(tokens);
  const total = numeric(rest[0]);
  if(total==null || total<=0){ line([{t:"总价无效。例 amort 3000 365 房租 年付",c:COLOR.yellow}]); return; }
  const d = parseDaysToken(rest[1]);
  if(!d){ line([{t:"分摊天数无效(需 ≥ "+AMORT_MIN_DAYS+" 天, 可写 12月)。",c:COLOR.yellow}]); return; }
  if(!Number.isInteger(d.days) || d.days<AMORT_MIN_DAYS || d.days>AMORT_MAX_DAYS){
    line([{t:"分摊天数需在 "+AMORT_MIN_DAYS+" ~ "+AMORT_MAX_DAYS+" 天之间。",c:COLOR.yellow}]); return;
  }
  const daily = r2(total/d.days);
  if(!(daily>0)){ line([{t:"总价 "+money(total)+" 分摊到 "+d.days+" 天每天不足 ¥0.01，请加大总价或缩短天数。",c:COLOR.yellow}]); return; }
  const cat = validateCategory(rest[2]);
  if(!cat) return;
  const note = rest.slice(3).join(" ");
  const date = cleanDateStr(rawDate);
  if(!date){ line([{t:"日期无效，格式 @YYYY-MM-DD",c:COLOR.yellow}]); return; }
  const wid = pickWalletId(rawWallet);   // 钱包按**总价**一次扣款(不是每天扣)
  if(wid==null) return;
  const rec = makeRecord(total, cat, note, date, d.days);
  rec.wallet = wid;
  if(rawPlace!=null) rec.place = (rawPlace==="-"||rawPlace==="off") ? "" : normalizePlace(rawPlace);
  state.records.push(rec);
  if(rec.place) line(geoPlaceSegs(rec.place, "   ", " 地点 "));
  const end = addDaysYMD(date, rec.amortDays-1);
  line([{t:"✓ 已记入分摊成本 #",c:COLOR.green},{t:rec.id,c:COLOR.pure,cls:"hl"},
        {t:"  "+cat+" ",c:catColor(cat)},
        {t:"总价 ¥"+money(recTotal(rec)),c:COLOR.pure}, {t:"  ("+date+" 起)",c:COLOR.gray},
        {t:"  ["+walletNameOf(wid)+" 按总价付款]",c:COLOR.gray}]);
  line([{t:"  分摊 ",c:COLOR.gray},
        {t:rec.amortDays+" 天",c:COLOR.cyan},
        {t:" → ",c:COLOR.gray},
        {t:"每天 ¥"+money(rec.amount),c:COLOR.pure,cls:"hl"},
        {t:"   期间 "+date+" ~ "+end, c:COLOR.gray},
        {t:(d.label? ("   ["+d.label+"]") : ""), c:COLOR.gray}]);
  line([{t:"  投资不分摊(只记总数): 应投货币 ",c:COLOR.gray},{t:"¥"+money(rec.mm),c:COLOR.cyan},
        {t:"  + 应投指数 ",c:COLOR.gray},{t:"¥"+money(rec.idx),c:COLOR.index},
        {t:"  = ",c:COLOR.gray},{t:"¥"+money(rec.mm+rec.idx),c:COLOR.green},
        {t:"   每天占用 ¥"+money(rec.amount/consumeShare()),c:COLOR.gray}]);
  const st = periodSnapshot();
  const aw = alertWord(st.ratio);
  if(aw.t!=="预算内 ✓"){
    line([{t:"⚠ 本期占用 ",c:COLOR.yellow},{t:"¥"+money(st.usedUnits),c:COLOR.yellow,cls:"glow"},
          {t:" / 发放 ¥"+money(st.B),c:COLOR.white},{t:"   "+aw.t,c:aw.c,cls:"glow"}]);
  }
}

/* ============================ recur (经常性支出) ============================
   一次录入"每隔一段时间付一次、持续一段时间"的支出(房租/会员/订阅/话费…)。
   两种落账方式(用户勾选「自动分摊成本到每天」决定):
     · 不分摊 → 生成 **N 笔独立记录**(每笔 = 一次扣款, 日期 = 各扣款日) —— 与 add 完全同构,
       所以列表/搜索/总结/每日预算/投资池/导出**不需要任何特判**;
     · 分摊   → 生成 **1 笔分摊成本**(总价 = 每次金额 × 次数, 摊到整个持续期), 投资只按总价记一次。
   为什么生成记录, 而不是"一条记录 + 展开逻辑": 领域不变量 §2.5 规定 amount 是"该记的那一天/那一笔的
   消费额", 让一条记录代表多天多笔会击穿所有窗口统计的唯一入口(recAmountInRange 等) ——
   生成记录把复杂度关在录入这一层。代价: 生成后每笔可单独编辑/删除(它们本来就是独立账目),
   撤销时整批一起回退(runCommand 的 mutate 只压一步)。
   单位口径: 日/周 = 固定天数(1/7); 月 = 日历月(31 号遇到小月取月末, 从起始日直算不累积漂移);
   周期 = 记账周期, 沿真实周期边界推进(nextPeriodStart), 改周期规则后**已生成的记录不变**。 */
const RECUR_MAX_COUNT = 500;      // 一次生成的扣款笔数上限(每日 × 一年 = 365, 再留余量)
const RECUR_UNITS = { day:"日", week:"周", period:"周期", month:"月" };
function recurUnitLabel(u){ return RECUR_UNITS[u] || "?"; }
function recurEveryLabel(u){ return "每"+recurUnitLabel(u); }
/* 单个单位词 → key: 日/周/周期/月(也认 d/w/p/m 与英文单词; 前缀「每」忽略) */
function parseRecurUnit(t){
  const s = String(t==null?"":t).trim().toLowerCase().replace(/^每/,"");
  if(/^(d|day|days|日|天)$/.test(s)) return "day";
  if(/^(w|week|weeks|周)$/.test(s)) return "week";
  if(/^(p|period|periods|周期|期)$/.test(s)) return "period";
  if(/^(m|mo|mon|month|months|月)$/.test(s)) return "month";
  return null;
}
/* 持续时长词 → {n, unit}: 12月 / 6周 / 90日 / 3周期 (也认 12个月) */
function parseRecurSpan(t){
  const s = String(t==null?"":t).trim().toLowerCase();
  const m = /^(\d+)\s*个?\s*(d|day|days|日|天|w|week|weeks|周|m|mo|mon|month|months|月|p|period|periods|周期|期)$/.exec(s);
  if(!m) return null;
  const unit = parseRecurUnit(m[2]);
  const n = +m[1];
  if(!unit || !(Number.isInteger(n) && n>=1)) return null;
  return { n, unit };
}
/* 按日历月加 n 个月; 日超过目标月天数时取月末。**从起始日直算** —— 不逐月累加,
   否则 1 月 31 日会漂成 2 月 28 日 → 3 月 28 日。 */
function addMonthsClamped(dateStr, n){
  const p = parseYMD(dateStr);
  const t = addMonths(p.y, p.m, n);
  return mkYMD(t.y, t.m, Math.min(p.d, lastDay(t.y, t.m)));
}
/* 持续期最后一天(含): 日/周按天数, 月按日历月, 周期按记账周期边界 */
function recurEndDate(startStr, span){
  if(span.unit==="day")  return addDaysYMD(startStr, span.n-1);
  if(span.unit==="week") return addDaysYMD(startStr, span.n*7-1);
  if(span.unit==="month") return addDaysYMD(addMonthsClamped(startStr, span.n), -1);
  let s = periodStartOf(startStr);                 // 周期: 本期 + 之后 N-1 期
  for(let i=0;i<span.n;i++) s = nextPeriodStart(s);
  return addDaysYMD(s, -1);
}
/* 第 k 个扣款日: **从起始日直算**(不逐次推进) —— 逐月推进会让 1/31 漂成 2/28 → 3/28;
   按 k 重算才能得到 1/31, 2/28, 3/31, 4/30 这种"月末夹取但不漂移"的序列。
   周期单位必须逐步沿周期边界走(第 2 笔起落在下一期首日)。 */
function recurStep(startStr, unit, k){
  if(unit==="day")   return addDaysYMD(startStr, k);
  if(unit==="week")  return addDaysYMD(startStr, k*7);
  if(unit==="month") return addMonthsClamped(startStr, k);
  let d = startStr;
  for(let i=0;i<k;i++) d = nextPeriodStart(d);
  return d;
}
/* 扣款日: start, start+step, … 直到超出 end(含 end) */
function recurDates(startStr, endStr, freqUnit){
  const out = [];
  for(let k=0; k<=RECUR_MAX_COUNT; k++){
    const d = recurStep(startStr, freqUnit, k);
    if(d > endStr) break;
    out.push(d);
  }
  return out;
}
/* 经常性支出的**唯一计算入口**(命令、弹窗预览、弹窗提交共用, 避免"预览说 A、提交成 B")。
   纯函数: 只读 settings(不落锚点、不改 state)。返回 {ok:true, ...} 或 {ok:false, msg}。 */
function recurPlan(o){
  const amount = (typeof o.amount==="number" && isFinite(o.amount) && o.amount>0) ? r2(o.amount) : null;
  if(amount==null || !(amount>0)) return { ok:false, msg:"每次金额需为大于 0 的数字" };
  const n = o.durValue;
  if(!Number.isInteger(n) || n<1) return { ok:false, msg:"持续时间需为 ≥1 的整数" };
  if(!RECUR_UNITS[o.durUnit] || !RECUR_UNITS[o.freq]) return { ok:false, msg:"单位只支持 日 / 周 / 周期 / 月" };
  const start = repairDate(o.start);
  if(!start) return { ok:false, msg:"起始日期无效: 请按 YYYY-MM-DD 填写真实存在的日期" };
  const end  = recurEndDate(start, { n, unit:o.durUnit });
  const days = daysBetween(start, end) + 1;
  if(!(days>=1)) return { ok:false, msg:"持续期计算异常(请检查起始日/持续时长)" };
  if(days > AMORT_MAX_DAYS) return { ok:false, msg:"持续期过长: 最多 "+AMORT_MAX_DAYS+" 天(当前 "+days+" 天)" };
  const dates = recurDates(start, end, o.freq);
  if(!dates.length) return { ok:false, msg:"没有产生扣款日(检查起始日/持续/频率)" };
  if(dates.length > RECUR_MAX_COUNT){
    return { ok:false, msg:"一次最多生成 "+RECUR_MAX_COUNT+" 笔(当前 "+dates.length+" 笔); 请缩短持续期, 或勾选「分摊」只记一笔" };
  }
  const total = r2(amount * dates.length);
  const wantSplit = !!o.split;
  const split = wantSplit && days >= AMORT_MIN_DAYS;
  const daily = split ? r2(total/days) : null;
  if(split && !(daily>0)){
    return { ok:false, msg:"总价 ¥"+money(total)+" 摊到 "+days+" 天每天不足 ¥0.01; 请加大金额或取消分摊" };
  }
  return { ok:true, amount, start, end, days, dates, count:dates.length, total,
           wantSplit, split, splitFallback:(wantSplit && !split), daily,
           freq:o.freq, durValue:n, durUnit:o.durUnit };
}
function recurUsage(){
  return "用法: recur <金额> <类别> <持续> <频率> [@起始日] [分摊] [备注..]\n"
       + "  例 recur 100 房租 12月 月 @2027-09-01 房租     每月 ¥100, 持续 12 个月 → 生成 12 笔\n"
       + "     recur 100 房租 12月 月 @2027-09-01 分摊     同上, 只记 1 笔分摊成本(总价摊到每天)\n"
       + "  持续: <N>日 | <N>周 | <N>周期 | <N>月    频率: 日 | 周 | 周期 | 月(周期=记账周期)";
}
function doRecur(tokens){
  if(tokens.length < 4){ line([{t:recurUsage(),c:COLOR.yellow}]); return; }
  const {tokens:rest, date:rawDate, place:rawPlace, wallet:rawWallet} = splitRecordArgs(tokens);
  const amt = numeric(rest[0]);
  const cat = validateCategory(rest[1]);
  if(!cat) return;
  const span = parseRecurSpan(rest[2]);
  if(!span){ line([{t:"持续时长无效: 写成 <N>日 / <N>周 / <N>周期 / <N>月, 如 12月",c:COLOR.yellow}]); return; }
  const freq = parseRecurUnit(rest[3]);
  if(!freq){ line([{t:"频率无效: 日 | 周 | 周期 | 月, 如 月",c:COLOR.yellow}]); return; }
  /* 「分摊」是**开关词**, 位置自由(在备注里也认); 剩余词拼成备注。只认这两个词, 免得把
     备注里的普通英文单词(daily / amort)误当开关。 */
  const isSplitTok = (t)=>/^(分摊|split|均摊)$/i.test(String(t));
  const split = rest.slice(4).some(isSplitTok);
  const note = rest.slice(4).filter(t=>!isSplitTok(t)).join(" ");
  const date = cleanDateStr(rawDate);
  if(!date){ line([{t:"日期无效，格式 @YYYY-MM-DD",c:COLOR.yellow}]); return; }
  if(amt==null || !(r2(amt)>0)){ line([{t:"金额无效。例 recur 100 房租 12月 月 @2027-09-01",c:COLOR.yellow}]); return; }
  const wid = pickWalletId(rawWallet);   // 整批记录由同一个钱包付款; 钱包不存在则一笔都不生成
  if(wid==null) return;
  const plan = recurPlan({ amount:amt, durValue:span.n, durUnit:span.unit, freq, start:date, split });
  if(!plan.ok){ line([{t:plan.msg,c:COLOR.yellow}]); return; }
  const place = (rawPlace==null) ? "" : ((rawPlace==="-"||rawPlace==="off") ? "" : normalizePlace(rawPlace));
  const catTxt = plan.count+" 笔";
  if(plan.split){
    const rec = makeRecord(plan.total, cat, note, plan.start, plan.days);
    rec.place = place;
    rec.wallet = wid;
    state.records.push(rec);
    line([{t:"✓ 已记入经常性支出(分摊成本) #",c:COLOR.green},{t:rec.id,c:COLOR.pure,cls:"hl"},
          {t:"  "+cat+" ",c:catColor(cat)},{t:"总价 ¥"+money(recTotal(rec)),c:COLOR.pure},
          {t:"   ("+recurEveryLabel(plan.freq)+" ¥"+money(plan.amount)+" × "+plan.count+" 次)",c:COLOR.gray},
          {t:"  ["+walletNameOf(wid)+" 按总价付款]",c:COLOR.gray}]);
    line([{t:"  期间 "+plan.start+" ~ "+plan.end+" ("+plan.days+" 天)",c:COLOR.gray},
          {t:"  →  每天 ¥"+money(rec.amount),c:COLOR.pure,cls:"hl"},
          {t:"   投资按总价记一次: 货币 ¥"+money(rec.mm)+" + 指数 ¥"+money(rec.idx),c:COLOR.gray}]);
  } else {
    const made = [];
    for(const d of plan.dates){
      const rec = makeRecord(plan.amount, cat, note, d);
      rec.place = place;
      rec.wallet = wid;
      state.records.push(rec);
      made.push(rec);
    }
    let mm=0, idx=0;
    for(const r of made){ mm += r.mm; idx += r.idx; }
    line([{t:"✓ 已记入 "+catTxt+"经常性支出 ",c:COLOR.green},
          {t:cat+" ",c:catColor(cat)},
          {t:recurEveryLabel(plan.freq)+" ¥"+money(plan.amount),c:COLOR.pure},
          {t:"   期间 "+plan.start+" ~ "+plan.end+" ("+plan.days+" 天)",c:COLOR.gray},
          {t:"  ["+walletNameOf(wid)+" 付款]",c:COLOR.gray}]);
    line([{t:"  编号 #"+made[0].id+" ~ #"+made[made.length-1].id+"   合计 ¥"+money(plan.total),c:COLOR.pure},
          {t:"   应投货币 ¥"+money(r2(mm))+" + 指数 ¥"+money(r2(idx)),c:COLOR.gray}]);
    const shown = plan.dates.slice(0,6).join(", ");
    line([{t:"  扣款日: "+shown+(plan.dates.length>6?(" … 共 "+plan.dates.length+" 个扣款日"):""),c:COLOR.gray}]);
    if(plan.splitFallback)
      line([{t:"  ※ 持续期只有 "+plan.days+" 天, 无法分摊, 已按每笔独立记账。",c:COLOR.yellow}]);
  }
  const st = periodSnapshot();
  const aw = alertWord(st.ratio);
  if(aw.t!=="预算内 ✓"){
    line([{t:"⚠ 本期占用 ",c:COLOR.yellow},{t:"¥"+money(st.usedUnits),c:COLOR.yellow,cls:"glow"},
          {t:" / 发放 ¥"+money(st.B),c:COLOR.white},{t:"   "+aw.t,c:aw.c,cls:"glow"}]);
  }
}

/* ============================ wallet (钱包, ) ============================
   钱包 = 付款账户, 余额**手动维护**(存入 / 取出), 记支出时选一个钱包付款 —— 钱包页与命令行同一通道。
   口径(三个数字, 三把尺子, 不要混用):
     · 余额   = Σ 手动流水(存入 + / 取出 −) − Σ 由它支付的支出(**总价**, 付款口径), 只算**截至今天**的;
                不参与预算的发放 / 占用 / 应投 / 结转, 与预算各自独立 —— 钱包页只把两者并排给出对照。
     · 本期支出 = 消费口径(与 budget 的「本期消费」同一把尺子: 分摊成本按落在本期的天数计),
                所以各钱包本期支出之和 = 本期消费(未指定钱包的旧记录单列)。
     · 支出对钱包的扣款 = recTotal(): 分摊成本的钱是记账当天一次付掉的, 不能拿"每天金额" amount 去减。
   单一入口: walletRows()(总览/钱包页/命令共用)、walletBalance()、walletLedger()。
   记录上 rec.wallet 存钱包 **id**(重命名不影响已有记录); 0 = 未指定(钱包功能上线前的旧记录)。 */
function walletById(id){ return state.wallets.find(w=>w.id===id) || null; }
function walletNameOf(id){ const w = walletById(id); return w ? w.name : ""; }
function defaultWallet(){
  /* 防御: 内存里的 wallets 不是数组, 只可能是外部脚本直接改写了 state —— 就地修复, 不让后续读取抛错 */
  if(!Array.isArray(state.wallets)) ensureWallets();
  return walletById(state.settings.walletDefault) || state.wallets[0];
}
function findWalletByName(name){
  const n = cleanWalletName(name);
  return n ? (state.wallets.find(w=>w.name===n) || null) : null;
}
function nextWalletId(){ return state.wallets.reduce((m,w)=>Math.max(m,w.id),0) + 1; }
/* `$钱包` 标记 → 钱包 id。没写 = 默认钱包; 写了但找不到 → 提示并返回 null,
   调用方必须**在落账之前**中止(不得静默换成默认钱包: 那会从错误的账户扣钱)。 */
function pickWalletId(raw){
  if(raw==null) return defaultWallet().id;
  const w = findWalletByName(raw);
  if(!w){
    line([{t:"未找到钱包「"+String(raw)+"」。用 wallet 查看已有钱包, 或 wallet add <名称> 新建。", c:COLOR.yellow}]);
    return null;
  }
  return w.id;
}
/* 手动流水合计(存入为正、取出为负), 只算截至 upTo 的 */
function walletOpsSum(id, upTo){
  return r2(state.wops.reduce((s,o)=> (o.wallet===id && o.date<=upTo) ? s+o.amount : s, 0));
}
/* 由该钱包支付的支出合计(付款口径 = 总价), 只算截至 upTo 已发生的 —— 未来日期的支出不提前扣款 */
function walletPaidSum(id, upTo){
  return r2(state.records.reduce((s,r)=> (r.wallet===id && r.date<=upTo) ? s+recTotal(r) : s, 0));
}
function walletBalance(id){
  const t = todayYMD();
  return r2(walletOpsSum(id,t) - walletPaidSum(id,t));
}
/* 截至指定日期的余额(与 walletBalance 同一口径, 只是把"今天"换成 upTo):
   转账落账前检查源钱包在转账日是否有足够余额, 不用今天的余额去误判未来的转账。 */
function walletBalanceAt(id, upTo){
  return r2(walletOpsSum(id,upTo) - walletPaidSum(id,upTo));
}
/* 当前周期每个钱包的已支出(消费口径): 与 collectWindow 同一行筛选 / 同一金额口径 */
function walletSpendMap(p){
  const win = collectWindow(p.start, p.end), m = new Map();
  for(const w of state.wallets) m.set(w.id, 0);
  const groups = new Map();
  for(const r of win.rows){
    if(!groups.has(r.wallet)) groups.set(r.wallet, []);
    groups.get(r.wallet).push(r);
  }
  for(const [id, rows] of groups) m.set(id, sumRange(rows, p.start, p.end).total);
  return { map:m, total:win.total };
}
/* 钱包总览的**唯一数据入口**(wallet 命令 / 钱包页 / 顶栏对照都从这里取数) */
function walletRows(p){
  p = p || currentPeriod();
  const sm = walletSpendMap(p), defId = defaultWallet().id;
  const rows = state.wallets.map(w=>{
    const spent = sm.map.get(w.id) || 0;
    return { w, id:w.id, name:w.name, isDefault:(w.id===defId), balance:walletBalance(w.id), spent,
             share:(sm.total>0 ? spent/sm.total : 0),
             pays: state.records.filter(r=>r.wallet===w.id).length,
             ops:  state.wops.filter(o=>o.wallet===w.id).length };
  });
  return { rows, periodSpend:sm.total, unassigned:(sm.map.get(0)||0) };
}
/* 钱包 ↔ 预算 的对照(只读派生, 两边口径互不影响):
   钱包余额合计 = 手里实际有多少; 可用余额(含结转) = 预算口径下按计划还能花多少。 */
function walletBudgetCompare(){
  const total = r2(state.wallets.reduce((s,w)=>s+walletBalance(w.id), 0));
  const bal = availableBalance();
  return { total, bal, diff:r2(total - bal) };
}
/* 钱包流水(存入 / 取出 / 支出扣款 合并, 按日期倒序)。id 省略 = 全部钱包; limit 省略 = 20 */
function walletLedger(id, limit){
  const out = [];
  state.wops.forEach((o,i)=>{
    if(id!=null && o.wallet!==id) return;
    out.push({ date:o.date, wallet:o.wallet, amount:o.amount,
               kind:o.xid ? "xfer" : "op", note:o.note, xid:o.xid||"", order:i });
  });
  state.records.forEach((r,i)=>{
    if(id!=null ? r.wallet!==id : !(r.wallet>0)) return;
    out.push({ date:r.date, wallet:r.wallet, amount:-recTotal(r), kind:"pay",
               note:r.category+(r.note?" "+r.note:""), order:i });
  });
  const n = (Number.isInteger(limit) && limit>0) ? limit : 20;
  out.sort((a,b)=> a.date<b.date ? 1 : (a.date>b.date ? -1 : b.order-a.order));
  return out.slice(0, n);
}
function walletUsage(){

function walletAdd(rest){
  const usage = "用法: wallet add <名称> [初始金额] [备注..]   例 wallet add 微信 500";
  const name = cleanWalletName(rest[0]);
  if(!name){ line([{t:"钱包名称不能为空, 且不超过 "+WALLET_NAME_MAX+" 个字符(含空格请加引号)。"+usage, c:COLOR.yellow}]); return; }
  if(findWalletByName(name)){ line([{t:"已有同名钱包「"+name+"」, 请换一个名字(或先用 wallet name 重命名)。", c:COLOR.yellow}]); return; }
  let init = 0, note = "";
  if(rest.length>1){
    const n = numeric(rest[1]);
    init = (n!=null && n>=0) ? r2(n) : NaN;
    if(!isFinite(init)){ line([{t:"初始金额无效(需为 ≥ 0 的数字, 不填 = 0)。"+usage, c:COLOR.yellow}]); return; }
    note = rest.slice(2).map(unescapeArg).join(" ");   // 备注按原意入库(弹窗回灌的 \# / \@ 前缀在这里还原)
  }
  const id = nextWalletId();
  state.wallets.push({ id, name });
  if(init>0) state.wops.push({ wallet:id, amount:init, date:todayYMD(), note: note || "初始余额", created:todayYMD() });  line([{t:"✓ 已新建钱包 ",c:COLOR.green},{t:name,c:COLOR.pure,cls:"hl"},{t:"  (id "+id+")",c:COLOR.gray},
        {t:init>0 ? ("  初始余额 ¥"+money(init)) : "  余额 ¥0.00 (用 wallet in 存入)",c:COLOR.white}]);
  line([{t:"  记支出时写 $"+(name.indexOf(" ")>=0 ? '"'+name+'"' : name)+" 指定由它付款; ",c:COLOR.gray},
        {t:"wallet use "+(name.indexOf(" ")>=0 ? '"'+name+'"' : name),c:COLOR.yellow},{t:" 可设为默认钱包。",c:COLOR.gray}]);
}
function walletInOut(rest, sign){
  const word = sign>0 ? "in" : "out", verb = sign>0 ? "存入" : "取出";
  const usage = "用法: wallet "+word+" <钱包> <金额> [备注..] [@日期]   例 wallet "+word+" 微信 500 工资";
  const a = findDateToken(rest);
  const w = findWalletByName(a.tokens[0]);
  if(!w){ line([{t:"未找到钱包「"+String(a.tokens[0]||"")+"」。"+usage, c:COLOR.yellow}]); return; }
  const n = parseAmount(a.tokens[1]);
  if(n==null){ line([{t:"金额无效(需为 ≥ ¥0.01 的数字)。"+usage, c:COLOR.yellow}]); return; }
  const date = cleanDateStr(a.date);
  if(!date){ line([{t:"日期无效，格式 @YYYY-MM-DD",c:COLOR.yellow}]); return; }
  const note = a.tokens.slice(2).map(unescapeArg).join(" ");
  state.wops.push({ wallet:w.id, amount:sign*n, date, note, created:todayYMD() });
  const bal = walletBalance(w.id);
  line([{t:"✓ "+verb+" ",c:COLOR.green},{t:w.name+"  ",c:COLOR.pure},
        {t:(sign>0 ? "+¥" : "−¥")+money(n)+(note ? "  "+note : ""),c:COLOR.white},
        {t:"   余额 ¥"+money(bal), c:bal<0?COLOR.red:COLOR.green}]);
  if(date > todayYMD()) line([{t:"  ※ 这条流水晚于今天, 到 "+date+" 才计入余额。", c:COLOR.gray}]);
  if(bal<0) line([{t:"⚠ 钱包「"+w.name+"」余额为负: 支出 / 取出已超过存入, 请核对或用 wallet in 补齐。", c:COLOR.yellow}]);
}
function walletMv(rest){
  const usage = "用法: wallet mv <记录id> <钱包>   把某笔支出改为由该钱包支付, 例 wallet mv 12 现金";

  rec.wallet = w.id;

  line([{t:"  付款钱包: "+fromName+" → "+w.name, c:COLOR.gray},
        {t:"   "+w.name+" 余额 ¥"+money(walletBalance(w.id)), c:walletBalance(w.id)<0?COLOR.red:COLOR.green},
        {t:(fromId ? ("   "+fromName+" 余额 ¥"+money(walletBalance(fromId))) : ""), c:COLOR.gray}]);
