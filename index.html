/* ===================== Tab 命令补全 ===================== */
/* M1: 补全词同样由 COMMANDS 派生(主名在前, 别名在后), 不再手抄一份 */
const CMD_WORDS = [...new Set([...COMMAND_NAMES, ...Object.keys(CMD_ALIAS)])];
function recordIds(){ return state.records.map(r=>String(r.id)); }
/* P1 B-13: 类别的「单一真相来源」= 默认类别 + 账本里出现过的类别(含导入备份的自定义类别)。
   datalist / Tab 补全 / list·summary·chart 提示 / 自定义类别配色全部走这里, 不再三套口径;
   H3 复发点: 以前 refreshCatlist() 只遍历 PREDEFINED.keys(), 导入后自定义类别不进下拉。 */
function knownCategories(){
  const recCats = (state && Array.isArray(state.records)) ? state.records.map(r=>r.category) : [];
  return [...new Set([...PREDEFINED.keys(), ...recCats])].filter(Boolean);
}
/* 参数补全。
   M2 修复: 以前用"第几个 token"当槽位, 但 `@日期` 是**位置无关**参数
   (`add @2027-08-18 300 购物` / `add 300 购物 @2027-08-18` 都合法), 数 token 会把后面的槽位顶偏;
   而且 `add` 干脆忽略槽位(金额位也提示类别)、`update` 又把类别放在金额位(slot 2)、类别位(slot 3)返回空。
   现在统一成"语义槽位" arg = **已输入的值参数个数**(命令名与 @日期 都不计入):
     arg=0 是该命令的第 1 个值参数, 依此类推。所有命令共用这一套。 */
function argCandidates(c0, slot, tokens, cur){
  const cmd = canonicalCmd(c0);      // 别名先归一, 下面的分支只认主名(与 dispatch 同一套)
  let arg = 0;                       // 语义槽位(0-based)
  for(let i=1; i<slot && i<tokens.length; i++){
    const t = tokens[i];
    if(t && t[0]!=="@" && t[0]!=="#" && t[0]!=="$") arg++;   // @日期 / #地点 / $钱包 都不占语义槽位
  }
  const typingAt = !!(cur && cur[0]==="@");
  if(cur && cur[0]==="#") return [];               // 地点自由输入, 不给候选
  /* 正在输 $钱包 → 给全部钱包名(名字不带空格时可直接补全; 带空格请写 $"…" ) */
  if(cur && cur[0]==="$") return state.wallets.map(w=>"$"+w.name);
  if(cmd==="wallet"){
    if(arg===0) return ["add","in","out","mv","use","name","del","log", ...state.wallets.map(w=>w.name)];
    const sub = String(tokens[1]||"").toLowerCase();
    if(sub==="add") return [];
    if(sub==="in"||sub==="out"||sub==="use"||sub==="name"||sub==="del") return (arg===1) ? state.wallets.map(w=>w.name) : [];
    if(sub==="mv") return (arg===1) ? recordIds() : (arg===2 ? state.wallets.map(w=>w.name) : []);
    return [];
  }
  // 正在输入 @条件: list / search 支持关键字写法, 其余命令要么接受 ISO 日期(@YYYY-MM-DD), 要么不支持
  if(typingAt) return (cmd==="list"||cmd==="search") ? ["@today","@period","@month"] : [];
  if(cmd==="help"||cmd==="cls"||cmd==="undo"||cmd==="redo") return [];
  /* P2 B-20: config 的子命令/子名也给候选(旧版整体返回空, geo/geokey/ratio 补不出来) */
  if(cmd==="config"){
    if(arg===0) return ["set"];
    if(arg===1) return ["period","periodstart","periodend","monthstart","budget","invest","consume","ratio","share","geo","geokey"];
    if(arg===2){
      const sub=(tokens[2]||"").toLowerCase();   // 子名槽: tokens[1]="set", tokens[2]=子名
      if(sub==="budget") return ["800","1000","1200","1500"];
      if(sub==="invest"||sub==="consume"||sub==="ratio"||sub==="share") return ["15","85","0.85","0.9"];
      if(sub==="geo") return ["auto","manual"];
      /* 周期三种写法都给候选 —— 天数快捷 / natural / 起止日(取当前与 15 天后做示例) */
      if(sub==="period") return ["natural","15","14","7","30","90",todayYMD()];
      if(sub==="periodstart") return [todayYMD(), addDaysYMD(todayYMD(),-14)];
      if(sub==="periodend") return [addDaysYMD(todayYMD(),14), addDaysYMD(todayYMD(),29)];
      if(sub==="monthstart") return ["natural","1","5","10","15","20","25","28"];
      return [];
    }
    if(arg===3){
      const sub=(tokens[2]||"").toLowerCase();
      if(sub==="budget") return ["now"];
      if(sub==="period") return [addDaysYMD(todayYMD(),29), addDaysYMD(todayYMD(),14)];
      return [];
    }
    return [];
  }
  if(cmd==="assets"||cmd==="forecast") return [];
  if(cmd==="budget"){
    if(arg===0) return ["set","default","reset"];
    if(arg===1) return ["800","1000","1200","1500","2000"];
    return [];
  }
  if(cmd==="set"){
    if(arg===0) return ["budget","daily","invest","consume","ratio","period","periodstart","monthstart","weekstart","alert","rate","category"];
    if(arg===1){
      const sub=(tokens[1]||"").toLowerCase();
      if(sub==="category"||sub==="cat") return ["reset", ...knownCategories()];
      if(sub==="daily") return ["off","50","100","150","200"];
      if(sub==="invest") return ["15","10","20","5"];
      if(sub==="consume"||sub==="ratio") return ["85","90","80","0.85"];
      if(sub==="period") return ["natural","15","14","7","30","90"];
      if(sub==="monthstart") return ["natural","1","5","10","15","20","25","28"];
      if(sub==="weekstart") return ["mon","sun"];
      if(sub==="alert") return ["80,100","50,100","90"];
      if(sub==="rate") return ["money","index"];
    }
    if(arg===2){
      const sub=(tokens[1]||"").toLowerCase();
      if(sub==="rate") return ["2","3","8","10"];
      if(sub==="category"||sub==="cat") return ["off","200","300","400","500"];
    }
    return [];
  }
  /* add <金额> <类别> [备注..] [@日期]: 金额位不提示(数字自己敲), 类别位给类别, 备注位不给 */
  if(cmd==="add"){
    if(arg===1) return knownCategories();
    return [];
  }
  /* amort <总价> <天数> <类别> [备注..] [@开始日期]: 金额位/天数位不提示, 类别位给类别(与 add 同一套) */
  if(cmd==="amort"){
    if(arg===2) return knownCategories();
    if(arg===1) return ["30","90","180","365","12月"];
    return [];
  }
  /* recur <金额> <类别> <持续> <频率> [@起始日] [分摊] [备注]: 持续/频率各给一组单位候选 */
  if(cmd==="recur"){
    if(arg===1) return knownCategories();
    if(arg===2) return ["12月","6月","3周期","4周","30日"];
    if(arg===3) return ["月","周","周期","日"];
    return ["分摊"];
  }
  /* update <id> <金额> <类别> [备注..] [@日期]: 修复前类别被放在金额位(slot 2), 类别位(slot 3)返回空 */
  if(cmd==="update"){
    if(arg===0) return recordIds();
    if(arg===2) return knownCategories();
    return [];
  }
  if(cmd==="del"){ if(arg===0) return recordIds(); return []; }
  if(cmd==="place"){
    if(arg===0) return recordIds();
    if(arg===1) return [...new Set(state.records.map(r=>r.place).filter(Boolean))];
    return [];
  }
  if(cmd==="pay"){
    if(arg===0) return recordIds();
    // pay full [mm|idx]: 全额投资只认两种池; pay <id> 才给 all/none
    if(arg===1) return ((tokens[1]||"").toLowerCase()==="full") ? ["mm","idx"] : ["mm","idx","all","none"];
    return [];
  }
  if(cmd==="list"){                                   // 类别/@日期/条数 顺序自由, 各槽位都给同一组候选
    return ["@today","@period","@month", ...knownCategories()];
  }
  /* search: 条件顺序自由, 每个槽位都给「日期关键字 + 类别」(编号/金额自己敲) */
  if(cmd==="search") return ["@today","@period","@month", ...knownCategories()];
  if(cmd==="summary"){
    if(arg===0) return ["day","week","month","cat", ...knownCategories()];
    return knownCategories();                           // 类别筛选
  }
  /* chart: 窗口 / 图型 / 类别顺序自由, 各槽位给同一组候选(与 list 的做法一致) */
  if(cmd==="chart") return ["day","week","period","month","bar","pie","both", ...knownCategories()];
  /* report: 固定双图, 只补窗口与类别 */
  if(cmd==="report") return ["day","week","period","month", ...knownCategories()];
  if(cmd==="export"){ if(arg===0) return ["md","txt"]; return []; }
  return [];
}
function completionCandidates(full){
  const hasTrailing = /\s$/.test(full);
  const tokens = full.match(/[^\s]+/g) || [];
  const slot = hasTrailing ? tokens.length : Math.max(0, tokens.length-1);
  const cur   = hasTrailing ? "" : (tokens.length? tokens[slot] : "");
  const prefix = cur.toLowerCase();
  let list=[];
  if(slot===0){ list = CMD_WORDS.filter(w=>w.toLowerCase().startsWith(prefix)); }
  else if(tokens.length){ list = argCandidates(tokens[0].toLowerCase(), slot, tokens, cur); }
  list = [...new Set(list)].filter(x=>x.toLowerCase().startsWith(prefix));
  return { list, slot, cur, hasTrailing, base: full };
}

  scrollBottom();
}
/* ---- 输入框淡色“将输入”提示(ghost): 唯一候选时显示待补字符 ---- */
let ghostSuffixCache = null;
function currentGhostSuffix(value){
  const info = completionCandidates(value);
  if(info.list.length!==1) return null;
  if(info.hasTrailing) return null;       // 后面还有空 token 时不提示
  if(!info.cur) return null;              // 尚未输入前缀
  const suffix = info.list[0].slice(info.cur.length);
  return suffix || null;
}

function textWidthPx(s, el){
  if(!s) return 0;
  try{
    if(!_cv){ _cv = document.createElement("canvas"); _ctx2 = _cv.getContext && _cv.getContext("2d"); }
    if(_ctx2){
      let f="15px monospace";
      try{ f = getComputedStyle(el || input).font || f; }catch(e){}
      _ctx2.font = f;
      return _ctx2.measureText(s).width;
    }
  }catch(e){}
  return 0;
}
function hideGhost(){ ghostSuffixCache=null;
  const el=document.getElementById("ghost"); if(el){ el.textContent=""; el.classList.remove("show"); } }
function updateGhost(){
  const el=document.getElementById("ghost");
  if(!el) return;
  if(document.activeElement!==input){ hideGhost(); return; }
  const suf = currentGhostSuffix(input.value);
  ghostSuffixCache = suf;
  if(!suf){ el.textContent=""; el.classList.remove("show"); return; }
  const w = textWidthPx(input.value);
  el.textContent = suf;
  el.style.left = (w + 3) + "px";
  el.classList.add("show");
}
function caretAtEnd(){
  try{ if(input.selectionEnd==null) return true; return input.selectionEnd===input.value.length; }
  catch(e){ return true; }
}
let comp=null; // {list,i,cur,hasTrailing,base,hint}
function handleTab(){
  if(!comp){
    const info = completionCandidates(input.value);
    if(!info.list.length){ return; }
    comp = { list: info.list, i: 0, cur: info.cur, hasTrailing: info.hasTrailing, base: info.base, hint:false };
  } else {
    comp.i = (comp.i + 1) % comp.list.length;
  }
  if(comp.list.length>1 && !comp.hint){ comp.hint=true; tabHint(comp.list); }
  const cand = comp.list[comp.i];
  let out;
  if(comp.hasTrailing){ out = comp.base + cand; }
  else { out = comp.base.slice(0, comp.base.length - comp.cur.length) + cand; }
  input.value = out;
  input.setSelectionRange(out.length, out.length);
  hideGhost();
}
function bindInput(){
  input.addEventListener("keydown",(e)=>{
    if((e.ctrlKey||e.metaKey) && (e.key==="z"||e.key==="Z")){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
    if((e.ctrlKey||e.metaKey) && (e.key==="y"||e.key==="Y")){ e.preventDefault(); redo(); return; }
    if(e.key==="Enter"){ comp=null; hideGhost(); runCommand(input.value); input.value=""; scrollBottom(); return; }
    if(e.key==="Tab"){ e.preventDefault(); handleTab(); updateGhost(); return; }
    if(e.key==="ArrowRight"){
      if(caretAtEnd() && ghostSuffixCache){
        e.preventDefault();
        input.value = input.value + ghostSuffixCache;
        input.setSelectionRange(input.value.length, input.value.length);
        hideGhost();
        return;
      }
    }
    if(!["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) comp=null;
    if(e.key==="ArrowUp"){ historyUp(); }
    else if(e.key==="ArrowDown"){ historyDown(); }
    updateGhost();
  });
  input.addEventListener("input",()=>{ scrollBottom(); updateGhost(); });
  input.addEventListener("focus", updateGhost);
  input.addEventListener("blur", hideGhost);
}
let history=[], hIdx=-1;
function historyUp(){ if(!history.length) return; if(hIdx<0) hIdx=history.length-1; else hIdx=Math.max(0,hIdx-1); input.value=history[hIdx]; }
function historyDown(){ if(hIdx<0) return; hIdx++; if(hIdx>=history.length){ hIdx=-1; input.value=""; } else input.value=history[hIdx]; }

/* 工具栏搜索框: 唯一入口仍是 `search` 命令 —— 回车把内容回灌给 runCommand,
   解析/匹配/渲染全部复用命令实现(H5 双通道对称: 鼠标与键盘不会走出两套行为)。
   Esc 清空并回到命令行; 搜索后焦点留在框里, 方便改条件再按回车。 */
function bindSearch(){
  const box = document.getElementById("searchBox");
  if(!box) return;
  box.addEventListener("keydown",(e)=>{
    if(!e) return;
    /* 中文输入法: 回车是"上屏"而不是"提交", 合成期间不能抢跑(否则搜到半个词, 且 Emoji/候选被吞)。 */
    if(e.isComposing || e.keyCode===229) return;
    if(e.key==="Escape"){
      if(e.preventDefault) e.preventDefault();
      box.value = "";
      input.focus();
      return;
    }
    if(e.key!=="Enter") return;
    if(e.preventDefault) e.preventDefault();
    const q = String(box.value||"").trim();
    input.value = "";                     // 命令行走过的痕迹不留在输入行, 避免误按回车重复执行
    runCommand(q ? ("search "+q) : "search");
    scrollBottom();
  });
}

function afterPageCommand(before, lines0){
  const body = document.getElementById(PAGE_ECHO[currentPage]+"Body");

function openWalletForm(host, w, kind){
  const f = walletFormBase(host);
  const err = walletFormErr(f);
  const cancel = ()=>{ host.innerHTML = ""; };
  if(kind==="name"){
    const name = walletField(f, "新名称", "如 微信");
    name.value = w.name;
    walletFormButtons(f, [
      ["确认重命名", ()=>{
        const nm = cleanWalletName(name.value);
        if(!nm) return walletFormFail(err, "新名称不能为空, 且不超过 "+WALLET_NAME_MAX+" 个字符");
        if(nm!==w.name && findWalletByName(nm)) return walletFormFail(err, "已有同名钱包「"+nm+"」");
        runCommand("wallet name "+quote(w.name)+" "+quote(nm));
      }, "accent"],
      ["取消", cancel]
    ]);
    return;
  }
  if(kind==="tr"){
    if(state.wallets.length<2){ err.textContent = "至少要两个钱包才能转账"; return; }
    const to = walletSelectField(f, "转入钱包", w.id);
    to.value = (state.wallets.find(x=>x.id!==w.id) || {}).name || "";
    const amt = walletField(f, "转账金额 (元)", "如 500", "number");
    const note = walletField(f, "备注 (可选)", "如 提现 / 还钱");
    const first = walletFormButtons(f, [
      ["确认转账", ()=>{
        const n = parseAmount(String(amt.value || "").replace(/,/g,""));
        if(n==null) return walletFormFail(err, "金额需为 ≥ ¥0.01 的数字");
        const dest = findWalletByName(to.value);
        if(!dest || dest.id===w.id) return walletFormFail(err, "请选择另一个钱包作为转入方");
        const nt = String(note.value || "").trim();
        runCommand("wallet tr "+quote(w.name)+" "+quote(dest.name)+" "+n+(nt ? " "+quoteNote(nt) : ""));
      }, "accent"],
      ["取消", cancel]
    ]);
    to.addEventListener("keydown", (e)=>{ if(e && e.key==="Enter"){ if(e.preventDefault) e.preventDefault(); if(first) first.click(); } });
    return;
  }
  const sign = (kind==="in") ? 1 : -1;
  const amt  = walletField(f, sign>0 ? "存入金额 (元)" : "取出金额 (元)", "如 500", "number");
  const note = walletField(f, "备注 (可选)", sign>0 ? "如 工资" : "如 转去别的钱包");
  walletFormButtons(f, [
    [sign>0 ? "确认存入" : "确认取出", ()=>{
      const n = parseAmount(String(amt.value || "").replace(/,/g,""));
      if(n==null) return walletFormFail(err, "金额需为 ≥ ¥0.01 的数字");
      const nt = String(note.value || "").trim();
      runCommand("wallet "+(sign>0 ? "in" : "out")+" "+quote(w.name)+" "+n+(nt ? " "+quoteNote(nt) : ""));
    }, "accent"],
    ["取消", cancel]
  ]);
}

function shareBar(ratio, opts){
  opts = opts || {};
  const r = (typeof ratio==="number" && isFinite(ratio)) ? Math.max(0, ratio) : 0;
  const wrap = document.createElement("div"); wrap.className = "l hbar-wrap";
  const top = document.createElement("div"); top.className = "hbar-top";

  const v = document.createElement("span"); v.className = "hbar-v"; v.style.color = COLOR.cyan;
  v.textContent = (r*100).toFixed(1)+"%";
  top.append(k, v);
  wrap.append(top, hbarTrack(r, COLOR.cyan, { marker:false }));
  if(opts.sub){
    const sub = document.createElement("div"); sub.className = "hbar-sub"; sub.textContent = opts.sub;
    wrap.appendChild(sub);
  }
  ((opts && opts.host) || term).appendChild(wrap);
  return wrap;
}

  const st = periodSnapshot(p);
  pageHead(host, "钱包", rows.length+" 个 · 默认: "+defaultWallet().name+" · "+p.label);
  const sum = document.createElement("div"); sum.className = "wsum";
  const wstat = (k, v, color, subTxt)=>{
    const d = document.createElement("div"); d.className = "ws";
    const kk = document.createElement("span"); kk.className = "k"; kk.textContent = k;
    const vv = document.createElement("span"); vv.className = "v"; vv.textContent = v; vv.style.color = color;
    d.append(kk, vv);
    if(subTxt){ const s2 = document.createElement("span"); s2.className = "s"; s2.textContent = subTxt; d.appendChild(s2); }
    sum.appendChild(d);
  };
  wstat("钱包余额合计", "¥"+money(cmp.total), cmp.total<0 ? COLOR.red : COLOR.green, "存入 − 取出 − 已付支出");
  wstat("可用余额(含结转)", "¥"+money(cmp.bal), cmp.bal<0 ? COLOR.red : COLOR.cyan, "预算口径: 发放 − 占用");
  wstat("钱包 − 预算可用", (cmp.diff>=0 ? "+" : "-")+"¥"+money(Math.abs(cmp.diff)),
        cmp.diff<0 ? COLOR.yellow : COLOR.white, cmp.diff>=0 ? "钱包里的钱比预算可用多" : "钱包里的钱比预算可用少");
  wstat("本期预算 / 已消费", "¥"+money(st.B)+" / ¥"+money(st.consumption), COLOR.white,
        "各钱包本期支出合计 ¥"+money(r2(periodSpend-unassigned)));
  host.appendChild(sum);
  pageLine(host, [{t:"  钱包余额手动维护, 不参与预算的发放 / 占用 / 结转 —— 两边各自计算, 这里只并排对照; 记支出时选钱包, 余额自动扣减(按总价)。", c:COLOR.gray}]);
  if(periodSpend>0){
    const parts = rows.filter(x=>x.spent>0).map(x=>({ label:x.name, value:x.spent, color:walletColor(state.wallets.indexOf(x.w)) }));
    if(unassigned>0) parts.push({ label:"未指定钱包(旧记录)", value:unassigned, color:COLOR.gray });
    stackBar(parts, { title:"本期各钱包支出占比(消费口径, 合计 ¥"+money(periodSpend)+")", host });
  } else {
    pageLine(host, [{t:"  本期还没有支出 —— 「+ 记一笔」时选一个支付钱包, 这里会显示各钱包的支出占比。", c:COLOR.gray}]);
  }
  host.appendChild(buildWalletNewCard());
  const grid = document.createElement("div"); grid.className = "wk-grid";
  rows.forEach(x=>grid.appendChild(buildWalletCard(x, periodSpend)));
  host.appendChild(grid);
  const items = walletLedger(null, 12);
  pageHead(host, "钱包流水", "最近 "+items.length+" 条 · 存入 / 取出 / 支出扣款(按总价) · 看更多: wallet log [N]");
  if(!items.length) pageLine(host, [{t:"  (暂无流水)", c:COLOR.gray}]);
  for(const it of items){
    const plus = it.amount>0;
    pageLine(host, [
      {t:"  "+it.date+"  ", c:COLOR.gray},
      {t:(walletNameOf(it.wallet) || "—")+"  ", c:COLOR.white},
      {t:(plus ? "+¥" : "-¥")+money(Math.abs(it.amount)).padStart(10," ")+"  ", c:plus ? COLOR.green : (it.kind==="pay" ? COLOR.orange : COLOR.red)},
      {t:(it.kind==="pay" ? "支出 " : (it.kind==="xfer" ? "" : (plus ? "存入 " : "取出 ")))+(it.note || ""), c:COLOR.gray}
    ]);
  }
}

/* ---- 设置页: SETTING_CARDS 是唯一清单(卡片顺序 / 标题 / 挂哪个面板 / 怎么回填 / 摘要文案) ----
   modal+wrap: 该卡挂载的既有弹窗面板与它的遮罩层(离开设置页时搬回去);
   fill: 把表单回填成当前已保存的值(与"以浮层打开"时走同一个回填函数);
   live: 卡片标题旁的一行实时摘要; build: 卡片里面板之外的补充行(或整张小表单)。 */
const SETTING_CARDS = [
  { key:"budget",   title:"周期预算",        modal:"budgetModal", wrap:"budgetWrap", fill:fillBudgetModal, live:liveBudget },
  { key:"period",   title:"周期持续时间",    modal:"periodModal", wrap:"periodWrap", fill:fillPeriodCard, live:livePeriod, build:buildMonthStartRow },
  { key:"invest",   title:"投资比例",        modal:"investModal", wrap:"investWrap", fill:fillInvestModal, live:liveInvest },
  { key:"category", title:"类别余额",        modal:"catModal",    wrap:"catWrap",    fill:fillCatCard,    live:liveCategory },
  { key:"geo",      title:"地点与地图 Key",  modal:"geoModal",    wrap:"geoWrap",    fill:fillGeoModal,   live:liveGeo },
  { key:"other",    title:"预警与收益参数",  build:buildOtherCard,                   fill:fillOtherCard,  live:liveOther },
];
function buildSettingsCards(){
  const host = document.getElementById("settingsCards");
  if(!host) return;
  host.innerHTML = "";                         // 仅清空
  const sub = document.getElementById("settingsSub");
  if(sub) sub.textContent = APP_VERSION+" · 改动立即保存, 可在主页撤销(Ctrl+Z) · 表单里显示的是已保存的值";
  for(const c of SETTING_CARDS){
    const card = document.createElement("div"); card.className = "scard"; card.dataset.key = c.key;
    const h = document.createElement("div"); h.className = "scard-h";
    const t = document.createElement("span"); t.className = "st"; t.textContent = "▓ "+c.title;
    const lv = document.createElement("span"); lv.className = "slive"; lv.id = "sl_"+c.key;
    h.append(t, lv);
    const body = document.createElement("div"); body.className = "scard-body"; body.id = "sb_"+c.key;
    if(c.modal){
      const slot = document.createElement("div"); slot.className = "scard-slot"; slot.id = "sf_"+c.key;
      body.appendChild(slot);
    }
    if(c.build) c.build(body);
    const hint = document.createElement("div"); hint.className = "shint"; hint.id = "sh_"+c.key;
    card.append(h, body, hint);
    host.appendChild(card);
  }
}
/* children 在浏览器里是 HTMLCollection(没有 indexOf), 在测试桩里是数组 —— 用遍历判断, 两边都成立 */
function hasChild(parent, el){
  if(!parent || !el) return false;
  for(const c of parent.children) if(c===el) return true;
  return false;
}
/* 把既有弹窗面板搬进设置页卡片(同一个 DOM 节点, 所以事件 / 校验 / 回灌命令都还是原来那一套) */
function mountSettingsCards(){
  const host = document.getElementById("settingsCards");
  if(!host.children.length) buildSettingsCards();
  for(const c of SETTING_CARDS){
    if(!c.modal) continue;
    const slot = document.getElementById("sf_"+c.key);
    const panel = document.getElementById(c.modal);
    if(slot && panel && !hasChild(slot, panel)) slot.appendChild(panel);
  }
}
function unmountSettingsCards(){
  for(const c of SETTING_CARDS){
    if(!c.modal) continue;
    const wrap = document.getElementById(c.wrap);
    const panel = document.getElementById(c.modal);
    if(wrap && panel && !hasChild(wrap, panel)) wrap.appendChild(panel);
  }
}
function clearSettingsHints(){
  for(const c of SETTING_CARDS){
    const h = document.getElementById("sh_"+c.key);
    if(h){ h.textContent = ""; h.classList.remove("bad"); }
  }
}
function settingsHint(key, msg, bad){
  const h = document.getElementById("sh_"+key);
  if(!h) return false;
  h.textContent = msg;
  h.classList.toggle("bad", !!bad);
  return false;
}
function fillSettingsCards(){
  mountSettingsCards();
  clearSettingsHints();
  for(const c of SETTING_CARDS){
    c.fill();
    const lv = document.getElementById("sl_"+c.key);
    if(lv) lv.textContent = c.live();
  }
}
/* 设置页专属的小表单行: 标签 + 输入框 + 按钮(Enter 同按钮); 回灌的命令由调用方给 */
function settingsRow(host, label, inputId, placeholder, btnLabel, onOk, inputType){
  const row = document.createElement("div"); row.className = "srow";
  const l = document.createElement("label"); l.textContent = label;
  const i = document.createElement("input");
  i.id = inputId; i.type = inputType || "text"; i.placeholder = placeholder || ""; i.autocomplete = "off";
  row.append(l, i);
  if(btnLabel){
    pageButton(row, btnLabel, onOk, "accent");
    i.addEventListener("keydown", (e)=>{ if(e && e.key==="Enter"){ if(e.preventDefault) e.preventDefault(); onOk(); } });
  }
  host.appendChild(row);
  return i;
}
function liveBudget(){
  const p = currentPeriod(), db = state.settings.dailyBudget;
  return "默认 ¥"+money(state.settings.budget)+" · 当期 ¥"+money(effectiveBudget(p))
       + " · 每日额度 "+((typeof db==="number" && db>0) ? "¥"+money(db) : "未设");
}
function livePeriod(){
  const s = state.settings, p = currentPeriod();
  return (s.periodMode==="rolling" ? ("每 "+s.lengthDays+" 天一期") : (s.monthStart===1 ? "按自然月" : "每月 "+s.monthStart+" 日起"))
       + " · 本期 "+p.label+" · 共 "+periodDayCount(p)+" 天";
}
function liveInvest(){
  const sp = rateSplit();
  return "消费 "+consumePct()+"% · 投资 "+invPct()+"% (货币 "+r2(sp.mm*100)+"% / 指数 "+r2(sp.idx*100)+"%)";
}
function liveCategory(){
  const cp = currentPeriod(), rows = catBudgetRows(cp);
  return rows.length ? ("已配置 "+rows.length+" 类 ¥"+money(catAllocated())+" · 可配置 ¥"+money(catPoolLeft(cp))) : "尚未配置类别余额";
}
function liveGeo(){
  return "地点: "+geoModeLabel()+" · 地图 Key "+(state.settings.geoKey ? ("已配置 ("+maskGeoKey(state.settings.geoKey)+")") : "未配置");
}
function liveOther(){
  const s = state.settings;
  return "阈值 "+s.thresholds.join("% / ")+"% · 周从"+(s.weekStart==="mon" ? "周一" : "周日")+"起 · 年化 货币 "+(s.rateMoney*100).toFixed(2)+"% / 指数 "+(s.rateIndex*100).toFixed(2)+"%";
}
function fillPeriodCard(){
  fillPeriodModal();
  const el = document.getElementById("o_monthstart");
  if(el) el.value = state.settings.monthStart;
}
function fillCatCard(){ fillCatModal(); }
function fillOtherCard(){
  const s = state.settings;
  const a = document.getElementById("o_alert");   if(a) a.value = s.thresholds.join(",");
  const mon = document.getElementById("o_week_mon"), sun = document.getElementById("o_week_sun");
  if(mon) mon.classList.toggle("on", s.weekStart==="mon");
  if(sun) sun.classList.toggle("on", s.weekStart!=="mon");
  const rm = document.getElementById("o_rate_money"); if(rm) rm.value = +(s.rateMoney*100);
  const ri = document.getElementById("o_rate_index"); if(ri) ri.value = +(s.rateIndex*100);
}
/* 周期卡里、面板之外的一行: 按月模式的月起始日(收进 config, 与命令行同一个校验入口) */
function buildMonthStartRow(host){
  settingsRow(host, "按月模式的月起始日", "o_monthstart", "1-28; 1 或 natural = 自然月", "保存", saveMonthStartRow);
}
function saveMonthStartRow(){
  const d = monthStartSet(document.getElementById("o_monthstart").value);
  if(d==null) return settingsHint("period", "月起始日需为 1-28 的整数(1 或 natural = 自然月)。", true);
  runCommand("config set monthstart "+d);
}
/* 「预警与收益参数」卡: 以前只有命令行能改的三项(set alert / set weekstart / set rate) */
function buildOtherCard(host){
  settingsRow(host, "预警阈值 (%)", "o_alert", "如 80,100", "保存", saveAlertRow);
  const row = document.createElement("div"); row.className = "srow";
  const l = document.createElement("label"); l.textContent = "周起始日(周总结起点)";
  const seg = document.createElement("div"); seg.className = "seg";
  for(const [id, label, val] of [["o_week_mon","周一","mon"],["o_week_sun","周日","sun"]]){
    const b = document.createElement("button"); b.type="button"; b.id = id; b.textContent = label;
    b.addEventListener("click", ()=>runCommand("set weekstart "+val));
    seg.appendChild(b);
  }
  row.append(l, seg);
  host.appendChild(row);
  settingsRow(host, "货币基金年化 (%)", "o_rate_money", "如 2", "保存", ()=>saveRateRow("money"), "number");
  settingsRow(host, "指数基金年化 (%)", "o_rate_index", "如 8", "保存", ()=>saveRateRow("index"), "number");
}
function saveAlertRow(){
  const parts = String(document.getElementById("o_alert").value || "").split(/[,，]/).map(x=>x.trim()).filter(Boolean);
  const nums = parts.map(x=>numeric(x));
  if(!parts.length || nums.some(n=>n==null || n<=0 || n>100)){
    return settingsHint("other", "预警阈值请写成 0~100 的百分数, 用逗号分隔, 如 80,100。", true);
  }
  runCommand("set alert "+nums.join(","));
}
function saveRateRow(which){
  const n = numeric(String(document.getElementById(which==="money" ? "o_rate_money" : "o_rate_index").value || "").trim());
  if(n==null || n<0 || n>100) return settingsHint("other", "年化需为 0~100 之间的数字(百分数), 如 2 或 8。", true);
  runCommand("set rate "+which+" "+n);
}
function bindPages(){
  document.querySelectorAll("#pageNav .pg").forEach(b=>{
    b.addEventListener("click", ()=>showPage(b.dataset.page));
  });
  if(typeof window!=="undefined" && window.addEventListener){
    window.addEventListener("keydown", (e)=>{      // Alt+1 主页 / Alt+2 钱包 / Alt+3 设置
      if(!e || !e.altKey || e.ctrlKey || e.metaKey) return;
      const pg = PAGE_KEYS[e.key];
      if(!pg) return;
      if(e.preventDefault) e.preventDefault();
      showPage(pg);
    });
  }
  buildSettingsCards();
}
function boot(){
  const dropped = loadState();
  /* 先把上次定位的地名从独立缓存读回来(左上角立即可见、首笔即可用), 再申请一次新定位 */
  const cached = loadGeoCache();
  setGeoStatus(cached ? "cached" : "idle",
               cached ? (geoCache.district || districtOf(geoCache.place)) : "定位中…");
  refreshAll();               // 顶栏统计/理财条/类别下拉/左上角定位/撤销按钮 一次刷新(H4 的同一入口)
  bindToolbar(); bindModal(); bindInput(); bindSearch(); bindPages();
  armAutoReconnect();
  if(dropped.dropped) line([{t:"⚠ 本地数据里有 "+dropped.dropped+" 条记录金额/日期损坏, 已跳过(其余记录照常加载)。", c:COLOR.yellow}]);
  if(dropped.walletsDropped) line([{t:"⚠ 本地数据里有 "+dropped.walletsDropped+" 条钱包 / 流水数据无效(名称重复、金额为 0 等), 已跳过。", c:COLOR.yellow}]);
  // banner
  const t=todayYMD();
  line([{t:"╔═══════════════════════════════════════════════════╗",c:COLOR.green}]);
  line([{t:"║  ",c:COLOR.green},{t:"BUDGET :: TERM",c:COLOR.cyan,cls:"glow"},{t:"  "+APP_VERSION+"   个人记账 · 自动理财规划",c:COLOR.pure},{t:"   ║",c:COLOR.green}]);
  line([{t:"╚═══════════════════════════════════════════════════╝",c:COLOR.green}]);
  line([
    {t:"今日 ",c:COLOR.gray},{t:t,c:COLOR.white},
    {t:"   模型: 消费÷"+consumePct()+"%=占用预算; 占用×"+invPct()+"% 应投 ",c:COLOR.gray},
    {t:"货币"+mmPct()+"%",c:COLOR.cyan},{t:"+",c:COLOR.gray},{t:"指数"+idxPct()+"%",c:COLOR.index},
    {t:"; 剩余结转, 透支下期扣回",c:COLOR.gray}
  ]);
  line([{t:"  投资比例可调: ",c:COLOR.gray},{t:"set invest 15",c:COLOR.yellow},
        {t:" (或 set consume 85 / set ratio 0.85)",c:COLOR.gray}]);
  showBudget();
  line([{t:"输入 ",c:COLOR.gray},{t:"help",c:COLOR.yellow},{t:" 查看全部命令；或点上方按钮快速操作。",c:COLOR.gray}]);
  /* 工具栏的「配置 ▾」移除后, 首屏明确指一下配置去哪儿了(省得老用户找按钮) */
  line([{t:"  配置(周期预算 / 周期持续时间 / 投资比例 / 类别余额 / 地图 Key)都在顶部「",c:COLOR.gray},
        {t:"设置",c:COLOR.cyan},{t:"」页, 页内直接改。",c:COLOR.gray}]);
  blank();
  primeGeoLocation();         // 每次打开只申请一次定位(结果只更新缓存 + 左上角, 不碰账本)
  input.focus();
}

window.addEventListener("DOMContentLoaded", boot);
// keep focus on input when clicking terminal
term.addEventListener("click",()=>input.focus());
</script>
