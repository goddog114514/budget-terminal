/* 钱包间转账: 两条手动流水成对落账(转出 − / 转入 +, 同一 xid, 同日期),
   合计对钱包的"总余额"无影响, 只是把钱从一个口袋挪到另一个口袋。
   一条命令 = 一次 mutate = 一步撤销; 先校验完两个钱包 / 金额 / 日期 / 源钱包余额, 再落任何一条流水。 */
function walletTransfer(rest){
  const usage = "用法: wallet tr <转出钱包> <转入钱包> <金额> [备注..] [@日期]   例 wallet tr 微信 现金 500 提现";
  const a = findDateToken(rest);
  const from = findWalletByName(a.tokens[0]), to = findWalletByName(a.tokens[1]);
  if(!from){ line([{t:"未找到转出钱包「"+String(a.tokens[0]||"")+"」。",c:COLOR.yellow},{t:usage,c:COLOR.yellow}]); return; }
  if(!to){ line([{t:"未找到转入钱包「"+String(a.tokens[1]||"")+"」。",c:COLOR.yellow},{t:usage,c:COLOR.yellow}]); return; }
  if(from.id===to.id){ line([{t:"转出与转入是同一个钱包「"+from.name+"」, 无需转账。",c:COLOR.yellow}]); return; }
  const n = parseAmount(a.tokens[2]);
  if(n==null){ line([{t:"金额无效(需为 ≥ ¥0.01 的数字)。"+usage, c:COLOR.yellow}]); return; }
  const date = cleanDateStr(a.date);
  if(!date){ line([{t:"日期无效，格式 @YYYY-MM-DD",c:COLOR.yellow}]); return; }
  const available = walletBalanceAt(from.id, date);
  if(available < n){
    line([{t:"⚠ 钱包「"+from.name+"」截至 "+date+" 只有 ¥"+money(available)+", 不够转出 ¥"+money(n)+"。",c:COLOR.yellow}]);
    return;
  }
  const note = a.tokens.slice(3).map(unescapeArg).join(" ");
  const seq = state.wops.reduce((m,o)=>{
    const g = /^x(\d+)-/.exec(o && o.xid ? o.xid : "");
    return g ? Math.max(m, Number(g[1])) : m;
  }, 0) + 1;
  const xid = "x"+seq+"-"+date.replace(/-/g,"")+"-"+String(state.wops.length);
  state.wops.push({ wallet:from.id, amount:-n, date, note:"转出至 "+to.name+(note ? " · "+note : ""), created:todayYMD(), xid });
  state.wops.push({ wallet:to.id, amount:n, date, note:"转入自 "+from.name+(note ? " · "+note : ""), created:todayYMD(), xid });
  line([{t:"✓ 转账 ",c:COLOR.green},{t:from.name+" → "+to.name,c:COLOR.pure},
        {t:" ¥"+money(n)+(note ? "  "+note : ""),c:COLOR.white}]);
  line([{t:"  日期 "+date+" · 两条流水成对记录(一步撤销) · ",c:COLOR.gray},
        {t:from.name+" ¥"+money(walletBalance(from.id)),c:COLOR.gray},
        {t:"  →  "+to.name+" ¥"+money(walletBalance(to.id)),c:COLOR.gray}]);
  if(date > todayYMD()) line([{t:"  ※ 这条转账晚于今天, 到 "+date+" 才计入两个钱包的余额。", c:COLOR.gray}]);
}
function walletUse(rest){
  const usage = "用法: wallet use <钱包>   设为默认钱包(记支出时不写 $钱包 就用它)";
  const w = findWalletByName(rest[0]);
  if(!w){ line([{t:"未找到钱包「"+String(rest[0]||"")+"」。"+usage, c:COLOR.yellow}]); return; }
  state.settings.walletDefault = w.id;
  line([{t:"✓ 默认钱包设为 ",c:COLOR.green},{t:w.name,c:COLOR.pure,cls:"hl"},
        {t:"  (记支出时不写 $钱包 就由它付款)",c:COLOR.gray}]);
}
function walletRename(rest){
  const usage = "用法: wallet name <钱包> <新名称>   重命名, 已有记录自动跟着改(记录存的是钱包 id)";
  const w = findWalletByName(rest[0]);
  if(!w){ line([{t:"未找到钱包「"+String(rest[0]||"")+"」。"+usage, c:COLOR.yellow}]); return; }
  const name = cleanWalletName(rest[1]);
  if(!name){ line([{t:"新名称不能为空, 且不超过 "+WALLET_NAME_MAX+" 个字符。"+usage, c:COLOR.yellow}]); return; }
  if(name===w.name){ line([{t:"名称没有变化。", c:COLOR.gray}]); return; }
  if(findWalletByName(name)){ line([{t:"已有同名钱包「"+name+"」, 请换一个名字。", c:COLOR.yellow}]); return; }
  const old = w.name;
  w.name = name;
  line([{t:"✓ 钱包已重命名: ",c:COLOR.green},{t:old,c:COLOR.gray},{t:"  →  ",c:COLOR.gray},{t:name,c:COLOR.pure,cls:"hl"},
        {t:"  ("+state.records.filter(r=>r.wallet===w.id).length+" 笔支出跟着改)",c:COLOR.gray}]);
}
function walletDel(rest){
  const usage = "用法: wallet del <钱包>   删除钱包: 流水一并删除, 由它支付的支出改记到默认钱包";
  const w = findWalletByName(rest[0]);
  if(!w){ line([{t:"未找到钱包「"+String(rest[0]||"")+"」。"+usage, c:COLOR.yellow}]); return; }
  if(state.wallets.length<=1){ line([{t:"至少要保留一个钱包(记支出需要指定付款钱包)。", c:COLOR.yellow}]); return; }
  const wasDefault = (state.settings.walletDefault===w.id);
  /* 删钱包时, 与它成对的那条转账流水也要一并删除(否则对方钱包留下半笔凭空转入) */
  const xids = new Set(state.wops.filter(o=>o.wallet===w.id && o.xid).map(o=>o.xid));
  const ops = state.wops.filter(o=>o.wallet===w.id || (o.xid && xids.has(o.xid))).length;
  state.wallets = state.wallets.filter(x=>x!==w);
  state.wops = state.wops.filter(o=>o.wallet!==w.id && !(o.xid && xids.has(o.xid)));
  if(wasDefault) state.settings.walletDefault = state.wallets[0].id;
  const toId = state.settings.walletDefault, toName = walletNameOf(toId);
  let moved = 0;
  for(const r of state.records) if(r.wallet===w.id){ r.wallet = toId; moved++; }
  line([{t:"✗ 已删除钱包 ",c:COLOR.red},{t:w.name,c:COLOR.red},
        {t:"  (流水 "+ops+" 条一并删除)",c:COLOR.gray}]);
  line([{t:"  由它支付的 "+moved+" 笔支出改记到"+(wasDefault?"新的默认钱包":"默认钱包")+"「"+toName+"」",c:COLOR.white},
        {t:"  可 undo 撤销",c:COLOR.gray}]);
}
function doWallet(tokens){
  const sub = String(tokens[0]||"").toLowerCase();
  if(!sub || sub==="list" || sub==="show" || sub==="ls" || sub==="总览"){ printWallets(); return; }
  const rest = tokens.slice(1);
  if(sub==="add"||sub==="new"||sub==="create"||sub==="新建"||sub==="添加"){ walletAdd(rest); return; }
  if(sub==="in"||sub==="fund"||sub==="deposit"||sub==="存入"||sub==="充值"){ walletInOut(rest, 1); return; }
  if(sub==="out"||sub==="take"||sub==="withdraw"||sub==="取出"||sub==="扣减"){ walletInOut(rest, -1); return; }
  if(sub==="tr"||sub==="transfer"||sub==="转账"||sub==="转"){ walletTransfer(rest); return; }
  if(sub==="mv"||sub==="move"||sub==="改付"){ walletMv(rest); return; }
  if(sub==="use"||sub==="default"||sub==="默认"){ walletUse(rest); return; }
  if(sub==="name"||sub==="rename"||sub==="重命名"){ walletRename(rest); return; }
  if(sub==="del"||sub==="rm"||sub==="delete"||sub==="remove"||sub==="删除"){ walletDel(rest); return; }
  if(sub==="log"||sub==="history"||sub==="流水"){
    let id = null, limit = 20;
    for(const t of rest){
      const w = findWalletByName(t);
      if(w) id = w.id;
      else if(numeric(t)!=null && numeric(t)>0) limit = Math.round(numeric(t));
      else { line([{t:"未识别的参数「"+t+"」。用法: wallet log [钱包] [N]", c:COLOR.yellow}]); return; }
    }
    printWalletLog(id, limit);
    return;
  }
  /* 不是子命令 → 当作钱包名: 看单个钱包 */
  const w = findWalletByName(tokens[0]);
  if(w){ printWallets(w.id); return; }
  walletUsage();
}

/* ------------------------------- list ---------------------------------- */
function addSeg(div, s){
  if(s.node){ div.appendChild(s.node); return; }      // Canvas 图标段(地点准星)
  const sp=document.createElement("span");
  if(s.c) sp.style.color = s.c;
  if(s.cls) sp.className = s.cls;
  sp.textContent = s.t;
  div.appendChild(sp);
}
function mkSpan(t,c){ const s=document.createElement("span"); s.textContent=t; if(c) s.style.color=c; return s; }
/* 查找结果高亮: 把 text 里命中 needles 的片段切成"普通段 + .hl 段"。
   只做字面量匹配(不构造正则), 大小写不敏感; 文本一个字都不改 —— 行的 textContent 与 list 完全一致。 */
function hlSegs(text, color, needles){
  const s = String(text==null?"":text);
  const ns = (Array.isArray(needles)?needles:[needles]).map(x=>String(x==null?"":x)).filter(Boolean).map(x=>x.toLowerCase());
  if(!s || !ns.length) return [{t:s, c:color}];
  const low = s.toLowerCase();
  const out=[]; let buf="", i=0;
  while(i < s.length){
    const hit = ns.find(n=>low.startsWith(n, i));
    if(hit){
      if(buf){ out.push({t:buf, c:color}); buf=""; }
      out.push({t:s.slice(i, i+hit.length), c:color, cls:"hl"});
      i += hit.length;
    } else { buf += s[i]; i++; }
  }
  if(buf) out.push({t:buf, c:color});
  return out;
}
/* 每条记录一行; 点右侧"投资状态"按钮后, 行内状态/已投小计即时刷新(修复点了仍显示未投)
   opts.hl : 查找关键词数组 —— 命中片段加 .hl 底色, 其余渲染与 list 完全一致。 */
function renderRecordRow(r, opts){
  const hl = (opts && Array.isArray(opts.hl) && opts.hl.length) ? opts.hl : null;
  const d = document.createElement("div"); d.className = "l";
  addSeg(d,{t:"#"+r.id, c:COLOR.cyan});
  addSeg(d,{t:"  "+r.date+"  ", c:COLOR.gray});
  const catTxt = r.category.padEnd(6," ");
  for(const s of (hl ? hlSegs(catTxt, catColor(r.category), hl) : [{t:catTxt, c:catColor(r.category)}])) addSeg(d,s);
  addSeg(d,{t:"¥"+money(r.amount).padStart(8," "), c:COLOR.pure});
  // 分摊成本: 行里的金额是"每天"的金额, 后面补上"总价 X / N 天(起~止)", 否则看不出来源
  if(recAmortized(r)){
    const w = recWindow(r);
    addSeg(d,{t:"  [分摊"+recDays(r)+"天: 总"+money(recTotal(r))+" → 每天"+money(r.amount)+"  "+w.start+"~"+w.end+"]", c:COLOR.gray});
  }
  addSeg(d,{t:"  应投货币 ",c:COLOR.cyan}); addSeg(d,{t:"¥"+money(r.mm), c:COLOR.white});
  addSeg(d,{t:"  应投指数 ",c:COLOR.index}); addSeg(d,{t:"¥"+money(r.idx), c:COLOR.white});
  const invSpan = mkSpan("", COLOR.gray);       // 已投小计
  const stSpan  = mkSpan("", COLOR.gray);       // 状态
  d.appendChild(invSpan); d.appendChild(stSpan);
  if(r.note) for(const s of (hl ? hlSegs("  · "+r.note, COLOR.gray, hl) : [{t:"  · "+r.note, c:COLOR.gray}])) addSeg(d,s);
  if(r.place) for(const s of geoPlaceSegs(r.place, "  · ", " ")) addSeg(d,s);
  /* 付款钱包: 与地点一样是行内元信息(方括号灰字); 旧记录(未指定钱包)不显示 */
  const wName = walletNameOf(r.wallet);
  if(wName){
    const wTxt = "  ["+wName+"]";
    for(const s of (hl ? hlSegs(wTxt, COLOR.gray, hl) : [{t:wTxt, c:COLOR.gray}])) addSeg(d,s);
  }
  addSeg(d,{t:"  ", c:COLOR.gray});
  const b = document.createElement("button"); b.type="button"; b.className="tbtn";
  b.title = "把 #"+r.id+" 应投货币/指数全部标记已投 (等同 pay "+r.id+" all), 再点重置";
  // H5: 行内 ✎ 编辑(接活弹窗 edit 分支); 放在投资按钮之后, 保持"行内第一个按钮 = 投资按钮"的既有约定
  const eb = document.createElement("button"); eb.type="button"; eb.className="tbtn";
  eb.title = "编辑 #"+r.id+" (等同 update "+r.id+" <金额> <类别>)";
  // 行是否还指向 state 里的同一条记录: undo/redo 或 del 之后, 旧行会变成"悬空"行,
  // 不能再让它按钮上报成功(否则看起来改了数据, 实际什么都没发生)
  const alive = ()=> state.records.indexOf(r) >= 0;
  const refresh = ()=>{
    if(!alive()){
      invSpan.textContent = ""; stSpan.textContent = "  已失效"; stSpan.style.color = COLOR.gray;
      b.disabled = true; b.className = "tbtn dimmed"; b.textContent = "已失效";
      b.title = "该行对应的记录已被删除或撤销, 请重新 list";
      eb.disabled = true; eb.className = "tbtn dimmed"; eb.textContent = "已失效";
      return;
    }
    const noNeed = recNoNeed(r);
    const mInv=r.moneyInv||0, iInv=r.indexInv||0;
    const parts=[]; if(mInv>0) parts.push("已投货币¥"+money(mInv)); if(iInv>0) parts.push("已投指数¥"+money(iInv));
    invSpan.textContent = parts.length? "  ["+parts.join(" ")+"]" : "";
    invSpan.style.color = COLOR.gray;
    const st = recStatus(r);
    stSpan.textContent = "  "+st.t; stSpan.style.color = st.c;
    const f2 = !noNeed && recFullyMoney(r) && recFullyIndex(r);
    b.className = "tbtn " + (f2 ? "on" : "");
    if(noNeed){
      b.disabled = true;
      b.textContent = "无需投资";
      b.title = "该笔应投货币/指数均为 ¥0.00, 无需投资";
    } else {
      b.disabled = false;
      b.textContent = f2 ? "已投资 ✓" : "标记已投资";
      b.title = "把 #"+r.id+" 应投货币/指数全部标记已投 (等同 pay "+r.id+" all), 再点重置";
    }
    eb.disabled = false; eb.className = "tbtn"; eb.textContent = "✎ 编辑";
  };
  b.addEventListener("click", ()=>{
    if(!alive()){ line([{t:"#"+r.id+" 所在行已失效(记录已被删除或撤销), 请重新执行 list 查看最新数据。", c:COLOR.yellow}]); refresh(); return; }
    if(recNoNeed(r)){ line([{t:"#"+r.id+" 应投货币/指数均为 ¥0.00, 无需投资。", c:COLOR.yellow}]); return; }
    mutate(()=>{
      if(recFullyMoney(r) && recFullyIndex(r)){ r.moneyInv=0; r.indexInv=0; }
      else { r.moneyInv=r.mm; r.indexInv=r.idx; }
    });
    commitIfDirty();                 // 出口统一落盘 + 刷新(H4)
    const f2 = recFullyMoney(r) && recFullyIndex(r);
    refresh();
    line([{t:"✓ #"+r.id+" "+r.category+" ¥"+money(r.amount)+" 投资 → "+(f2?"已投资":"未投资"), c: f2?COLOR.green:COLOR.yellow}]);
    scrollBottom();
  });
  eb.addEventListener("click", ()=>{
    if(!alive()){ line([{t:"#"+r.id+" 所在行已失效(记录已被删除或撤销), 请重新执行 list 查看最新数据。", c:COLOR.yellow}]); refresh(); return; }
    openEdit(r);
  });
  d.appendChild(b);
  d.appendChild(eb);
  refresh();   // 初始化行内状态
  term.appendChild(d);
}
/* ---- 日期条件解析(抽成单一实现, list 与 search 共用) ----
   `@2027-08-18` / `@2027-08` / `@today` / `@period` / `@month` 以及中文关键字
   (`今日` / `本周期` / `本月`) 都归一到三种结果之一:
     {kind:"date",  date}   只看这一天
     {kind:"month", month}  看整月(自然月)
     {kind:"range", range}  看一段区间(周期 / 本月)
   返回 null = 无法识别, 由调用方决定"报错"还是"当普通关键词"。
   以前这套判断只写在 filterByTokens 里, 新增 search 时若再抄一份必然漂移(F1)。 */
function dateKeywordCond(s){
  const low = String(s==null?"":s).toLowerCase();
  if(low==="today" || s==="今日" || s==="今天" || s==="当日") return { kind:"date", date:todayYMD() };
  if(low==="period" || s==="周期" || s==="本周期"){
    const p = currentPeriod();
    return { kind:"range", range:{ start:p.start, end:p.end, label:"周期 "+p.label } };
  }
  if(low==="month" || s==="本月" || s==="月份" || s==="自然月"){
    const m = calendarMonthBounds(todayYMD());
    return { kind:"range", range:{ start:m.start, end:m.end, label:"本月 "+m.label } };
  }
  return null;
}
function dateCondOf(raw){
  const s = String(raw==null?"":raw).trim().replace(/^@/,"");
  if(!s) return null;
  const kw = dateKeywordCond(s);
  if(kw) return kw;
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){
    const p = parseYMD(s);
    if(!p || !(p.m>=1 && p.m<=12) || !(p.d>=1 && p.d<=lastDay(p.y,p.m))) return null;   // 2027-13-40 不算日期
    return { kind:"date", date:mkYMD(p.y,p.m,p.d) };
  }
  if(/^\d{4}-\d{1,2}$/.test(s)){
    const p = parseYMD(s+"-01");
    if(!p || !(p.m>=1 && p.m<=12)) return null;
    return { kind:"month", month:mkYMD(p.y,p.m,1).slice(0,7) };
  }
  return null;
}
/* list 参数解析: [类别X] [@日期 | @YYYY-MM | @today | @period | @month] [条数]
   - @YYYY-MM-DD / @today  → 只看该天
   - @YYYY-MM   / @month   → 看整月(自然月)
   - @period               → 看当前记账周期(可跨月)
   - 其余非数字 token 视为类别 */
function filterByTokens(tokens){
  let cat=null, month=null, date=null, range=null, limit=null;
  const bad = [];                      // 无法识别的 @条件(以前会被静默忽略, 于是 list @写错 就变成"列出全部")
  const apply = (c)=>{
    if(c.kind==="date") date = c.date;
    else if(c.kind==="month") month = c.month;
    else range = c.range;
  };
  for(const tk of tokens){
    const raw = String(tk);
    if(raw[0]==="@"){
      const c = dateCondOf(raw);
      if(c){ apply(c); continue; }
      bad.push(raw);
      continue;
    }
    if(/^(cat|类别|category)$/i.test(raw)) continue;
    if(numeric(raw)!==null){ limit = +raw; continue; }
    const kw = dateKeywordCond(raw);     // 不带 @ 时只认关键字, 不把 2027-08 当日期(与旧行为一致)
    if(kw){ apply(kw); continue; }
    cat = raw;
  }
  return {cat,month,date,range,limit,bad};
}
function doList(tokens){
  const f = filterByTokens(tokens);
  let rows = state.records.slice();
  /* 日期口径统一走"分摊窗口有交集": 一笔分摊成本在它的每一天都该出现在列表里。
     以前写成 r.date===f.date / inRange(r.date,..) 只认记账日 → 窗口里其余天"查不到这笔"(缺陷)。 */
  let winB = null;                                   // 本次筛选的日期窗口(没有日期条件时为 null)
  if(f.date)       winB = { start:f.date, end:f.date };
  else if(f.range) winB = { start:f.range.start, end:f.range.end };
  else if(f.month) winB = calendarMonthBounds(f.month+"-01");
  if(f.cat)  rows = rows.filter(r=>r.category===f.cat);
  if(winB)   rows = rows.filter(r=>recInWindow(r,winB.start,winB.end));
  rows.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:a.id-b.id));
  if(f.limit && f.limit>0) rows = rows.slice(-f.limit);
  const desc=[];
  if(f.cat) desc.push("类别="+f.cat);
  if(f.date) desc.push("日期="+f.date);
  else if(f.range) desc.push(f.range.label);
  else if(f.month) desc.push("月份="+f.month);
  if(f.limit) desc.push("最近 "+f.limit+" 条");
  const descTxt = desc.length ? ("  [筛选: "+desc.join("  ")+"]") : "";
  if(f.bad.length) line([{t:"⚠ 无法识别的日期条件: "+f.bad.join(" ")+"  可用 @YYYY-MM-DD / @YYYY-MM / @today / @period / @month",
                          c:COLOR.yellow}]);
  if(!rows.length){
    line([{t:"(暂无匹配记录)"+descTxt+"   add 一笔试试吧",c:COLOR.gray}]);
    const cats=[...new Set(state.records.map(r=>r.category))];
    if(cats.length) line([{t:"现有类别: "+cats.join("   "),c:COLOR.gray}]);
    return;
  }
  /* 合计按"窗口内实际计入的天数"算: 分摊记录只算落在筛选窗口里的那些天,
     否则一行显示的是"每天"、合计却按整天数全算, 两处对不上。 */
  const winDays = winB ? (daysBetween(winB.start,winB.end)+1) : null;
  const sm = winB ? sumRange(rows, winB.start, winB.end)
                  : { total:r2(rows.reduce((s,r)=>s+r.amount,0)), amort:0 };
  blank();
  sectionHead("消费记录", rows.length+" 条"+descTxt);
  line([{t:" 合计 ¥"+money(sm.total)+"   点每行右侧 [标记已投资] 一键勾选, 再点取消。",c:COLOR.gray}]);
  if(sm.amort>0){
    line([{t:" 其中分摊成本 ¥"+money(sm.amort)
           +(winDays>1 ? ("  (行内 ¥ 是每天的口径, 合计按落在筛选窗口内的 "+winDays+" 天计)")
                       : "  (行内 ¥ 就是当天这一份)"),
           c:COLOR.gray}]);
  }
  for(const r of rows){ renderRecordRow(r); }
  blank();
}
/* ============================== search ==========================
   一个入口覆盖「类别 / 编号 / 关键词 / 金额 / 日期」, 命令行与工具栏搜索框共用:
     search 餐饮               类别 / 备注 / 地点 任一处命中
     search 午餐 餐饮           多个关键词必须同时命中(AND; 每个词可命中任一文本字段)
     search #12                记录编号(精确, 列表行首的 #12)
     search 50                 金额 = 50 —— 同一条数字也按编号匹配(#50), 免得"编号搜不到"
     search >100 / <=50        金额比较(按总价; 年付房租不会因每天 8 元被算成小额)
     search 100-200            金额区间(写反 200-100 也按区间处理)
     search @2027-08 / @today  日期窗口, 与 list 同一口径(分摊按窗口交集命中)
     search 餐饮 @2027-08       不同条件之间 AND
   结果行复用 renderRecordRow(), 行内 [标记已投资] / ✎ 编辑 与消费列表完全一致;
   合计口径也与 list 相同: 带日期条件时只算落在窗口内的天数。 */
const SEARCH_CMP_RE = /^(>=|<=|>|<)(\d+(?:\.\d+)?)$/;
const SEARCH_RANGE_RE = /^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/;
/* 金额写法的宽容归一: 全角数字 → 半角, 去掉 ¥/￥ 前缀、千分位逗号与结尾的「元」 */
function searchNumText(t){
  return String(t==null?"":t)
    .replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/^[¥￥]/,"").replace(/,/g,"").replace(/元$/,"").trim();
}
function searchNum(v){ return String(+(+v).toFixed(2)); }   // 100.00 → "100", 8.20 → "8.2"
function parseSearchQuery(tokens){
  const q = { text:[], id:null, amount:[], date:null, month:null, range:null, bad:[], notes:[] };
  const setDate = (c)=>{
    /* 日期/月份/区间只接受一个: 同时给 "@2027-08 @today" 时按"第一个生效"并明确提示,
       不再悄悄叠加成"既在 8 月又是今天"这种看不出来的组合。 */
    if(q.date || q.month || q.range){ q.notes.push("日期/月份条件只取第一个"); return; }
    if(c.kind==="date") q.date = c.date;
    else if(c.kind==="month") q.month = c.month;
    else q.range = c.range;
  };
  for(const tk of tokens){
    const raw = String(tk);
    if(!raw) continue;
    if(raw[0]==="#"){
      const n = numeric(raw.slice(1));
      if(n!=null && Number.isInteger(n) && n>=0){ q.id = n; continue; }
      q.bad.push(raw);
      continue;
    }
    const dc = dateCondOf(raw);
    if(dc){ setDate(dc); continue; }
    if(raw[0]==="@"){ q.bad.push(raw); continue; }       // @ 开头却没解析出日期: 报错, 别当关键词
    const num = searchNumText(raw);
    const cmp = SEARCH_CMP_RE.exec(num);
    if(cmp){ q.amount.push({op:cmp[1], v:parseFloat(cmp[2])}); continue; }
    const rg = SEARCH_RANGE_RE.exec(num);
    if(rg){
      const a = parseFloat(rg[1]), b = parseFloat(rg[2]);
      q.amount.push({op:"range", v:Math.min(a,b), v2:Math.max(a,b)});
      continue;
    }
    const n = numeric(num);
    if(n!=null){ q.amount.push({op:"=", v:n}); continue; }
    q.text.push(raw.toLowerCase());
  }
  return q;
}
/* 金额条件:
   - 等值: 「每天金额」或「总价」任一命中(用户可能照抄行里的 ¥, 也可能是记得的总价);
   - 比较/区间: 只看**总价** —— 否则年付房租会因为"每天 8 元"被算进 "<=50" 的小额筛选, 明显反直觉。 */
function searchAmountHit(r, t){
  const amt = r2(Number(r.amount)||0), total = r2(recTotal(r));
  switch(t.op){
    case "=":     return amt===r2(t.v) || total===r2(t.v) || r.id===t.v;
    case ">":     return total>t.v;
    case ">=":    return total>=t.v;
    case "<":     return total<t.v;
    case "<=":    return total<=t.v;
    case "range": return total>=t.v && total<=t.v2;
  }
  return true;
}
function searchTextHit(r, kw){
  /* 付款钱包名也参与关键词匹配(搜「微信」能搜到用它付的记录) */
  return [r.category, r.note, r.place, walletNameOf(r.wallet)].some(h=>String(h==null?"":h).toLowerCase().includes(kw));
}
function searchDesc(q){
  const parts = [];
  if(q.id!=null) parts.push("#"+q.id);
  if(q.text.length) parts.push("关键词="+q.text.join("+"));
  for(const t of q.amount){
    parts.push(t.op==="range" ? ("金额 ¥"+searchNum(t.v)+"~¥"+searchNum(t.v2))
               : t.op==="="   ? ("金额=¥"+searchNum(t.v))
                              : ("金额"+t.op+"¥"+searchNum(t.v)));
  }
  if(q.date) parts.push("日期="+q.date);
  else if(q.month) parts.push("月份="+q.month);
  else if(q.range) parts.push(q.range.label);
  return parts.join("  ");
}
function searchUsage(){
  line([{t:"用法: search <关键词|#编号|金额|@日期>   多个条件用空格分隔(同时满足)", c:COLOR.yellow}]);
  line([{t:"      search 餐饮                 类别/备注/地点 任一处含「餐饮」", c:COLOR.yellow}]);
  line([{t:"      search #12                  按编号(列表行首的 #12)", c:COLOR.yellow}]);
  line([{t:"      search 50 / >100 / 100-200  金额等于 / 大于 / 区间(等值含每天金额, 比较按总价)", c:COLOR.yellow}]);
  line([{t:"      search @2027-08 / @today    日期或月份(与 list 同口径)", c:COLOR.yellow}]);
  line([{t:"      例: search 餐饮 @2027-08    search 房租     工具栏最右侧搜索框回车同效", c:COLOR.yellow}]);
}
function doSearch(tokens){
  const q = parseSearchQuery(tokens);
  if(q.bad.length){
    line([{t:"⚠ 无法识别的查找条件: "+q.bad.join(" ")+"   可用 #编号 / 金额(>100、100-200) / @YYYY-MM-DD / @YYYY-MM / @today|@period|@month",
          c:COLOR.yellow}]);
  }
  if(q.notes.length) line([{t:"⚠ "+[...new Set(q.notes)].join("; "), c:COLOR.yellow}]);
  if(q.id==null && !q.text.length && !q.amount.length && !q.date && !q.month && !q.range){
    searchUsage();
    return;
  }
  const rows = state.records.filter(r=>{
    if(q.id!=null && r.id!==q.id) return false;
    if(q.date && !recInWindow(r, q.date, q.date)) return false;
    if(q.month){ const b = calendarMonthBounds(q.month+"-01"); if(!recInWindow(r, b.start, b.end)) return false; }
    if(q.range && !recInWindow(r, q.range.start, q.range.end)) return false;
    for(const t of q.amount) if(!searchAmountHit(r, t)) return false;
    for(const kw of q.text) if(!searchTextHit(r, kw)) return false;
    return true;
  });
  rows.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:a.id-b.id));
  const desc = searchDesc(q);
  const descTxt = desc ? ("  [查找: "+desc+"]") : "";
  if(!rows.length){
    line([{t:"(没有匹配的消费记录)"+descTxt+"   换个关键词/编号/金额, 或改用 @日期 试试", c:COLOR.gray}]);
    const cats = [...new Set(state.records.map(r=>r.category))];
    if(cats.length) line([{t:"现有类别: "+cats.join("   "), c:COLOR.gray}]);
    blank();
    return;
  }
  /* 合计口径与 list 一致: 带日期条件时, 分摊记录只算落在窗口里的天数 */
  let winB = null;
  if(q.date) winB = { start:q.date, end:q.date };
  else if(q.range) winB = { start:q.range.start, end:q.range.end };
  else if(q.month) winB = calendarMonthBounds(q.month+"-01");
  const sm = winB ? sumRange(rows, winB.start, winB.end)
                  : { total:r2(rows.reduce((s,r)=>s+r.amount,0)), amort:0 };
  blank();
  sectionHead("查找结果", rows.length+" 条"+descTxt);
  line([{t:" 合计 ¥"+money(sm.total)+"   点每行右侧 [标记已投资] 一键勾选, 再点 ✎ 编辑改动。", c:COLOR.gray}]);
  if(sm.amort>0){
    line([{t:" 其中分摊成本 ¥"+money(sm.amort)
           +(winB && daysBetween(winB.start,winB.end)>0 ? "  (行内 ¥ 是每天的口径, 合计按落在窗口内的天数计)"
                                                       : "  (行内 ¥ 就是当天这一份)"),
           c:COLOR.gray}]);
  }
  const hl = q.text.length ? q.text : null;
  for(const r of rows) renderRecordRow(r, { hl });
  blank();
}
function doDelete(tokens){
  const id = numeric(tokens[0]);
  if(id==null){ line([{t:"用法: del <id>",c:COLOR.yellow}]); return; }
  const i = state.records.findIndex(r=>r.id===id);
  if(i<0){ line([{t:"未找到 #"+id+"。用 list 查看编号",c:COLOR.yellow}]); return; }
  const [rm] = state.records.splice(i,1);
  line([{t:"✗ 已删除 #",c:COLOR.red},{t:rm.id,c:COLOR.red},
        {t:"  "+rm.category+" ¥"+money(rm.amount),c:COLOR.white},
        {t:recAmortized(rm) ? ("  (分摊"+(rm.amortDays)+"天 · 总价 ¥"+money(recTotal(rm))+")") : "", c:COLOR.gray}]);
}
function doUpdate(tokens){
  if(tokens.length<3){ line([{t:"用法: update <id> <金额> <类别> [备注..] [@日期] [#地点] [$钱包]",c:COLOR.yellow}]); return; }
  const id = numeric(tokens[0]);
  const rec = state.records.find(r=>r.id===id);
  if(!rec){ line([{t:"未找到 #"+id,c:COLOR.yellow}]); return; }
  const {tokens:rest, date:rawDate, place:rawPlace, wallet:rawWallet} = splitRecordArgs(tokens.slice(1));
  const amt = numeric(rest[0]);
  if(amt==null||amt<=0){ line([{t:"金额无效",c:COLOR.yellow}]); return; }
  const cat = validateCategory(rest[1]); if(!cat) return;
  const note = rest.slice(2).join(" ");
  /* $钱包 不写 = 不改付款钱包; 写了但不存在 → 整条 update 中止(先校验再改, 不留半更新) */
  const wid = (rawWallet!=null) ? pickWalletId(rawWallet) : null;
  if(rawWallet!=null && wid==null) return;
  const days = recDays(rec);                    // 分摊成本: 天数不变, 金额按"每天"解释 → 总价同步重算
  rec.amount = r2(amt); rec.category = cat; rec.note = note;
  if(wid!=null) rec.wallet = wid;
  if(rawPlace!=null) rec.place = (rawPlace==="-"||rawPlace==="off"||rawPlace==="clear") ? "" : normalizePlace(rawPlace);
  rec.amortDays = days;
  rec.amortTotal = days>1 ? r2(rec.amount*days) : rec.amount;
  if(rawDate){ const d = cleanDateStr(rawDate); if(d) rec.date=d; }
  const inv = investOf(recTotal(rec)); rec.mm=inv.mm; rec.idx=inv.idx;
  rec.moneyInv = Math.min(rec.moneyInv||0, rec.mm);
  rec.indexInv = Math.min(rec.indexInv||0, rec.idx);
  line([{t:"✓ 已更新 #",c:COLOR.green},{t:id,c:COLOR.pure},
        {t:"  "+cat+" ¥"+money(rec.amount)+(days>1 ? ("/天 (总价 ¥"+money(recTotal(rec))+" ÷ "+days+" 天)") : ""),
         c:COLOR.white},
        {t:"  应投按总价重算: 货币¥"+money(rec.mm)+" 指数¥"+money(rec.idx),c:COLOR.white},
        {t:(wid!=null ? ("  付款钱包 → "+walletNameOf(wid)) : ""), c:COLOR.gray}]);
}
function doPay(tokens){
  // H5: 「全额投资」以前只有界面按钮 —— 这里补上命令通道 pay full [mm|idx] (别名 invest full);
  // 界面按钮也改为回灌这条命令, 两条通道从此对称, 撤销栈也只有一个提交点。
  if((tokens[0]||"").toLowerCase()==="full"){ doPayFull(tokens.slice(1)); return; }
  const id = numeric(tokens[0]);
  if(id==null){ line([{t:"用法: pay <id> [mm|idx|all|none]   例 pay 3 all;  全额投资: pay full [mm|idx]",c:COLOR.yellow}]); return; }
  const rec = state.records.find(r=>r.id===id);
  if(!rec){ line([{t:"未找到 #"+id,c:COLOR.yellow}]); return; }
  if(recNoNeed(rec)){ line([{t:"#"+id+" 应投货币/指数均为 ¥0.00, 无需投资。",c:COLOR.yellow}]); return; }
  const kind = (tokens[1]||"all").toLowerCase();
  let label="", verb;
  const fm = recFullyMoney(rec), fi = recFullyIndex(rec);
  if(kind==="all"){
    if(fm && fi){ rec.moneyInv=0; rec.indexInv=0; label="重置为未投资"; }
    else { rec.moneyInv=rec.mm; rec.indexInv=rec.idx; label="全部记已投"; }
  } else if(kind==="none"){
    rec.moneyInv=0; rec.indexInv=0; label="重置为未投资";
  } else if(kind==="mm"){
    rec.moneyInv = fm ? 0 : rec.mm; label = fm ? "货币 重置未投" : "货币 记已投";
  } else if(kind==="idx"||kind==="index"){
    rec.indexInv = fi ? 0 : rec.idx; label = fi ? "指数 重置未投" : "指数 记已投";
  } else { line([{t:"kind 应为 mm | idx | all | none",c:COLOR.yellow}]); return; }
  const st2 = recStatus(rec);
  line([{t:"✓ #"+id+" "+label+" → "+st2.t, c: st2.c===COLOR.green?COLOR.green:COLOR.yellow}]);
}

/* 全额投资: 整池投掉清零; 仅当该种未投池 ≥ 阈值(货币100/指数20)才可执行(否则提示需满额)。
   H5 收口: 把"执行 + 播报"抽成 investFullRun()(不含 mutate), 命令通道(pay full)与
   程序化入口(doInvestFull)共用同一份实现 —— 界面按钮改为回灌 pay full 命令;
   因为 mutate() 不可重入(嵌套会压两条撤销), 所以"执行体"不能再自带 mutate。 */
function investFullRun(kind){
  const name = kind==="money" ? "应投货币" : "应投指数";
  const lot = kind==="money" ? INVEST_MONEY_LOT : INVEST_INDEX_LOT;
  const r = investFull(kind);
  if(!r){
    const pend = kind==="money" ? moneyPending() : indexPending();
    if(pend <= INV_EPS) line([{t:name+" 未投池为空，暂无可投。", c:COLOR.yellow}]);
    else line([{t:name+" 未投池仅 ¥"+money(pend)+"，需累计至 ¥"+lot+" 才能全额投资。", c:COLOR.yellow}]);
    return false;
  }
  line([{t:"✓ 已全额投资 ",c:COLOR.green},{t:name,c:kind==="money"?COLOR.cyan:COLOR.index},
        {t:" ¥"+money(r.amt)+" (池已清零; 分摊到 "+r.applied+" 笔未投记录)",c:COLOR.white}]);
  scrollBottom();
  return true;
}
/* 程序化入口(测试/外部脚本): 自带一次 mutate + 统一提交; 界面按钮统一走 pay full 命令。
   命令路径(pay full)由 runCommand 出口的 commitIfDirty() 提交, 这里只兜住非命令调用,
   避免"执行体"自己 commit 造成 mutate 重入 / 多次落盘。 */
function doInvestFull(kind){ const r = mutate(()=>investFullRun(kind)); commitIfDirty(); return r; }
/* pay full [mm|idx] —— 全额投资的命令通道(别名 invest full); 省略参数 = 货币+指数都尝试 */
function doPayFull(rest){
  const arg = (rest[0]||"all").toLowerCase();
  let kinds;
  if(arg==="all"||arg==="")           kinds = ["money","index"];
  else if(arg==="mm"||arg==="money")  kinds = ["money"];
  else if(arg==="idx"||arg==="index") kinds = ["index"];
  else { line([{t:"用法: pay full [mm|idx]   例 pay full mm (省略 = 货币+指数都尝试)",c:COLOR.yellow}]); return; }
  for(const k of kinds) investFullRun(k);
}

/* ----------------------------- summaries ------------------------------- */
/* 窗口统计的唯一实现在"窗口统计"分区(collectWindow / investTotalsOf),
   这里只放 summary 命令本身 —— 别再复制一份窗口求和。 */
/* 总结报告渲染。表里的"预算行"(本期发放/占用/结余/累计余额)按**窗口覆盖的记账周期合计**算
   预算按周期发放与结转, 所以它不跟着窗口内的天数走, 但要跟着**查询的那一段**走
   —— `report @2026-09` 看的是 2026-09 那一段的发放与结转(自然月跨两个记账周期时就是两期之和),
   不是今天这一期(旧实现一律 currentPeriod())。区间与窗口不完全重合时, 表头会标出预算行用的是哪一段。 */
function printSummaryReport(win, windowName, opts){
  opts = opts || {};
  const st = budgetOfWindow(win);              // 预算行口径 = 窗口覆盖的各期合计
  const aw  = alertWord(st.ratio);
  const carry = r2(st.usedUnits - st.B);       // >0 透支; <=0 本期剩余可结转
  const bal = availableBalance(st);
  const title = windowName;
  if(!opts.noTitle) sectionHead("预算总结", title);
  /* 预算行与窗口不是同一段日期时必须说清楚, 否则"窗口 ¥5043.92 / 本期发放 ¥1823.99"还是对不上 */
  if(st.start !== win.start || st.end !== win.end){
    line([{t:" 预算行口径: "+st.count+" 个记账周期合计 "+st.start+" ~ "+st.end
            +"(发放/消费/结转均按该区间)", c:COLOR.gray}]);
  }
  const invTotal = r2(win.mmT+win.idxT);
  // stat table rows: [key, value, color, glow?]
  const rows=[
    ["窗口总消费", "¥"+money(win.total), COLOR.pure],
    ["消费笔数", String(win.count), COLOR.white],
  ];
  /* compact = 合并入口 report 专用: 类别明细与下面的饼图图例重复, 不再在表格里列一遍。
     summary 单命令仍保留这段(它的类别信息没有别的出口)。 */
  if(!opts.compact){
    for(const [cat,amt] of win.cats){
      const pct = win.total>0? (amt/win.total*100).toFixed(1)+"%":"0%";
      rows.push(["  类别·"+cat, "¥"+money(amt)+"  ("+pct+")", catColor(cat)]);
    }
  }
  /* 分摊成本的占比: 它已经按天算进"窗口总消费"里了, 这里只是让用户看得见有多少来自分摊
     (以前分摊只在记账当天计一天, 其余天数在总结里完全不可见) */
  if(win.amortTotal>0){
    const pA = win.total>0? (win.amortTotal/win.total*100).toFixed(1)+"%":"0%";
    rows.push(["其中分摊成本", "¥"+money(win.amortTotal)+"  ("+pA+")", COLOR.gray]);
  }
  rows.push(["应投货币("+mmPct()+"%)", "¥"+money(win.mmT), COLOR.cyan]);
  rows.push(["应投指数("+idxPct()+"%)", "¥"+money(win.idxT), COLOR.index]);
  rows.push(["应投合计", "¥"+money(invTotal), COLOR.green]);
  rows.push(["本期发放(基准)", "¥"+money(st.B), COLOR.white]);
  rows.push(["本期消费", "¥"+money(st.consumption), COLOR.pure]);
  rows.push(["本期占用(消费+应投)", "¥"+money(st.usedUnits), (st.ratio>1?COLOR.red:COLOR.white)]);
  rows.push(["本期结余/透支", (carry>0?"透支 -":"可结转 +")+money(Math.abs(carry)), carry>0?COLOR.red:COLOR.green]);
  rows.push(["累计可用余额(含结转)", "¥"+money(bal), bal<0?COLOR.red:COLOR.green]);
  rows.push(["超额状态", aw.t, aw.c]);
  for(const [k,v,color] of rows){
    kvRow(k, v, 0, color, /透支|超额/.test(k) && (carry>0 || aw.t!=="预算内 ✓"));
  }
  // visual bar for the period
  ratioBar(st.ratio, {
    label: "本期发放进度",
    sub: "已占用 ¥"+money(st.usedUnits)+" / 发放 ¥"+money(st.B)
  });
  line([{t:" 换算口径: 消费÷"+consumePct()+"%=占用; 占用×"+invPct()+"% 应投(货币"+mmPct()+"%/指数"+idxPct()+"%)", c:COLOR.gray}]);
  // category bars（compact 时类别交给饼图图例，避免同一份数据出现两次）
  if(!opts.compact && win.cats.length && win.total>0){
    line([{t:" 类别占比(按消费):",c:COLOR.gray}]);
    catRows(win.cats, win.total);
  }
  // investment payment status recap (未投部分 != 0)
  const unpaid = win.rows.filter(r=> !(recFullyMoney(r) && recFullyIndex(r)));
  if(unpaid.length){
    line([{t:" 未完全投资 ("+unpaid.length+" 笔): 用 pay <id> all 或点右侧按钮", c:COLOR.yellow}]);
    unpaid.slice(0,10).forEach(r=>{
      const mmInv=r.moneyInv||0, idxInv=r.indexInv||0;
      const invNote = (mmInv||idxInv) ? "  (已投货币¥"+money(mmInv)+" 指数¥"+money(idxInv)+")":"";
      line([{t:"   #"+r.id+" "+r.category+" ¥"+money(r.amount)+"  (应投货币¥"+money(r.mm)+" 指数¥"+money(r.idx)+")"+invNote,c:COLOR.white}]);
    });
    if(unpaid.length>10) line([{t:"   ... 等 "+(unpaid.length-10)+" 笔",c:COLOR.gray}]);
  }
  // 平均每日消费（summary day 不计算）
  if(!opts.isDay){
    const today = todayYMD();
    const totalDays = win.days || 1;
    const endEff = (win.end && win.end < today) ? win.end : today;
    const usedDays = Math.max(1, daysBetween(win.start, endEff) + 1);
    /* summary 单命令保持原口径(窗口总消费 ÷ 已过天数, T29.22 守着);
       report(compact) 改用截至今天的消费, 与分析里的预算使用率同口径, 避免未来分摊抬高日均。 */
    const base = opts.compact ? spentUpToToday(win) : win.total;
    const avg = r2(base / usedDays);
    line([{t:" ── 平均每日消费 ──", c:COLOR.gray}]);
    line([
      {t:" 日均 ", c:COLOR.gray},
      {t:"¥"+money(avg), c:COLOR.cyan, cls:"glow"},
      {t:"   = "+(opts.compact?"窗口消费":"窗口总消费")+" ¥"+money(base)+" ÷ "+usedDays+" 天", c:COLOR.gray}
    ]);
    line([
      {t:" 统计口径: ", c:COLOR.gray},
      {t:(usedDays<totalDays
          ? ("窗口 "+totalDays+" 天, 已过 "+usedDays+" 天")
          : ("窗口 "+totalDays+" 天 (已结束)")), c:COLOR.gray}
    ]);
  }
  blank();
}
/* summary 参数解析：summary [day|week|month|cat] [类别] [@YYYY-MM]
   第一个 token 若不在已知 kind 里, 则视为类别(窗口用当前记账周期)。 */
const SUMMARY_KINDS = new Set(["day","日","today","week","周","month","月","natural","cat","category","类别"]);
function parseSummaryArgs(tokens){
  let kind = (tokens[0]||"").toLowerCase();
  let rest = tokens.slice(1);
  if(kind && !SUMMARY_KINDS.has(kind)){ rest = tokens.slice(); kind=""; }
  let cat=null, ref=null;
  for(const tk of rest){
    if(!tk) continue;
    if(tk[0]==="@"){ ref = tk.slice(1); continue; }
    if(/^\d{4}-\d{1,2}(-\d{1,2})?$/.test(tk)){ ref = tk; continue; } // 形如 2027-07 / 2027-07-01
    cat = tk;                                                        // 其余非日期 token 视为类别
  }
  return {kind, cat, ref};
}
/* 窗口解析唯一入口: summary / chart / report 共用同一份窗口定义。
   现象: 窗口边界原先整段写在 doSummary 里; 图表与合并后的总结也要按同样的窗口统计, 再抄一遍就会有两套边界。
   原因: 分摊成本按"落在窗口内的天数"计入, 边界差一天数字就差一天(F13)。
   修复: 抽成单一函数, 三个命令都只传 kind/ref/cat, 金额一律由 collectWindow() 给出。
   kind="date" 是"手动输日期"弹窗选了具体某天时的窗口(不是 todayYMD), 同样按单日分桶。 */
function resolveWindow(kind, ref, cat){
  let isDay = (kind==="day"||kind==="日"||kind==="today");
  let win, name;
  if(kind==="date"){
    const p = parseYMD(ref) || parseYMD(todayYMD());
    const t = mkYMD(p.y,p.m,p.d);
    win=collectWindow(t,t,cat); name="指定日期 "+t; isDay=true;
  } else if(isDay){
    const t=todayYMD(); win=collectWindow(t,t,cat); name="今日 "+t;
  } else if(kind==="week"||kind==="周"){
    const w=weekBounds(todayYMD()); win=collectWindow(w.start,w.end,cat);
    name="本周 "+w.start+" ~ "+w.end+" (周"+(state.settings.weekStart==="mon"?"一":"日")+"起)";
  } else if(kind==="cat"||kind==="category"||kind==="类别"){
    const p=currentPeriod(); win=collectWindow(p.start,p.end,cat);
    name="周期分类 · "+p.label;
  } else if(kind==="month"||kind==="月"||kind==="natural"||(!kind && ref)){
    // 自然月：固定从当月 1 日到月末，与记账周期(滚动/自定义)无关
    // (kind 为空但给了月份, 如 `summary 2027-07`: 以前会静默忽略这个月份, 现在按该自然月统计)
    let r = todayYMD();
    if(ref){
      const p = parseYMD(ref) || (/^\d{4}-\d{1,2}$/.test(ref) ? parseYMD(ref+"-01") : null);
      if(p) r = mkYMD(p.y, p.m, 1);
    }
    const m = calendarMonthBounds(r);
    win = collectWindow(m.start, m.end, cat);
    name = "本月(自然月 1日~月末) "+m.label;
  } else { // default: current accounting period
    const p=currentPeriod(); win=collectWindow(p.start,p.end,cat);
    const w1 = p.mode==="rolling" ? "本周期(每"+p.len+"天)" : "本月周期";
    name = w1+" "+p.label;
  }
  return {win, name, isDay};
}
function noCategoryHint(cat){
  if(!cat) return;
  line([{t:"⚠ 该窗口内没有“"+cat+"”的记录，已按 0 显示。", c:COLOR.yellow}]);
  const used = [...new Set(state.records.map(r=>r.category))];
  if(used.length) line([{t:"  现有类别: "+used.join("  "), c:COLOR.gray}]);
}
function doSummary(tokens){
  const {kind, cat, ref} = parseSummaryArgs(tokens);
  const {win, name, isDay} = resolveWindow(kind, ref, cat);
  const tag = cat ? "  [类别: "+cat+"]" : "";
  if(cat && win.count===0) noCategoryHint(cat);
  printSummaryReport(win, name+tag, {isDay, catFilter:cat});
}

/* ============================ 图表总结 ============================
   把 日 / 周 / 周期 / 自然月 的预算情况画成柱状图与饼图, 并给出自动分析与结论。
   口径纪律(§2.6 / F13): 窗口一律来自 resolveWindow(), 金额一律来自 collectWindow(),
   柱状图的每个桶也单独走 collectWindow(桶起, 桶止, 类别) —— 分摊成本按"落在桶内的天数"计入,
   不能拿 r.date 直接筛。图上的预算参考线用**消费口径**(本期日均发放 × consumeShare()),
   与柱高同口径; 分析里的"占用 / 参考发放额度"用**预算口径**, 两者差一个 N, 文案里写明。 */
function parseChartArgs(tokens){
  const out = {kind:"", type:"both", cat:null, ref:null, bad:null};
  let sawWindow = false;
  for(const tk of tokens){
    const low = String(tk).toLowerCase();
    if(low[0]==="@" || /^\d{4}-\d{1,2}(-\d{1,2})?$/.test(low)){
      const v = low[0]==="@" ? low.slice(1) : low;
      if(!/^\d{4}-\d{1,2}(-\d{1,2})?$/.test(v)){ out.bad = "日期参数需为 @YYYY-MM 或 @YYYY-MM-DD"; continue; }
      out.ref = v; continue;
    }
    if(CHART_WINDOWS.has(low)){
      if(sawWindow){ out.bad = "只能指定一个统计窗口"; continue; }
      sawWindow = true;
      out.kind = (low==="period"||low==="周期"||low==="cycle") ? "" : low;
      continue;
    }
    if(CHART_TYPES.has(low)){
      out.type = (low==="bar"||low==="bars"||low==="柱"||low==="柱状图"||low==="柱图") ? "bar"
               : (low==="pie"||low==="饼"||low==="饼图") ? "pie" : "both";
      continue;
    }
    if(out.cat){ out.bad = "只能指定一个类别"; continue; }
    out.cat = tk;
  }
  if(out.ref && out.kind && !/^(month|月|natural)$/.test(out.kind)){
    out.bad = "指定月份时窗口只能用 month / period";
  }
  /* 手动输日期弹窗会给完整日期或只给月份: 前者要按**那一天**统计(不是整月), 后者按自然月。
     两者都走 resolveWindow 的单一入口, 所以这里只负责把 ref 归一成正确的窗口 kind。 */
  if(out.ref && !out.kind){
    out.kind = /^\d{4}-\d{1,2}-\d{1,2}$/.test(out.ref) ? "date" : "month";
  }
  return out;
}
/* 分桶: 时间桶最多 CHART_MAX_BUCKETS 个(长窗口自动按天合并), 单日窗口改按类别分桶。
   日均基准来自**窗口覆盖的记账周期合计**(与「预算总结」同一口径、同一份 budgetOfWindow()),
   不再固定用当前周期 —— 否则 `chart @2026-09` 的参考线是今天的日均发放, 与柱高/使用率全都对不上。 */
function chartBuckets(win, isDay, cat){
  const bs = budgetOfWindow(win);
  const pDays = Math.max(1, bs.days);
  const perDay = r2(bs.B / pDays);                   // 占用口径: 各期发放合计 ÷ 区间天数
  const perDaySpend = r2(perDay * consumeShare());  // 消费口径: 与柱高/参考线同口径
  const buckets = [];
  let mode;
  if(isDay){
    mode = "category";
    const cats = win.cats;
    const keep = cats.length > CHART_MAX_BUCKETS ? CHART_MAX_BUCKETS-1 : CHART_MAX_BUCKETS;
    for(const [nm,amt] of cats.slice(0,keep)){
      buckets.push({label:String(nm).slice(0,4), name:nm, total:r2(amt), quota:perDaySpend, days:1});
    }
    if(cats.length > CHART_MAX_BUCKETS){
      const rest = cats.slice(keep).reduce((s,x)=>s+x[1],0);
      buckets.push({label:"其他", name:"其他", total:r2(rest), quota:perDaySpend, days:1});
    }
  } else {
    mode = "date";
    const step = Math.max(1, Math.ceil(win.days / CHART_MAX_BUCKETS));
    let s = win.start;
    while(s <= win.end){
      let e = addDaysYMD(s, step-1);
      if(e > win.end) e = win.end;
      const days = daysBetween(s,e)+1;
      const cw = collectWindow(s, e, cat);
      buckets.push({label:s.slice(5), name:s.slice(5)+(days>1?("~"+e.slice(5)):""), start:s, end:e,
                    total:cw.total, quota:r2(perDaySpend*days), days});
      s = addDaysYMD(e,1);
    }
  }
  const maxVal = Math.max(1, ...buckets.map(b=>b.total));
  return {buckets, mode, perDay, perDaySpend, maxVal};
}
function chartFrame(){
  const box = document.createElement("div");
  box.className = "l chartbox";
  term.appendChild(box);
  return box;
}
/* 图表章节标题 = 全站统一的章节标题(chartHead 只是 sectionHead 的别名,
   保证图表与 budget/forecast/assets 的标题永远同一套规格, 不出现两份实现)。 */
function chartHead(text, color){
  return sectionHead(text, "", color);
}
function renderBarChart(box, data){
  const {buckets, perDaySpend, maxVal, mode} = data;
  const wrap = document.createElement("div");
  wrap.className = "chart-bars";
  wrap.dataset.chart = "bars";
  wrap.dataset.kind = mode;
  wrap.dataset.count = String(buckets.length);
  wrap.dataset.max = String(maxVal);      // 重排柱高时的分母(resize 后不用重算数据)
  wrap.dataset.min = "0";                 // 消费口径恒 >= 0, 零轴贴底
  const typicalDays = buckets.length ? buckets[0].days : 1;
  const refQuota = r2(perDaySpend * typicalDays);
  for(const b of buckets){
    const col = document.createElement("div"); col.className = "chart-col";
    const bar = document.createElement("div"); bar.className = "chart-bar";
    const barColor = LEVEL_COLOR[barLevel(b.quota>0 ? b.total/b.quota : 0)];
    bar.style.background = barColor;
    bar.style.color = barColor;            // 让 box-shadow 的 currentColor 跟着柱色发光
    bar.dataset.value = String(b.total);
    bar.dataset.label = b.name;
    const v = document.createElement("span"); v.className = "chart-v";
    v.style.color = barColor;              // 柱顶数值与柱同色(超支红/橙、正常绿), 一眼看出哪根越线
    v.textContent = money(b.total);
    const k = document.createElement("span"); k.className = "chart-k"; k.textContent = b.label;
    col.append(bar, v, k);
    wrap.appendChild(col);
  }
  if(refQuota > 0){
    const ln = document.createElement("div"); ln.className = "chart-refline";
    const lb = document.createElement("div"); lb.className = "chart-reflabel";
    lb.textContent = "预算 ¥"+money(refQuota);
    wrap.append(ln, lb);
    wrap.dataset.refQuota = String(refQuota);
  }
  box.appendChild(wrap);
  applyPlotHeight(wrap);   // 柱高/参考线按当前视口高度落地(基准 = CHART_PLOT_H)
  return {refQuota};
}
function renderPieChart(box, win){
  const pie = document.createElement("div");
  pie.className = "chart-pie"; pie.dataset.chart = "pie"; pie.dataset.total = String(win.total);
  const legend = document.createElement("div"); legend.className = "chart-legend";
  if(!win.cats.length || win.total<=0){
    pie.style.background = "var(--panel)";
    pie.dataset.slices = "0";
    const li = document.createElement("div"); li.className = "li";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = "窗口内无消费记录";
    li.appendChild(nm); legend.appendChild(li);
  } else {
    let acc = 0; const segs = [];
    const last = win.cats.length-1;
    win.cats.forEach(([cat,amt], i)=>{
      const pct = amt/win.total*100;
      const from = acc, to = (i===last) ? 100 : acc+pct;
      acc = to;
      const col = catColor(cat);
      /* 切片必须严格首尾相接 —— 这里**不允许**再插 transparent 段。
         旧实现用 0.5% 的透明段冒充"分隔线", 等于在饼图上挖了一个 1.8° 的缺口:
         相邻两片同色时(如两个自定义类别共用 catColor 兜底色)看起来就是"少了一块",
         也就是"饼图没闭合"。分隔交给相邻色差; 需要缝线就画在切片上, 不要挖洞。 */
      segs.push(col+" "+from.toFixed(2)+"% "+to.toFixed(2)+"%");
      const li = document.createElement("div"); li.className = "li";
      const sw = document.createElement("span"); sw.className = "chart-swatch"; sw.style.background = col;
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = cat;
      /* 金额与占比拆成两段: 金额用白色、占比用绿色并右对齐成列(参考图的四列图例) */
      const vl = document.createElement("span"); vl.className = "vl";
      const amtEl = document.createElement("span"); amtEl.className = "amt";
      amtEl.textContent = "¥"+money(amt)+" ";     // 末尾留空格: 复制成纯文本时金额与占比不会粘在一起
      const pctEl = document.createElement("span"); pctEl.className = "pc";
      pctEl.textContent = pct.toFixed(1)+"%";
      vl.append(amtEl, pctEl);
      li.append(sw, nm, vl); legend.appendChild(li);
    });
    /* from -90deg: 从 12 点方向顺时针起画(与参考图一致) */
    pie.style.background = "conic-gradient(from -90deg,"+segs.join(",")+")";
    pie.dataset.slices = String(win.cats.length);
  }
  box.append(pie, legend);
}
function printChartTable(data){
  chartHead("数据明细（消费口径，与柱状图一一对应）");
  for(const b of data.buckets){
    const pct = b.quota>0 ? (b.total/b.quota*100).toFixed(1)+"%" : "—";
    /* 一行三段配色: 金额与括号里的占比同色(超参考额度=红, 未超=绿), "参考"保持灰,
       这样扫一眼就能定位越线的时段 —— 参考图的明细表就是这个形态。 */
    const tone = (b.quota>0 && b.total>b.quota) ? COLOR.red : COLOR.green;
    kvRow(b.name, [
      {t:"¥"+money(b.total), c:tone, cls:"glow"},
      {t:"   / 参考 ¥"+money(b.quota), c:COLOR.gray},
      {t:"   ("+pct+")", c:tone}
    ], 0);
  }
}
function printChartAnalysis(win, data, meta){
  const {buckets, mode, perDay, perDaySpend} = data;
  const today = todayYMD();
  const endEff = (win.end < today) ? win.end : today;
  const usedDays = Math.max(1, daysBetween(win.start, endEff)+1);
  /* 预算对比只算"已经发生"的消费: 进行中的窗口若把未来日期的分摊成本也算进分子,
     用率会虚高(窗口 7 天只过了 1 天, 却拿 7 天的分摊去除 1 天的额度) —— 口径不一致是 F13。
     柱状图/饼图仍展示整窗口(消费归属日), 这里的占用/日均/结论按"截至今天"算, 文案注明。 */
  const spent = spentUpToToday(win);
  const avg = r2(spent/usedDays);
  const usedUnits = r2(spent/consumeShare());
  const refGrant = r2(perDay*usedDays);
  const usage = refGrant>0 ? usedUnits/refGrant : 0;
  const aw = alertWord(usage);
  const over = buckets.filter(b=>b.quota>0 && b.total>b.quota).length;
  const zero = buckets.filter(b=>b.total<=0).length;
  const peak = buckets.reduce((a,b)=> b.total>(a?a.total:-1) ? b : a, null);
  const top1 = win.cats[0];
  const top1pct = (top1 && win.total>0) ? top1[1]/win.total*100 : 0;
  const top3 = r2(win.cats.slice(0,3).reduce((s,x)=>s+x[1],0));
  const top3pct = win.total>0 ? top3/win.total*100 : 0;
  const amortPct = win.total>0 ? win.amortTotal/win.total*100 : 0;
  /* skipCore = 合并入口 report 专用: 总消费 / 日均 / 分摊占比已经在「预算总结」里出现过,
     这里不再重复同一行; chart 单命令没有总结表, 仍完整输出。 */
  const skipCore = !!(meta && meta.skipCore);
  chartHead("自动分析");
  if(!skipCore){
    kvRow("窗口总消费", "¥"+money(win.total), 0, COLOR.pure);
    kvRow("平均每日消费", "¥"+money(avg)+"   (÷"+usedDays+" 天)", 0, COLOR.white);
  }
  kvRow("窗口占用(截至今天, 消费÷"+consumePct()+"%)", "¥"+money(usedUnits), 0, COLOR.white);
  kvRow("参考发放额度", "¥"+money(refGrant)+"   (日均 ¥"+money(perDay)+" × "+usedDays+" 天)", 0, COLOR.white);
  kvRow("预算使用率", (usage*100).toFixed(1)+"%   "+aw.t, 0, aw.c);
  kvRow("峰值"+(mode==="date"?"时段":"类别"), peak ? (peak.name+"  ¥"+money(peak.total)) : "—", 0, COLOR.white);
  kvRow("超参考额度", over+" / "+buckets.length+" 个"+(mode==="date"?"时段":"类别"), 0, over?COLOR.yellow:COLOR.green);
  kvRow("零消费", zero+" 个"+(mode==="date"?"时段":"类别"), 0, COLOR.gray);
  kvRow("Top1 类别", top1 ? (top1[0]+"  "+top1pct.toFixed(1)+"%") : "—", 0, top1?catColor(top1[0]):COLOR.gray);
  kvRow("Top3 集中度", top3pct.toFixed(1)+"%", 0, COLOR.white);
  if(win.amortTotal>0 && !skipCore) kvRow("其中分摊成本", "¥"+money(win.amortTotal)+"  ("+amortPct.toFixed(1)+"%)", 0, COLOR.gray);
  if(mode==="date" && buckets.length>=2){
    const mid = Math.floor(buckets.length/2);
    const a = r2(buckets.slice(0,mid).reduce((s,b)=>s+b.total,0));
    const c = r2(buckets.slice(mid).reduce((s,b)=>s+b.total,0));
    const delta = a>0 ? (c-a)/a*100 : (c>0?100:0);
    const word = delta>5 ? "上升" : (delta<-5 ? "下降" : "持平");
    kvRow("前后半段趋势", word+"  "+Math.abs(delta).toFixed(1)+"%   (前 ¥"+money(a)+" → 后 ¥"+money(c)+")", 0,
          delta>5 ? COLOR.red : (delta<-5 ? COLOR.green : COLOR.gray));
  }
  chartHead("总结与建议");
  let concl;
  if(win.total<=0){
    concl = meta.name+" 内没有消费记录，图表与指标均按 0 显示；记一笔后再来看趋势。";
  } else {
    concl = meta.name+" 消费 ¥"+money(spent)+"，占参考预算 "+(usage*100).toFixed(1)+"%（"+aw.t+"）"
          + "；主要支出为 "+(top1?top1[0]:"—")+"（"+top1pct.toFixed(1)+"%）。";
  }
  line([{t:"  "+concl, c:win.total<=0?COLOR.gray:COLOR.white}]);
  const advice = [];
  const th = [...state.settings.thresholds].sort((a,b)=>a-b);
  const warn = th.length ? th[0]/100 : 0.8, overP = th.length ? th[th.length-1]/100 : 1;
  if(win.total<=0){
    advice.push("暂无消费数据，先记一笔即可生成日 / 周 / 周期 / 月的预算图表。");
  } else {
    if(usage>=overP) advice.push("已超出参考发放额度，建议把后续日均消费压到 ¥"+money(perDaySpend)+" 以下，并核对大额支出。");
    else if(usage>=warn) advice.push("预算进度已进入预警区间，注意后续大额支出。");
    else advice.push("预算执行平稳，剩余额度可继续按当前节奏使用。");
    if(top1 && top1pct>=50) advice.push("支出集中在「"+top1[0]+"」（"+top1pct.toFixed(1)+"%），可优先检查这一类的可压缩空间。");
    if(peak && avg>0 && peak.total>2*avg){
      advice.push("峰值 "+peak.name+" 消费 ¥"+money(peak.total)+"，约为日均的 "+(peak.total/avg).toFixed(1)+" 倍，留意一次性大额支出。");
    }
    if(over>0) advice.push("有 "+over+" 个"+(mode==="date"?"时段":"类别")+"超过日均预算参考线（图中黄色虚线）。");
    if(amortPct>=20) advice.push("分摊成本占 "+amortPct.toFixed(1)+"%，属于固定支出，短期削减空间有限。");
    const unpaid = win.rows.filter(r=> !(recFullyMoney(r) && recFullyIndex(r)));
    if(unpaid.length) advice.push("还有 "+unpaid.length+" 笔未完全投资，可用 pay <id> all 或 pay full 处理。");
  }
  if(!advice.length) advice.push("各项指标平稳，保持当前节奏即可。");
  for(const s of advice) line([{t:"   · "+s, c:COLOR.gray}]);
  line([{t:"  口径: 柱高与饼图均为消费口径; 参考线 = 该窗口所在周期的日均发放 × "+consumePct()+"% × 桶天数; 分摊成本按落入桶内的天数计入。", c:COLOR.gray}]);
}
/* 图表输出的唯一实现: chart 与 report 共用, 不在两处各画一遍。
   type = bar | pie | both；合并后的「总结与图表」固定传 both, 一次同时出柱状图和饼图。 */
function renderChartBody(win, name, isDay, cat, type, opts){
  opts = opts || {};
  const typeName = type==="bar" ? "柱状图" : (type==="pie" ? "饼图" : "柱状图 + 饼图");
  if(!opts.hideMeta){
    line([{t:"  图型: "+typeName+"    窗口: "+win.start+" ~ "+win.end+"（"+win.days+" 天）", c:COLOR.gray}]);
  }
  const data = chartBuckets(win, isDay, cat);
  if(type==="bar" || type==="both"){
    chartHead("柱状图 · "+(data.mode==="date"?"按时间段":"按类别")+"（虚线 = 日均预算参考）");
    renderBarChart(chartFrame(), data);
    line([{t:"  "+(data.mode==="date"
        ? "每柱 "+data.buckets[0].days+" 天（长窗口自动合并，最多 "+CHART_MAX_BUCKETS+" 柱）"
        : "单日没有时间维度，按类别对比；参考线为当日消费额度"), c:COLOR.gray}]);
  }
  if(type==="pie" || type==="both"){
    chartHead("饼图 · 类别消费占比");
    renderPieChart(chartFrame(), win);
    line([{t:"  共 "+win.cats.length+" 个类别；占比按窗口内实际计入的金额计算。", c:COLOR.gray}]);
  }
  printChartTable(data);
  printChartAnalysis(win, data, {name, skipCore:!!opts.skipCore});
  blank();
  return data;
}

/* P2 B-19: 用户输入(类别/备注/地点)原样拼进 Markdown 会破坏结构(**、#、[]、| 等); 导出 md 时转义 */
function escapeMd(s){
  return String(s==null?"":s).replace(/([\\`*_\[\]#<>|~])/g, "\\$1");
}
function buildReportText(md){
  const esc=(s)=> md ? escapeMd(s) : String(s==null?"":s);   // txt 无结构字符, 原样输出

  const HR=()=> L.push(md?"---":"─".repeat(40));
  const moneyF=(x)=> "¥"+money(x);      // md/txt 两种格式的金额写法一致(原先是个恒等的三元)
  const r2s=(x)=> (x*100).toFixed(1)+"%";
  const st = periodSnapshot();
  const bal = availableBalance();

  push("本期发放总预算", moneyF(st.B));

  push("本期应投合计", moneyF(st.invest));
  push("本期占用(消费+应投)", moneyF(st.usedUnits));
  push("本期结余/透支(结转)", (carry>0?"透支 -":"可结转 +")+moneyF(Math.abs(carry)));
  push("累计可用余额(含结转)", moneyF(bal));
  push("发放使用率", r2s(st.ratio));
  push("超额状态", aw.t);
  HR();
  H("当前周期消费明细");
  const w=collectWindow(p.start,p.end);
  push("消费笔数", String(w.count));
  push("总消费", moneyF(w.total));
  if(w.amortTotal>0) push("其中分摊成本(按落在本期的天数计)", moneyF(w.amortTotal));
  for(const [cat,amt] of w.cats){ push("类别·"+esc(cat), moneyF(amt)+" ("+(w.total?amt/w.total*100:0).toFixed(1)+"%)"); }
  HR();

  push("应投指数 ("+idxPct()+"%口径)", moneyF(w.idxT));

  const paid = investTotalsOf(w.rows);
  push("已投货币", moneyF(paid.mmInv)+" / 应投"+moneyF(w.mmT));
  push("已投指数", moneyF(paid.idxInv)+" / 应投"+moneyF(w.idxT));
  HR();
  H("逐笔记录");
  for(const r of state.records.slice().sort((a,b)=>a.date<b.date?-1:1)){
    const paidSt=recStatus(r).t;
    // 分摊成本额外标注"总价 / 天数 / 生效区间"; 行里的 ¥ 金额仍是每天的口径(与合计/占用一致)
    const amort = recAmortized(r)
      ? ("  分摊"+recDays(r)+"天("+recWindow(r).start+"~"+recWindow(r).end
         +" 总价¥"+money(recTotal(r))+" → 每天¥"+money(r.amount)+")") : "";
    L.push("- "+r.date+"  #"+r.id+"  "+esc(r.category)+"  ¥"+money(r.amount)+amort
          +"  (应投货币¥"+money(r.mm)+" 指数¥"+money(r.idx)
          +"  已投货币¥"+money(r.moneyInv||0)+" 指数¥"+money(r.indexInv||0)+")  ["+paidSt+"]"
          +(r.note?"  "+esc(r.note):"")+(r.place?"  地点:"+esc(r.place):"")
          +(walletNameOf(r.wallet)?"  钱包:"+esc(walletNameOf(r.wallet)):"")
          +(r.created?"  创建:"+r.created:""));   // P2 B-19: 补 created 字段, 用户输入走 esc()
  }
  HR();
  L.push("");
  L.push("生成时间: "+t+"  |  BUDGET::TERM 自动理财报告");
  return md? ("# BUDGET::TERM 自动理财报告\n\n"+L.join("\n")) : L.join("\n");
}
function download(filename, content, type){
  const blob = new Blob([content], {type:type||"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},300);
}

/* ======================= 燃尽预测 (burn rate) ======================= */
function forecastData(){
  const st = periodSnapshot();
  const p = st.p, B = st.B;
  const today = todayYMD();
  const total = periodDayCount(p);
  const elapsedRaw = daysBetween(p.start, today) + 1;   // 含今天(不超过周期)
  const elapsed = Math.max(1, Math.min(total, elapsedRaw));
  const remaining = Math.max(0, total - elapsed);       // 之后还剩几天
  const spent = st.consumption;
  const dailyAvg = elapsed>0 ? spent/elapsed : 0;
  const projConsumption = r2(dailyAvg * total);         // 期末预测消费
  const projUsed = r2(projConsumption / consumeShare()); // 期末预测占用(预算口径)
  const projLeft = r2(B - projUsed);                    // >0 预计结余, <0 预计超支
  const allow = r2(consumeShare() * B);                 // 本期消费额度(N%)
  const leftConsume = r2(allow - spent);                // 还可消费
  const perDayLeft = remaining>0 ? r2(leftConsume/remaining) : leftConsume;
  const projRatio = B>0 ? projUsed/B : 0;
  return { st, p, B, today, total, elapsed, remaining, spent, dailyAvg,
           projConsumption, projUsed, projLeft, allow, leftConsume, perDayLeft, projRatio };
}
/* budget 命令末尾的一行简报 */

  const f = forecastData();

  const tail = f.remaining > 0
    ? ("  (还剩 "+f.remaining+" 天, 每天可花 ¥"+money(Math.max(0,f.perDayLeft))+")")
    : ("  (本周期已到最后一天, 还可消费 ¥"+money(Math.max(0,f.leftConsume))+")");
  line([{t:"  燃尽预测: 日均 ¥"+money(f.dailyAvg)+"/天", c:COLOR.gray},
        {t:"  →  期末预计"+(f.projLeft<0?"超支 ":"结余 "), c:COLOR.gray},
        {t:"¥"+money(Math.abs(f.projLeft)), c:color, cls:"glow"},
        {t:tail, c:COLOR.gray}]);
}

/* ======================= 资产看板 & 收益模拟 ======================= */
function fv(P, rate, years){ return P * Math.pow(1 + rate, years); }
/* 注: 字符曲线 sparkline(▁▂▃▄▅▆▇█)已被 miniBars 取代 —— 字符曲线
   的高度取决于字体, 与柱状图不是同一套颜色/比例语义, 且窄屏会折行。留着就是死代码, 已删除。 */
function doAssets(tokens){
  const rawYears = numeric(tokens[0]);
  const horizon = (rawYears!=null && rawYears>0 && rawYears<=60) ? Math.round(rawYears) : 10;
  const cash  = availableBalance();
  const pm    = moneyInvestedTotal();
  const pi    = indexInvestedTotal();
  const rm    = state.settings.rateMoney  || 0;
  const ri    = state.settings.rateIndex  || 0;
  const mvM   = r2(fv(pm, rm, horizon));
  const mvI   = r2(fv(pi, ri, horizon));
  const totalNow = r2(cash + pm + pi);
  const totalFut = r2(cash + mvM + mvI);
  blank();
  sectionHead("资产看板", "年化 货币 "+(rm*100).toFixed(2)+"% / 指数 "+(ri*100).toFixed(2)+"%   (set rate 可改)");
  // 逐行
  const row=(k,v,c)=>kvRow(k,v,0,c);      // 统一渲染器(列宽按窗口自适应)
  row("现金余额(含结转)", "¥"+money(cash), cash<0?COLOR.red:COLOR.green);
  row("货币基金 本金", "¥"+money(pm), COLOR.cyan);
  row("  货币 "+horizon+"年后", "¥"+money(mvM), COLOR.cyan);
  row("指数基金 本金", "¥"+money(pi), COLOR.index);
  row("  指数 "+horizon+"年后", "¥"+money(mvI), COLOR.index);
  line([{t:"  "+"─".repeat(40), c:COLOR.gray}]);
  row("总资产(现金+本金)", "¥"+money(totalNow), COLOR.pure);
  row("总资产("+horizon+"年后预估)", "¥"+money(totalFut), COLOR.green);
  const gain = r2(totalFut - totalNow);
  row("预估增值", (gain>=0?"+":"")+"¥"+money(gain)+"   ("+(totalNow>0?((gain/totalNow)*100).toFixed(1)+"%":"—")+")",
      gain>=0?COLOR.green:COLOR.red);
  /* 资产构成: 现金 / 货币本金 / 指数本金 —— 一张堆叠条看清"钱在哪儿" */
  stackBar([
    {label:"现金", value:cash, color:cash<0?COLOR.red:COLOR.green},   // 现金为负(透支)必须看得见, 用红色段
    {label:"货币基金", value:pm, color:COLOR.cyan},
    {label:"指数基金", value:pi, color:COLOR.index}
  ], {title:"资产构成(现金 + 基金本金)"});
  /* 增长曲线改成真的柱状图(复用图表柱样式), 不再是 ▁▂▃ 字符曲线:
     0 年 → horizon 年每年一根, 超过 12 年只画 11 根 + 末年, 避免糊成一片。 */
  const vals = [];
  const stepY = Math.max(1, Math.ceil(horizon/5));        // 最多 6 根: 数值标签才不会互相压住
  for(let t=0;t<=horizon;t+=stepY){ vals.push({label:(t===0?"现在":"第"+t+"年"), value:r2(cash + fv(pm,rm,t) + fv(pi,ri,t))}); }
  if(vals[vals.length-1].label !== ("第"+horizon+"年")){
    vals.push({label:"第"+horizon+"年", value:totalFut});
  }
  line([{t:"  增长曲线(现金不增值, 仅基金复利)   现值 ¥"+money(totalNow)+" → 第"+horizon+"年 ¥"+money(totalFut)
        +"   累计 "+(totalNow>0?((gain/totalNow)*100).toFixed(1)+"%":"—"), c:COLOR.gray}]);
  miniBars(vals, {kind:"assets"});
  blank();
}

function invCluster(kind){
  const m = kind==="money";
  const lot = m ? INVEST_MONEY_LOT : INVEST_INDEX_LOT;
  const pend    = m ? moneyPending()    : indexPending();
  const invested= m ? moneyInvestedTotal(): indexInvestedTotal();
  const ready = pend >= lot - 0.005;              // 池≥阈值才点亮全额投资
  const cl = document.createElement("div"); cl.className="inv-cl";
  const kEl = document.createElement("span"); kEl.className="inv-kind "+(m?"m":"i");
  kEl.textContent = m ? "应投货币" : "应投指数";
  const pool = document.createElement("span"); pool.className="inv-pool"+(ready?" ready":"");
  pool.textContent = "¥"+money(pend);
  const done = document.createElement("span"); done.className="inv-done";
  done.textContent = "已投 ¥"+money(invested);
  // 全额投资: 把整池一次性投掉; 仅当未投池 ≥ 该种阈值(货币100/指数20)才点亮
  const btnFull = document.createElement("button"); btnFull.type="button"; btnFull.className="inv-btn";
  btnFull.disabled = !ready;
  btnFull.textContent = ready ? ("全额投资 ¥"+money(pend)) : ("待满 ¥"+lot);
  // H5: 界面按钮不再直接调 doInvestFull, 而是回灌 pay full 命令(与命令行同一通道, 撤销栈单一提交点)
  if(ready) btnFull.addEventListener("click", ()=>runCommand("pay full "+(m?"mm":"idx")));
  cl.append(kEl, pool, done, btnFull);
  if(!ready){
    const hint = document.createElement("span"); hint.className="inv-hint";
    hint.textContent = "(未投池累计至 ¥"+lot+" 即点亮全额投资并清池)";
    cl.appendChild(hint);
  }
  return cl;
}

/* 分摊预览: 总价 ÷ 天数 = 每天; 非法输入用黄色说明原因并阻止提交(输入框加 input 监听, 实时更新) */
function updateAmortHint(){
  const el = document.getElementById("fa_hint");
  if(!el) return;
  if(modalTab!=="amort"){ el.textContent=""; el.classList.remove("bad"); return; }
  const total = input2num(document.getElementById("fa_total").value);
  const d = parseDaysToken(document.getElementById("fa_days").value);
  if(total==null || total<=0){
    el.className="mhint"; el.textContent="填「总价」+「分摊天数」后显示每天摊到多少（投资只按总价记一次，不再分摊）。"; return;
  }
  if(!d){
    el.className="mhint bad"; el.textContent="分摊天数需为 ≥ "+AMORT_MIN_DAYS+" 的整数天，也可以写 12月 / 12m（按 30 天/月）。"; return;
  }
  if(!Number.isInteger(d.days) || d.days<AMORT_MIN_DAYS || d.days>AMORT_MAX_DAYS){
    el.className="mhint bad"; el.textContent="分摊天数需在 "+AMORT_MIN_DAYS+" ~ "+AMORT_MAX_DAYS+" 天之间（当前 "+d.days+" 天）。"; return;
  }
  const daily = r2(total/d.days);
  if(!(daily>0)){
    el.className="mhint bad"; el.textContent="每天不足 ¥0.01，请加大总价或缩短天数。"; return;
  }
  /* 起始日期**精确到日**: 留空 = 今天; 非空必须是合法日期, 非法就用黄色说明并阻止提交
     (以前这个字段是 type="month", 提交时硬拼 "-01" —— 起始日被强制吸到每月 1 号) */
  const chosen = amortPickDate(document.getElementById("fa_date").value);
  if(!chosen){
    el.className="mhint bad"; el.textContent="起始日期需为 YYYY-MM-DD 的合法日期（也可以留空 = 今天）。"; return;
  }
  /* P0: 预览必须与 makeRecord 同一口径 —— 投资只按"记录总价" r2(total) 记一次;
     逐日累计(每天金额 × 天数)是消费口径, 因 r2 中间取整可能与总价不等, 分别写明不混算。 */
  const recTotal = r2(total);
  const accrued  = r2(daily*d.days);
  const inv = investOf(recTotal);
  let s = "= 每天 ¥"+money(daily)+" × "+d.days+" 天（记录总价 ¥"+money(recTotal);
  if(accrued!==recTotal) s += "，逐日累计 ¥"+money(accrued)+"（消费口径）";
  s += "）";
  s += "，从 "+chosen.date+" 起";
  s += "\n生效区间: "+chosen.date+" ~ "+addDaysYMD(chosen.date, d.days-1)+"（含首尾，共 "+d.days+" 天）";
  s += "\n应投按总价一次记入: 货币 ¥"+money(inv.mm)+" + 指数 ¥"+money(inv.idx);
  el.className="mhint"; el.textContent=s;
}
/* 经常性支出预览: 与提交共用 recurPlan() —— 次数/总价/结束日/是否分摊都在同一处算,
   输入非法用黄色说明并阻止提交(与分摊选项卡同一套交互)。 */
function updateRecurHint(){
  const el = document.getElementById("fr_hint");
  if(!el) return;
  if(modalTab!=="recur"){ el.className="mhint"; el.textContent=""; return; }
  const amt  = input2num(document.getElementById("fr_amt").value);
  const durV = input2num(document.getElementById("fr_dur").value);
  const durU = document.getElementById("fr_dur_unit").value;
  const freq = document.getElementById("fr_freq").value;
  const split = !!document.getElementById("fr_split").checked;
  const picked = amortPickDate(document.getElementById("fr_date").value);
  if(amt==null || durV==null || !picked){
    el.className="mhint";
    el.textContent="填「每次金额 + 起始日期 + 持续时间」后显示：共几笔、总价、结束日期、扣款日；勾选「自动分摊」则只记一笔。";
    return;
  }
  const plan = recurPlan({ amount:amt, durValue:durV, durUnit:durU, freq, start:picked.date, split });
  if(!plan.ok){ el.className="mhint bad"; el.textContent=plan.msg; return; }
  let s = recurEveryLabel(plan.freq)+" ¥"+money(plan.amount)+" × "+plan.count+" 笔 = 总价 ¥"+money(plan.total);
  s += "\n期间 "+plan.start+" ~ "+plan.end+"（共 "+plan.days+" 天）";
  s += plan.split
    ? ("\n→ 自动分摊到每天 ¥"+money(plan.daily)+"/天（投资按总价记一次，不再分摊）")
    : ("\n→ 按扣款日各记一笔（共 "+plan.count+" 笔）");
  s += "\n扣款日: "+plan.dates.slice(0,8).join(", ")+(plan.dates.length>8?" …":"");
  if(plan.splitFallback) s += "\n※ 持续期只有 "+plan.days+" 天，无法分摊，将按单笔记账。";
  el.className="mhint"; el.textContent=s;
}
/* 分摊起始日期的唯一解析入口(预览与提交共用, 避免"预览说 A、提交成 B"):
    空值 / 原生 date 控件给的 YYYY-MM-DD / 手输的 2027/8/5 等宽容写法 → 统一成 {date,blank};
    无法解析返回 null(调用方必须提示, 不得静默回落到今天 —— 见 HANDOVER B6)。 */
function amortPickDate(raw){
  const s = String(raw==null ? "" : raw).trim();
  if(!s) return { date: todayYMD(), blank:true };
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return { date: s, blank:false };
  const fixed = repairDate(s);            // 兼容 2027/8/5、2027.8.5、20270805、2027年8月5日…
  return fixed ? { date: fixed, blank:false } : null;
}

      " 起, 起止日由月起始日决定(要改月起始日: config set monthstart <1-28>)。保存后回到按月周期。";
    return;
  }
  const r = periodModalCheck();

    meta.textContent = "本期 "+r.start+" ~ "+r.end+" · 共 "+r.days+" 天 · 下一期 "+addDaysYMD(r.end,1)+" 起";

/* ---- 配置类别余额弹窗 ----
   每行: [色块] 类别 [提示超额勾选] [数字输入] [浅色: 可配置余额] [占比]
   · 勾选框(默认勾选) = 该类别是否提示超额; 取消后顶栏/budget 不再出现它, 明细里标「静默」;
   · 输入框后的浅色数字 = 总可用余额 − 已配置类别余额(按当前输入实时算) —— 就是"还能再分多少";
   · 行尾占比 = 该类别余额 ÷ 总可用余额, 随输入即时刷新;
   · 两者都只在内存里算, 不落盘、不改 state; 保存时整张表回灌**一条** `set category …` 命令,
     与命令行同一通道(H5), 因此是一步撤销。 */
function catRowParts(row){
  const o = { warn:null, input:null, left:null, pc:null };
  for(const n of row.children){
    const c = String((n && n.className) || "");
    if(c.indexOf("cwarn")>=0) o.warn = n;
    else if(c.indexOf("camt")>=0) o.input = n;
    else if(c.indexOf("cleft")>=0) o.left = n;
    else if(c.indexOf("cpc")>=0) o.pc = n;
  }
  return o;
}
function buildCatRows(){
  const host = document.getElementById("c_rows");
  if(!host) return null;
  host.innerHTML = "";
  for(const cat of catBudgetCats()){
    const row = document.createElement("div"); row.className = "crow"; row.dataset.cat = cat;
    const sw = document.createElement("i"); sw.className = "csw"; sw.style.background = catColor(cat);
    const nm = document.createElement("span"); nm.className = "cnm"; nm.textContent = cat;
    /* 默认勾选 = 提示超额; 取消 = 该类别完全静默(只影响警告, 不影响金额) */
    const wn = document.createElement("input");
    wn.type = "checkbox"; wn.className = "cwarn"; wn.title = "提示该类别超额";
    wn.checked = !catMuted(cat);
    const inp = document.createElement("input");
    inp.type = "number"; inp.className = "camt"; inp.min = "0"; inp.step = "0.01";
    inp.placeholder = "0"; inp.value = catAllocOf(cat) || "";
    inp.dataset.cat = cat;
    inp.addEventListener("input", updateCatModal);
    inp.addEventListener("keydown", (e)=>{ if(e && e.key==="Enter"){ if(e.preventDefault) e.preventDefault(); saveCatBudgets(); } });
    const lf = document.createElement("span"); lf.className = "cleft";
    const pc = document.createElement("span"); pc.className = "cpc";
    row.append(sw, nm, wn, inp, lf, pc);
    host.appendChild(row);
  }
  return host;
}
function readCatInputs(){
  const host = document.getElementById("c_rows");
  const out = [];
  if(!host) return out;
  for(const row of host.children){
    const parts = catRowParts(row);
    const v = input2num(parts.input && parts.input.value);
    /* 勾选框缺失时按"提示超额"处理(缺省语义); 取消勾选才静默 */
    out.push({ cat: row.dataset.cat, row, parts, value: (v!=null && v>0) ? r2(v) : 0,
               mute: !!(parts.warn && !parts.warn.checked) });
  }
  return out;
}
function updateCatModal(){
  const p = currentPeriod();
  const pool = catPool(p);
  const items = readCatInputs();
  let sum = 0; for(const it of items) sum += it.value;
  sum = r2(sum);
  const left = r2(pool - sum);
  for(const it of items){
    if(it.parts.left){
      it.parts.left.textContent = "可配置 ¥"+money(left);
      if(it.parts.left.classList) it.parts.left.classList.toggle("neg", left < 0);
    }
    if(it.parts.pc) it.parts.pc.textContent = pool>0 ? ((it.value/pool)*100).toFixed(1)+"%" : "—";
  }
  const meta = document.getElementById("c_meta");
  if(meta){
    meta.innerHTML = "";                 // 一律 textContent: 类别名是用户输入, 不进 innerHTML
    const put = (t, c)=>{ const s=document.createElement("span"); s.textContent=t; if(c) s.style.color=c; meta.appendChild(s); };
    put("当期预算 ¥"+money(effectiveBudget(p))+" × 消费 "+consumePct()+"%  =  总可用余额 ");
    put("¥"+money(pool), COLOR.pure);
    put("     已配置 "); put("¥"+money(sum), COLOR.pure);
    put("     可配置 "); put("¥"+money(left), left<0?COLOR.red:COLOR.green);
  }
  const hint = document.getElementById("c_hint");
  if(hint){
    hint.className = "hint" + (left<0 ? " bad" : "");
    hint.textContent = left<0
      ? ("已配置合计 ¥"+money(sum)+" 超出总可用余额 ¥"+money(pool)+" 共 ¥"+money(-left)+"；请先下调其它类别再保存（已经超额度时只能减、不能加）。")
      : ("输入框后的浅色数字 = 实时可配置余额（总可用余额 − 已配置类别余额）；行尾 = 该类别余额占总可用余额的比例。保存按整张表一次性提交，可一步撤销。");
  }
  return { pool, sum, left, items };
}
function fillCatModal(){
  buildCatRows();
  updateCatModal();
}
function openCatModal(){
  fillCatModal();
  openOverlay("catWrap");
  const host = document.getElementById("c_rows");
  const first = host && host.children && host.children[0];

    const parts = catRowParts(first);
    if(parts.input && parts.input.focus) parts.input.focus();
  }
}

/* 保存: 整表拼成一条命令 —— 清零的类别显式发 off(否则旧额度残留), 未勾选「提示超额」的带 nowarn */
function catBudgetCommand(){
  const parts = ["set category"];
  for(const it of readCatInputs()){
    if(it.value>0) parts.push(quote(it.cat)+" "+it.value+(it.mute ? " nowarn" : ""));
    else if(catAllocOf(it.cat)>0) parts.push(quote(it.cat)+" off");
  }
  return parts.length>1 ? parts.join(" ") : "set category reset";
}
function saveCatBudgets(){
  const st = updateCatModal();
  if(st.left < 0 && st.sum > catAllocated() + 0.005){
    const hint = document.getElementById("c_hint");
    if(hint){ hint.className="hint bad";
      hint.textContent = "已配置合计 ¥"+money(st.sum)+" 超过总可用余额 ¥"+money(st.pool)+"，请先下调其它类别。"; }
    return;
  }
  const cmd = catBudgetCommand();
  closeCatModal();
  runCommand(cmd);
}

/* 分摊成本选项卡的提交: 与命令行同一条 amort 命令(拼串回灌 runCommand, 保证双通道行为一致) */
function submitAmort(){
  const total=input2num(document.getElementById("fa_total").value);
  const d=parseDaysToken(document.getElementById("fa_days").value);
  const cat=document.getElementById("fa_cat").value.trim();
  const note=document.getElementById("fa_note").value.trim();
  const place=document.getElementById("fa_place").value.trim();
  if(total==null||total<=0){ alertModal("总价需为大于0的数字"); return; }
  if(!d){ alertModal("分摊天数需为 ≥ "+AMORT_MIN_DAYS+" 的整数天"); return; }
  if(!Number.isInteger(d.days) || d.days<AMORT_MIN_DAYS || d.days>AMORT_MAX_DAYS){
    alertModal("分摊天数需在 "+AMORT_MIN_DAYS+" ~ "+AMORT_MAX_DAYS+" 天之间"); return;
  }
  if(!(r2(total/d.days)>0)){ alertModal("每天不足 ¥0.01，请加大总价或缩短天数"); return; }
  if(!cat){ alertModal("请输入类别，如 房租 / 会员"); return; }
  /* 起始日期精确到日: 留空则**不带 @参数**(与命令行的默认语义完全一致 = 今天);
     填了但解析不了就提示并中止 —— 以前是静默拼成"本月 1 号", 用户选的日会被丢掉(B6/B7)。 */
  const picked = amortPickDate(document.getElementById("fa_date").value);
  if(!picked){ alertModal("起始日期需为 YYYY-MM-DD 的合法日期（或留空 = 今天）"); return; }
  closeModal();
  const cmd = "amort "+total+" "+d.days+" "+cat+(note?" "+quoteNote(note):"")
            + (picked.blank ? "" : (" @"+picked.date))
            + modalWalletPart("fa_wallet")
            + (place ? " "+quotePlace(place) : "");
  input.value = cmd; input.focus();
  runCommand(cmd);
}
/* 经常性支出选项卡的提交: 与命令行同一条通道(拼 recur 命令回灌 runCommand),
   因此与键盘输入完全等价 —— 校验失败不关窗、不落数据; 成功则由 runCommand 一次提交/一步撤销。 */
function submitRecur(){
  const amt = input2num(document.getElementById("fr_amt").value);
  const cat = document.getElementById("fr_cat").value.trim();
  const durV = input2num(document.getElementById("fr_dur").value);
  const durU = document.getElementById("fr_dur_unit").value;
  const freq = document.getElementById("fr_freq").value;
  const split = !!document.getElementById("fr_split").checked;
  const note = document.getElementById("fr_note").value.trim();
  const picked = amortPickDate(document.getElementById("fr_date").value);
  if(!cat){ alertModal("请输入类别，如 房租 / 会员"); return; }
  if(!picked){ alertModal("起始日期需为 YYYY-MM-DD 的合法日期"); return; }
  const plan = recurPlan({ amount:amt, durValue:durV, durUnit:durU, freq, start:picked.date, split });
  if(!plan.ok){ alertModal(plan.msg); return; }
  closeModal();
  const cmd = "recur "+plan.amount+" "+cat+" "+(plan.durValue+RECUR_UNITS[plan.durUnit])+" "+RECUR_UNITS[plan.freq]
            + " @"+plan.start + (split ? " 分摊" : "") + modalWalletPart("fr_wallet") + (note ? " "+quoteNote(note) : "");
  input.value = cmd; input.focus();
  runCommand(cmd);
}
function input2num(v){ const n=parseFloat(String(v).replace(/,/g,"")); return isNaN(n)?null:n; }function quote(s){ return '"'+String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"')+'"'; }
function alertModal(msg){ const old=document.getElementById("btnSubmit").textContent; document.getElementById("btnSubmit").textContent=msg; setTimeout(()=>{document.getElementById("btnSubmit").textContent="确认";},1400); }

/* ---- 浮层互斥 ----
   现象: 点第二个下拉时 toggleDd() 只 toggle 自己并 stopPropagation, document 的"点空白收起"
        不会执行 → 多个下拉/弹窗同时叠在页面上(互相遮挡)。
   规则: 全局同时最多一个浮层 open —— 打开任一下拉/弹窗前, 先关掉其它所有浮层。
   下拉与弹窗都走这两个入口, 不再各写一份 close 清单(F1 横向重复)。 */
const DD_IDS = ["listDd","reportDd","exportDd"];   // configDd/geoDd 分别随「配置 ▾」「地点 ▾」一起移除(配置在设置页)
const MODAL_IDS = ["modalWrap","budgetWrap","investWrap","dateWrap","geoWrap","catWrap","periodWrap"];
function closeAllOverlays(except){
  for(const id of DD_IDS.concat(MODAL_IDS)){
    if(id===except) continue;
    const el=document.getElementById(id);
    if(el) el.classList.remove("open");
  }
}
function openOverlay(id){
  closeAllOverlays(id);
  const el=document.getElementById(id);
  if(el) el.classList.add("open");
}
function closeAllDd(){
  for(const id of DD_IDS){
    const el=document.getElementById(id);
    if(el) el.classList.remove("open");
  }
}

/* toolbar */
function bindToolbar(){
  document.querySelectorAll("nav.toolbar button").forEach(b=>{
    b.addEventListener("click",(ev)=>{
      // 范围下拉: 「消费列表」与「总结与图表」共用同一套 data-range + 菜单处理
      if(b.dataset && b.dataset.range!==undefined){ onRangeMenuItem(b.dataset.range, b.dataset.rangeTarget); return; }
      if(b.id==="btnListDd"){ toggleDd("listDd", ev); return; }
      if(b.id==="btnReportDd"){ toggleDd("reportDd", ev); return; }
      if(b.id==="btnExportDd"){ toggleDd("exportDd", ev); return; }
      const c=b.dataset.cmd;
      if(!c) return;
      /* 点了任何 data-cmd 按钮都收起**全部**下拉(清单走 DD_IDS 单一来源) ——
         以前这里是四个 closeDd 的硬编码清单, 新增「导出 ▾」时就会漏关、菜单叠在页面上。 */
      closeAllDd();
      if(c==="open-add"){ openAdd(); return; }
      /* 「配置 ▾」下拉整体移除(配置全在设置页) —— data-config / btnConfigDd 两个分支随之删除,
         面板的"以弹窗打开"入口(openBudgetModal 等)只剩程序化调用(设置页的卡片直接挂载面板, 不走弹窗)。 */
      if(c==="backup-download"){ doBackupDownload(); return; }
      if(c==="restore-file"){ document.getElementById("fileImport").click(); return; }
      if(c==="autosave-dir"){ doAutosaveToggle(); return; }
      input.value = c; input.focus();
      runCommand(c);
    });
  });
  const fi = document.getElementById("fileImport");
  if(fi) fi.addEventListener("change", async (ev)=>{
    const file = ev.target.files && ev.target.files[0];
    ev.target.value="";
    if(!file) return;
    try{ await restoreFromText(await file.text()); }
    catch(e){ line([{t:"导入失败: "+(e&&e.message||e), c:COLOR.red}]); }
  });
  // 点空白处收起下拉(清单走 DD_IDS 单一来源)
  document.addEventListener("click",(ev)=>{
    for(const id of DD_IDS){
      const dd=document.getElementById(id);
      if(dd && ev.target && dd.contains && !dd.contains(ev.target)) dd.classList.remove("open");
    }
  });
  restoreLocalHandleQuiet(); // 尝试重连上次选择的本地目录(若权限仍在)
}
/* ---- 范围下拉: 「消费列表」与合并后的「总结与图表」共用一套开合/选范围逻辑 ----
   现象: 以前四个总结按钮各拼一条固定命令, 图表又另有一个下拉, 选范围与手动输日期只在 list 里有。
   原因: 两套下拉 = 两套行为, 且"先选日期再输出"只有列表能用(F1 横向重复)。
   修复: 统一 data-range + onRangeMenuItem(kind, target); target 决定拼 list 还是 report 命令,
        手动输日期复用同一个 #dateModal, 只是提交时按 target 换命令名。 */
function toggleDd(id, ev){
  const dd=document.getElementById(id);
  if(!dd) return;
  const willOpen = !dd.classList.contains("open");
  if(willOpen) closeAllOverlays(id);   // 打开前先关掉其它所有浮层(含弹窗), 保持全局互斥
  dd.classList.toggle("open");
  if(ev && ev.stopPropagation) ev.stopPropagation();
}
function closeDd(id){ const dd=document.getElementById(id); if(dd) dd.classList.remove("open"); }
const RANGE_COMMANDS = {
  list:   { today:"list @today", period:"list @period", month:"list @month" },

};

/* ---- 手动输入日期/月份查看 ----
   两个输入框统一为 ISO 文本: 日期 YYYY-MM-DD、月份 YYYY-MM(与命令 @日期 一致),
   旁边 📅 仍可调原生日历/月份选择器, 选完同样回填成统一格式。 */
const DATE_HINT = "格式统一: 日期 YYYY-MM-DD、月份 YYYY-MM（等同命令 @2027-08-18 / @2027-08）；填日期 → 只看当天/只出当天总结，只填月份 → 看整月/整月总结，两个都填则优先日期。";
/* 同一个弹窗服务两个入口: "list" = 消费列表, "report" = 合并后的总结与图表。
   只改命令名与标题, 日期归一化/校验/预览全部共用(B6/B7 的修复不重复实现)。 */
let dateModalTarget = "list";
function dateModalCmd(target, cat, when){
  const base = target==="report" ? "report" : "list";
  return base+(cat ? (" "+cat) : "")+" "+when;
}
function dateModalEl(id){ return document.getElementById(id); }
function normDateField(id, kind){                    // 读取并归一化某个输入框
  const el = dateModalEl(id);
  return { el, raw: el.value.trim(), ...normDateText(el.value, kind) };
}
function setDateHint(text, bad){
  const h = dateModalEl("d_hint");
  h.textContent = text;
  h.classList.toggle("bad", !!bad);
}
/* 实时校验 + 预览将要执行的命令(始终用统一格式显示) */
function updateDatePreview(){
  const d  = normDateField("d_date","date");
  const m  = normDateField("d_month","month");
  const cat = dateModalEl("d_cat").value.trim();
  if(d.raw && !d.ok)      setDateHint("日期格式: "+d.error, true);
  else if(m.raw && !m.ok) setDateHint("月份格式: "+m.error, true);
  else                    setDateHint(DATE_HINT, false);
  const when = d.value ? ("@"+d.value) : (m.value ? ("@"+m.value) : "");
  const pv = dateModalEl("d_preview");
  pv.textContent = when ? ("将执行:  "+dateModalCmd(dateModalTarget, cat, when))
                        : "将执行:  (请先填写「日期」或「月份」)";
  pv.style.color = d.value ? COLOR.green : (m.value ? COLOR.cyan : COLOR.faint);
  return { d, m, cat, when };
}
/* 失焦即把写法归一化: 2027/8/5 → 2027-08-05 */
function normalizeDateField(id, kind){
  const f = normDateField(id, kind);
  if(f.ok && f.raw) f.el.value = f.value;
  updateDatePreview();
}
function openDateModal(target){
  dateModalTarget = (target==="report") ? "report" : "list";
  const title = dateModalEl("d_title");
  if(title) title.textContent = dateModalTarget==="report" ? "按日期 / 月份生成总结与图表" : "按日期 / 月份查看消费";
  ["d_date","d_month","d_cat"].forEach(id=>{ dateModalEl(id).value=""; });
  ["d_date_native","d_month_native"].forEach(id=>{ dateModalEl(id).value=""; });
  setDateHint(DATE_HINT,false);
  updateDatePreview();
  openOverlay("dateWrap");
  dateModalEl("d_date").focus();
}
function closeDateModal(){ dateModalEl("dateWrap").classList.remove("open"); }
function applyDateModal(){
  const st = updateDatePreview();
  if(st.d.raw && !st.d.ok){ dateModalEl("d_date").focus(); return; }
  if(st.m.raw && !st.m.ok){ dateModalEl("d_month").focus(); return; }
  if(!st.when){ setDateHint("请至少填写「日期」或「月份」。", true); dateModalEl("d_date").focus(); return; }
  dateModalEl("d_date").value  = st.d.value;   // 回填统一格式, 下次打开看到的就是规范写法
  dateModalEl("d_month").value = st.m.value;
  closeDateModal();
  runCommand(dateModalCmd(dateModalTarget, st.cat, st.when));
  scrollBottom();
}
/* 📅 按钮 → 原生选择器; 选中后把 ISO 结果填回文本输入框 */
function openNativePicker(nativeId, textId, kind){
  const nat = dateModalEl(nativeId);
  const f = normDateField(textId, kind);
  nat.value = f.ok ? f.value : "";
  try{
    if(typeof nat.showPicker === "function"){ nat.showPicker(); return; }
  }catch(e){ /* 少数浏览器/环境不允许, 退回到下面提示手动输入 */ }
  setDateHint(((kind==="month")?"月份":"日期")+"请直接按 "+(kind==="month"?"YYYY-MM":"YYYY-MM-DD")+" 输入（当前浏览器不支持弹出选择器）。", true);
  dateModalEl(textId).focus();
}
function onNativePick(nativeId, textId, kind){
  const v = dateModalEl(nativeId).value;
  if(!v) return;
  const f = normDateText(v, kind);               // 原生控件给的是 ISO, 再统一一次更稳
  dateModalEl(textId).value = f.ok ? f.value : v;
  updateDatePreview();
}
